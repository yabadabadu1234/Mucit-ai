<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="Çift bra-ket ⟨||⟩ şeklinde bir duvar; iki köşeli parantez arasındaki iki çubuk yarığı ayıran duvar parçası, kenarlardaki iki yarıktan girişim deseni görünüyor">
  <defs>
    <clipPath id="slit-left">
      <rect x="150" y="90" width="40" height="260"/>
    </clipPath>
    <clipPath id="slit-right">
      <rect x="262" y="90" width="40" height="260"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="440" height="440" fill="#ffffff"/>

  <!-- yarıkların arkasında görünen girişim deseni (Newton halkaları) -->
  <g clip-path="url(#slit-left)">
    <g fill="none" stroke-width="7">
      <circle cx="220" cy="220" r="16"  stroke="#c8342b"/>
      <circle cx="220" cy="220" r="32"  stroke="#f2a33d"/>
      <circle cx="220" cy="220" r="48"  stroke="#1c3f7c"/>
      <circle cx="220" cy="220" r="64"  stroke="#c8342b"/>
      <circle cx="220" cy="220" r="80"  stroke="#f2a33d"/>
      <circle cx="220" cy="220" r="96"  stroke="#1c3f7c"/>
      <circle cx="220" cy="220" r="112" stroke="#c8342b"/>
      <circle cx="220" cy="220" r="128" stroke="#f2a33d"/>
      <circle cx="220" cy="220" r="144" stroke="#1c3f7c"/>
      <circle cx="220" cy="220" r="160" stroke="#c8342b"/>
      <circle cx="220" cy="220" r="176" stroke="#f2a33d"/>
    </g>
  </g>
  <g clip-path="url(#slit-right)">
    <g fill="none" stroke-width="7">
      <circle cx="220" cy="220" r="16"  stroke="#c8342b"/>
      <circle cx="220" cy="220" r="32"  stroke="#f2a33d"/>
      <circle cx="220" cy="220" r="48"  stroke="#1c3f7c"/>
      <circle cx="220" cy="220" r="64"  stroke="#c8342b"/>
      <circle cx="220" cy="220" r="80"  stroke="#f2a33d"/>
      <circle cx="220" cy="220" r="96"  stroke="#1c3f7c"/>
      <circle cx="220" cy="220" r="112" stroke="#c8342b"/>
      <circle cx="220" cy="220" r="128" stroke="#f2a33d"/>
      <circle cx="220" cy="220" r="144" stroke="#1c3f7c"/>
      <circle cx="220" cy="220" r="160" stroke="#c8342b"/>
      <circle cx="220" cy="220" r="176" stroke="#f2a33d"/>
    </g>
  </g>

  <!-- çift bra-ket duvarı: ⟨ | | ⟩ — < ve > yarığın dış kenarları, || yarığı ayıran orta duvar -->
  <g fill="none" stroke="#14213d" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 150,90 L 40,220 L 150,350"/>
    <path d="M 302,90 L 400,220 L 302,350"/>
  </g>
  <g fill="#14213d">
    <rect x="190" y="90" width="72" height="260"/>
  </g>
  <line x1="226" y1="90" x2="226" y2="350" stroke="#ffffff" stroke-width="4"/>
</svg>
