# LoRa tasarim dersi sitesi: her guncellemede (1) siteyi uretip semalari denetler, (2) yayin icin Pages is akisini tetikler.
# Bu depoda Pages "GitHub Actions" ile yayinlanir ve github-pages ortami yalniz claude/kuran-hikmetleri dalindan
# yayina izin verir (bu dalin pages.yml dosyasi iki siteyi tek pakette birlestirir):
#   /            -> Kuran Hikmetleri
#   /lora-ders/  -> bu ders sitesi (bu dalin guncel hali kuran dalindaki is akisi tarafindan cekilir)
# Bu is akisi yayin yapmaz; yalniz denetler ve o is akisini calistirir. Pages ayari degistirilmez.
name: ders-sitesi
on:
  push:
    branches: [claude/restore-lost-code-wlcust]
    paths:
      - 'lora_projesi/ders/**'
      - '.github/workflows/ders_sitesi.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  uret-ve-tetikle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Siteyi uret (semalar baglanti listesiyle denetlenir; hata varsa burada durur)
        run: |
          cd lora_projesi/ders
          python3 uret.py
      - name: Yayin is akisini tetikle (kuran dalindaki pages.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref claude/kuran-hikmetleri --repo "$GITHUB_REPOSITORY"
