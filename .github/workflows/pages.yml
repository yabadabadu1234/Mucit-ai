name: Pages

on:
  push:
    branches: [claude/kuran-hikmetleri]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Yayın kaynağını yalnız bu iş akışına bağla (dal yayını eski nüshayı üstüne yazmasın)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow && echo KAYNAK_DEGISTI
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Hazırla (kuran_hikmetleri → site kökü)
        run: |
          mkdir -p _site
          cp -r kuran_hikmetleri/. _site/
          sed -i 's#/home/runner/work/Mucit-ai/Mucit-ai/kuran_hikmetleri/##g' _site/kuran_hikmetleri_kitap.html
          sed -i "s#__SURUM__#${GITHUB_SHA}#g" _site/kuran_hikmetleri_kitap.html
          cp _site/kuran_hikmetleri_kitap.html _site/index.html
          printf '{"sha":"%s"}\n' "${GITHUB_SHA}" > _site/surum.json

      - name: Kitabı eski adresinde de aç (kuran_hikmetleri/ alt yolu; kök bağlantıları bu yolu kullanır)
        run: |
          mkdir -p "$RUNNER_TEMP/kuran_kopya"
          cp -r _site/. "$RUNNER_TEMP/kuran_kopya/"
          mkdir -p _site/kuran_hikmetleri
          cp -r "$RUNNER_TEMP/kuran_kopya/." _site/kuran_hikmetleri/

      - name: LoRa ders sitesini /lora-ders/ altına ekle (başarısız olursa kitap yayını etkilenmez)
        continue-on-error: true
        run: |
          git fetch --depth 1 origin claude/restore-lost-code-wlcust
          git worktree add --detach "$RUNNER_TEMP/ders" FETCH_HEAD
          cd "$RUNNER_TEMP/ders/lora_projesi/ders"
          python3 uret.py
          mkdir -p "$GITHUB_WORKSPACE/_site/lora-ders"
          cp -r site/. "$GITHUB_WORKSPACE/_site/lora-ders/"
          rm -rf "$GITHUB_WORKSPACE/lora-ders"
          mkdir -p "$GITHUB_WORKSPACE/lora-ders"
          cp -r site/. "$GITHUB_WORKSPACE/lora-ders/"

      - name: Zübde uygulamasını /zubde/ altına ekle
        run: |
          mkdir -p _site/zubde/misal
          cp zubde/ZUBDE.html _site/zubde/index.html
          cp zubde/uygulama.html _site/zubde/uygulama.html
          cp zubde/ZUBDE.zbd _site/zubde/
          cp zubde/misal/*.html zubde/misal/*.zbd _site/zubde/misal/

      - name: Her sayfaya sürüm damgası ve sürüm bekçisi (eski nüsha gösterilmez)
        run: python3 .github/surum_damgala.py _site "${GITHUB_SHA}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Dal yayınının bitmesini bekle (o biterse eski nüshayı üstüne yazar)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            b=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.commit+" "+.status' 2>/dev/null || true)
            echo "$b"
            case "$b" in "${GITHUB_SHA} built"*|"${GITHUB_SHA} errored"*) break;; esac
            sleep 10
          done

      - name: Yeniden yayınla (son sözü bu iş akışı söylesin)
        uses: actions/deploy-pages@v4
