name: Pages

on:
  push:
    branches: [claude/kuran-hikmetleri]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Hazırla (kuran_hikmetleri → site kökü)
        run: |
          mkdir -p _site
          cp -r kuran_hikmetleri/. _site/
          sed -i 's#/home/runner/work/Mucit-ai/Mucit-ai/kuran_hikmetleri/##g' _site/kuran_hikmetleri_kitap.html
          cp _site/kuran_hikmetleri_kitap.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: README ve kök bağlantısını yeni sürüme bağla
        run: |
          SHA="${GITHUB_SHA::7}"
          sed -i -E "s#(kuran_hikmetleri/kuran_hikmetleri_kitap\.html)(\?v=[0-9a-f]+)?#\1?v=${SHA}#g" README.md index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html
          if ! git diff --cached --quiet; then
            git commit -m "Kitap bağlantısı yeni sürüme bağlandı (v=${SHA}) [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
