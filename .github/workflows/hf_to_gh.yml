# ══════════════════════════════════════════════════════════════════
#  HUGGINGFACE → GITHUB RELEASE  (çevrilmiş külliyat olarak)
# ══════════════════════════════════════════════════════════════════
#
# PADİŞAHIN HÜKMÜ:
#
#   "Hugging Face ve GitHub sunucuları birbirine doğrudan veri aktarımı
#   yapmaz; ancak GitHub Actions altyapısını kullanarak veriyi GitHub
#   sunucuları üzerinden Hugging Face'ten çekip bir GitHub Release veya
#   depoya aktarabilir, oradan da ajanınıza indirebilirsiniz... Sen bu
#   verdiğim koda bizim dataset format çeviriciyi de ekle, veriyi
#   çekerken aynı anda formatını da dönüştürmüş olalım."
#
# NİÇİN LÂZIM. Ajan yalnız GitHub görür; ``huggingface.co`` bu oturumun
# ağ siyasetiyle kapalıdır (ölçüldü: CONNECT'e 403, ayrıca kapta ``ssh``
# ikilisi yok -- ferman 1-K). Fakat GitHub Actions koşucusu HF'i
# görür. O hâlde veri **GitHub sunucusu üzerinden** geçer.
#
# ÇEVİRİ NİÇİN BURADA. ``main/kulliyat.py:mucit_cevir`` metni
# **tiktoken**den geçirir ve düz ``uint32`` belirteç kimlikleri olarak
# yazar (ferman 1-N: ana belirteçleyici her daim tiktokendir). Netice
# ``np.memmap`` ile açılır. Yâni yüklenen şey ham veri değil, **tâlimin
# doğrudan okuduğu külliyattır**: her koşuda yeniden çevrilmez ve
# kodlama tutmazsa ``mucit_ac`` **reddeder**.
#
# VERİ KESİLMEZ (ferman 1-O). Release varlık başına 2 GB tutar; daha
# büyük külliyat aşağıda **parçalanır** ve ``kulliyat_cek`` parçaları
# indirip birleştirir. Biçim düz bayt olduğu için kayıpsızdır. Yâni
# hudut bir budama sebebi değil, bir parçalama sebebidir.
#
# İNDİRME TARAFI. ``main/kulliyat.py``deki ``Kaynak(surum=..., varlik=...)``
# satırı bu Release varlığını ``curl`` ile indirir. Yâni bu iş akışının
# çıktısı tâlime **bağlıdır**, ayrı durmaz (ferman 1-C/b).

name: HuggingFace to GitHub Release

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: 'HuggingFace veri kümesi kimliği (ör. openbmb/UltraData-Math)'
        required: true
        type: string
      kodlama:
        description: 'tiktoken kodlaması (EgitimAyari.kodlama ile AYNI olmalı; tutmazsa mucit_ac REDDEDER)'
        required: true
        default: 'o200k_base'
        type: string
      alt_yol:
        description: 'Veri kümesi içinde alınacak alt dizin (boş = hepsi)'
        required: false
        default: ''
        type: string
      uzanti:
        description: 'Metin sayılan uzantılar, virgülle. BOŞ = HEPSİ (uzantıya bakma)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python ortamını kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli paketleri yükle
        run: pip install --quiet huggingface_hub numpy tiktoken pyarrow

      # ══════════════════════════════════════════════════════════
      #  HF GİRİŞİ -- KAPALI (gated) DEPOLAR İÇİN
      # ══════════════════════════════════════════════════════════
      #
      # Ölçüldü: ``openbmb/UltraData-SFT-2605`` için
      # ``GatedRepoError: 401 ... Access to dataset is restricted.
      # You must have access to it and be authenticated``.
      # Yâni depo umumi değil, **izinli**dir; jeton olmadan inmez.
      #
      # **JETON KODA YAZILMAZ.** Depoya gömülen bir jeton, deponun
      # okunabildiği her yerde ifşadır. GitHub → Settings → Secrets and
      # variables → Actions → New repository secret:
      #
      #     Ad    : HF_TOKEN
      #     Değer : hf_...
      #
      # Jeton konmamışsa iş akışı **düşmez**: umumi depolar yine iner,
      # kapalı olan ise 401 ile ve **sebebiyle** durur (ferman 5:
      # sessiz ikame yok).
      - name: Hugging Face'e giriş (kapalı depolar için)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            python -c "from huggingface_hub import login; import os; login(token=os.environ['HF_TOKEN'], add_to_git_credential=True); print('HF girişi yapıldı')"
          else
            echo "HF_TOKEN sırrı konmamış -- yalnız umumi depolar inebilir."
          fi

      # ══════════════════════════════════════════════════════════
      #  KOŞUCUNUN DİSKİ AÇILIR -- ÖLÇÜLDÜ, DOLUYORDU
      # ══════════════════════════════════════════════════════════
      #
      #   RuntimeError: File reconstruction error:
      #   IO Error: No space left on device (os error 28)
      #
      # ubuntu-latest'te ~14 GB boş alan vardır ve onun bir kısmını
      # koşucunun kendi kurulu takımları tutar (.NET, GHC, Android
      # SDK, CodeQL) -- hiçbiri bu işte kullanılmaz. Silinince ~25 GB
      # açılır. Bu bir budama değil, **kabın genişletilmesidir**;
      # veriye dokunulmaz (ferman 1-O).
      - name: Koşucunun diskini aç (veriye DOKUNULMAZ)
        run: |
          echo "--- evvel ---"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup || true
          sudo apt-get clean || true
          echo "--- sonra ---"; df -h / | tail -1

      # ══════════════════════════════════════════════════════════
      #  BORU HATTI -- ``main/kulliyat.py:hf_boru`` (ferman 1-O)
      # ══════════════════════════════════════════════════════════
      #
      # Çevirici **depodan** çağrılır, burada yeniden yazılmaz: iki
      # nüsha olsaydı hangisinin koştuğu belirsiz olurdu (ferman 1-E)
      # ve biri ötekinden kayınca tâlim başka bir belirteç uzayı
      # okurdu -- ``mucit_ac``ın sözlük denetimi tam da onun içindir.
      #
      # ``snapshot_download`` **kesildi**: bütün kaynağı indirip sonra
      # çevirmek, adı boru hattı olan bir havuzdu ve koşucunun diskini
      # doldurdu. ``hf_boru`` dosya dosya indirir, çevirir ve hamı
      # **derhal siler**; diskte bir seferde tek dosya durur. Veri
      # kesilmez -- Release'e çıkan çevrilmiş külliyatın tamamıdır.
      - name: Çek-çevir-bırak (hf_boru)
        env:
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          KODLAMA: ${{ inputs.kodlama }}
          ALT_YOL: ${{ inputs.alt_yol }}
          UZANTI: ${{ inputs.uzanti }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from main.kulliyat import hf_boru, MUCIT_UZANTI

          kimlik = os.environ["HF_REPO_ID"]
          ad = kimlik.replace("/", "__")
          uz = tuple(u.strip() for u in os.environ["UZANTI"].split(",")
                     if u.strip())
          o = hf_boru(kimlik, ad + MUCIT_UZANTI, os.environ["KODLAMA"],
                      alt_yol=os.environ.get("ALT_YOL") or "",
                      uzantilar=uz,
                      jeton=os.environ.get("HF_TOKEN") or None)
          print("ÇEVRİLDİ:", o)
          # **BOŞ ÇIKTI SESSİZCE GEÇİLMEZ** (ferman 5): çevrilecek bir
          # şey yoksa iş akışı KIRMIZI yanar, boş bir varlık yüklemez.
          assert o["belirteç"] > 0, (
              "çeviri boş çıktı: inen %d dosya, %d bayt"
              % (o["inen_dosya"], o["inen_bayt"]))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("MUCIT_AD=%s\n" % ad)
              f.write("MUCIT_BELIRTEC=%d\n" % o["belirteç"])
              f.write("MUCIT_DOSYA=%d\n" % o["dosya"])
          PY
          df -h / | tail -1
          ls -lh *.mucit

      # Release varlığı başına 2 GB haddi vardır; çevrilmiş külliyat
      # ondan büyükse parçalanır. Parçalar indirildikten sonra
      # ``cat``lenerek birleşir -- biçim düz bayt olduğu için parçalama
      # ve birleştirme kayıpsızdır.
      - name: Release haddine göre parçala (BUDAMA YOK -- ferman 1-O)
        run: |
          BOY=$(stat -c%s "${MUCIT_AD}.mucit")
          if [ "$BOY" -gt 1900000000 ]; then
            split -b 1800M -d -a 2 "${MUCIT_AD}.mucit" "${MUCIT_AD}.mucit.parca"
            rm -f "${MUCIT_AD}.mucit"
            echo "parçalandı: $(ls ${MUCIT_AD}.mucit.parca* | wc -l) parça"
          else
            echo "tek parça: $BOY bayt"
          fi
          ls -lh ${MUCIT_AD}.mucit*

      - name: GitHub Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kulliyat-${{ github.run_number }}"
          name: "Külliyat (çevrilmiş): ${{ inputs.hf_repo_id }}"
          body: |
            **Çevrilmiş külliyat** -- `main/kulliyat.py:mucit_cevir`

            | | |
            |---|---|
            | Kaynak | `${{ inputs.hf_repo_id }}` (HuggingFace) |
            | Kodlama | `${{ inputs.kodlama }}` (tiktoken) |
            | Belirteç | `${{ env.MUCIT_BELIRTEC }}` |
            | Dosya | `${{ env.MUCIT_DOSYA }}` |

            Tâlime bağlamak için `main/kulliyat.py` cetveline:

            ```python
            Kaynak("${{ inputs.hf_repo_id }}", "${{ github.repository }}", "",
                   surum="kulliyat-${{ github.run_number }}",
                   varlik="${{ env.MUCIT_AD }}.mucit", pay=2.0),
            ```

            Biçim: `MUCIT2\n` + 320 baytlık JSON başlık + düz `uint32`
            **tiktoken belirteç kimlikleri**. `mucit_ac` `np.memmap` ile
            açar; kodlama tutmazsa **reddeder** (sessiz ikame yasak).
          files: |
            *.mucit
            *.mucit.parca*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
