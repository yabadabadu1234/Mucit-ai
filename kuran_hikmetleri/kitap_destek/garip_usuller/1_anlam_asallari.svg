<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="860" viewBox="0 0 1640 860" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="20" y="36" font-size="22" font-weight="700">1. Anlam asalları (Natural Semantic Metalanguage)</text><text x="20" y="60" font-size="13" fill="#555">Her mana yalnız ~65 evrensel "asal" kelimeyle (BİRİ, BİR ŞEY, YAPMAK, DÜŞÜNMEK, İSTEMEK, ÖNCE, SONRA, BUNUN YÜZÜNDEN…) yazılır.</text><text x="20" y="80" font-size="13" fill="#555">Satırlar manalar arasında ortaktır; iki mana arasındaki fark, eklenen ve düşen satırlardır. Bu tarifler benim yazdığım taslaktır.</text><text transform="translate(705.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">ESAS: ölçüp biçerek hazırlamak</text><text transform="translate(825.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">yaratmak (Allah için)</text><text transform="translate(945.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">yaratılmış (mahlûk)</text><text transform="translate(1065.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">huy</text><text transform="translate(1185.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">uydurmak</text><text transform="translate(1305.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">eskimek</text><text transform="translate(1425.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">nasip, pay</text><text transform="translate(1545.0,198) rotate(-50)" font-size="12.5" font-weight="700" fill="#2b2410">lâyık</text><rect x="12" y="210" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="232" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BİRİ, BİR ŞEY İÇİN BİR ŞEY YAPTI</text><circle cx="700.0" cy="227.0" r="9" fill="#2f6fb3"/><circle cx="820.0" cy="227.0" r="9" fill="#2f6fb3"/><circle cx="1180.0" cy="227.0" r="9" fill="#2f6fb3"/><text x="20" y="266" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">ÖNCE BU KİŞİ ŞÖYLE DÜŞÜNDÜ: &quot;BU ŞEY ŞÖYLE OLSUN İSTİYORUM&quot;</text><circle cx="700.0" cy="261.0" r="9" fill="#2f6fb3"/><circle cx="820.0" cy="261.0" r="9" fill="#2f6fb3"/><circle cx="1180.0" cy="261.0" r="9" fill="#2f6fb3"/><circle cx="1540.0" cy="261.0" r="9" fill="#2f6fb3"/><rect x="12" y="278" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="300" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">ÖNCE BU ŞEY BÖYLE DEĞİLDİ</text><circle cx="700.0" cy="295.0" r="9" fill="#2f6fb3"/><text x="20" y="334" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU KİŞİ BU ŞEYİN NE KADAR BÜYÜK OLACAĞINI BİLMEK İÇİN BİR ŞEY YAPTI (ölçtü)</text><circle cx="700.0" cy="329.0" r="9" fill="#2f6fb3"/><circle cx="1420.0" cy="329.0" r="9" fill="#2f6fb3"/><rect x="12" y="346" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="368" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BUNUN YÜZÜNDEN, SONRA BU ŞEY BU KİŞİNİN İSTEDİĞİ GİBİ OLDU</text><circle cx="700.0" cy="363.0" r="9" fill="#2f6fb3"/><circle cx="820.0" cy="363.0" r="9" fill="#2f6fb3"/><text x="20" y="402" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">ÖNCE BU ŞEY HİÇ YOKTU</text><circle cx="820.0" cy="397.0" r="9" fill="#2f6fb3"/><circle cx="940.0" cy="397.0" r="9" fill="#2f6fb3"/><rect x="12" y="414" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="436" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU YAPAN İNSAN DEĞİL; BUNU YALNIZ ALLAH YAPABİLİR</text><circle cx="820.0" cy="431.0" r="9" fill="#2f6fb3"/><text x="20" y="470" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU ŞEY ŞİMDİ VAR, ÇÜNKÜ BİRİ ONU BÖYLE YAPTI</text><circle cx="940.0" cy="465.0" r="9" fill="#2f6fb3"/><circle cx="1060.0" cy="465.0" r="9" fill="#2f6fb3"/><rect x="12" y="482" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="504" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU ŞEY BİRİNİN İÇİNDE; BU KİŞİ ÇOK ZAMAN BÖYLE DÜŞÜNÜR, BÖYLE YAPAR</text><circle cx="1060.0" cy="499.0" r="9" fill="#2f6fb3"/><text x="20" y="538" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU KİŞİ BUNU DÜŞÜNMEDEN YAPAR</text><circle cx="1060.0" cy="533.0" r="9" fill="#2f6fb3"/><rect x="12" y="550" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="572" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BİRİ BİR ŞEY SÖYLEDİ; BU ŞEY DOĞRU DEĞİL</text><circle cx="1180.0" cy="567.0" r="9" fill="#2f6fb3"/><text x="20" y="606" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU KİŞİ İNSANLARIN &quot;BU DOĞRU&quot; DÜŞÜNMESİNİ İSTEDİ</text><circle cx="1180.0" cy="601.0" r="9" fill="#2f6fb3"/><rect x="12" y="618" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="640" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU ŞEY ÇOK ZAMAN BİR ŞEYE DOKUNDU; BUNUN YÜZÜNDEN ÜSTÜ DÜZ OLDU, ESKİ OLDU</text><circle cx="1300.0" cy="635.0" r="9" fill="#2f6fb3"/><text x="20" y="674" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BİRİ İÇİN BİR ŞEYİN BİR PARÇASI; BU PARÇA BU KİŞİ İÇİN İYİ</text><circle cx="1420.0" cy="669.0" r="9" fill="#2f6fb3"/><rect x="12" y="686" width="1616" height="34" fill="#f4efe0" opacity=".6"/><text x="20" y="708" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#2b2410">BU ŞEY BİR ŞEY İÇİN İYİ, ÇÜNKÜ ONUN İÇİN BÖYLE YAPILDI</text><circle cx="1540.0" cy="703.0" r="9" fill="#2f6fb3"/><line x1="700.0" y1="227.0" x2="1180.0" y2="227.0" stroke="#2f6fb3" stroke-width="2" opacity=".5"/><line x1="700.0" y1="261.0" x2="1540.0" y2="261.0" stroke="#2f6fb3" stroke-width="2" opacity=".5"/><line x1="700.0" y1="329.0" x2="1420.0" y2="329.0" stroke="#2f6fb3" stroke-width="2" opacity=".5"/><line x1="700.0" y1="363.0" x2="820.0" y2="363.0" stroke="#2f6fb3" stroke-width="2" opacity=".5"/><line x1="820.0" y1="397.0" x2="940.0" y2="397.0" stroke="#2f6fb3" stroke-width="2" opacity=".5"/><line x1="940.0" y1="465.0" x2="1060.0" y2="465.0" stroke="#2f6fb3" stroke-width="2" opacity=".5"/><text x="20" y="760" font-size="12.5" fill="#555">Okuyuş: "yaratmak" = ESAS − L3 − L4 + L6 + L7  ·  "uydurmak" = ESAS − L3 − L4 − L5 + L11 + L12  ·  "huy" = yaratılmış + L9 + L10</text></svg>