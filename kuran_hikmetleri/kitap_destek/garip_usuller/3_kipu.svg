<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="20" y="36" font-size="22" font-weight="700">3. Kipu: kökün manaları düğümlü iplere işlenir</text><text x="20" y="60" font-size="13" fill="#555">Ana ip = kök. Sarkan ip = dal. Düğümün ipteki yüksekliği = köke uzaklık. Yuvarlak düğüm: bitişiklikle türeyen mana; uzun düğüm: benzerlikle (istiare).</text><text x="20" y="80" font-size="13" fill="#555">Yan ipler alt dallardır. Bir kere düğüm dili öğrenilince ip elle de okunur (İnka kipuları sayıları böyle saklardı).</text><path d="M60,130 C400,110 1000,150 1460,125" fill="none" stroke="#8a6d3b" stroke-width="10" stroke-linecap="round"/><text x="640" y="112" text-anchor="middle" font-size="24" font-family="Amiri, serif">خلق</text><path d="M180,135 L180,835" fill="none" stroke="#2f6fb3" stroke-width="5"/><text x="190" y="157" font-size="12.5" font-weight="700" fill="#2f6fb3">ölçüp biçme</text><circle cx="180" cy="325" r="9" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="194" y="329" font-size="11" fill="#2b2410">yaratmak</text><circle cx="180" cy="455" r="9" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="194" y="459" font-size="11" fill="#2b2410">yaratılmış</text><path d="M180,395 C204.0,415 300,405 300,455" fill="none" stroke="#2f6fb3" stroke-width="3"/><circle cx="300" cy="455" r="9" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="314" y="459" font-size="11" fill="#2b2410">yaradılış</text><rect x="293" y="569" width="14" height="32" rx="7" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="314" y="589" font-size="11" fill="#2b2410">huy</text><rect x="293" y="699" width="14" height="32" rx="7" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="314" y="719" font-size="11" fill="#2b2410">ahlâk</text><path d="M300,655 C324.0,675 420,665 420,715" fill="none" stroke="#2f6fb3" stroke-width="3"/><rect x="413" y="699" width="14" height="32" rx="7" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="434" y="719" font-size="11" fill="#2b2410">öfke</text><path d="M300,655 C324.0,675 540,665 540,715" fill="none" stroke="#2f6fb3" stroke-width="3"/><rect x="533" y="699" width="14" height="32" rx="7" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="554" y="719" font-size="11" fill="#2b2410">takınmak</text><path d="M180,395 C204.0,415 420,405 420,455" fill="none" stroke="#2f6fb3" stroke-width="3"/><rect x="413" y="439" width="14" height="32" rx="7" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.5"/><text x="434" y="459" font-size="11" fill="#2b2410">uydurmak</text><path d="M640,135 L640,835" fill="none" stroke="#3f8f3a" stroke-width="5"/><text x="650" y="157" font-size="12.5" font-weight="700" fill="#3f8f3a">düzleme</text><circle cx="640" cy="325" r="9" fill="#3f8f3a" stroke="#2b2410" stroke-width="1.5"/><text x="654" y="329" font-size="11" fill="#2b2410">eskimek</text><path d="M640,265 C670.0,285 790,275 790,325" fill="none" stroke="#3f8f3a" stroke-width="3"/><circle cx="790" cy="325" r="9" fill="#3f8f3a" stroke="#2b2410" stroke-width="1.5"/><text x="804" y="329" font-size="11" fill="#2b2410">koku sürmek</text><path d="M640,265 C670.0,285 940,275 940,325" fill="none" stroke="#3f8f3a" stroke-width="3"/><circle cx="940" cy="325" r="9" fill="#3f8f3a" stroke="#2b2410" stroke-width="1.5"/><text x="954" y="329" font-size="11" fill="#2b2410">şekli belirmiş</text><path d="M1230,135 L1230,835" fill="none" stroke="#c26a1e" stroke-width="5"/><text x="1240" y="157" font-size="12.5" font-weight="700" fill="#c26a1e">pay</text><path d="M1400,135 L1400,835" fill="none" stroke="#a8478f" stroke-width="5"/><text x="1410" y="157" font-size="12.5" font-weight="700" fill="#a8478f">yakışmak</text></svg>