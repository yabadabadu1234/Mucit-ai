<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="20" y="36" font-size="22" font-weight="700">2. Metin devresi (DisCoCirc): mana, katılanların tellerinde akan bir süreçtir</text><text x="20" y="60" font-size="13" fill="#555">Her tel bir katılan; kutu bir süreç ve dokunduğu tellerin hâlini değiştirir. Türeyen mana, ESAS devresinde bir teli ya da kutuyu değiştirmekle elde edilir.</text><text x="20" y="110" font-size="15" font-weight="700" fill="#2b2410">ESAS: ölçüp biçerek hazırlamak</text><line x1="110" y1="150" x2="580" y2="150" stroke="#2f6fb3" stroke-width="4"/><text x="104" y="155" text-anchor="end" font-size="12" font-weight="700" fill="#2f6fb3">yapan</text><line x1="110" y1="196" x2="580" y2="196" stroke="#c26a1e" stroke-width="4"/><text x="104" y="201" text-anchor="end" font-size="12" font-weight="700" fill="#c26a1e">ham madde</text><rect x="140" y="134" width="92" height="32" rx="6" fill="#2b2410" stroke="#2b2410" stroke-width="1.4"/><text x="186" y="154.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">niyet</text><rect x="250" y="134" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="296" y="177.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ölç</text><rect x="360" y="134" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="406" y="177.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">biç</text><rect x="470" y="180" width="92" height="32" rx="6" fill="#3f8f3a" stroke="#2b2410" stroke-width="1.4"/><text x="516" y="200.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">hazır</text><text x="20" y="240" font-size="11.5" fill="#555">Ham madde teli sonunda &quot;murad edilen şey&quot; hâline girer.</text><text x="660" y="110" font-size="15" font-weight="700" fill="#2b2410">yaratmak: ham madde teli YOKTAN başlar</text><line x1="750" y1="150" x2="1220" y2="150" stroke="#2f6fb3" stroke-width="4"/><text x="744" y="155" text-anchor="end" font-size="12" font-weight="700" fill="#2f6fb3">yapan</text><line x1="750" y1="196" x2="1220" y2="196" stroke="#999" stroke-width="4"/><text x="744" y="201" text-anchor="end" font-size="12" font-weight="700" fill="#999">(yok)→şey</text><rect x="780" y="134" width="92" height="32" rx="6" fill="#2b2410" stroke="#2b2410" stroke-width="1.4"/><text x="826" y="154.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">niyet</text><rect x="890" y="134" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="936" y="177.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">takdir</text><rect x="1000" y="134" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="1046" y="177.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">var et</text><rect x="1110" y="180" width="92" height="32" rx="6" fill="#3f8f3a" stroke="#2b2410" stroke-width="1.4"/><text x="1156" y="200.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">düzen</text><text x="660" y="240" font-size="11.5" fill="#555">Değişen: madde teli; kalan devre aynı.</text><text x="20" y="330" font-size="15" font-weight="700" fill="#2b2410">uydurmak: madde teli SÖZ olur, hedefe DİNLEYEN eklenir</text><line x1="110" y1="370" x2="580" y2="370" stroke="#2f6fb3" stroke-width="4"/><text x="104" y="375" text-anchor="end" font-size="12" font-weight="700" fill="#2f6fb3">yapan</text><line x1="110" y1="416" x2="580" y2="416" stroke="#c26a1e" stroke-width="4"/><text x="104" y="421" text-anchor="end" font-size="12" font-weight="700" fill="#c26a1e">söz</text><line x1="110" y1="462" x2="580" y2="462" stroke="#a8478f" stroke-width="4"/><text x="104" y="467" text-anchor="end" font-size="12" font-weight="700" fill="#a8478f">dinleyen</text><rect x="140" y="354" width="92" height="32" rx="6" fill="#2b2410" stroke="#2b2410" stroke-width="1.4"/><text x="186" y="374.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">niyet</text><rect x="250" y="354" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="296" y="397.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ölç</text><rect x="360" y="354" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="406" y="397.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">kur</text><rect x="470" y="400" width="92" height="78" rx="6" fill="#a8478f" stroke="#2b2410" stroke-width="1.4"/><text x="516" y="443.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">inandır</text><text x="20" y="506" font-size="11.5" fill="#555">Devre aynı, tel türü değişti: istiare (benzerlik).</text><text x="660" y="330" font-size="15" font-weight="700" fill="#2b2410">huy: biçilen şey KİŞİNİN KENDİSİDİR</text><line x1="750" y1="370" x2="1220" y2="370" stroke="#2f6fb3" stroke-width="4"/><text x="744" y="375" text-anchor="end" font-size="12" font-weight="700" fill="#2f6fb3">yaratan</text><line x1="750" y1="416" x2="1220" y2="416" stroke="#c26a1e" stroke-width="4"/><text x="744" y="421" text-anchor="end" font-size="12" font-weight="700" fill="#c26a1e">kişi</text><line x1="750" y1="462" x2="1220" y2="462" stroke="#3f8f3a" stroke-width="4"/><text x="744" y="467" text-anchor="end" font-size="12" font-weight="700" fill="#3f8f3a">kişinin işleri</text><rect x="780" y="354" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="826" y="397.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">takdir</text><rect x="890" y="354" width="92" height="78" rx="6" fill="#2f6fb3" stroke="#2b2410" stroke-width="1.4"/><text x="936" y="397.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">biç</text><rect x="1000" y="400" width="92" height="32" rx="6" fill="#3f8f3a" stroke="#2b2410" stroke-width="1.4"/><text x="1046" y="420.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">yerleş</text><rect x="1110" y="400" width="92" height="78" rx="6" fill="#3f8f3a" stroke="#2b2410" stroke-width="1.4"/><text x="1156" y="443.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">çıkar</text><text x="660" y="506" font-size="11.5" fill="#555">Biçilen madde insanın içi; çıktısı düşünmeden yapılan işler.</text></svg>