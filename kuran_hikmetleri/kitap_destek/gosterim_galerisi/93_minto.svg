<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">93. Minto piramidi: önce hüküm, altında gerekçeleri, onların altında delilleri</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Okuyan istediği katta durabilir.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="300" y="70" width="300" height="56" rx="6" fill="#f3eedd" stroke="#b8860b" stroke-width="1.6"/><text x="450.0" y="87.0" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="700">ANA FİKİR</text><text x="450.0" y="104.0" text-anchor="middle" font-size="10" fill="#2b2410" >خلق: bir şeyi bir maksada göre ölçüp hazırlamak</text><rect x="40" y="200" width="250" height="46" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.6"/><text x="165.0" y="217.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">Ölçmek yaratır</text><line x1="165" y1="200" x2="450" y2="128" stroke="#2b2410" marker-end="url(#o)"/><rect x="55" y="290" width="220" height="52" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.6"/><text x="165.0" y="308.0" text-anchor="middle" font-size="10" fill="#2b2410" >ölçülen tamamlanınca yaratılır</text><line x1="165" y1="290" x2="165" y2="246" stroke="#bbb"/><rect x="55" y="360" width="220" height="52" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.6"/><text x="165.0" y="378.0" text-anchor="middle" font-size="10" fill="#2b2410" >yaratılanın kalıbı yaradılıştır</text><line x1="165" y1="360" x2="165" y2="342" stroke="#bbb"/><rect x="55" y="430" width="220" height="52" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.6"/><text x="165.0" y="448.0" text-anchor="middle" font-size="10" fill="#2b2410" >kalıp nefse girince huydur</text><line x1="165" y1="430" x2="165" y2="412" stroke="#bbb"/><rect x="325" y="200" width="250" height="46" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="450.0" y="217.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">Düzlemek aşındırır</text><line x1="450" y1="200" x2="450" y2="128" stroke="#2b2410" marker-end="url(#o)"/><rect x="340" y="290" width="220" height="52" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="450.0" y="308.0" text-anchor="middle" font-size="10" fill="#2b2410" >düzlenen yüzey kayar</text><line x1="450" y1="290" x2="450" y2="246" stroke="#bbb"/><rect x="340" y="360" width="220" height="52" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="450.0" y="378.0" text-anchor="middle" font-size="10" fill="#2b2410" >kullanılan eşya eskir</text><line x1="450" y1="360" x2="450" y2="342" stroke="#bbb"/><rect x="340" y="430" width="220" height="52" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="450.0" y="448.0" text-anchor="middle" font-size="10" fill="#2b2410" >sürülen koku yüzeyi düzler</text><line x1="450" y1="430" x2="450" y2="412" stroke="#bbb"/><rect x="610" y="200" width="250" height="46" rx="6" fill="#fff" stroke="#c26a1e" stroke-width="1.6"/><text x="735.0" y="217.0" text-anchor="middle" font-size="11" fill="#c26a1e" font-weight="700">Ayırmak yakıştırır</text><line x1="735" y1="200" x2="450" y2="128" stroke="#2b2410" marker-end="url(#o)"/><rect x="625" y="290" width="220" height="52" rx="6" fill="#fff" stroke="#c26a1e" stroke-width="1.6"/><text x="735.0" y="308.0" text-anchor="middle" font-size="10" fill="#2b2410" >işe ayrılan paydır</text><line x1="735" y1="290" x2="735" y2="246" stroke="#bbb"/><rect x="625" y="360" width="220" height="52" rx="6" fill="#fff" stroke="#c26a1e" stroke-width="1.6"/><text x="735.0" y="378.0" text-anchor="middle" font-size="10" fill="#2b2410" >işe uyan lâyıktır</text><line x1="735" y1="360" x2="735" y2="342" stroke="#bbb"/><text x="450.0" y="560.0" text-anchor="middle" font-size="11" fill="#2b2410" >Yukarıdaki her cümle aşağıdakileri özetler; aşağıdakiler yukarıdakini ispat eder (Minto, &quot;Piramit Prensibi&quot;).</text></svg>