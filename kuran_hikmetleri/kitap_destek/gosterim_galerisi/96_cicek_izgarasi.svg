<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">96. Çiçek ızgarası: kelimenin etrafında sabit sekiz yaprak</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her yaprağın sorusu her kelimede aynıdır; okuyan neyi nerede bulacağını bilir.</text><ellipse cx="450.0" cy="105.0" rx="112" ry="50" fill="#e8c766" fill-opacity="0.15" stroke="#b8860b"/><text x="450.0" y="83.0" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">TARİF</text><text x="450.0" y="107.0" text-anchor="middle" font-size="10" fill="#2b2410" >ölçüp biçerek bir maksada</text><text x="450.0" y="120.0" text-anchor="middle" font-size="10" fill="#2b2410" >göre hazırlamak</text><ellipse cx="662.1" cy="176.8" rx="112" ry="50" fill="#e8c766" fill-opacity="0.2" stroke="#b8860b"/><text x="662.1" y="154.8" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">ÇEKİRDEK KELİME</text><text x="662.1" y="186.8" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><ellipse cx="750.0" cy="350.0" rx="112" ry="50" fill="#e8c766" fill-opacity="0.15" stroke="#b8860b"/><text x="750.0" y="328.0" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">EŞ MANALI</text><text x="750.0" y="360.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">فَطَرَ  بَرَأَ  قَدَّرَ</text><ellipse cx="662.1" cy="523.2" rx="112" ry="50" fill="#e8c766" fill-opacity="0.2" stroke="#b8860b"/><text x="662.1" y="501.2" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">ZIDDI</text><text x="662.1" y="525.2" text-anchor="middle" font-size="10" fill="#2b2410" >بَعْثَرَ (dağıtmak),</text><text x="662.1" y="538.2" text-anchor="middle" font-size="10" fill="#2b2410" >أَفْسَدَ (bozmak)</text><ellipse cx="450.0" cy="595.0" rx="112" ry="50" fill="#e8c766" fill-opacity="0.15" stroke="#b8860b"/><text x="450.0" y="573.0" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">AİLESİ</text><text x="450.0" y="605.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَالِق  مَخْلُوق  خُلُق  أَخْلَاق</text><ellipse cx="237.9" cy="523.2" rx="112" ry="50" fill="#e8c766" fill-opacity="0.2" stroke="#b8860b"/><text x="237.9" y="501.2" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">MİSAL CÜMLE</text><text x="237.9" y="533.2" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ</text><ellipse cx="150.0" cy="350.0" rx="112" ry="50" fill="#e8c766" fill-opacity="0.15" stroke="#b8860b"/><text x="150.0" y="328.0" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">İNCELİK</text><text x="150.0" y="352.0" text-anchor="middle" font-size="10" fill="#2b2410" >yokluktan değil, ölçüyle</text><text x="150.0" y="365.0" text-anchor="middle" font-size="10" fill="#2b2410" >düzen vermek vurgulanır</text><ellipse cx="237.9" cy="176.8" rx="112" ry="50" fill="#e8c766" fill-opacity="0.2" stroke="#b8860b"/><text x="237.9" y="154.8" text-anchor="middle" font-size="11" fill="#8a5a00" font-weight="700">YANLIŞ ANLAMA</text><text x="237.9" y="178.8" text-anchor="middle" font-size="10" fill="#2b2410" >خَلْق ile خُلُق</text><text x="237.9" y="191.8" text-anchor="middle" font-size="10" fill="#2b2410" >karıştırılır: yaratma ↔</text><text x="237.9" y="204.8" text-anchor="middle" font-size="10" fill="#2b2410" >huy</text><circle cx="450" cy="350" r="70" fill="#fff" stroke="#b8860b" stroke-width="3"/><text x="450.0" y="359.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خ ل ق</text></svg>