idth="140" height="32" rx="16" fill="#fff" stroke="#2b2410"/><text x="200.0" y="264.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">a / Allah</text><rect x="380" y="244" width="140" height="32" rx="16" fill="#fff" stroke="#2b2410"/><text x="450.0" y="264.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">i / insan</text><rect x="630" y="244" width="140" height="32" rx="16" fill="#fff" stroke="#2b2410"/><text x="700.0" y="264.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">h / hazırlamak-01</text><rect x="550" y="394" width="140" height="32" rx="16" fill="#fff" stroke="#2b2410"/><text x="620.0" y="414.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">ö / ölçmek-01</text><rect x="730" y="394" width="140" height="32" rx="16" fill="#fff" stroke="#2b2410"/><text x="800.0" y="414.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">ş / şekil</text><rect x="380" y="394" width="140" height="32" rx="16" fill="#fff" stroke="#2b2410"/><text x="450.0" y="414.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">n / nutfe</text><text x="40" y="490" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410" xml:space="preserve">(y / yaratmak-01</text><text x="40" y="507" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410" xml:space="preserve">   :ARG0 (a / Allah)</text><text x="40" y="524" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410" xml:space="preserve">   :ARG1 (i / insan)</text><text x="40" y="541" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410" xml:space="preserve">   :source (n / nutfe)</text><text x="40" y="558" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410" xml:space="preserve">   :manner (h / hazırlamak-01</text><text x="40" y="575" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410" xml:space="preserve">      :ARG1-of 