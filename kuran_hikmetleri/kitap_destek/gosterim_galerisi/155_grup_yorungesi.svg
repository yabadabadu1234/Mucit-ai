<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">155. Cebir: vezinler kök üstünde işleyen dönüşümler, kelimeler kökün yörüngesi</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Harfler dönüşümün adı (φ fâil, μ mef&#x27;ûl, ι ifti&#x27;âl…).</text><path d="M450,360 Q476.0,233.5 450.0,130.0 Q424.0,233.5 450,360" fill="#2f6fb3" fill-opacity=".18" stroke="#2f6fb3" stroke-width="1.5"/><text x="450.0" y="106.0" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">خَالِق</text><text x="450.0" y="226.0" text-anchor="middle" font-size="12" fill="#2f6fb3" font-weight="700" font-style="italic">φ</text><path d="M450,360 Q531.8,260.1 556.9,156.3 Q485.8,235.9 450,360" fill="#2f6fb3" fill-opacity=".18" stroke="#2f6fb3" stroke-width="1.5"/><text x="570.8" y="135.8" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">مَخْلُوق</text><text x="514.1" y="241.8" text-anchor="middle" font-size="12" fill="#2f6fb3" font-weight="700" font-style="italic">μ</text><path d="M450,360 Q568.9,309.5 639.3,229.3 Q539.3,266.7 450,360" fill="#2f6fb3" fill-opacity=".18" stroke="#2f6fb3" stroke-width="1.5"/><text x="664.0" y="218.3" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">خَلْق</text><text x="563.6" y="285.6" text-anchor="middle" font-size="12" fill="#2f6fb3" font-weight="700" font-style="italic">σ</text><path d="M450,360 Q578.7,370.6 678.3,332.3 Q572.4,318.9 450,360" fill="#3f8f3a" fill-opacity=".18" stroke="#3f8f3a" stroke-width="1.5"/><text x="708.1" y="334.7" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#3f8f3a">خَلَّقَ</text><text x="587.0" y="347.4" text-anchor="middle" font-size="12" fill="#3f8f3a" font-weight="700" font-style="italic">τ</text><path d="M450,360 Q589.9,440.9 721.2,462.8 Q608.4,392.2 450,360" fill="#2c8c7c" fill-opacity=".18" stroke="#2c8c7c" stroke-width="1.5"/><text x="749.2" y="479.5" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2c8c7c">مُخَلَّق</text><text x="612.7" y="425.7" text-anchor="middle" font-size="12" fill="#2c8c7c" font-weight="700" font-style="italic">τμ</text><path d="M450,360 Q514.4,471.9 602.5,532.2 Q553.3,437.4 450,360" fill="#7a3fb3" fill-opacity=".18" stroke="#7a3fb3" stroke-width="1.5"/><text x="622.4" y="560.6" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#7a3fb3">تَخَلَّقَ</text><text x="541.5" y="467.3" text-anchor="middle" font-size="12" fill="#7a3fb3" font-weight="700" font-style="italic">ε</text><path d="M450,360 Q455.0,489.0 505.0,583.3 Q505.5,476.6 450,360" fill="#c0392b" fill-opacity=".18" stroke="#c0392b" stroke-width="1.5"/><text x="512.2" y="618.4" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#c0392b">اِخْتَلَقَ</text><text x="483.0" y="498.0" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700" font-style="italic">ι</text><path d="M450,360 Q386.6,508.6 380.6,641.6 Q437.1,521.1 450,360" fill="#c0392b" fill-opacity=".18" stroke="#c0392b" stroke-width="1.5"/><text x="373.4" y="676.7" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#c0392b">اِخْتِلَاق</text><text x="408.4" y="532.9" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700" font-style="italic">ισ</text><path d="M450,360 Q324.8,462.1 257.7,577.1 Q363.7,496.6 450,360" fill="#c0392b" fill-opacity=".18" stroke="#c0392b" stroke-width="1.5"/><text x="237.8" y="605.5" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#c0392b">مُخْتَلَق</text><text x="334.6" y="494.2" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700" font-style="italic">ιμ</text><path d="M450,360 Q291.6,392.2 178.8,462.8 Q310.1,440.9 450,360" fill="#c0392b" fill-opacity=".18" stroke="#c0392b" stroke-width="1.5"/><text x="150.8" y="479.5" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#c0392b">مُخْتَلِق</text><text x="287.3" y="425.7" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700" font-style="italic">ιφ</text><path d="M450,360 Q327.6,318.9 221.7,332.3 Q321.3,370.6 450,360" fill="#7a3fb3" fill-opacity=".18" stroke="#7a3fb3" stroke-width="1.5"/><text x="191.9" y="334.7" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#7a3fb3">خُلُق</text><text x="313.0" y="347.4" text-anchor="middle" font-size="12" fill="#7a3fb3" font-weight="700" font-style="italic">ψ</text><path d="M450,360 Q333.5,248.0 211.3,195.3 Q304.0,290.8 450,360" fill="#7a3fb3" fill-opacity=".18" stroke="#7a3fb3" stroke-width="1.5"/><text x="186.6" y="184.2" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#7a3fb3">أَخْلَاق</text><text x="306.8" y="265.2" text-anchor="middle" font-size="12" fill="#7a3fb3" font-weight="700" font-style="italic">ψπ</text><path d="M450,360 Q414.2,235.9 343.1,156.3 Q368.2,260.1 450,360" fill="#a8478f" fill-opacity=".18" stroke="#a8478f" stroke-width="1.5"/><text x="329.2" y="135.8" text-anchor="middle" font-size="16" font-family="Amiri, Noto Naskh Arabic, serif" fill="#a8478f">خَلِيق</text><text x="385.9" y="241.8" text-anchor="middle" font-size="12" fill="#a8478f" font-weight="700" font-style="italic">ρ</text><circle cx="450" cy="360" r="38" fill="#e8c766"/><text x="450.0" y="368.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خلق</text><text x="450.0" y="680.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">Kelime = dönüşüm(kök). Bileşik dönüşüm: ιμ = μ∘ι (önce VIII. bâb, sonra mef&#x27;ûl). ψπ = cem&#x27;∘fu&#x27;ul.</text><text x="450.0" y="700.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >Kısa yaprak tek dönüşüm, uzun yaprak iki dönüşümün bileşkesi. Aynı dönüşümler başka köke uygulanınca aynı desen çıkar.</text></svg>