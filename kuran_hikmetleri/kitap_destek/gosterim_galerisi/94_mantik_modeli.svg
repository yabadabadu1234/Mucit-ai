<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">94. Mantık modeli: girdi → faaliyet → çıktı → netice → uzun vade</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her safhanın altında o safhada doğan manalar.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="20" y="90" width="160" height="320" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><rect x="20" y="90" width="160" height="34" rx="8" fill="#2b2410"/><text x="100.0" y="112.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">GİRDİ</text><text x="100.0" y="160.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ham madde (deri,</text><text x="100.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >toprak)</text><text x="100.0" y="240.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ölçü aleti</text><text x="100.0" y="320.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >yapan</text><line x1="180" y1="250" x2="196" y2="250" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><rect x="196" y="90" width="160" height="320" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><rect x="196" y="90" width="160" height="34" rx="8" fill="#2b2410"/><text x="276.0" y="112.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">FAALİYET</text><text x="276.0" y="160.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ölçmek</text><text x="276.0" y="240.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >biçmek</text><text x="276.0" y="320.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >düzlemek</text><line x1="356" y1="250" x2="372" y2="250" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><rect x="372" y="90" width="160" height="320" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><rect x="372" y="90" width="160" height="34" rx="8" fill="#2b2410"/><text x="452.0" y="112.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">ÇIKTI</text><text x="452.0" y="160.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >yaratılmış (مَخْلُوق)</text><text x="452.0" y="240.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >şekli belirmiş</text><text x="452.0" y="254.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >(مُخَلَّق)</text><text x="452.0" y="320.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >düz yüzey (خَلْقَاء)</text><line x1="532" y1="250" x2="548" y2="250" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><rect x="548" y="90" width="160" height="320" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><rect x="548" y="90" width="160" height="34" rx="8" fill="#2b2410"/><text x="628.0" y="112.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">NETİCE</text><text x="628.0" y="160.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >yaradılış, kalıp</text><text x="628.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >(خِلْقَة)</text><text x="628.0" y="240.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >işe yakışma (خَلِيق)</text><text x="628.0" y="320.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >pay (خَلَاق)</text><line x1="708" y1="250" x2="724" y2="250" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><rect x="724" y="90" width="160" height="320" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><rect x="724" y="90" width="160" height="34" rx="8" fill="#2b2410"/><text x="804.0" y="112.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">UZUN VADE</text><text x="804.0" y="160.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >huy (خُلُق)</text><text x="804.0" y="240.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ahlâk (أَخْلَاق)</text><text x="804.0" y="320.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >eskime (خَلِقَ)</text><text x="450.0" y="450.0" text-anchor="middle" font-size="11" fill="#2b2410" >Usul: soldan sağa bir işin girdisinden uzun vadeli neticesine. Kökün manaları bu işin safhalarıdır.</text></svg>