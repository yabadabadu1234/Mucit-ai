<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">64. SMILES tarzı tek satır: bütün türeme ağacı bir satırda</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Kimyada molekül böyle tek satıra yazılır.</text><text x="450" y="130" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#2b2410">E(A(D(J)(KU(X)(Y)Z)L)N)(B(F)G)(C)H.R2</text><text x="450.0" y="175.0" text-anchor="middle" font-size="12" fill="#2b2410" >Okunuşu: harf = mana; peş peşe = türeme; parantez = yan dal; nokta = bağsız parça (kök dışı).</text><text x="90.0" y="230.0" text-anchor="start" font-size="11.5" fill="#b8860b" >E = esas</text><text x="290.0" y="230.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >A = ölçüp biçmek</text><text x="490.0" y="230.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >D = yaratmak</text><text x="690.0" y="230.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >J = yaratılmış</text><text x="90.0" y="256.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >K = yaradılış</text><text x="290.0" y="256.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >U = huy</text><text x="490.0" y="256.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >X = ahlâk</text><text x="690.0" y="256.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >Y = öfke</text><text x="90.0" y="282.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >Z = huy takınmak</text><text x="290.0" y="282.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" >L = uydurmak</text><text x="490.0" y="282.0" text-anchor="start" font-size="11.5" fill="#2c8c7c" >N = şekli belirmiş</text><text x="690.0" y="282.0" text-anchor="start" font-size="11.5" fill="#3f8f3a" >B = düzlemek</text><text x="90.0" y="308.0" text-anchor="start" font-size="11.5" fill="#3f8f3a" >F = eskimek</text><text x="290.0" y="308.0" text-anchor="start" font-size="11.5" fill="#3f8f3a" >G = koku sürmek</text><text x="490.0" y="308.0" text-anchor="start" font-size="11.5" fill="#c26a1e" >C = pay</text><text x="690.0" y="308.0" text-anchor="start" font-size="11.5" fill="#a8478f" >H = yakışmak</text><text x="90.0" y="334.0" text-anchor="start" font-size="11.5" fill="#7a7a7a" >R2 = kök dışı</text><text x="450.0" y="400.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">Kelimelerle (kısmî):</text><text x="450.0" y="440.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خلق(خَلَقَ|خَلْق)(خَلِيقَة|خُلُق)(اِخْلَوْلَقَ|خَلِقَ)(خَلَقَ|تَخَلَّقَ)</text><text x="450.0" y="500.0" text-anchor="middle" font-size="12" fill="#2b2410" >Bütün yapı 37 işarete sığar. Aynı yazıdan ağaç geri çizilebilir.</text></svg>