<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">77. Veri çizgi romanı: türeme altı kare bir hikâye</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her kare bir mana, alt yazısı kelimesi.</text><rect x="20" y="70" width="275" height="270" fill="#fff" stroke="#2b2410" stroke-width="3"/><rect x="20" y="70" width="275" height="44" fill="#f3eedd" stroke="#2b2410"/><text x="157.0" y="96.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">Terzi deriyi ölçüp biçer.</text><circle cx="80" cy="170" r="12" fill="none" stroke="#2b2410" stroke-width="2.5"/><line x1="80" y1="182" x2="80" y2="222" stroke="#2b2410" stroke-width="2.5"/><line x1="62" y1="198" x2="98" y2="198" stroke="#2b2410" stroke-width="2.5"/><path d="M66,250 L80,222 L94,250" stroke="#2b2410" stroke-width="2.5" fill="none"/><rect x="130" y="220" width="120" height="50" fill="#d9b382"/><line x1="130" y1="210" x2="250" y2="210" stroke="#2b2410" stroke-width="2"/><text x="157.0" y="322.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">خَلَقَ</text><rect x="310" y="70" width="275" height="270" fill="#fff" stroke="#2b2410" stroke-width="3"/><rect x="310" y="70" width="275" height="44" fill="#f3eedd" stroke="#2b2410"/><text x="447.0" y="96.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">Ölçülen parçalar birleşir, eser ortaya çıkar.</text><circle cx="370" cy="170" r="12" fill="none" stroke="#2b2410" stroke-width="2.5"/><line x1="370" y1="182" x2="370" y2="222" stroke="#2b2410" stroke-width="2.5"/><line x1="352" y1="198" x2="388" y2="198" stroke="#2b2410" stroke-width="2.5"/><path d="M356,250 L370,222 L384,250" stroke="#2b2410" stroke-width="2.5" fill="none"/><path d="M440,270 l40,-70 l40,70z" fill="#d9b382" stroke="#2b2410"/><text x="480" y="190" font-size="22">✨</text><text x="447.0" y="322.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">خَلْق</text><rect x="600" y="70" width="275" height="270" fill="#fff" stroke="#2b2410" stroke-width="3"/><rect x="600" y="70" width="275" height="44" fill="#f3eedd" stroke="#2b2410"/><text x="737.0" y="96.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">Eserin bir kalıbı, bir yaradılışı vardır.</text><circle cx="660" cy="170" r="12" fill="none" stroke="#2b2410" stroke-width="2.5"/><line x1="660" y1="182" x2="660" y2="222" stroke="#2b2410" stroke-width="2.5"/><line x1="642" y1="198" x2="678" y2="198" stroke="#2b2410" stroke-width="2.5"/><path d="M646,250 L660,222 L674,250" stroke="#2b2410" stroke-width="2.5" fill="none"/><rect x="730" y="190" width="80" height="90" fill="none" stroke="#2f6fb3" stroke-dasharray="6 3" stroke-width="2"/><text x="737.0" y="322.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">خِلْقَة</text><rect x="20" y="355" width="275" height="270" fill="#fff" stroke="#2b2410" stroke-width="3"/><rect x="20" y="355" width="275" height="44" fill="#f3eedd" stroke="#2b2410"/><text x="157.0" y="381.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">İnsanda bu kalıp içe yerleşir: huy.</text><circle cx="80" cy="455" r="12" fill="none" stroke="#2b2410" stroke-width="2.5"/><line x1="80" y1="467" x2="80" y2="507" stroke="#2b2410" stroke-width="2.5"/><line x1="62" y1="483" x2="98" y2="483" stroke="#2b2410" stroke-width="2.5"/><path d="M66,535 L80,507 L94,535" stroke="#2b2410" stroke-width="2.5" fill="none"/><path d="M80,480 c-8,-10 -18,0 0,14 c18,-14 8,-24 0,-14" fill="#c0392b"/><circle cx="200" cy="455" r="12" fill="none" stroke="#2b2410" stroke-width="2.5"/><line x1="200" y1="467" x2="200" y2="507" stroke="#2b2410" stroke-width="2.5"/><line x1="182" y1="483" x2="218" y2="483" stroke="#2b2410" stroke-width="2.5"/><path d="M186,535 L200,507 L214,535" stroke="#2b2410" stroke-width="2.5" fill="none"/><path d="M200,480 c-8,-10 -18,0 0,14 c18,-14 8,-24 0,-14" fill="#c0392b"/><text x="157.0" y="607.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">خُلُق</text><rect x="310" y="355" width="275" height="270" fill="#fff" stroke="#2b2410" stroke-width="3"/><rect x="310" y="355" width="275" height="44" fill="#f3eedd" stroke="#2b2410"/><text x="447.0" y="381.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">Elbise yıllarca giyilir, yüzü düzleşir.</text><circle cx="370" cy="455" r="12" fill="none" stroke="#2b2410" stroke-width="2.5"/><line x1="370" y1="467" x2="370" y2="507" stroke="#2b2410" stroke-width="2.5"/><line x1="352" y1="483" x2="388" y2="483" stroke="#2b2410" stroke-width="2.5"/><path d="M356,535 L370,507 L384,535" stroke="#2b2410" stroke-width="2.5" fill="none"/><path d="M440,475 h80 v90 h-80z" fill="#b5b5b5"/><path d="M460,505 l10,10 M490,535 l12,-6" stroke="#fff" stroke-width="3"/><text x="520" y="475" font-size="20">⏳</text><text x="447.0" y="607.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#3f8f3a">خَلِق</text><rect x="600" y="355" width="275" height="270" fill="#fff" stroke="#2b2410" stroke-width="3"/><rect x="600" y="355" width="275" height="44" fill="#f3eedd" stroke="#2b2410"/><text x="737.0" y="381.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">Biri olmayan sözü eser gibi diker.</text><circle cx="660" cy="455" r="12" fill="none" stroke="#2b2410" stroke-width="2.5"/><line x1="660" y1="467" x2="660" y2="507" stroke="#2b2410" stroke-width="2.5"/><line x1="642" y1="483" x2="678" y2="483" stroke="#2b2410" stroke-width="2.5"/><path d="M646,535 L660,507 L674,535" stroke="#2b2410" stroke-width="2.5" fill="none"/><rect x="700" y="435" width="150" height="50" rx="20" fill="#fff" stroke="#2b2410"/><text x="775" y="466" text-anchor="middle" font-size="12">"Gördüm, oldu!"</text><text x="775" y="525" font-size="30" text-anchor="middle">❌</text><text x="737.0" y="607.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2f6fb3">اِخْتَلَقَ</text></svg>