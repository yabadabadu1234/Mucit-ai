<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">85. Kialo tartışma ağacı: tez, lehte ve aleyhte iki sütun</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her itirazın altında cevabı; cevaplanamayan kabul edilir.</text><rect x="250" y="70" width="400" height="56" rx="8" fill="#2b2410"/><text x="450.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="700">TEZ: خلق&#x27;ın bütün manaları &quot;ölçüp biçerek hazırlamak&quot;tan doğar</text><text x="230.0" y="160.0" text-anchor="middle" font-size="13" fill="#3f8f3a" font-weight="700">LEHTE</text><rect x="30" y="180" width="400" height="80" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="2" style="border-left:6px"/><rect x="30" y="180" width="8" height="80" fill="#3f8f3a"/><text x="240.0" y="210.0" text-anchor="middle" font-size="11" fill="#2b2410" >Yaratmak, ölçülen şeyin tamamlanmasıdır</text><rect x="30" y="280" width="400" height="80" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="2" style="border-left:6px"/><rect x="30" y="280" width="8" height="80" fill="#3f8f3a"/><text x="240.0" y="310.0" text-anchor="middle" font-size="11" fill="#2b2410" >Huy, yaradılışa ölçülüp verilen hâldir</text><rect x="30" y="380" width="400" height="80" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="2" style="border-left:6px"/><rect x="30" y="380" width="8" height="80" fill="#3f8f3a"/><text x="240.0" y="410.0" text-anchor="middle" font-size="11" fill="#2b2410" >Pay (خَلَاق) iş için ölçülen paydır</text><rect x="30" y="480" width="400" height="80" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="2" style="border-left:6px"/><rect x="30" y="480" width="8" height="80" fill="#3f8f3a"/><text x="240.0" y="510.0" text-anchor="middle" font-size="11" fill="#2b2410" >Lâyık (خَلِيق) ölçüsüne uyan şeydir</text><text x="670.0" y="160.0" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="700">ALEYHTE</text><rect x="470" y="180" width="400" height="80" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2" style="border-left:6px"/><rect x="470" y="180" width="8" height="80" fill="#c0392b"/><text x="680.0" y="210.0" text-anchor="middle" font-size="11" fill="#2b2410" >Eskimek (خَلِقَ) ölçüden değil aşınmadan gelir</text><text x="680.0" y="236.0" text-anchor="middle" font-size="10" fill="#3f8f3a" >↳ cevap: eskimek düzlemenin neticesidir (B dalı)</text><rect x="470" y="280" width="400" height="80" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2" style="border-left:6px"/><rect x="470" y="280" width="8" height="80" fill="#c0392b"/><text x="680.0" y="310.0" text-anchor="middle" font-size="11" fill="#2b2410" >Koku (خَلُوق) hiçbir ölçü bildirmez</text><text x="680.0" y="336.0" text-anchor="middle" font-size="10" fill="#3f8f3a" >↳ cevap: koku sürmek yüzeyi düzler (B dalı)</text><rect x="470" y="380" width="400" height="80" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2" style="border-left:6px"/><rect x="470" y="380" width="8" height="80" fill="#c0392b"/><text x="680.0" y="410.0" text-anchor="middle" font-size="11" fill="#2b2410" >Kazan (خِلْقِين) Yunancadandır</text><text x="680.0" y="436.0" text-anchor="middle" font-size="10" fill="#7a7a7a" >↳ kabul: kök dışı sayılır</text></svg>