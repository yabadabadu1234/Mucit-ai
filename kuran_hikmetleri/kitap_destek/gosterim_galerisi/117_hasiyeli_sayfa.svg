<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">117. Haşiyeli sayfa (matn–şerh–hâşiye): ortada asıl, etrafında açıklamalar</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Medrese kitaplarının sayfa tertibi.</text><rect x="60" y="70" width="780" height="560" fill="#fbf6e6" stroke="#8a5a2b" stroke-width="2"/><rect x="290" y="250" width="320" height="200" fill="#fff" stroke="#8a5a2b" stroke-width="1.5"/><text x="450.0" y="270.0" text-anchor="middle" font-size="11" fill="#8a5a2b" font-weight="700">MATN</text><text x="450.0" y="320.0" text-anchor="middle" font-size="22" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ: قَدَّرَ وَهَيَّأَ</text><text x="450.0" y="350.0" text-anchor="middle" font-size="11" fill="#2b2410" >ölçüp biçerek hazırladı</text><text x="450.0" y="395.0" text-anchor="middle" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">ثُمَّ: أَوْجَدَ، وَمِنْهُ الخُلُق</text><text x="450.0" y="420.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >sonra: var etti; huy da buradandır</text><text x="450.0" y="110.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ŞERH (üst): ölçmek, bir şeyi yapmadan önce sınırlarını tayin etmektir; terzi böyle yapar.</text><text x="450.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Bu yüzden Allah&#x27;a &quot;Hâlık&quot; denir: her şeyi ölçüsüyle var eden.</text><text x="175.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">HÂŞİYE (sol):</text><text x="175.0" y="310.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >eskimek manası</text><text x="175.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >düzlenmiş yüzeyden</text><text x="175.0" y="350.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >gelir: خَلِقَ الثَّوْبُ</text><text x="725.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">HÂŞİYE (sağ):</text><text x="725.0" y="310.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >huy, yaradılışın</text><text x="725.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >nefse vurmasıdır;</text><text x="725.0" y="350.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >çoğulu أَخْلَاق</text><text x="450.0" y="500.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >TA&#x27;LÎKA (alt): koku manası (خَلُوق) yüzeye sürülen şeyden; kazan (خِلْقِين) yabancı kelimedir.</text><text x="450.0" y="600.0" text-anchor="middle" font-size="10" fill="#6d6650" >Matn ortada, şerh etrafını sarar; okuyan önce matnı, ihtiyaç olunca kenarı okur.</text></svg>