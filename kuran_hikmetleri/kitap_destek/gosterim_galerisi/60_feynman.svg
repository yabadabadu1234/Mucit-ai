.0" text-anchor="start" font-size="11" fill="#2b2410" >uydurdu</text><text x="450.0" y="625.0" text-anchor="middle" font-size="11" fill="#2b2410" >Düz çizgi = kök (harfler), dalgalı çizgi = vezin, nokta = birleşme, kalın çizgi = doğan kelime (renk dal).</text></svg>