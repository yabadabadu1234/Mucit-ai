<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">139. Gazete ön sayfası: en mühim mana manşette, diğerleri sütunlarda</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Okuyan önce manşeti, sonra ilgisini çeken sütunu okur; ehemmiyet yerleşimden belli olur.</text><rect x="30" y="64" width="840" height="580" fill="#faf8f0" stroke="#2b2410"/><text x="450.0" y="108.0" text-anchor="middle" font-size="34" fill="#2b2410" font-weight="700" font-family="Georgia, serif">LÜGAT GAZETESİ</text><line x1="40" y1="120" x2="860" y2="120" stroke="#2b2410" stroke-width="3"/><text x="450.0" y="136.0" text-anchor="middle" font-size="10" fill="#6d6650" >15 Kasım 2026 · Kök: خ ل ق · Fiyatı: bir dikkat</text><text x="450.0" y="180.0" text-anchor="middle" font-size="28" fill="#2b2410" font-weight="700" font-family="Georgia, serif">&quot;HER ŞEY ÖLÇÜYLE YARATILDI&quot;</text><text x="50.0" y="210.0" text-anchor="start" font-size="11.5" fill="#2b2410" >Lügat âlimleri, yaratmak manasının asıl kaynağını açıkladı: kelime ilk önce terzi ve marangozun ölçüp biçmesini anlatıyordu. Ölçülen</text><text x="50.0" y="226.7" text-anchor="start" font-size="11.5" fill="#2b2410" >şey tamamlanınca &quot;yaratılmış&quot; oldu. Bugün خَالِق kelimesi bu ölçünün sahibini bildiriyor.</text><text x="50.0" y="300.0" text-anchor="start" font-size="9.5" fill="#b3541e" font-weight="700">İÇ HABER</text><text x="50.0" y="322.0" text-anchor="start" font-size="14" fill="#1a1a1a" font-weight="700" font-family="Georgia, serif">Huy da aileden çıktı</text><text x="50.0" y="345.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Yaradılışta nefse verilen kalıp,</text><text x="50.0" y="360.2" text-anchor="start" font-size="10.5" fill="#2b2410" >insanın huyu (خُلُق) oldu.</text><text x="50.0" y="375.4" text-anchor="start" font-size="10.5" fill="#2b2410" >Uzmanlara göre huylar yerleşince</text><text x="50.0" y="390.7" text-anchor="start" font-size="10.5" fill="#2b2410" >ahlâk (أَخْلَاق) doğuyor.</text><line x1="247" y1="290" x2="247" y2="620" stroke="#ccc"/><text x="255.0" y="300.0" text-anchor="start" font-size="9.5" fill="#b3541e" font-weight="700">EKONOMİ</text><text x="255.0" y="322.0" text-anchor="start" font-size="14" fill="#1a1a1a" font-weight="700" font-family="Georgia, serif">Pay piyasası</text><text x="255.0" y="345.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Bir iş için ölçülüp ayrılan nasibe</text><text x="255.0" y="360.2" text-anchor="start" font-size="10.5" fill="#2b2410" >خَلَاق deniyor. Âhirette payı</text><text x="255.0" y="375.4" text-anchor="start" font-size="10.5" fill="#2b2410" >olmayanlar için Bakara 102</text><text x="255.0" y="390.7" text-anchor="start" font-size="10.5" fill="#2b2410" >uyarıyor.</text><line x1="452" y1="290" x2="452" y2="620" stroke="#ccc"/><text x="460.0" y="300.0" text-anchor="start" font-size="9.5" fill="#b3541e" font-weight="700">MODA</text><text x="460.0" y="322.0" text-anchor="start" font-size="14" fill="#1a1a1a" font-weight="700" font-family="Georgia, serif">Elbiseler neden eskir?</text><text x="460.0" y="345.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Düzlenen yüzey sürtündükçe</text><text x="460.0" y="360.2" text-anchor="start" font-size="10.5" fill="#2b2410" >aşınıyor: خَلِقَ. Paçavralara</text><text x="460.0" y="375.4" text-anchor="start" font-size="10.5" fill="#2b2410" >خُلْقَان deniyor.</text><line x1="657" y1="290" x2="657" y2="620" stroke="#ccc"/><text x="665.0" y="300.0" text-anchor="start" font-size="9.5" fill="#b3541e" font-weight="700">SON DAKİKA</text><text x="665.0" y="322.0" text-anchor="start" font-size="14" fill="#1a1a1a" font-weight="700" font-family="Georgia, serif">Uydurma tespit edildi</text><text x="665.0" y="345.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Olmayan sözü varmış gibi gösteren</text><text x="665.0" y="360.2" text-anchor="start" font-size="10.5" fill="#2b2410" >اِخْتِلَاق vakası. Yetkililer:</text><text x="665.0" y="375.4" text-anchor="start" font-size="10.5" fill="#2b2410" >&quot;Sahte yaratmadır.&quot;</text><text x="450.0" y="630.0" text-anchor="middle" font-size="10" fill="#6d6650" font-style="italic">Küçük ilan: Yunanca kökenli kazan (خِلْقِين) aile arıyor. Akrabalık kabul edilmedi.</text></svg>