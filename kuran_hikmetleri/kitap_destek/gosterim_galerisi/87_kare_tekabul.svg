<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">87. Kare-i tekabül (mantıkta karşıtlık karesi): esas iddianın dört hâli</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Ortaçağ mantık yazmalarındaki dört köşeli şekil.</text><line x1="180" y1="120" x2="720" y2="120" stroke="#c0392b" stroke-width="2"/><text x="450.0" y="112.0" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">tezât (ikisi birden doğru olamaz)</text><line x1="180" y1="480" x2="720" y2="480" stroke="#c26a1e" stroke-width="2"/><text x="450.0" y="472.0" text-anchor="middle" font-size="10.5" fill="#c26a1e" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">duhûl tahte&#x27;t-tezât (ikisi birden yanlış olamaz)</text><line x1="180" y1="120" x2="720" y2="480" stroke="#2b2410" stroke-width="2"/><line x1="720" y1="120" x2="180" y2="480" stroke="#2b2410" stroke-width="2"/><line x1="180" y1="120" x2="180" y2="480" stroke="#2f6fb3" stroke-width="2"/><text x="180.0" y="292.0" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">tedâhul</text><line x1="720" y1="120" x2="720" y2="480" stroke="#2f6fb3" stroke-width="2"/><text x="720.0" y="292.0" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">tedâhul</text><text x="450.0" y="290.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" stroke="#fffdf6" stroke-width="4" paint-order="stroke">tenâkuz (biri doğruysa öteki yanlış)</text><rect x="30" y="86" width="300" height="68" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="180.0" y="108.0" text-anchor="middle" font-size="10" fill="#6d6650" >A: küllî mûcibe</text><text x="180.0" y="130.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">Her yaratılan ölçülmüştür</text><rect x="570" y="86" width="300" height="68" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="720.0" y="108.0" text-anchor="middle" font-size="10" fill="#6d6650" >E: küllî sâlibe</text><text x="720.0" y="130.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">Hiçbir yaratılan ölçülmemiştir</text><rect x="30" y="446" width="300" height="68" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="180.0" y="468.0" text-anchor="middle" font-size="10" fill="#6d6650" >I: cüz&#x27;î mûcibe</text><text x="180.0" y="490.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">Bazı yaratılanlar ölçülmüştür</text><rect x="570" y="446" width="300" height="68" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="720.0" y="468.0" text-anchor="middle" font-size="10" fill="#6d6650" >O: cüz&#x27;î sâlibe</text><text x="720.0" y="490.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">Bazı yaratılanlar ölçülmemiştir</text><text x="450.0" y="590.0" text-anchor="middle" font-size="11" fill="#2b2410" >Kökün iddiası A köşesidir. Kare, bu iddiayı reddeden kimin hangi köşeyi savunması gerektiğini gösterir.</text></svg>