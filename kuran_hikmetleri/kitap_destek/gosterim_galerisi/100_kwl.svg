<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">100. KWL cetveli: bildiğim, merak ettiğim, öğrendiğim</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Okuyan önce kendi bilgisini yazar; öğrendiği, merakının cevabı olarak yerleşir.</text><rect x="30" y="80" width="270" height="480" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="2"/><rect x="30" y="80" width="270" height="40" rx="8" fill="#2f6fb3"/><text x="165.0" y="106.0" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">BİLİYORUM</text><text x="45.0" y="160.0" text-anchor="start" font-size="11" fill="#2b2410" >خلق = yaratmak</text><text x="45.0" y="220.0" text-anchor="start" font-size="11" fill="#2b2410" >خالق = yaratan</text><text x="45.0" y="280.0" text-anchor="start" font-size="11" fill="#2b2410" >ahlâk kelimesi Türkçede var</text><rect x="320" y="80" width="270" height="480" rx="8" fill="#fff" stroke="#c26a1e" stroke-width="2"/><rect x="320" y="80" width="270" height="40" rx="8" fill="#c26a1e"/><text x="455.0" y="106.0" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">MERAK EDİYORUM</text><text x="335.0" y="160.0" text-anchor="start" font-size="11" fill="#2b2410" >ahlâk neden yaratmakla aynı kökten?</text><text x="335.0" y="220.0" text-anchor="start" font-size="11" fill="#2b2410" >eskimek bu köke nasıl girdi?</text><text x="335.0" y="280.0" text-anchor="start" font-size="11" fill="#2b2410" >koku neden buradan?</text><rect x="610" y="80" width="270" height="480" rx="8" fill="#fff" stroke="#3f8f3a" stroke-width="2"/><rect x="610" y="80" width="270" height="40" rx="8" fill="#3f8f3a"/><text x="745.0" y="106.0" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">ÖĞRENDİM</text><text x="625.0" y="160.0" text-anchor="start" font-size="11" fill="#2b2410" >esas: ölçüp biçerek hazırlamak</text><text x="625.0" y="220.0" text-anchor="start" font-size="11" fill="#2b2410" >huy = nefse ölçülüp verilen kalıp</text><text x="625.0" y="280.0" text-anchor="start" font-size="11" fill="#2b2410" >eskimek = düzlenen yüzeyin aşınması</text><text x="625.0" y="340.0" text-anchor="start" font-size="11" fill="#2b2410" >koku = yüzeyi düzleyen sürme</text></svg>