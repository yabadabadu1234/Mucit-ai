<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">33. Toulmin delil şeması: kökün tek esasa irca edilmesi</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Veri → (teminat, dayanak) → kayıtlı hüküm; itiraz ayrı kutuda.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="20" y="90" width="250" height="120" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="28.0" y="106.0" text-anchor="start" font-size="10.5" fill="#2b2410" font-weight="700">VERİ (müşahede)</text><text x="28.0" y="123.0" text-anchor="start" font-size="10" fill="#2b2410" >خَلَقَ: yarattı</text><text x="28.0" y="138.0" text-anchor="start" font-size="10" fill="#2b2410" >خُلُق: huy, ahlâk</text><text x="28.0" y="153.0" text-anchor="start" font-size="10" fill="#2b2410" >خَلِقَ: eskidi</text><text x="28.0" y="168.0" text-anchor="start" font-size="10" fill="#2b2410" >خَلَاق: pay</text><rect x="620" y="90" width="260" height="120" rx="6" fill="#fff" stroke="#b3541e" stroke-width="1.6"/><text x="628.0" y="106.0" text-anchor="start" font-size="10.5" fill="#b3541e" font-weight="700">HÜKÜM</text><text x="628.0" y="123.0" text-anchor="start" font-size="10" fill="#2b2410" >Bütün bu manalar tek esastan</text><text x="628.0" y="138.0" text-anchor="start" font-size="10" fill="#2b2410" >doğar: ölçüp biçerek</text><text x="628.0" y="153.0" text-anchor="start" font-size="10" fill="#2b2410" >hazırlamak.</text><rect x="330" y="90" width="230" height="60" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="338.0" y="106.0" text-anchor="start" font-size="10.5" fill="#2b2410" font-weight="700">KAYIT (derece)</text><text x="338.0" y="123.0" text-anchor="start" font-size="10" fill="#2b2410" >ekseriyetle; bir kelime müstesna</text><rect x="330" y="250" width="250" height="105" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="338.0" y="266.0" text-anchor="start" font-size="10.5" fill="#2b2410" font-weight="700">TEMİNAT (köprü)</text><text x="338.0" y="283.0" text-anchor="start" font-size="10" fill="#2b2410" >Ölçülüp biçilen şey yaratılır,</text><text x="338.0" y="298.0" text-anchor="start" font-size="10" fill="#2b2410" >yaratılan bir huy kazanır;</text><text x="338.0" y="313.0" text-anchor="start" font-size="10" fill="#2b2410" >düzlenen şey eskir ve yıpranır.</text><rect x="330" y="400" width="250" height="75" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="338.0" y="416.0" text-anchor="start" font-size="10.5" fill="#2b2410" font-weight="700">DAYANAK</text><text x="338.0" y="433.0" text-anchor="start" font-size="10" fill="#2b2410" >İbn Fâris, Mekâyîs: iki asıl</text><text x="338.0" y="448.0" text-anchor="start" font-size="10" fill="#2b2410" >(takdîr ve imlâs)</text><rect x="620" y="260" width="260" height="90" rx="6" fill="#fff" stroke="#7a7a7a" stroke-width="1.6"/><text x="628.0" y="276.0" text-anchor="start" font-size="10.5" fill="#7a7a7a" font-weight="700">İTİRAZ (istisna)</text><text x="628.0" y="293.0" text-anchor="start" font-size="10" fill="#2b2410" >خَلُوق (koku) türemeyle</text><text x="628.0" y="308.0" text-anchor="start" font-size="10" fill="#2b2410" >açıklanamıyor: kök dışı (R2)</text><line x1="270" y1="150" x2="620" y2="150" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><line x1="455" y1="250" x2="455" y2="158" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><line x1="455" y1="400" x2="455" y2="357" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><line x1="750" y1="260" x2="750" y2="212" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/></svg>