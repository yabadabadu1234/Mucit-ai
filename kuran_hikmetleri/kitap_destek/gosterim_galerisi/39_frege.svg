2" stroke="#2b2410" stroke-width="1.5"/><line x1="70" y1="672" x2="100" y2="672" stroke="#2b2410" stroke-width="1.5"/><text x="106.0" y="676.0" text-anchor="start" font-size="10.5" fill="#2b2410" >esas</text><text x="330.0" y="660.0" text-anchor="start" font-size="10" fill="#6d6650" >çünkü ölçülüp hazırlanan şey hazırlandığı işe yakışır</text><text x="450.0" y="716.0" text-anchor="middle" font-size="11" fill="#2b2410" >Dikey kısa çizgi: &quot;hükmolunur&quot;. Aşağı inen kol: şart. Okunuşu: alttaki varsa üstteki vardır.</text></svg>