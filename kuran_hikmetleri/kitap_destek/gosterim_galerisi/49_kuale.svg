<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">49. Dört illet (kuale yapısı): bir kelimenin dört yüzü</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her köşe bir illet ve onu taşıyan kelimeler.</text><text x="450.0" y="358.0" text-anchor="middle" font-size="30" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق</text><circle cx="450" cy="350" r="60" fill="none" stroke="#b8860b" stroke-width="2"/><rect x="70" y="130" width="320" height="100" rx="8" fill="#fff" stroke="#2b2410"/><line x1="405" y1="310" x2="350" y2="230" stroke="#999"/><text x="230.0" y="152.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">SURÎ (formal): nedir?</text><text x="230.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ölçülüp biçilmiş, şekli belirmiş bir varlık</text><text x="230.0" y="210.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَخْلُوق · خِلْقَة</text><rect x="510" y="130" width="320" height="100" rx="8" fill="#fff" stroke="#2b2410"/><line x1="495" y1="310" x2="550" y2="230" stroke="#999"/><text x="670.0" y="152.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">MADDÎ (constitutive): neden yapılmış?</text><text x="670.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ham madde: deri, toprak, nutfe</text><text x="670.0" y="210.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">düzlenmiş yüzey: خَلْقَاء</text><rect x="70" y="470" width="320" height="100" rx="8" fill="#fff" stroke="#2b2410"/><line x1="405" y1="390" x2="350" y2="470" stroke="#999"/><text x="230.0" y="492.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">GAÎ (telic): ne için?</text><text x="230.0" y="520.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >bir işe yakışmak, lâyık olmak</text><text x="230.0" y="550.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيق · أَخْلَق</text><rect x="510" y="470" width="320" height="100" rx="8" fill="#fff" stroke="#2b2410"/><line x1="495" y1="390" x2="550" y2="470" stroke="#999"/><text x="670.0" y="492.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">FÂİLÎ (agentive): nasıl meydana geldi?</text><text x="670.0" y="520.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ölçüp biçen bir yapanın fiiliyle</text><text x="670.0" y="550.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَالِق · خَلَّاق</text><text x="450.0" y="630.0" text-anchor="middle" font-size="11" fill="#2b2410" >Pustejovsky&#x27;nin dört kualesi Aristo&#x27;nun dört illetidir: surî, maddî, gaî, fâilî.</text></svg>