<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">69. Lull bilgi ağacı: yedi parçalı ağaç (kök, gövde, dal, yaprak, çiçek, meyve)</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her parça bir mertebe; meyve en son ve en çok emek isteyen manadır.</text><path d="M380,600 Q450,650 520,600 M400,600 l-50,40 M500,600 l50,40" stroke="#6b3e1d" stroke-width="6" fill="none"/><text x="40.0" y="604.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-weight="700">RADICES (kökler)</text><text x="860.0" y="604.0" text-anchor="end" font-size="11" fill="#2b2410" >kök harfleri خ ل ق</text><rect x="430" y="460" width="40" height="140" fill="#8a5a2b"/><text x="40.0" y="514.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-weight="700">TRUNCUS (gövde)</text><text x="860.0" y="514.0" text-anchor="end" font-size="11" fill="#2b2410" >esas: ölçüp biçerek hazırlamak</text><ellipse cx="450" cy="420" rx="370" ry="30" fill="#3f8f3a" fill-opacity=".8"/><text x="40.0" y="424.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-weight="700">RAMI (büyük dallar)</text><text x="860.0" y="424.0" text-anchor="end" font-size="11" fill="#2b2410" >ölçmek · düzlemek · pay · yakışmak</text><ellipse cx="450" cy="330" rx="320" ry="30" fill="#5aa04f" fill-opacity=".8"/><text x="40.0" y="334.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-weight="700">RAMUSCULI (küçük dallar)</text><text x="860.0" y="334.0" text-anchor="end" font-size="11" fill="#2b2410" >yaratmak · eskimek · koku · şekil</text><ellipse cx="450" cy="240" rx="270" ry="30" fill="#7bbf6a" fill-opacity=".8"/><text x="40.0" y="244.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-weight="700">FOLIA (yapraklar)</text><text x="860.0" y="244.0" text-anchor="end" font-size="11" fill="#2b2410" >yaratılmış · yaradılış · uydurmak</text><ellipse cx="450" cy="150" rx="220" ry="30" fill="#d07fb0" fill-opacity=".8"/><text x="40.0" y="154.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-weight="700">FLORES (çiçekler)</text><text x="860.0" y="154.0" text-anchor="end" font-size="11" fill="#2b2410" >huy · huy takınmak · öfke</text><ellipse cx="450" cy="75" rx="170" ry="30" fill="#c0392b" fill-opacity=".8"/><text x="40.0" y="79.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-weight="700">FRUCTUS (meyve)</text><text x="860.0" y="79.0" text-anchor="end" font-size="11" fill="#2b2410" >ahlâk (أَخْلَاق)</text></svg>