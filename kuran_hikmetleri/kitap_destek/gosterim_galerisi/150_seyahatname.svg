<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">150. Seyahatname: bir yolcu kökün memleketini gün gün gezer</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her gün bir mana; yolun sırası türemenin sırasıdır, yolcunun gözlemi sebebidir.</text><rect x="80" y="64" width="740" height="590" fill="#f6eedb" stroke="#8a6d3b" stroke-width="2"/><text x="110.0" y="100.0" text-anchor="start" font-size="12" fill="#8a5a00" font-weight="700" font-family="Georgia, serif">Birinci gün</text><text x="230.0" y="100.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Esas pınarından yola çıktım. Ölçüp biçmek denen bu pınar, bütün suların kaynağıdır.</text><text x="110.0" y="130.7" text-anchor="start" font-size="12" fill="#8a5a00" font-weight="700" font-family="Georgia, serif">İkinci gün</text><text x="230.0" y="130.7" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Ölçü ırmağını izleyip Hâlık şehrine vardım. Ölçülen her şey burada tamamlanıp &quot;yaratılmış&quot;</text><text x="230.0" y="147.4" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">adını alıyor.</text><text x="110.0" y="178.0" text-anchor="start" font-size="12" fill="#8a5a00" font-weight="700" font-family="Georgia, serif">Üçüncü gün</text><text x="230.0" y="178.0" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Hilkat köyünde her şeyin bir kalıbı olduğunu öğrendim. Köylüler kalıbı insanın içine</text><text x="230.0" y="194.7" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">koyunca ona huy diyorlar.</text><text x="110.0" y="225.4" text-anchor="start" font-size="12" fill="#8a5a00" font-weight="700" font-family="Georgia, serif">Dördüncü gün</text><text x="230.0" y="225.4" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Ahlâk kalesine çıktım: huyların yerleşip düzene girdiği yer. Kalenin dibinde öfke</text><text x="230.0" y="242.1" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">yarlarını gördüm; huy taşınca oradan akıyor.</text><text x="110.0" y="272.7" text-anchor="start" font-size="12" fill="#8a5a00" font-weight="700" font-family="Georgia, serif">Beşinci gün</text><text x="230.0" y="272.7" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Dönüşte Uydurma bataklığına saptım; olmayan yolu varmış gibi gösteriyordu. Ölçüsüz yaratma</text><text x="230.0" y="289.4" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">budur dedim, geri döndüm.</text><text x="110.0" y="320.1" text-anchor="start" font-size="12" fill="#8a5a00" font-weight="700" font-family="Georgia, serif">Altıncı gün</text><text x="230.0" y="320.1" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Düzlük yaylasına geçtim. Burada her yüzey düzlenmiş, çokları aşınıp eskimiş; pazarda eski</text><text x="230.0" y="336.8" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">elbiselere hulkân diyorlar. Koku bahçelerinde halûk sürüyorlar.</text><text x="110.0" y="367.4" text-anchor="start" font-size="12" fill="#8a5a00" font-weight="700" font-family="Georgia, serif">Yedinci gün</text><text x="230.0" y="367.4" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Pay pazarında herkesin işine ayrılan nasibini, Yakışık köprüsünde işine uyanı gördüm.</text><text x="230.0" y="384.1" text-anchor="start" font-size="11.5" fill="#2b2410" font-family="Georgia, serif">Limanda bir kazan duruyordu; Yunan gemisiyle gelmiş, bu memleketten değilmiş.</text></svg>