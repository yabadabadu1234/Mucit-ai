<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">48. Mel&#x27;čuk sözlük fonksiyonları: kökten türeyenler evrensel fonksiyonların değeri</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Eşleşmeler bu levha için tayin edildi; fonksiyon adları Anlam-Metin nazariyesindendir.</text><rect x="60" y="80" width="300" height="34" fill="#2b2410"/><text x="65.0" y="96.0" text-anchor="start" font-size="10.5" fill="#fff" font-weight="700">sözlük fonksiyonu</text><rect x="360" y="80" width="220" height="34" fill="#2b2410"/><text x="365.0" y="96.0" text-anchor="start" font-size="10.5" fill="#fff" font-weight="700">değeri</text><rect x="580" y="80" width="260" height="34" fill="#2b2410"/><text x="585.0" y="96.0" text-anchor="start" font-size="10.5" fill="#fff" font-weight="700">Türkçesi</text><rect x="60" y="114" width="300" height="34" fill="#fff" stroke="#e2d9bd"/><text x="65.0" y="130.0" text-anchor="start" font-size="10" fill="#2b2410" >S0 (fiilin ismi)</text><rect x="360" y="114" width="220" height="34" fill="#fff" stroke="#e2d9bd"/><text x="575.0" y="131.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق</text><rect x="580" y="114" width="260" height="34" fill="#fff" stroke="#e2d9bd"/><text x="585.0" y="130.0" text-anchor="start" font-size="10" fill="#2b2410" >yaratma</text><rect x="60" y="148" width="300" height="34" fill="#fbf6e6" stroke="#e2d9bd"/><text x="65.0" y="164.0" text-anchor="start" font-size="10" fill="#2b2410" >S1 (birinci rol: fâil)</text><rect x="360" y="148" width="220" height="34" fill="#fbf6e6" stroke="#e2d9bd"/><text x="575.0" y="165.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَالِق</text><rect x="580" y="148" width="260" height="34" fill="#fbf6e6