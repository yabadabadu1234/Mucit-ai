<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">135. Patlatılmış montaj çizimi: kelime parçalarına sökülür</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Mühendislik çiziminin usulü: hangi parça nereye takılmış, takılınca ne olmuş.</text><text x="450.0" y="140.0" text-anchor="middle" font-size="46" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَخْلُوق</text><text x="450.0" y="170.0" text-anchor="middle" font-size="11" fill="#6d6650" >montajlı hâl</text><line x1="450" y1="185" x2="220" y2="300" stroke="#bbb" stroke-dasharray="4 3"/><rect x="182" y="300" width="76" height="90" rx="6" fill="#fff" stroke="#2b2410" stroke-width="2" transform="rotate(-7.666666666666667 220 345)"/><text x="220.0" y="360.0" text-anchor="middle" font-size="38" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2b2410">ق</text><text x="220.0" y="420.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >kök 3</text><line x1="450" y1="185" x2="310" y2="300" stroke="#bbb" stroke-dasharray="4 3"/><rect x="272" y="300" width="76" height="90" rx="6" fill="#fff" stroke="#b3541e" stroke-width="2" transform="rotate(-4.666666666666667 310 345)"/><text x="310.0" y="360.0" text-anchor="middle" font-size="38" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">ُو</text><text x="310.0" y="420.0" text-anchor="middle" font-size="10.5" fill="#b3541e" >uzatma vâvı</text><line x1="450" y1="185" x2="400" y2="300" stroke="#bbb" stroke-dasharray="4 3"/><rect x="362" y="300" width="76" height="90" rx="6" fill="#fff" stroke="#2b2410" stroke-width="2" transform="rotate(-1.6666666666666667 400 345)"/><text x="400.0" y="360.0" text-anchor="middle" font-size="38" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2b2410">ل</text><text x="400.0" y="420.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >kök 2</text><line x1="450" y1="185" x2="480" y2="300" stroke="#bbb" stroke-dasharray="4 3"/><rect x="442" y="300" width="76" height="90" rx="6" fill="#fff" stroke="#999" stroke-width="2" transform="rotate(1.0 480 345)"/><text x="480.0" y="360.0" text-anchor="middle" font-size="38" font-family="Amiri, Noto Naskh Arabic, serif" fill="#999">ْ</text><text x="480.0" y="420.0" text-anchor="middle" font-size="10.5" fill="#999" >sükûn</text><line x1="450" y1="185" x2="560" y2="300" stroke="#bbb" stroke-dasharray="4 3"/><rect x="522" y="300" width="76" height="90" rx="6" fill="#fff" stroke="#2b2410" stroke-width="2" transform="rotate(3.6666666666666665 560 345)"/><text x="560.0" y="360.0" text-anchor="middle" font-size="38" font-family="Amiri, Noto Naskh Arabic, serif" fill="#2b2410">خ</text><text x="560.0" y="420.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >kök 1</text><line x1="450" y1="185" x2="670" y2="300" stroke="#bbb" stroke-dasharray="4 3"/><rect x="632" y="300" width="76" height="90" rx="6" fill="#fff" stroke="#b3541e" stroke-width="2" transform="rotate(7.333333333333333 670 345)"/><text x="670.0" y="360.0" text-anchor="middle" font-size="38" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">م</text><text x="670.0" y="420.0" text-anchor="middle" font-size="10.5" fill="#b3541e" >mim: &quot;-ilmiş olan&quot;</text><text x="450.0" y="500.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">Parça listesi: 3 kök harfi (ölçüp biçme) + mim ve vâv (vezin: مَفْعُول, &quot;kendisine iş yapılan&quot;) = &quot;ölçülüp biçilmiş, yaratılmış olan&quot;</text><text x="450.0" y="530.0" text-anchor="middle" font-size="11" fill="#2b2410" >Makine çizimindeki gibi parçalar yerinden çıkarılıp sökülme sırasıyla gösterilir; siyah parçalar asıl, kırmızılar takılan.</text></svg>