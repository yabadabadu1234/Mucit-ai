<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">27. Lull çarkı: üç dönen halka, her dönüş yeni bir türev</text><text x="18" y="50" font-size="11.5" fill="#6d6650">İç halka esasın yönleri, orta halka türeme işlemleri, dış halka vezinler.</text><circle cx="450" cy="355" r="90" fill="none" stroke="#b8860b" stroke-width="2"/><text x="450.0" y="299.0" text-anchor="middle" font-size="10.5" fill="#b8860b" font-weight="700">ölçmek</text><text x="510.0" y="359.0" text-anchor="middle" font-size="10.5" fill="#b8860b" font-weight="700">düzlemek</text><text x="450.0" y="419.0" text-anchor="middle" font-size="10.5" fill="#b8860b" font-weight="700">ayırmak</text><text x="390.0" y="359.0" text-anchor="middle" font-size="10.5" fill="#b8860b" font-weight="700">yakıştırmak</text><circle cx="450" cy="355" r="170" fill="none" stroke="#2f6fb3" stroke-width="2"/><text x="450.0" y="219.0" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">netice</text><text x="532.3" y="245.7" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">hâl</text><text x="583.1" y="315.7" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">nesne</text><text x="583.1" y="402.3" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">vasıta</text><text x="532.3" y="472.3" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">zaman</text><text x="450.0" y="499.0" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">içe geçiş</text><text x="367.7" y="472.3" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">düzen</text><text x="316.9" y="402.3" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">taşma</text><text x="316.9" y="315.7" text-anchor="middle" font-size="10.5" fill="#