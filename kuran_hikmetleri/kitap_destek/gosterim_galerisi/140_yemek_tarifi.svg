<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">140. Yemek tarifi: bir mana, malzemesi ve yapılış adımlarıyla</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Malzeme = önşart manalar, adım = türeme sırası, sonuç = hedef kelime.</text><rect x="80" y="70" width="740" height="560" rx="14" fill="#fff9ee" stroke="#c26a1e" stroke-width="3"/><text x="450.0" y="115.0" text-anchor="middle" font-size="24" fill="#c26a1e" font-weight="700" font-family="Georgia, serif">TARİF: AHLÂK (أَخْلَاق)</text><text x="450.0" y="140.0" text-anchor="middle" font-size="11" fill="#6d6650" >Hazırlık: bir ömür · Pişirme: sabırla · Kaç kişilik: bir nefs</text><text x="120.0" y="180.0" text-anchor="start" font-size="13" fill="#c26a1e" font-weight="700">MALZEMELER</text><text x="130.0" y="205.0" text-anchor="start" font-size="11.5" fill="#2b2410" >• 1 ölçü (asıl: ölçüp biçmek, خَلَقَ)</text><text x="130.0" y="227.0" text-anchor="start" font-size="11.5" fill="#2b2410" >• 1 yaratılmış nefs (مَخْلُوق)</text><text x="130.0" y="249.0" text-anchor="start" font-size="11.5" fill="#2b2410" >• 1 yaradılış kalıbı (خِلْقَة)</text><text x="130.0" y="271.0" text-anchor="start" font-size="11.5" fill="#2b2410" >• bol miktarda tekrar</text><text x="130.0" y="293.0" text-anchor="start" font-size="11.5" fill="#2b2410" >• öfke (تَخَلَّقَ): dikkat, taşırmayın</text><text x="470.0" y="180.0" text-anchor="start" font-size="13" fill="#c26a1e" font-weight="700">YAPILIŞI</text><text x="480.0" y="205.0" text-anchor="start" font-size="11.5" fill="#2b2410" >1. Ham maddeyi maksada göre ölçün ve biçin.</text><text x="480.0" y="227.7" text-anchor="start" font-size="11.5" fill="#2b2410" >2. Ölçülen şeyi tamamlayın: artık</text><text x="480.0" y="244.4" text-anchor="start" font-size="11.5" fill="#2b2410" >yaratılmıştır.</text><text x="480.0" y="267.0" text-anchor="start" font-size="11.5" fill="#2b2410" >3. Yaratılana kalıbını verin; bu yaradılıştır.</text><text x="480.0" y="289.7" text-anchor="start" font-size="11.5" fill="#2b2410" >4. Kalıp nefse yerleşince huy olarak kabarır.</text><text x="480.0" y="312.4" text-anchor="start" font-size="11.5" fill="#2b2410" >5. Huyları tekrarla pişirin; yerleşince ahlâk</text><text x="480.0" y="329.1" text-anchor="start" font-size="11.5" fill="#2b2410" >olur.</text><text x="480.0" y="351.7" text-anchor="start" font-size="11.5" fill="#2b2410" >6. Başkasının huyunu üstünüze giymek</text><text x="480.0" y="368.4" text-anchor="start" font-size="11.5" fill="#2b2410" >(تَخَلُّق) tarifi bozar.</text><text x="450.0" y="600.0" text-anchor="middle" font-size="11" fill="#6d6650" font-style="italic">Usta notu: ölçüsüz yapılan &quot;yemek&quot; uydurmadır (اِخْتِلَاق). Kazan (خِلْقِين) bu tarifin malzemesi değildir, yabancıdır.</text></svg>