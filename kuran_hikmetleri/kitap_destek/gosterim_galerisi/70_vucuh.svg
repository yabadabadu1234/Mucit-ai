<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">70. Vücûh ve nezâir: Kur&#x27;ân&#x27;da bir kelimenin manaları (vücûh) ve benzerleri (nezâir)</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Klasik müfessirlerin sözlük usulü. Âyet yerleri hafızadandır; vech tasnifi bu levha için yapıldı.</text><rect x="20" y="80" width="860" height="80" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/><text x="32.0" y="102.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">vech 1: yaratmak</text><text x="860.0" y="110.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ</text><text x="860.0" y="134.0" text-anchor="end" font-size="10" fill="#6d6650" >En‘âm 6:1</text><text x="32.0" y="128.0" text-anchor="start" font-size="10" fill="#6d6650" >nezâiri (aynı manada başka kökler):</text><text x="32.0" y="150.0" text-anchor="start" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">فَطَرَ · بَرَأَ · جَعَلَ</text><rect x="20" y="170" width="860" height="80" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/><text x="32.0" y="192.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">vech 2: ölçüp biçmek / şekil vermek</text><text x="860.0" y="200.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">وَإِذْ تَخْلُقُ مِنَ الطِّينِ كَهَيْئَةِ الطَّيْرِ</text><text x="860.0" y="224.0" text-anchor="end" font-size="10" fill="#6d6650" >Mâide 5:110</text><text x="32.0" y="218.0" text-anchor="start" font-size="10" fill="#6d6650" >nezâiri (aynı manada başka kökler):</text><text x="32.0" y="240.0" text-anchor="start" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">صَوَّرَ · قَدَّرَ</text><rect x="20" y="260" width="860" height="80" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/><text x="32.0" y="282.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">vech 3: uydurmak</text><text x="860.0" y="290.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">إِنْ هَٰذَا إِلَّا اخْتِلَاقٌ</text><text x="860.0" y="314.0" text-anchor="end" font-size="10" fill="#6d6650" >Sâd 38:7</text><text x="32.0" y="308.0" text-anchor="start" font-size="10" fill="#6d6650" >nezâiri (aynı manada başka kökler):</text><text x="32.0" y="330.0" text-anchor="start" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">افْتَرَىٰ · تَقَوَّلَ</text><rect x="20" y="350" width="860" height="80" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/><text x="32.0" y="372.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">vech 4: huy, ahlâk</text><text x="860.0" y="380.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ</text><text x="860.0" y="404.0" text-anchor="end" font-size="10" fill="#6d6650" >Kalem 68:4</text><text x="32.0" y="398.0" text-anchor="start" font-size="10" fill="#6d6650" >nezâiri (aynı manada başka kökler):</text><text x="32.0" y="420.0" text-anchor="start" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">دِين · عَادَة</text><rect x="20" y="440" width="860" height="80" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.5"/><text x="32.0" y="462.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">vech 5: din, âdet (yaratılış yolu)</text><text x="860.0" y="470.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">إِنْ هَٰذَا إِلَّا خُلُقُ الْأَوَّلِينَ</text><text x="860.0" y="494.0" text-anchor="end" font-size="10" fill="#6d6650" >Şuarâ 26:137</text><text x="32.0" y="488.0" text-anchor="start" font-size="10" fill="#6d6650" >nezâiri (aynı manada başka kökler):</text><text x="32.0" y="510.0" text-anchor="start" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">سُنَّة</text><rect x="20" y="530" width="860" height="80" rx="6" fill="#fff" stroke="#c26a1e" stroke-width="1.5"/><text x="32.0" y="552.0" text-anchor="start" font-size="12" fill="#c26a1e" font-weight="700">vech 6: pay, nasip</text><text x="860.0" y="560.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ</text><text x="860.0" y="584.0" text-anchor="end" font-size="10" fill="#6d6650" >Bakara 2:102</text><text x="32.0" y="578.0" text-anchor="start" font-size="10" fill="#6d6650" >nezâiri (aynı manada başka kökler):</text><text x="32.0" y="600.0" text-anchor="start" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">نَصِيب</text></svg>