<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">148. Müze vitrini: her mana bir eşya, yanında künye etiketi</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Eşyayı görüp etiketi okuyan, manayı bir nesneye bağlar.</text><rect x="30" y="70" width="840" height="560" fill="#2b2a33"/><rect x="45" y="90" width="130" height="140" fill="#3a3945" stroke="#555"/><rect x="45" y="230" width="130" height="6" fill="#d9c38a"/><g transform="translate(110,160)"><path d="M-30,-20 L30,20 M-30,20 L30,-20" stroke="#d9c38a" stroke-width="5"/><circle cx="-34" cy="-22" r="8" fill="none" stroke="#d9c38a" stroke-width="3"/><circle cx="-34" cy="22" r="8" fill="none" stroke="#d9c38a" stroke-width="3"/></g><rect x="182" y="110" width="125" height="130" fill="#f5f1e6"/><text x="190.0" y="126.0" text-anchor="start" font-size="9" fill="#777" >Eser 1</text><text x="190.0" y="142.0" text-anchor="start" font-size="9.5" fill="#1a1a1a" font-weight="700">Terzi makası ve arşın</text><text x="300.0" y="164.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="190.0" y="184.0" text-anchor="start" font-size="8.5" fill="#2b2410" >Kökün ilk manası: ölçüp</text><text x="190.0" y="196.3" text-anchor="start" font-size="8.5" fill="#2b2410" >biçmek. Bu alet olmadan</text><text x="190.0" y="208.7" text-anchor="start" font-size="8.5" fill="#2b2410" >hiçbir şey</text><text x="190.0" y="221.0" text-anchor="start" font-size="8.5" fill="#2b2410" >&quot;yaratılmazdı&quot;.</text><rect x="320" y="90" width="130" height="140" fill="#3a3945" stroke="#555"/><rect x="320" y="230" width="130" height="6" fill="#d9c38a"/><g transform="translate(385,160)"><path d="M-25,-35 L25,-35 L40,40 L-40,40Z" fill="#7fa6cc"/></g><rect x="457" y="110" width="125" height="130" fill="#f5f1e6"/><text x="465.0" y="126.0" text-anchor="start" font-size="9" fill="#777" >Eser 2</text><text x="465.0" y="142.0" text-anchor="start" font-size="9.5" fill="#1a1a1a" font-weight="700">Bitmiş bir kaftan</text><text x="575.0" y="164.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَخْلُوق</text><text x="465.0" y="184.0" text-anchor="start" font-size="8.5" fill="#2b2410" >Ölçülen şey tamamlanınca</text><text x="465.0" y="196.3" text-anchor="start" font-size="8.5" fill="#2b2410" >&quot;yaratılmış&quot; olur.</text><rect x="595" y="90" width="130" height="140" fill="#3a3945" stroke="#555"/><rect x="595" y="230" width="130" height="6" fill="#d9c38a"/><g transform="translate(660,160)"><path d="M-25,-35 L25,-35 L40,40 L-40,40Z" fill="none" stroke="#fff" stroke-dasharray="5 3" stroke-width="2"/></g><rect x="732" y="110" width="125" height="130" fill="#f5f1e6"/><text x="740.0" y="126.0" text-anchor="start" font-size="9" fill="#777" >Eser 3</text><text x="740.0" y="142.0" text-anchor="start" font-size="9.5" fill="#1a1a1a" font-weight="700">Kaftanın kalıbı</text><text x="850.0" y="164.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة</text><text x="740.0" y="184.0" text-anchor="start" font-size="8.5" fill="#2b2410" >Her yaratılanın kalıbı,</text><text x="740.0" y="196.3" text-anchor="start" font-size="8.5" fill="#2b2410" >yaradılışıdır.</text><rect x="45" y="340" width="130" height="140" fill="#3a3945" stroke="#555"/><rect x="45" y="480" width="130" height="6" fill="#d9c38a"/><g transform="translate(110,410)"><path d="M0,25 C-45,-5 -25,-40 0,-15 C25,-40 45,-5 0,25Z" fill="#c0392b"/></g><rect x="182" y="360" width="125" height="130" fill="#f5f1e6"/><text x="190.0" y="376.0" text-anchor="start" font-size="9" fill="#777" >Eser 4</text><text x="190.0" y="392.0" text-anchor="start" font-size="9.5" fill="#1a1a1a" font-weight="700">Bir kalp (nefs)</text><text x="300.0" y="414.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خُلُق</text><text x="190.0" y="434.0" text-anchor="start" font-size="8.5" fill="#2b2410" >Kalıp içe girince huy</text><text x="190.0" y="446.3" text-anchor="start" font-size="8.5" fill="#2b2410" >olur.</text><rect x="320" y="340" width="130" height="140" fill="#3a3945" stroke="#555"/><rect x="320" y="480" width="130" height="6" fill="#d9c38a"/><g transform="translate(385,410)"><path d="M-25,-35 L25,-35 L40,40 L-40,40Z" fill="#888"/><path d="M-10,0 l8,10 l-6,8 M10,-10 l6,6" stroke="#2b2a33" stroke-width="3"/></g><rect x="457" y="360" width="125" height="130" fill="#f5f1e6"/><text x="465.0" y="376.0" text-anchor="start" font-size="9" fill="#777" >Eser 5</text><text x="465.0" y="392.0" text-anchor="start" font-size="9.5" fill="#1a1a1a" font-weight="700">Yıpranmış bir hırka</text><text x="575.0" y="414.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَق</text><text x="465.0" y="434.0" text-anchor="start" font-size="8.5" fill="#2b2410" >Düzlenen yüzey aşınır:</text><text x="465.0" y="446.3" text-anchor="start" font-size="8.5" fill="#2b2410" >eski.</text><rect x="595" y="340" width="130" height="140" fill="#3a3945" stroke="#555"/><rect x="595" y="480" width="130" height="6" fill="#d9c38a"/><g transform="translate(660,410)"><rect x="-15" y="-20" width="30" height="45" rx="6" fill="#a8478f"/><rect x="-6" y="-34" width="12" height="14" fill="#d9c38a"/></g><rect x="732" y="360" width="125" height="130" fill="#f5f1e6"/><text x="740.0" y="376.0" text-anchor="start" font-size="9" fill="#777" >Eser 6</text><text x="740.0" y="392.0" text-anchor="start" font-size="9.5" fill="#1a1a1a" font-weight="700">Koku şişesi</text><text x="850.0" y="414.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلُوق</text><text x="740.0" y="434.0" text-anchor="start" font-size="8.5" fill="#2b2410" >Yüzeye sürülen ıtır.</text></svg>