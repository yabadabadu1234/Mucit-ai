<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">83. Sözlük maddesi ağacı (Oxford usulü): 1 → 1a → 1a(i) numaralı mana dizini</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Numara mananın yerini, girinti köke uzaklığı gösterir; sağda kelimeler.</text><text x="40.0" y="80.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">1</text><text x="80.0" y="80.0" text-anchor="start" font-size="11.5" fill="#2b2410" >ölçüp biçmek</text><text x="870.0" y="82.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="74.0" y="106.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">1a</text><text x="114.0" y="106.0" text-anchor="start" font-size="11.5" fill="#2b2410" >yaratmak, var etmek</text><text x="870.0" y="108.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ · خَلْق · خَالِق · خَلَّاق</text><text x="108.0" y="132.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">1ai</text><text x="148.0" y="132.0" text-anchor="start" font-size="11.5" fill="#2b2410" >yaratılmış olan</text><text x="870.0" y="134.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق · مَخْلُوق · مَخْلُوقَات · خَلِيقَة</text><text x="108.0" y="158.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">1aii</text><text x="148.0" y="158.0" text-anchor="start" font-size="11.5" fill="#2b2410" >yaradılıştaki hâl ve suret</text><text x="870.0" y="160.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة · خِلْقِيّ</text><text x="142.0" y="184.0" text-anchor="start" font-size="12" fill="#2f6fb3" font-weight="700">1aiia</text><t