<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">144. Bilmece: mana tarif edilir, kelime cevap olarak tersine yazılır</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Okuyan önce tahmin eder, sonra kâğıdı çevirip cevaba bakar.</text><rect x="40" y="80" width="400" height="165" rx="10" fill="#fff" stroke="#2b2410"/><text x="54.0" y="102.0" text-anchor="start" font-size="11" fill="#b3541e" font-weight="700">Bilmece 1</text><text x="240.0" y="135.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">Ölçülmeden yapılmam, yapılınca adım değişir;</text><text x="240.0" y="155.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">beni yapana bir isim, bana başka bir isim verilir.</text><g transform="rotate(180 240 215)"><text x="240.0" y="220.0" text-anchor="middle" font-size="11" fill="#9a9a9a" >cevap: مَخْلُوق (yaratılmış)</text></g><rect x="460" y="80" width="400" height="165" rx="10" fill="#fff" stroke="#2b2410"/><text x="474.0" y="102.0" text-anchor="start" font-size="11" fill="#b3541e" font-weight="700">Bilmece 2</text><text x="660.0" y="135.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">Gözle görülmem ama her hâlinde belliyim;</text><text x="660.0" y="155.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">yaradılışta konuldum, tekrarla sağlamlaştım.</text><g transform="rotate(180 660 215)"><text x="660.0" y="220.0" text-anchor="middle" font-size="11" fill="#9a9a9a" >cevap: خُلُق (huy)</text></g><rect x="40" y="265" width="400" height="165" rx="10" fill="#fff" stroke="#2b2410"/><text x="54.0" y="287.0" text-anchor="start" font-size="11" fill="#b3541e" font-weight="700">Bilmece 3</text><text x="240.0" y="320.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">Yeniyken düzdüm, kullanıldıkça düzleştim,</text><text x="240.0" y="340.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">sonunda adım &quot;eski&quot; oldu.</text><g transform="rotate(180 240 400)"><text x="240.0" y="405.0" text-anchor="middle" font-size="11" fill="#9a9a9a" >cevap: خَلِقَ (eskidi)</text></g><rect x="460" y="265" width="400" height="165" rx="10" fill="#fff" stroke="#2b2410"/><text x="474.0" y="287.0" text-anchor="start" font-size="11" fill="#b3541e" font-weight="700">Bilmece 4</text><text x="660.0" y="320.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">Yaratmanın taklidiyim, ölçüm yoktur;</text><text x="660.0" y="340.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">söylenirim ama olmamışımdır.</text><g transform="rotate(180 660 400)"><text x="660.0" y="405.0" text-anchor="middle" font-size="11" fill="#9a9a9a" >cevap: اِخْتِلَاق (uydurma)</text></g><rect x="40" y="450" width="400" height="165" rx="10" fill="#fff" stroke="#2b2410"/><text x="54.0" y="472.0" text-anchor="start" font-size="11" fill="#b3541e" font-weight="700">Bilmece 5</text><text x="240.0" y="505.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">Bir iş için ayrılırım, herkese düşmem;</text><text x="240.0" y="525.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">âhirette olmayanı ayet anar.</text><g transform="rotate(180 240 585)"><text x="240.0" y="590.0" text-anchor="middle" font-size="11" fill="#9a9a9a" >cevap: خَلَاق (pay)</text></g><rect x="460" y="450" width="400" height="165" rx="10" fill="#fff" stroke="#2b2410"/><text x="474.0" y="472.0" text-anchor="start" font-size="11" fill="#b3541e" font-weight="700">Bilmece 6</text><text x="660.0" y="505.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">Ailedenmiş gibi dururum, kanım yoktur;</text><text x="660.0" y="525.0" text-anchor="middle" font-size="12" fill="#2b2410" font-style="italic">mutfaktayım, aslım denizin ötesinde.</text><g transform="rotate(180 660 585)"><text x="660.0" y="590.0" text-anchor="middle" font-size="11" fill="#9a9a9a" >cevap: خِلْقِين (kazan)</text></g></svg>