<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">157. Fonksiyon eğrisi: mana = f(dıştan içe değişkeni)</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Tek değişken seçilir; manalar o değişkenin fonksiyonu olarak bir eğri üstüne düşer.</text><line x1="90" y1="600" x2="850" y2="600" stroke="#2b2410" stroke-width="2"/><line x1="90" y1="600" x2="90" y2="120" stroke="#2b2410" stroke-width="2"/><text x="850.0" y="630.0" text-anchor="end" font-size="11.5" fill="#2b2410" font-weight="700">x: dıştan içe (eşyadan nefse)  →</text><text transform="translate(40,360.0) rotate(-90)" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b2410">y = f(x): kökten uzaklık (türeme basamağı)</text><path d="M90.0,600.0 C143.2,600.0 143.2,511.1 196.4,511.1 C257.2,511.1 257.2,422.2 318.0,422.2 C375.0,422.2 375.0,333.3 432.0,333.3 C489.0,333.3 489.0,333.3 546.0,333.3 C614.4,333.3 614.4,244.4 682.8,244.4 C747.4,244.4 747.4,155.6 812.0,155.6" fill="none" stroke="#2f6fb3" stroke-width="3"/><circle cx="90.0" cy="600.0" r="5" fill="#b8860b"/><text x="98.0" y="592.0" text-anchor="start" font-size="10.5" fill="#b8860b" font-weight="700">esas</text><text x="98.0" y="614.0" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a"></text><circle cx="196.4" cy="511.1" r="5" fill="#2f6fb3"/><text x="204.4" y="503.1" text-anchor="start" font-size="10.5" fill="#2f6fb3" font-weight="700">ölçüp biçmek</text><text x="204.4" y="525.1" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><circle cx="318.0" cy="422.2" r="5" fill="#2f6fb3"/><text x="326.0" y="414.2" text-anchor="start" font-size="10.5" fill="#2f6fb3" font-weight="700">yaratmak</text><text x="326.0" y="436.2" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><circle cx="432.0" cy="333.3" r="5" fill="#2f6fb3"/><text x="440.0" y="325.3" text-anchor="start" font-size="10.5" fill="#2f6fb3" font-weight="700">yaratılmış</text><text x="440.0" y="347.3" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق</text><circle cx="546.0" cy="333.3" r="5" fill="#2f6fb3"/><text x="554.0" y="325.3" text-anchor="start" font-size="10.5" fill="#2f6fb3" font-weight="700">yaradılış</text><text x="554.0" y="347.3" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة</text><circle cx="682.8" cy="244.4" r="5" fill="#2f6fb3"/><text x="690.8" y="236.4" text-anchor="start" font-size="10.5" fill="#2f6fb3" font-weight="700">huy</text><text x="690.8" y="258.4" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيقَة</text><circle cx="812.0" cy="155.6" r="5" fill="#2f6fb3"/><text x="820.0" y="147.6" text-anchor="start" font-size="10.5" fill="#2f6fb3" font-weight="700">ahlâk</text><text x="820.0" y="169.6" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَاق</text><text x="822.0" y="125.6" text-anchor="start" font-size="11" fill="#2f6fb3" font-style="italic">ölçme kolu: f₁(x)</text><path d="M90.0,600.0 C112.8,600.0 112.8,511.1 135.6,511.1 C150.8,511.1 150.8,422.2 166.0,422.2" fill="none" stroke="#3f8f3a" stroke-width="3"/><circle cx="90.0" cy="600.0" r="5" fill="#b8860b"/><text x="98.0" y="592.0" text-anchor="start" font-size="10.5" fill="#b8860b" font-weight="700">esas</text><text x="98.0" y="614.0" text-anchor="start" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a"></text><circle cx="135.6" cy="511.1" r="5" fill="#3f8f3a"/><text x="127.6" y="503.1" text-anchor="end" font-size="10.5" fill="#3f8f3a" font-weight="700">düzlemek</text><text x="127.6" y="525.1" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَق</text><circle cx="166.0" cy="422.2" r="5" fill="#3f8f3a"/><text x="158.0" y="414.2" text-anchor="end" font-size="10.5" fill="#3f8f3a" font-weight="700">eskimek</text><text x="158.0" y="436.2" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْلَوْلَقَ</text><text x="156.0" y="392.2" text-anchor="end" font-size="11" fill="#3f8f3a" font-style="italic">düzleme kolu: f₂(x)</text><circle cx="713.2" cy="155.6" r="4" fill="none" stroke="#2f6fb3" stroke-width="2"/><text x="720.2" y="159.6" text-anchor="start" font-size="9.5" fill="#2f6fb3" >öfke</text><circle cx="758.8" cy="155.6" r="4" fill="none" stroke="#2f6fb3" stroke-width="2"/><text x="765.8" y="159.6" text-anchor="start" font-size="9.5" fill="#2f6fb3" >huy takınmak</text><circle cx="363.6" cy="333.3" r="4" fill="none" stroke="#2f6fb3" stroke-width="2"/><text x="370.6" y="337.3" text-anchor="start" font-size="9.5" fill="#2f6fb3" >uydurmak</text><circle cx="242.0" cy="511.1" r="4" fill="none" stroke="#c26a1e" stroke-width="2"/><text x="249.0" y="515.1" text-anchor="start" font-size="9.5" fill="#c26a1e" >pay</text><circle cx="280.0" cy="511.1" r="4" fill="none" stroke="#a8478f" stroke-width="2"/><text x="287.0" y="515.1" text-anchor="start" font-size="9.5" fill="#a8478f" >yakışmak</text><circle cx="219.2" cy="422.2" r="4" fill="none" stroke="#3f8f3a" stroke-width="2"/><text x="226.2" y="426.2" text-anchor="start" font-size="9.5" fill="#3f8f3a" >koku sürmek</text><text x="450.0" y="650.0" text-anchor="middle" font-size="11" fill="#2b2410" >Eğri boyunca ilerlemek hem içe girmek hem kökten uzaklaşmaktır: f₁ artandır. Düzleme kolu (f₂) eşya tarafında kalır, içe girmez.</text><text x="450.0" y="668.0" text-anchor="middle" font-size="10" fill="#6d6650" >Boş halkalar eğrinin dışında kalan ayrık noktalar (dallanma). x değerleri kıyas içindir, ölçülmemiştir.</text></svg>