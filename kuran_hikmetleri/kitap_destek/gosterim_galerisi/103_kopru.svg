<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">103. Köprü haritası (benzetme): aynı ilişki bütün çiftlerde</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Bir çifti anlayan ötekileri ilişkinin aynılığıyla anlar.</text><text x="115.0" y="290.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">ölçülen deri</text><line x1="40" y1="300" x2="190" y2="300" stroke="#2b2410" stroke-width="2"/><text x="115.0" y="325.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">elbise</text><line x1="115" y1="304" x2="115" y2="308" stroke="#2b2410"/><path d="M190,300 L210,250 L230,300" stroke="#b3541e" stroke-width="2" fill="none"/><text x="210.0" y="240.0" text-anchor="middle" font-size="10" fill="#b3541e" >gibi</text><text x="285.0" y="290.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">yaradılış</text><line x1="210" y1="300" x2="360" y2="300" stroke="#2b2410" stroke-width="2"/><text x="285.0" y="325.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">huy</text><line x1="285" y1="304" x2="285" y2="308" stroke="#2b2410"/><path d="M360,300 L380,250 L400,300" stroke="#b3541e" stroke-width="2" fill="none"/><text x="380.0" y="240.0" text-anchor="middle" font-size="10" fill="#b3541e" >gibi</text><text x="455.0" y="290.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">elbise</text><line x1="380" y1="300" x2="530" y2="300" stroke="#2b2410" stroke-width="2"/><text x="455.0" y="325.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">eskimek</text><line x1="455" y1="304" x2="455" y2="308" stroke="#2b2410"/><path d="M530,300 L550,250 L570,300" stroke="#b3541e" stroke-width="2" fill="none"/><text x="550.0" y="240.0" text-anchor="middle" font-size="10" fill="#b3541e" >gibi</text><text x="625.0" y="290.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">olmayan şey</text><line x1="550" y1="300" x2="700" y2="300" stroke="#2b2410" stroke-width="2"/><text x="625.0" y="325.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">uydurmak</text><line x1="625" y1="304" x2="625" y2="308" stroke="#2b2410"/><path d="M700,300 L720,250 L740,300" stroke="#b3541e" stroke-width="2" fill="none"/><text x="720.0" y="240.0" text-anchor="middle" font-size="10" fill="#b3541e" >gibi</text><text x="795.0" y="290.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">işe ayrılan</text><line x1="720" y1="300" x2="870" y2="300" stroke="#2b2410" stroke-width="2"/><text x="795.0" y="325.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">pay</text><line x1="795" y1="304" x2="795" y2="308" stroke="#2b2410"/><text x="450.0" y="400.0" text-anchor="middle" font-size="11" fill="#2b2410" >İlişki: &quot;üstteki, ölçülüp biçilince olur / nefse girince olur … alttakini doğurur&quot;</text><text x="450.0" y="430.0" text-anchor="middle" font-size="11" fill="#2b2410" >Köprü ilişkisi: üstteki şey bir işlemden geçince alttaki olur. Her ayakta işlem aynıdır: ölçüyle şekil alma.</text></svg>