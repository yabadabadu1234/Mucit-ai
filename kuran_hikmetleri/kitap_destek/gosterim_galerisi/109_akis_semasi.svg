<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">109. Akış şeması: bir kelimenin manasını bulma usulü adım adım</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Baklava = soru, dikdörtgen = iş, oval = baş ve son.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="200" y="70" width="200" height="40" rx="20" fill="#e8c766" stroke="#2b2410"/><text x="300.0" y="94.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >BAŞLA: kelimeyi oku</text><rect x="190" y="158" width="220" height="44" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="300.0" y="184.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >kökü bul: خ ل ق</text><path d="M300,250 L410,280 L300,310 L190,280Z" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="300.0" y="284.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >vezni bilinen mi?</text><rect x="190" y="358" width="220" height="44" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="300.0" y="384.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >vezin manasını al (fâil, mef&#x27;ûl…)</text><path d="M300,440 L410,470 L300,500 L190,470Z" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="300.0" y="474.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >bağlamda fâil/nesne kim?</text><rect x="200" y="550" width="200" height="40" rx="20" fill="#e8c766" stroke="#2b2410"/><text x="300.0" y="574.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >BİT: manayı yaz</text><rect x="540" y="258" width="220" height="44" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="650.0" y="284.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >harekeye bak (karar ağacı)</t