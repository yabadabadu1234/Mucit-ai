<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">105. Çok akışlı harita: solda sebepler, ortada iş, sağda neticeler</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Bir işin bütün sebepleri ve bütün neticeleri tek bakışta.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="350" y="280" width="200" height="70" rx="6" fill="#f3eedd" stroke="#b8860b" stroke-width="1.6"/><text x="450.0" y="297.0" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="700">ÖLÇÜP BİÇMEK</text><text x="450.0" y="342.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><rect x="40" y="120" width="200" height="50" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="140.0" y="138.0" text-anchor="middle" font-size="10" fill="#2b2410" >bir maksat var</text><path d="M240,145 Q295.0,230.0 350,315" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="40" y="230" width="200" height="50" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="140.0" y="248.0" text-anchor="middle" font-size="10" fill="#2b2410" >ham madde var</text><path d="M240,255 Q295.0,285.0 350,315" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="40" y="340" width="200" height="50" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="140.0" y="358.0" text-anchor="middle" font-size="10" fill="#2b2410" >yapanın bilgisi var</text><path d="M240,365 Q295.0,340.0 350,315" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="40" y="450" width="200" height="50" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text