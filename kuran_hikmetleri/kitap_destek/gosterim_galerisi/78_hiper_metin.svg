aratılan, bir yapı ve hâl üzere y</text><text x="606.0" y="244.0" text-anchor="start" font-size="9" fill="#2b2410" >aratılmıştır</text><text x="814.0" y="258.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة خِلْقِيّ</text><rect x="640" y="340" width="220" height="62" rx="4" fill="#fffef8" stroke="#2f6fb3" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="640" y="340" width="220" height="16" fill="#2f6fb3"/><text x="646.0" y="352.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">huy</text><text x="646.0" y="372.0" text-anchor="start" font-size="9" fill="#2b2410" >yaradılışta verilen iç hâl, kişinin hu</text><text x="646.0" y="384.0" text-anchor="start" font-size="9" fill="#2b2410" >yu olur</text><text x="854.0" y="398.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيقَة خُلُق</text><rect x="650" y="480" width="220" height="62" rx="4" fill="#fffef8" stroke="#2f6fb3" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="650" y="480" width="220" height="16" fill="#2f6fb3"/><text x="656.0" y="492.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">ahlâk</text><text x="656.0" y="512.0" text-anchor="start" font-size="9" fill="#2b2410" >huy yerleşip çoğalınca bir düzen ve il</text><text x="656.0" y="524.0" text-anchor="start" font-size="9" fill="#2b2410" >im olur</text><text x="864.0" y="538.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَاق أَخْلَاقِيّ</text><rect x="340" y="250" width="220" height="62" rx="4" fill="#fffef8" stroke="#2f6fb3" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="340" y="250" width="220" height="16" fill="#2f6fb3"/><text x="346.0" y="262.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">uydurmak</text><text x="346.0" y="282.0" text-anchor="start" font-size="9" fill="#2b2410" >olmayan sözü var göstermek, yaratmanın</text><text x="346.0" y="294.0" text-anchor="start" font-size="9" fill="#2b2410" > dille taklididir</text><text x="554.0" y="308.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ تَخَلَّقَ</text><rect x="60" y="330" width="220" height="62" rx="4" fill="#fffef8" stroke="#3f8f3a" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="60" y="330" width="220" height="16" fill="#3f8f3a"/><text x="66.0" y="342.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">düzlemek</text><text x="66.0" y="362.0" text-anchor="start" font-size="9" fill="#2b2410" >ham maddeyi murada uydurmak onu eğrili</text><text x="66.0" y="374.0" text-anchor="start" font-size="9" fill="#2b2410" >kten ve pürüzden arındırmaktır</text><text x="274.0" y="388.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَق خَلْقَاء</text><rect x="80" y="480" width="220" height="62" rx="4" fill="#fffef8" stroke="#3f8f3a" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="80" y="480" width="220" height="16" fill="#3f8f3a"/><text x="86.0" y="492.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">eskimek</text><text x="86.0" y="512.0" text-anchor="start" font-size="9" fill="#2b2410" >aşınan şey sürtülür, yüzeyi düzleşip y</text><text x="86.0" y="524.0" text-anchor="start" font-size="9" fill="#2b2410" >umuşar</text><text x="294.0" y="538.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْلَوْلَقَ خَلِقَ</text><rect x="310" y="500" width="220" height="62" rx="4" fill="#fffef8" stroke="#3f8f3a" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="310" y="500" width="220" height="16" fill="#3f8f3a"/><text x="316.0" y="512.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">koku sürmek</text><text x="316.0" y="532.0" text-anchor="start" font-size="9" fill="#2b2410" >sürülen koku kabalığı giderir, şeyi ka</text><text x="316.0" y="544.0" text-anchor="start" font-size="9" fill="#2b2410" >bule şayan kılar</text><text x="524.0" y="558.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلُوق مُخَلَّق</text><rect x="330" y="380" width="220" height="62" rx="4" fill="#fffef8" stroke="#2c8c7c" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="330" y="380" width="220" height="16" fill="#2c8c7c"/><text x="336.0" y="392.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">şekli belirmiş</text><text x="336.0" y="412.0" text-anchor="start" font-size="9" fill="#2b2410" >hem ölçüp biçilen hem düzlenen şeyin ş</text><text x="336.0" y="424.0" text-anchor="start" font-size="9" fill="#2b2410" >ekli belli olur</text><text x="544.0" y="438.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مُخَلَّق سَهْم مُخَلَّق</text><rect x="60" y="200" width="220" height="62" rx="4" fill="#fffef8" stroke="#c26a1e" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="60" y="200" width="220" height="16" fill="#c26a1e"/><text x="66.0" y="212.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">pay</text><text x="66.0" y="232.0" text-anchor="start" font-size="9" fill="#2b2410" >bir iş için ayrılan şey, o iş için ölç</text><text x="66.0" y="244.0" text-anchor="start" font-size="9" fill="#2b2410" >ülüp hazırlanmış paydır</text><text x="274.0" y="258.0" text-anchor="end" font-size="11" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَاق</text><rect x="360" y="560" width="220" height="62" rx="4" fill="#fffef8" stroke="#a8478f" stroke-width="2" filter="drop-shadow(2px 2px 2px #0002)"/><rect x="360" y="560" width="220" height="16" fill="#a8478f"/><text x="366.0" y="572.0" text-anchor="start" font-size="9.5" fill="#fff" font-weight="700">yakışmak</text><text x="366.0" y="592.0" text-ancho