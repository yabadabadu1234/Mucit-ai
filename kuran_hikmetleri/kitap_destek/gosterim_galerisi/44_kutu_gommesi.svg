<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">44. Kutu gömmesi: her mana bir kutu, çocuk kutu ebeveyninin içinde</text><text x="18" y="50" font-size="11.5" fill="#6d6650">İçinde olmak = ondan türemek; kesişim = iki asla birden bağlı olmak.</text><rect x="20" y="66" width="860" height="560" rx="8" fill="#e8c766" fill-opacity=".15" stroke="#b8860b" stroke-width="2"/><text x="28.0" y="82.0" text-anchor="start" font-size="11" fill="#b8860b" font-weight="700">esas</text><rect x="30.0" y="90.0" width="470.0" height="520.0" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="36.0" y="104.0" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">ölçüp biçmek</text><rect x="36.0" y="112.0" width="458.0" height="492.0" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="42.0" y="126.0" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">yaratmak</text><rect x="42.0" y="134.0" width="446.0" height="151.3" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="48.0" y="148.0" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">yaratılmış</text><text x="265.0" y="277.3" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق مَخْلُوق مَخْلُوقَات</text><rect x="42.0" y="289.3" width="446.0" height="151.3" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="48.0" y="303.3" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">yaradılış</text><rect x="48.0" y="311.3" width="434.0" height="123.3" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="54.0" y="325.3" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">huy</text><rect x="54.0" y="333.3" width="422.0" height="28.4" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="60.0" y="347.3" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">ahlâk</text><text x="265.0" y="353.8" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَاق أَخْلَاقِيّ أَخْلَاقِيَّة</text><rect x="54.0" y="365.8" width="422.0" height="28.4" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="60.0" y="379.8" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">öfke</text><text x="265.0" y="386.2" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">تَخَلَّقَ</text><rect x="54.0" y="398.2" width="422.0" height="28.4" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="60.0" y="412.2" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">huy takınmak</text><text x="265.0" y="418.7" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">تَخَلَّقَ</text><rect x="42.0" y="444.7" width="446.0" height="151.3" rx="6" fill="#2f6fb3" fill-opacity=".10" stroke="#2f6fb3" stroke-width="1.6"/><text x="48.0" y="458.7" text-anchor="start" font-size="10" fill="#2f6fb3" font-weight="700">uydurmak</text><text x="265.0" y="588.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ تَخَلَّقَ اِخْتَلَقَ</text><rect x="520.0" y="90.0" width="170.0" height="300.0" rx="6" fill="#3f8f3a" fill-opacity=".10" stroke="#3f8f3a" stroke-width="1.6"/><text x="526.0" y="104.0" text-anchor="start" font-size="10" fill="#3f8f3a" font-weight="700">düzlemek</text><rect x="526.0" y="112.0" width="76.0" height="272.0" rx="6" fill="#3f8f3a" fill-opacity=".10" stroke="#3f8f3a" stroke-width="1.6"/><text x="532.0" y="126.0" text-anchor="start" font-size="10" fill="#3f8f3a" font-weight="700">eskimek</text><text x="564.0" y="376.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْلَوْلَقَ خَلِقَ أَخْلَقَ</text><rect x="608.0" y="112.0" width="76.0" height="272.0" rx="6" fill="#3f8f3a" fill-opacity=".10" stroke="#3f8f3a" stroke-width="1.6"/><text x="614.0" y="126.0" text-anchor="start" font-size="10" fill="#3f8f3a" font-weight="700">koku sürmek</text><text x="646.0" y="376.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلُوق مُخَلَّق خَلَّقَ</text><rect x="700.0" y="90.0" width="80.0" height="160.0" rx="6" fill="#c26a1e" fill-opacity=".10" stroke="#c26a1e" stroke-width="1.6"/><text x="706.0" y="104.0" text-anchor="start" font-size="10" fill="#c26a1e" font-weight="700">pay</text><text x="740.0" y="242.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَاق</text><rect x="790.0" y="90.0" width="80.0" height="160.0" rx="6" fill="#a8478f" fill-opacity=".10" stroke="#a8478f" stroke-width="1.6"/><text x="796.0" y="104.0" text-anchor="start" font-size="10" fill="#a8478f" font-weight="700">yakışmak</text><text x="830.0" y="242.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيق أَخْلَق خَلُقَ</text><rect x="700.0" y="520.0" width="170.0" height="90.0" rx="6" fill="#7a7a7a" fill-opacity=".10" stroke="#7a7a7a" stroke-width="1.6"/><text x="706.0" y="534.0" text-anchor="start" font-size="10" fill="#7a7a7a" font-weight="700">kök dışı</text><text x="785.0" y="602.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقِين</text><rect x="440" y="350" width="130" height="80" rx="6" fill="#2c8c7c" fill-opacity=".25" stroke="#2c8c7c" stroke-width="2" stroke-dasharray="5 3"/><text x="505.0" y="385.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700">şekli belirmiş</text><text x="505.0" y="412.0" text-anchor="middle" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مُخَلَّق</text><text x="450.0" y="645.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Kesik çizgili kutu iki kutunun kesişimindedir: hem ölçülüp biçilmiş hem düzlenmiş. Kök dışı kutu esasın dışına taşar.</text></svg>