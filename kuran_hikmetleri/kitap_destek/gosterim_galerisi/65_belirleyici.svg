<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">65. Belirleyici işaret (Mısır yazısı, Çince bileşen tarzı)</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Ses kökten, sınıf işaretten okunur. İşaretleri bu levha için seçtim.</text><text x="140.0" y="120.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="80" y="124" font-size="34" font-family="Noto Color Emoji">📏</text><text x="120.0" y="154.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: ölçü</text><text x="120.0" y="172.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">ölçüp biçmek</text><text x="350.0" y="120.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="290" y="124" font-size="34" font-family="Noto Color Emoji">✨</text><text x="330.0" y="154.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: var etme</text><text x="330.0" y="172.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">yaratmak</text><text x="560.0" y="120.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق</text><text x="500" y="124" font-size="34" font-family="Noto Color Emoji">🧍</text><text x="540.0" y="154.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: varlık</text><text x="540.0" y="172.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">yaratılmış</text><text x="770.0" y="120.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة</text><text x="710" y="124" font-size="34" font-family="Noto Color Emoji">🧬</text><text x="750.0" y="154.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: kalıp</text><text x="750.0" y="172.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">yaradılış</text><text x="140.0" y="250.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيقَة</text><text x="80" y="254" font-size="34" font-family="Noto Color Emoji">❤️</text><text x="120.0" y="284.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: iç hâl</text><text x="120.0" y="302.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">huy</text><text x="350.0" y="250.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَاق</text><text x="290" y="254" font-size="34" font-family="Noto Color Emoji">⚖️</text><text x="330.0" y="284.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: düzen</text><text x="330.0" y="302.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">ahlâk</text><text x="560.0" y="250.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">تَخَلَّقَ</text><text x="500" y="254" font-size="34" font-family="Noto Color Emoji">🔥</text><text x="540.0" y="284.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: taşma</text><text x="540.0" y="302.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">öfke</text><text x="770.0" y="250.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">تَخَلَّقَ</text><text x="710" y="254" font-size="34" font-family="Noto Color Emoji">🎭</text><text x="750.0" y="284.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: giyinme</text><text x="750.0" y="302.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">huy takınmak</text><text x="140.0" y="380.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="80" y="384" font-size="34" font-family="Noto Color Emoji">🗣️</text><text x="120.0" y="414.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: söz</text><text x="120.0" y="432.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">uydurmak</text><text x="350.0" y="380.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مُخَلَّق</text><text x="290" y="384" font-size="34" font-family="Noto Color Emoji">🏹</text><text x="330.0" y="414.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: şekil</text><text x="330.0" y="432.0" text-anchor="middle" font-size="11" fill="#2c8c7c" font-weight="700">şekli belirmiş</text><text x="560.0" y="380.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَق</text><text x="500" y="384" font-size="34" font-family="Noto Color Emoji">🪨</text><text x="540.0" y="414.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: yüzey</text><text x="540.0" y="432.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">düzlemek</text><text x="770.0" y="380.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْلَوْلَقَ</text><text x="710" y="384" font-size="34" font-family="Noto Color Emoji">👕</text><text x="750.0" y="414.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: eşya/zaman</text><text x="750.0" y="432.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">eskimek</text><text x="140.0" y="510.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلُوق</text><text x="80" y="514" font-size="34" font-family="Noto Color Emoji">🌸</text><text x="120.0" y="544.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: koku</text><text x="120.0" y="562.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">koku sürmek</text><text x="350.0" y="510.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَاق</text><text x="290" y="514" font-size="34" font-family="Noto Color Emoji">🍰</text><text x="330.0" y="544.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: pay</text><text x="330.0" y="562.0" text-anchor="middle" font-size="11" fill="#c26a1e" font-weight="700">pay</text><text x="560.0" y="510.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيق</text><text x="500" y="514" font-size="34" font-family="Noto Color Emoji">🎯</text><text x="540.0" y="544.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: uygunluk</text><text x="540.0" y="562.0" text-anchor="middle" font-size="11" fill="#a8478f" font-weight="700">yakışmak</text><text x="770.0" y="510.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقِين</text><text x="710" y="514" font-size="34" font-family="Noto Color Emoji">🍲</text><text x="750.0" y="544.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >belirleyici: kap</text><text x="750.0" y="562.0" text-anchor="middle" font-size="11" fill="#7a7a7a" font-weight="700">kök dışı</text><text x="450.0" y="640.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Hiyeroglifte okunmayan bir işaret, kelimenin hangi sınıftan olduğunu gösterir. Burada kökün yanına mana sınıfı işareti konuldu.</text></svg>