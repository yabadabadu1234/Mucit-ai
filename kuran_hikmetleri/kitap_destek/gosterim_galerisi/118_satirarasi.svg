<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">118. Satırarası tercüme: kelimenin hemen altında manası</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Okuyan Arapça sırayı bozmadan anlar.</text><text x="755.0" y="120.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">خَلَقَ</text><text x="755.0" y="150.0" text-anchor="middle" font-size="12" fill="#2b2410" >yarattı</text><text x="755.0" y="168.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >fiil, mâzî</text><text x="565.0" y="120.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">الْإِنسَانَ</text><text x="565.0" y="150.0" text-anchor="middle" font-size="12" fill="#2b2410" >insanı</text><text x="565.0" y="168.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >mef&#x27;ûl</text><text x="375.0" y="120.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مِن</text><text x="375.0" y="150.0" text-anchor="middle" font-size="12" fill="#2b2410" >-den</text><text x="375.0" y="168.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >harf</text><text x="185.0" y="120.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">نُّطْفَةٍ</text><text x="185.0" y="150.0" text-anchor="middle" font-size="12" fill="#2b2410" >bir damla su</text><text x="185.0" y="168.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >mecrûr</text><text x="755.0" y="270.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">وَإِنَّكَ</text><text x="755.0" y="300.0" text-anchor="middle" font-size="12" fill="#2b2410" >ve şüphesiz sen</text><text x="755.0" y="318.0" text-anchor="middle" font-size="9.5" fill="#6d6650" ></text><text x="565.0" y="270.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">لَعَلَىٰ</text><text x="565.0" y="300.0" text-anchor="middle" font-size="12" fill="#2b2410" >üzerindesin</text><text x="565.0" y="318.0" text-anchor="middle" font-size="9.5" fill="#6d6650" ></text><text x="375.0" y="270.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">خُلُقٍ</text><text x="375.0" y="300.0" text-anchor="middle" font-size="12" fill="#2b2410" >bir huy</text><text x="375.0" y="318.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >isim</text><text x="185.0" y="270.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">عَظِيمٍ</text><text x="185.0" y="300.0" text-anchor="middle" font-size="12" fill="#2b2410" >büyük</text><text x="185.0" y="318.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >sıfat</text><text x="450.0" y="440.0" text-anchor="middle" font-size="11" fill="#2b2410" >Nahl 16:4 ve Kalem 68:4. Her kelimenin altında karşılığı ve görevi; kökün kelimeleri kırmızı.</text></svg>