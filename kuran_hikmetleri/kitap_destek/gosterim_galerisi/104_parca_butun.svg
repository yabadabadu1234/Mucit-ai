<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">104. Parça–bütün parantezi (brace map): kelime, harfleri ve vezni</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Sol bütün, sağ parçaları; her parantez bir alt bölme.</text><text x="80.0" y="350.0" text-anchor="middle" font-size="28" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="80.0" y="375.0" text-anchor="middle" font-size="10" fill="#2b2410" >kelime</text><path d="M156,120 Q140,120 140,340.0 L130,350.0 L140,360.0 Q140,580 156,580" stroke="#2b2410" stroke-width="2" fill="none"/><text x="170.0" y="160.0" text-anchor="start" font-size="13" fill="#2b2410" font-weight="700">ف (fâ): خ</text><path d="M346,130 Q330,130 330,155.0 L320,165.0 L330,175.0 Q330,200 346,200" stroke="#2b2410" stroke-width="2" fill="none"/><text x="360.0" y="152.0" text-anchor="start" font-size="11.5" fill="#2b2410" >boğazdan çıkan sert ses</text><text x="360.0" y="182.0" text-anchor="start" font-size="11.5" fill="#2b2410" >kesme, yarma çağrışımı</text><text x="170.0" y="275.0" text-anchor="start" font-size="13" fill="#2b2410" font-weight="700">ع (ayn): ل</text><path d="M346,245 Q330,245 330,270.0 L320,280.0 L330,290.0 Q330,315 346,315" stroke="#2b2410" stroke-width="2" fill="none"/><text x="360.0" y="267.0" text-anchor="start" font-size="11.5" fill="#2b2410" >dil ucu, yumuşak geçiş</text><text x="360.0" y="297.0" text-anchor="start" font-size="11.5" fill="#2b2410" >uzanma, düzlük</text><text x="170.0" y="390.0" text-anchor="start" font-size="13" fill="#2b2410" font-weight="700">ل (lâm): ق</text><path d="M346,360 Q330,360 330,385.0 L320,395.0 L330,405.0 Q330,430 346,430" stroke="#2b2410" stroke-width="2" fill="none"/><text x="360.0" y="382.0" text-anchor="start" font-size="11.5" fill="#2b2410" >dilkökünden derin ses</text><text x="360.0" y="412.0" text-anchor="start" font-size="11.5" fill="#2b2410" >sağlamlık, sabitlik</text><text x="170.0" y="505.0" text-anchor="start" font-size="13" fill="#2b2410" font-weight="700">vezin: فَعَلَ</text><path d="M346,475 Q330,475 330,500.0 L320,510.0 L330,520.0 Q330,545 346,545" stroke="#2b2410" stroke-width="2" fill="none"/><text x="360.0" y="497.0" text-anchor="start" font-size="11.5" fill="#2b2410" >fiil, geçişli</text><text x="360.0" y="527.0" text-anchor="start" font-size="11.5" fill="#2b2410" >bir defalık iş</text><text x="450.0" y="610.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >Harf manaları çağrışımdır, kesin hüküm değildir (iştikâk-ı ekber tartışması).</text></svg>