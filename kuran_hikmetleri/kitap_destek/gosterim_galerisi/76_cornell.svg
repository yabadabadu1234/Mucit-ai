<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">76. Cornell notu: suâl sütunu, not sütunu, özet kutusu</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Ders notu tutmanın üç bölmeli usulü.</text><rect x="30" y="70" width="840" height="560" fill="#fff" stroke="#2b2410"/><line x1="250" y1="70" x2="250" y2="520" stroke="#c0392b" stroke-width="2"/><line x1="30" y1="520" x2="870" y2="520" stroke="#2b2410" stroke-width="2"/><text x="40.0" y="110.0" text-anchor="start" font-size="11.5" fill="#c0392b" font-weight="700">Esas nedir?</text><text x="265.0" y="110.0" text-anchor="start" font-size="11" fill="#2b2410" >ölçüp biçerek hazırlamak (İbn Fâris: takdîr ve imlâs)</text><text x="860.0" y="130.0" text-anchor="end" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="40.0" y="170.0" text-anchor="start" font-size="11.5" fill="#c0392b" font-weight="700">Yaratmak nereden?</text><text x="265.0" y="170.0" text-anchor="start" font-size="11" fill="#2b2410" >ölçülen şey tamamlanınca var olur</text><text x="860.0" y="190.0" text-anchor="end" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَالِق · خَلْق · مَخْلُوق</text><text x="40.0" y="230.0" text-anchor="start" font-size="11.5" fill="#c0392b" font-weight="700">Huy nereden?</text><text x="265.0" y="230.0" text-anchor="start" font-size="11" fill="#2b2410" >yaradılışın içe verdiği kalıp</text><text x="860.0" y="250.0" text-anchor="end" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خُلُق · أَخْلَاق · تَخَلَّقَ</text><text x="40.0" y="290.0" text-anchor="start" font-size="11.5" fill="#c0392b" font-weight="700">Eskimek nereden?</text><text x="265.0" y="290.0" text-anchor="start" font-size="11" fill="#2b2410" >düzlenen yüzey zamanla aşınır</text><text x="860.0" y="310.0" text-anchor="end" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِقَ · خَلَق · خُلْقَان</text><text x="40.0" y="350.0" text-anchor="start" font-size="11.5" fill="#c0392b" font-weight="700">Pay ve lâyık?</text><text x="265.0" y="350.0" text-anchor="start" font-size="11" fill="#2b2410" >bir işe ayrılan şey pay, işe uyan şey lâyık</text><text x="860.0" y="370.0" text-anchor="end" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَاق · خَلِيق</text><text x="40.0" y="410.0" text-anchor="start" font-size="11.5" fill="#c0392b" font-weight="700">Uydurmak?</text><text x="265.0" y="410.0" text-anchor="start" font-size="11" fill="#2b2410" >yaratmanın sözle taklidi</text><text x="860.0" y="430.0" text-anchor="end" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْتَلَقَ · اِخْتِلَاق</text><text x="40.0" y="470.0" text-anchor="start" font-size="11.5" fill="#c0392b" font-weight="700">İstisna?</text><text x="265.0" y="470.0" text-anchor="start" font-size="11" fill="#2b2410" >kazan: Yunancadan, kökten değil</text><text x="860.0" y="490.0" text-anchor="end" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقِين</text><text x="40.0" y="545.0" text-anchor="start" font-size="12" fill="#2b2410" font-weight="700">ÖZET:</text><text x="40.0" y="570.0" text-anchor="start" font-size="11" fill="#2b2410" >Bir terzinin ölçüp biçmesi: ölçülen yaratılır, yaratılanın kalıbı huy olur; düzlenen eskir; ayrılan pay olur, uyan lâyık olur.</text><text x="40.0" y="600.0" text-anchor="start" font-size="10.5" fill="#6d6650" >Sol sütun suâl, sağ sütun not, alt kutu özet. Tekrar ederken sağ kapatılıp soldaki suâle cevap verilir.</text></svg>