<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">80. Kalıp dili (Alexander): her mana numaralı bir kalıp, kalıplar birbirini çağırır</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Bağlam → çözüm → sonraki kalıplar. Kalıpların ifadesi bu levha için yazıldı.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="25" y="90" width="200" height="200" fill="#fff" stroke="#2f6fb3" stroke-width="2"/><text x="125.0" y="112.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">1. ÖLÇÜLÜ HAZIRLIK</text><text x="35.0" y="140.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="35.0" y="156.0" text-anchor="start" font-size="10" fill="#2b2410" >Bir şey bir iş için hazırlanacak.</text><text x="35.0" y="186.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="35.0" y="202.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Ölç, biç, sonra yap.</text><text x="215.0" y="240.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="35.0" y="278.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: 2, 5, 6</text><rect x="243" y="90" width="200" height="200" fill="#fff" stroke="#2f6fb3" stroke-width="2"/><text x="343.0" y="112.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">2. ESERİN DOĞUŞU</text><text x="253.0" y="140.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="253.0" y="156.0" text-anchor="start" font-size="10" fill="#2b2410" >Ölçülen parçalar hazır.</text><text x="253.0" y="186.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="253.0" y="202.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Birleştir; eser var olur.</text><text x="433.0" y="240.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ خَلْق</text><text x="253.0" y="278.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: 3, 7</text><rect x="461" y="90" width="200" height="200" fill="#fff" stroke="#2f6fb3" stroke-width="2"/><text x="561.0" y="112.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">3. İÇ KALIP</text><text x="471.0" y="140.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="471.0" y="156.0" text-anchor="start" font-size="10" fill="#2b2410" >Eser yaşayan bir şey.</text><text x="471.0" y="186.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="471.0" y="202.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Kalıbı içine yerleştir: huy.</text><text x="651.0" y="240.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيقَة خُلُق</text><text x="471.0" y="278.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: 4</text><rect x="679" y="90" width="200" height="200" fill="#fff" stroke="#2f6fb3" stroke-width="2"/><text x="779.0" y="112.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">4. YERLEŞİK DÜZEN</text><text x="689.0" y="140.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="689.0" y="156.0" text-anchor="start" font-size="10" fill="#2b2410" >Huylar çoğaldı.</text><text x="689.0" y="186.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="689.0" y="202.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Onları bir ilme bağla: ahlâk.</text><text x="869.0" y="240.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَاق أَخْلَاقِيّ</text><text x="689.0" y="278.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: —</text><rect x="25" y="360" width="200" height="200" fill="#fff" stroke="#3f8f3a" stroke-width="2"/><text x="125.0" y="382.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">5. DÜZ YÜZEY</text><text x="35.0" y="410.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="35.0" y="426.0" text-anchor="start" font-size="10" fill="#2b2410" >Madde pürüzlü.</text><text x="35.0" y="456.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="35.0" y="472.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Düzle; zamanla aşınır.</text><text x="215.0" y="510.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَق خَلْقَاء</text><text x="35.0" y="548.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: 8</text><rect x="243" y="360" width="200" height="200" fill="#fff" stroke="#c26a1e" stroke-width="2"/><text x="343.0" y="382.0" text-anchor="middle" font-size="11" fill="#c26a1e" font-weight="700">6. PAY VE LİYAKAT</text><text x="253.0" y="410.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="253.0" y="426.0" text-anchor="start" font-size="10" fill="#2b2410" >Hazırlanan bir işe ayrılacak.</text><text x="253.0" y="456.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="253.0" y="472.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Payını ver, işe uyanı seç.</text><text x="433.0" y="510.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَاق</text><text x="253.0" y="548.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: —</text><rect x="461" y="360" width="200" height="200" fill="#fff" stroke="#2f6fb3" stroke-width="2"/><text x="561.0" y="382.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">7. SAHTE ESER</text><text x="471.0" y="410.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="471.0" y="426.0" text-anchor="start" font-size="10" fill="#2b2410" >Eser yokken var denmesi.</text><text x="471.0" y="456.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="471.0" y="472.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Bunu ayırt et: uydurmadır.</text><text x="651.0" y="510.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ تَخَلَّقَ</text><text x="471.0" y="548.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: —</text><rect x="679" y="360" width="200" height="200" fill="#fff" stroke="#3f8f3a" stroke-width="2"/><text x="779.0" y="382.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">8. EŞYANIN YAŞLANMASI</text><text x="689.0" y="410.0" text-anchor="start" font-size="9.5" fill="#6d6650" >bağlam:</text><text x="689.0" y="426.0" text-anchor="start" font-size="10" fill="#2b2410" >Yüzey kullanılıyor.</text><text x="689.0" y="456.0" text-anchor="start" font-size="9.5" fill="#6d6650" >çözüm:</text><text x="689.0" y="472.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">Kabul et; eskilik de bir haldir.</text><text x="869.0" y="510.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْلَوْلَقَ خَلِقَ</text><text x="689.0" y="548.0" text-anchor="start" font-size="10" fill="#b3541e" >sonraki: —</text><line x1="225" y1="190" x2="243" y2="190" stroke="#b3541e" stroke-opacity=".5" marker-end="url(#o)"/><path d="M125,290 C125,330 125,320 125,360" stroke="#b3541e" stroke-opacity=".5" fill="none" marker-end="url(#o)"/><path d="M125,290 C125,330 343,320 343,360" stroke="#b3541e" stroke-opacity=".5" fill="none" marker-end="url(#o)"/><line x1="443" y1="190" x2="461" y2="190" stroke="#b3541e" stroke-opacity=".5" marker-end="url(#o)"/><path d="M343,290 C343,330 561,320 561,360" stroke="#b3541e" stroke-opacity=".5" fill="none" marker-end="url(#o)"/><line x1="661" y1="190" x2="679" y2="190" stroke="#b3541e" stroke-opacity=".5" marker-end="url(#o)"/><line x1="225" y1="460" x2="679" y2="460" stroke="#b3541e" stroke-opacity=".5" marker-end="url(#o)"/></svg>