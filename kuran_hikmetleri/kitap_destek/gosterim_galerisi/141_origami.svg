<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">141. Origami katlama adımları: tek bir maddenin hâlleri sırayla</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Kat izleri açılınca bile kâğıtta kalır: kalıp (خِلْقَة) budur.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><g transform="translate(90,170)"><rect x="-45" y="-45" width="90" height="90" fill="#f3eedd" stroke="#2b2410" stroke-width="2"/></g><text x="90.0" y="250.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">1. ham madde: düz kâğıt</text><text x="90.0" y="274.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْقَاء</text><line x1="160" y1="170" x2="255" y2="170" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><g transform="translate(330,170)"><rect x="-45" y="-45" width="90" height="90" fill="#f3eedd" stroke="#2b2410" stroke-width="2"/><line x1="-45" y1="45" x2="45" y2="-45" stroke="#2f6fb3" stroke-dasharray="5 3" stroke-width="2"/></g><text x="330.0" y="250.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">2. ölçmek: köşegen çizilir</text><text x="330.0" y="274.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><line x1="400" y1="170" x2="495" y2="170" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><g transform="translate(570,170)"><path d="M-45,45 L45,-45 L45,45Z" fill="#dfe8f3" stroke="#2b2410" stroke-width="2"/></g><text x="570.0" y="250.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">3. biçmek: katlanır</text><text x="570.0" y="274.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><line x1="640" y1="170" x2="735" y2="170" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><g transform="translate(810,170)"><path d="M-45,45 L0,-45 L45,45 L0,20Z" fill="#cfe3dc" stroke="#2b2410" stroke-width="2"/></g><text x="810.0" y="250.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">4. şekli belirir</text><text x="810.0" y="274.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مُخَلَّق</text><g transform="translate(90,420)"><path d="M-55,10 L0,-10 L55,-35 L20,10 L0,40 L-10,10Z" fill="#9db8d9" stroke="#2b2410" stroke-width="2"/></g><text x="90.0" y="500.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">5. yaratılmış: kuş</text><text x="90.0" y="524.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَخْلُوق</text><line x1="160" y1="420" x2="255" y2="420" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><g transform="translate(330,420)"><rect x="-45" y="-45" width="90" height="90" fill="#fff" stroke="#2b2410"/><path d="M-45,45 L45,-45 M-45,-45 L45,45 M0,-45 L0,45" stroke="#7a3fb3" stroke-dasharray="4 3"/></g><text x="330.0" y="500.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">6. kalıbı: kat izleri</text><text x="330.0" y="524.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة</text><line x1="400" y1="420" x2="495" y2="420" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><g transform="translate(570,420)"><path d="M-55,12 L0,-8 L50,-30 L18,14 L-2,38 L-12,12Z" fill="#d5d5d5" stroke="#777" stroke-width="2" stroke-dasharray="2 2"/></g><text x="570.0" y="500.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">7. eskimiş: yıpranmış kat</text><text x="570.0" y="524.0" text-anchor="middle" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِقَ</text><text x="450.0" y="640.0" text-anchor="middle" font-size="11" fill="#2b2410" >Aynı kâğıt her katla başka bir şey olur; kelimeler bir maddenin katlanma safhalarıdır.</text></svg>