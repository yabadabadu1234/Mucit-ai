<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">26. Wilkins tarzı harf kodu (1668): adı okuyan yerini okur</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her mananın adı, ağaçtaki yolunun harflerinden yapılır.</text><text x="18.0" y="80.0" text-anchor="start" font-size="12" fill="#2b2410" >Kelimenin harfleri tasnif yolunu taşır: ilk hece dal, her sonraki harf bir basamak</text><text x="40.0" y="108.0" text-anchor="start" font-size="18" fill="#2f6fb3" font-weight="700" font-family="DejaVu Sans Mono">ka</text><text x="200.0" y="108.0" text-anchor="start" font-size="12" fill="#2b2410" >= ölçüp biçmek</text><text x="600.0" y="108.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><text x="40.0" y="138.0" text-anchor="start" font-size="18" fill="#2f6fb3" font-weight="700" font-family="DejaVu Sans Mono">kab</text><text x="200.0" y="138.0" text-anchor="start" font-size="12" fill="#2b2410" >= yaratmak</text><text x="600.0" y="138.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ خَلْق خَالِق خَلَّاق</text><text x="40.0" y="168.0" text-anchor="start" font-size="18" fill="#2f6fb3" font-weight="700" font-family="DejaVu Sans Mono">kabb</text><text x="200.0" y="168.0" text-anchor="start" font-size="12" fill="#2b2410" >= yaratılmış</text><text x="600.0" y="168.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق مَخْلُوق مَخْلُوقَات خَلِيقَة</text><text x="40.0" y="198.0" text-anchor="start" font-size="18" fill="#2f6fb3" font-weight="700" font-family="DejaVu Sans Mono">kabc</text><text x="200.0" y="198.0" text-anchor="start" font-size="12" fill="#2b2410" >= yaradılış</text><text x="600.0" y="198.0" text