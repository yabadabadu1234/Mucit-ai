nt-weight="700" font-family="DejaVu Sans Mono">li</text><text x="200.0" y="528.0" text-anchor="start" font-size="12" fill="#2b2410" >= yakışmak</text><text x="600.0" y="528.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيق أَخْلَق خَلُقَ اِخْلَوْلَقَ</text><text x="40.0" y="558.0" text-anchor="start" font-size="18" fill="#7a7a7a" font-weight="700" font-family="DejaVu Sans Mono">xo</text><text x="200.0" y="558.0" text-anchor="start" font-size="12" fill="#2b2410" >= kök dışı</text><text x="600.0" y="558.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقِين</text><text x="18.0" y="620.0" text-anchor="start" font-size="12" fill="#b3541e" font-weight="700">Okuma: &quot;kabcbb&quot; = ka (ölçüp biçme) → b (yaratmak) → c (yaradılış) → b (huy) → b (ahlâk)</text></svg>