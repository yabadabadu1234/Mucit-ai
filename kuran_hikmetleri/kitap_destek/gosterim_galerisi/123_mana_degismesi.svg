<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">123. Mana değişmesi türleri (Bréal, Ullmann): her türeme bir değişme türüne konur</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Sol: değişmenin adı, sağ: kökte onun örneği.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="40" y="80" width="200" height="56" rx="28" fill="#2f6fb3"/><text x="140.0" y="113.0" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">GENİŞLEME</text><text x="360.0" y="113.0" text-anchor="middle" font-size="12" fill="#2b2410" >ölçüp biçmek</text><path d="M470,108 Q515.0,108.0 560,108" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="700.0" y="113.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">her türlü yaratmak</text><rect x="40" y="156" width="200" height="56" rx="28" fill="#c26a1e"/><text x="140.0" y="189.0" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">DARALMA</text><text x="360.0" y="189.0" text-anchor="middle" font-size="12" fill="#2b2410" >yaratılmış her şey</text><path d="M470,184 Q515.0,184.0 560,184" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="700.0" y="189.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">insanlar (خَلْق = halk)</text><rect x="40" y="232" width="200" height="56" rx="28" fill="#7a3fb3"/><text x="140.0" y="265.0" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">SOYUTLAŞMA</text><text x="360.0" y="265.0" text-anchor="middle" font-size="12" fill="#2b2410" >yaradılış (beden)</text><path d="M470,260 Q515.0,260.0 560,260" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="700.0" y="265.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">huy (nefs)</text><rect x="40" y="308" width="200" height="56" rx="28" fill="#3f8f3a"/><text x="140.0" y="341.0" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">İYİLEŞME</text><text x="360.0" y="341.0" text-anchor="middle" font-size="12" fill="#2b2410" >huy</text><path d="M470,336 Q515.0,336.0 560,336" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="700.0" y="341.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">güzel ahlâk (أَخْلَاق)</text><rect x="40" y="384" width="200" height="56" rx="28" fill="#c0392b"/><text x="140.0" y="417.0" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">KÖTÜLEŞME</text><text x="360.0" y="417.0" text-anchor="middle" font-size="12" fill="#2b2410" >yaratmak</text><path d="M470,412 Q515.0,412.0 560,412" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="700.0" y="417.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">uydurmak (اِخْتَلَقَ)</text><rect x="40" y="460" width="200" height="56" rx="28" fill="#a8478f"/><text x="140.0" y="493.0" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">BİTİŞİKLİK</text><text x="360.0" y="493.0" text-anchor="middle" font-size="12" fill="#2b2410" >yüzey</text><path d="M470,488 Q515.0,488.0 560,488" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="700.0" y="493.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">yüzeye sürülen koku</text><rect x="40" y="536" width="200" height="56" rx="28" fill="#7a7a7a"/><text x="140.0" y="569.0" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">NETİCE</text><text x="360.0" y="569.0" text-anchor="middle" font-size="12" fill="#2b2410" >düzlemek</text><path d="M470,564 Q515.0,564.0 560,564" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="700.0" y="569.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">eskimek</text></svg>