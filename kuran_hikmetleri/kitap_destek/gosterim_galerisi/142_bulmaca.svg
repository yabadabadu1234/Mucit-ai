l="#2b2410" font-weight="700">SOLDAN SAĞA</text><text x="600.0" y="122.0" text-anchor="start" font-size="11" fill="#2b2410" >1. Ölçülen şey tamamlanınca (خَلَقَ)</text><text x="600.0" y="141.9" text-anchor="start" font-size="11" fill="#2b2410" >6. Düzlenen yüzeyin aşınması (خَلِقَ)</text><text x="600.0" y="171.9" text-anchor="start" font-size="12" fill="#2b2410" font-weight="700">YUKARIDAN AŞAĞI</text><text x="600.0" y="193.9" text-anchor="start" font-size="11" fill="#2b2410" >2. Yaradılışta nefse verilen kalıp</text><text x="600.0" y="209.8" text-anchor="start" font-size="11" fill="#2b2410" >(خُلُق)</text><text x="600.0" y="229.8" text-anchor="start" font-size="11" fill="#2b2410" >3. Huyların yerleşmiş düzeni (أَخْلَاق)</text><text x="600.0" y="249.7" text-anchor="start" font-size="11" fill="#2b2410" >4. Bir iş için ayrılan (خَلَاق)</text><text x="600.0" y="269.7" text-anchor="start" font-size="11" fill="#2b2410" >5. Yüzeye sürülen (خَلُوق)</text><text x="450.0" y="640.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >İpucu mana, cevap kelimedir; kesişen harfler iki mananın bir kelimeden geldiğini hissettirir. Soluk harfler cevap anahtarıdır.</text></svg>