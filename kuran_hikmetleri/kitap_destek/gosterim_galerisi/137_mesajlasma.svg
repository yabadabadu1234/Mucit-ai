<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">137. Mesajlaşma: kökün kelimeleri bir grupta birbirine kendini anlatır</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her kelime birinci şahısla konuşur; aile bağı sohbetin içinde ortaya çıkar.</text><rect x="200" y="60" width="500" height="590" rx="30" fill="#ece5dd" stroke="#2b2410" stroke-width="2"/><rect x="200" y="60" width="500" height="44" rx="20" fill="#075e54"/><text x="450.0" y="88.0" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">خلق ailesi grubu</text><rect x="220" y="130" width="320" height="56" rx="10" fill="#fff"/><text x="530.0" y="148.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#075e54">خَلَقَ</text><text x="230.0" y="164.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Selam, ben ölçüp biçen. Herkes beni &quot;yarattı&quot;</text><text x="230.0" y="179.0" text-anchor="start" font-size="10.5" fill="#2b2410" >diye biliyor ama önce ölçerim.</text><rect x="360" y="196" width="320" height="56" rx="10" fill="#dcf8c6"/><text x="670.0" y="214.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#075e54">خُلُق</text><text x="370.0" y="230.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Ben de senin çocuğunum aslında. Yaradılışta</text><text x="370.0" y="245.0" text-anchor="start" font-size="10.5" fill="#2b2410" >içe konan kalıbım. Huy.</text><rect x="220" y="262" width="320" height="56" rx="10" fill="#fff"/><text x="530.0" y="280.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#075e54">خَلِقَ</text><text x="230.0" y="296.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Bana eskimiş diyorlar. Ama ben de ailedenim:</text><text x="230.0" y="311.0" text-anchor="start" font-size="10.5" fill="#2b2410" >düzlenen yüzey aşınınca ben olurum.</text><rect x="360" y="328" width="320" height="56" rx="10" fill="#dcf8c6"/><text x="670.0" y="346.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#075e54">خُلُق</text><text x="370.0" y="362.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Yani ikimiz de &quot;şekil&quot; sahibiyiz: ben içte,</text><text x="370.0" y="377.0" text-anchor="start" font-size="10.5" fill="#2b2410" >sen yüzde.</text><rect x="220" y="394" width="320" height="56" rx="10" fill="#fff"/><text x="530.0" y="412.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#075e54">اِخْتَلَقَ</text><text x="230.0" y="428.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Beni pek sevmezler. Olmayan sözü yaratılmış</text><text x="230.0" y="443.0" text-anchor="start" font-size="10.5" fill="#2b2410" >gibi gösteririm.</text><rect x="360" y="460" width="320" height="41" rx="10" fill="#dcf8c6"/><text x="670.0" y="478.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#075e54">خَلَقَ</text><text x="370.0" y="494.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Ölçüsüz yaratma sahtedir. Sen benim gölgemsin.</text><rect x="220" y="511" width="320" height="56" rx="10" fill="#fff"/><text x="530.0" y="529.0" text-anchor="end" font-size="13" font-family="Amiri, Noto Naskh Arabic, serif" fill="#075e54">خِلْقِين</text><text x="230.0" y="545.0" text-anchor="start" font-size="10.5" fill="#2b2410" >Ben kazanım; Yunanca konuşuyorum, galiba</text><text x="230.0" y="560.0" text-anchor="start" font-size="10.5" fill="#2b2410" >yanlış gruba eklendim 🙂</text></svg>