<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">133. Beden haritası: her mana bedenin onu işleyen uzvuna konur</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Okuyan kendi bedeninde yer bulur: el ölçer, kalpte huy durur, ağız uydurur.</text><circle cx="450" cy="140" r="50" fill="#f5e1c8" stroke="#2b2410" stroke-width="2"/><path d="M380,200 L520,200 L540,420 L360,420Z" fill="#f5e1c8" stroke="#2b2410" stroke-width="2"/><path d="M380,210 L280,360 L300,370 L390,250" fill="#f5e1c8" stroke="#2b2410" stroke-width="2"/><path d="M520,210 L620,360 L600,370 L510,250" fill="#f5e1c8" stroke="#2b2410" stroke-width="2"/><path d="M390,420 L380,620 L420,620 L440,420 M460,420 L480,620 L520,620 L510,420" fill="#f5e1c8" stroke="#2b2410" stroke-width="2"/><path d="M436,270 c-14,-18 -34,0 0,26 c34,-26 14,-44 0,-26" fill="#c0392b"/><line x1="285" y1="365" x2="130" y2="320" stroke="#2f6fb3" stroke-width="1.5"/><circle cx="285" cy="365" r="4" fill="#2f6fb3"/><text x="130.0" y="316.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">EL: ölçer, biçer</text><text x="130.0" y="336.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><line x1="450" y1="120" x2="180" y2="110" stroke="#2f6fb3" stroke-width="1.5"/><circle cx="450" cy="120" r="4" fill="#2f6fb3"/><text x="180.0" y="106.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">GÖZ: dış şekli görür</text><text x="180.0" y="126.0" text-anchor="middle" font-size="14" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة</text><line x1="436" y1="280" x2="150" y2="470" stroke="#2f6fb3" stroke-width="1.5"/><circle cx="436" cy="280" r="4" fill="#2f6fb3"/><text x="150.0" y="466.0" text-anchor="middle" font-size="11" fill="#2f6fb