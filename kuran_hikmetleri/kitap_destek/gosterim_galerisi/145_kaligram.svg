<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">145. Kaligram: yazının kendisi bir elbise şekli alır</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Metin, anlattığı şeyin (ölçülüp biçilen elbisenin) şeklinde dizilir.</text><text x="450.0" y="120.0" text-anchor="middle" font-size="10" fill="#2b2410" >خلق kökünün aslı ölçüp</text><text x="450.0" y="134.0" text-anchor="middle" font-size="10" fill="#2b2410" >biçerek hazırlamaktır.</text><text x="450.0" y="148.0" text-anchor="middle" font-size="10" fill="#2b2410" >Terzi deriyi ölçer,</text><text x="450.0" y="162.0" text-anchor="middle" font-size="10" fill="#2b2410" >makasıyla biçer, parçaları birleştirir ve bir</text><text x="450.0" y="176.0" text-anchor="middle" font-size="10" fill="#2b2410" >elbise yaratır. Yaratılan elbisenin bir kalıbı</text><text x="450.0" y="190.0" text-anchor="middle" font-size="10" fill="#2b2410" >vardır; buna hilkat denir. Kalıp</text><text x="450.0" y="204.0" text-anchor="middle" font-size="10" fill="#2b2410" >insanın içine girince huy olur,</text><text x="450.0" y="218.0" text-anchor="middle" font-size="10" fill="#2b2410" >huylar yerleşince ahlâk olur.</text><text x="450.0" y="232.0" text-anchor="middle" font-size="10" fill="#2b2410" >Elbise giyildikçe düzleşir, aşınır</text><text x="450.0" y="246.0" text-anchor="middle" font-size="10" fill="#2b2410" >ve eskir; eskiyene halika,</text><text x="450.0" y="260.0" text-anchor="middle" font-size="10" fill="#2b2410" >paçavraya hulkân denir. Elbiseye</text><text x="450.0" y="274.0" text-anchor="middle" font-size="10" fill="#2b2410" >sürülen güzel koku halûktur.</text><text x="450.0" y="288.0" text-anchor="middle" font-size="10" fill="#2b2410" >Bir iş için ayrılan kumaş</text><text x="450.0" y="302.0" text-anchor="middle" font-size="10" fill="#2b2410" >paydır, bedene uyan elbise</text><text x="450.0" y="316.0" text-anchor="middle" font-size="10" fill="#2b2410" >lâyıktır. Ölçüsüz biçilen</text><text x="450.0" y="330.0" text-anchor="middle" font-size="10" fill="#2b2410" >sahte elbise ise uydurmadır,</text><text x="450.0" y="344.0" text-anchor="middle" font-size="10" fill="#2b2410" >ihtilâktır. خلق kökünün aslı</text><text x="450.0" y="358.0" text-anchor="middle" font-size="10" fill="#2b2410" >ölçüp biçerek hazırlamaktır. Terzi</text><text x="450.0" y="372.0" text-anchor="middle" font-size="10" fill="#2b2410" >deriyi ölçer, makasıyla biçer,</text><text x="450.0" y="386.0" text-anchor="middle" font-size="10" fill="#2b2410" >parçaları birleştirir ve bir elbise</text><text x="450.0" y="400.0" text-anchor="middle" font-size="10" fill="#2b2410" >yaratır. Yaratılan elbisenin bir kalıbı</text><text x="450.0" y="414.0" text-anchor="middle" font-size="10" fill="#2b2410" >vardır; buna hilkat denir. Kalıp insanın içine</text><text x="450.0" y="428.0" text-anchor="middle" font-size="10" fill="#2b2410" >girince huy olur, huylar yerleşince ahlâk olur.</text><text x="450.0" y="442.0" text-anchor="middle" font-size="10" fill="#2b2410" >Elbise giyildikçe düzleşir, aşınır ve eskir; eskiyene</text><text x="450.0" y="456.0" text-anchor="middle" font-size="10" fill="#2b2410" >halika, paçavraya hulkân denir. Elbiseye sürülen güzel</text><text x="450.0" y="470.0" text-anchor="middle" font-size="10" fill="#2b2410" >koku halûktur. Bir iş için ayrılan kumaş paydır, bedene uyan</text><text x="450.0" y="484.0" text-anchor="middle" font-size="10" fill="#2b2410" >elbise lâyıktır. Ölçüsüz biçilen sahte elbise ise uydurmadır,</text><text x="450.0" y="498.0" text-anchor="middle" font-size="10" fill="#2b2410" >ihtilâktır.</text><text x="450.0" y="100.0" text-anchor="middle" font-size="24" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">خَلَقَ</text></svg>