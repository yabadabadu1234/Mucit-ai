<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">149. Sınav kâğıdı: bilgi önce sorulur, sonra öğretilir</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Çeldiriciler en sık karışan manalardır; yanlış şık nereden karıştığını gösterir.</text><rect x="60" y="64" width="780" height="580" fill="#fff" stroke="#2b2410"/><text x="450.0" y="92.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">SINAV: خ ل ق kökü   ·   Adı Soyadı: ……………   ·   Puan: …/100</text><text x="90.0" y="130.0" text-anchor="start" font-size="12" fill="#2b2410" font-weight="700">1. خُلُق kelimesinin aslî manaya en yakın izahı hangisidir?</text><circle cx="100" cy="150" r="7" fill="none" stroke="#2b2410"/><text x="112.0" y="154.0" text-anchor="start" font-size="10.5" fill="#2b2410" >A) yaratılmış şey</text><circle cx="290" cy="150" r="7" fill="none" stroke="#2b2410"/><text x="302.0" y="154.0" text-anchor="start" font-size="10.5" fill="#2b2410" >B) nefse verilen kalıp</text><circle cx="480" cy="150" r="7" fill="none" stroke="#2b2410"/><text x="492.0" y="154.0" text-anchor="start" font-size="10.5" fill="#2b2410" >C) eskimiş elbise</text><circle cx="670" cy="150" r="7" fill="none" stroke="#2b2410"/><text x="682.0" y="154.0" text-anchor="start" font-size="10.5" fill="#2b2410" >D) pay</text><text x="90.0" y="204.0" text-anchor="start" font-size="12" fill="#2b2410" font-weight="700">2. Aşağıdakilerden hangisi bu köke türeme yoluyla bağlanmaz?</text><circle cx="100" cy="224" r="7" fill="none" stroke="#2b2410"/><text x="112.0" y="228.0" text-anchor="start" font-size="10.5" fill="#2b2410" >A) خَلَاق</text><circle cx="290" cy="224" r="7" fill="none" stroke="#2b2410"/><text x="302.0" y="228.0" text-anchor="start" font-size="10.5" fill="#2b2410" >B) خَلِيق</text><circle cx="480" cy="224" r="7" fill="none" stroke="#2b2410"/><text x="492.0" y="228.0" text-anchor="start" font-size="10.5" fill="#2b2410" >C) خِلْقِين</text><circle cx="670" cy="224" r="7" fill="none" stroke="#2b2410"/><text x="682.0" y="228.0" text-anchor="start" font-size="10.5" fill="#2b2410" >D) خُلْقَان</text><text x="90.0" y="278.0" text-anchor="start" font-size="12" fill="#2b2410" font-weight="700">3. &quot;Elbise eskidi&quot; mânâsı hangi koldan gelir?</text><circle cx="100" cy="298" r="7" fill="none" stroke="#2b2410"/><text x="112.0" y="302.0" text-anchor="start" font-size="10.5" fill="#2b2410" >A) ölçüp biçmek</text><circle cx="290" cy="298" r="7" fill="none" stroke="#2b2410"/><text x="302.0" y="302.0" text-anchor="start" font-size="10.5" fill="#2b2410" >B) düzlemek</text><circle cx="480" cy="298" r="7" fill="none" stroke="#2b2410"/><text x="492.0" y="302.0" text-anchor="start" font-size="10.5" fill="#2b2410" >C) pay ayırmak</text><circle cx="670" cy="298" r="7" fill="none" stroke="#2b2410"/><text x="682.0" y="302.0" text-anchor="start" font-size="10.5" fill="#2b2410" >D) yakışmak</text><text x="90.0" y="352.0" text-anchor="start" font-size="12" fill="#2b2410" font-weight="700">4. اِخْتَلَقَ fiilini yaratmaktan ayıran şey nedir?</text><circle cx="100" cy="372" r="7" fill="none" stroke="#2b2410"/><text x="112.0" y="376.0" text-anchor="start" font-size="10.5" fill="#2b2410" >A) ölçüsüz, sahte oluşu</text><circle cx="290" cy="372" r="7" fill="none" stroke="#2b2410"/><text x="302.0" y="376.0" text-anchor="start" font-size="10.5" fill="#2b2410" >B) eşyaya yapılması</text><circle cx="480" cy="372" r="7" fill="none" stroke="#2b2410"/><text x="492.0" y="376.0" text-anchor="start" font-size="10.5" fill="#2b2410" >C) çoğul oluşu</text><circle cx="670" cy="372" r="7" fill="none" stroke="#2b2410"/><text x="682.0" y="376.0" text-anchor="start" font-size="10.5" fill="#2b2410" >D) zamanla olması</text><text x="90.0" y="560.0" text-anchor="start" font-size="10" fill="#6d6650" >Cevap anahtarı (ters çevirin):</text><g transform="rotate(180 450 600)"><text x="450.0" y="600.0" text-anchor="middle" font-size="12" fill="#9a9a9a" >1-B · 2-C · 3-B · 4-A</text></g></svg>