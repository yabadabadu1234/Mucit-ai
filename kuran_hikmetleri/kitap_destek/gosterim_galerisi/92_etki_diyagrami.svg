t x="40.0" y="395.0" width="180" height="50" rx="6" fill="#fff" stroke="#c26a1e" stroke-width="1.6"/><text x="130.0" y="413.0" text-anchor="middle" font-size="10" fill="#2b2410" >belirsizlik: fâil kim?</text><rect x="320.0" y="395.0" width="200" height="50" rx="6" fill="#fff" stroke="#c26a1e" stroke-width="1.6"/><text x="420.0" y="413.0" text-anchor="middle" font-size="10" fill="#2b2410" >belirsizlik: nesne eşya mı</text><text x="420.0" y="426.0" text-anchor="middle" font-size="10" fill="#2b2410" >insan mı?</text><rect x="610.0" y="395.0" width="180" height="50" rx="6" fill="#fff" stroke="#c26a1e" stroke-width="1.6"/><text x="700.0" y="413.0" text-anchor="middle" font-size="10" fill="#2b2410" >belirsizlik: zaman geçti mi?</text><rect x="460.0" y="125.0" width="200" height="50" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="560.0" y="143.0" text-anchor="middle" font-size="10" fill="#2b2410" >DEĞER: doğru mana</text><text x="450.0" y="560.0" text-anchor="middle" font-size="11" fill="#2b2410" >fâil Allah → yaratmak · nesne nefs → huy · zaman geçti ve nesne elbise → eskimek</text></svg>