<svg xmlns="http://www.w3.org/2000/svg" width="900" height="559.65" viewBox="0 0 900 559.65" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">138. Karagöz perdesi: iki tip muhavere ile öğretir, biri bilir biri şaşırır</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Şaşıran tipin yanlış anlaması, doğrunun sınırını gösterir.</text><rect x="60" y="70" width="780" height="300" fill="#f7ecc9" stroke="#8a5a2b" stroke-width="8"/><circle cx="250" cy="190" r="34" fill="#c0392b" fill-opacity=".5"/><rect x="220" y="224" width="60" height="110" rx="10" fill="#c0392b" fill-opacity=".5"/><circle cx="650" cy="190" r="34" fill="#2f6fb3" fill-opacity=".5"/><rect x="620" y="224" width="60" height="110" rx="10" fill="#2f6fb3" fill-opacity=".5"/><text x="250.0" y="360.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">KARAGÖZ</text><text x="650.0" y="360.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">HACİVAT</text><text x="70.0" y="400.0" text-anchor="start" font-size="11" fill="#2f6fb3" font-weight="700">Hacivat:</text><text x="150.0" y="400.0" text-anchor="start" font-size="11" fill="#2b2410" >Ey Karagöz&#x27;üm, &quot;hulk&quot; kelimesinin aslı ölçüp biçmektir, bilir misin?</text><text x="70.0" y="419.9" text-anchor="start" font-size="11" fill="#c0392b" font-weight="700">Karagöz:</text><text x="150.0" y="419.9" text-anchor="start" font-size="11" fill="#2b2410" >Bilmem mi! Terzi Ahmet ölçtü, biçti, ceketim oldu. Sonra eskidi: &quot;halika&quot;.</text><text x="70.0" y="439.9" text-anchor="start" font-size="11" fill="#2f6fb3" font-weight="700">Hacivat:</text><text x="150.0" y="439.9" text-anchor="start" font-size="11" fill="#2b2410" >Aferin. Allah her şeyi ölçüsüyle yarattığı için Hâlık&#x27;tır; yaratılmışa mahlûk denir.</text><text x="70.0" y="459.8" text-anchor="start" font-size="11" fill="#c0392b" font-weight="700">Karagöz:</text><text x="150.0" y="459.8" text-anchor="start" font-size="11" fill="#2b2410" >Benim mahlûk huyum da yaradılıştan mı?</text><text x="70.0" y="479.8" text-anchor="start" font-size="11" fill="#2f6fb3" font-weight="700">Hacivat:</text><text x="150.0" y="479.8" text-anchor="start" font-size="11" fill="#2b2410" >Evet: yaradılışta içe verilen kalıba hulk derler, çoğalıp yerleşince ahlâk olur.</text><text x="70.0" y="499.7" text-anchor="start" font-size="11" fill="#c0392b" font-weight="700">Karagöz:</text><text x="150.0" y="499.7" text-anchor="start" font-size="11" fill="#2b2410" >O hâlde senin bu uydurma lafların da bu köktendir, &quot;ihtilâk&quot;!</text><text x="70.0" y="519.7" text-anchor="start" font-size="11" fill="#2f6fb3" font-weight="700">Hacivat:</text><text x="150.0" y="519.7" text-anchor="start" font-size="11" fill="#2b2410" >Yıktın perdeyi, eyledin viran…</text></svg>