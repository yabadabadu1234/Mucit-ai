<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">38. Peirce varoluş çizgesi (alfa): türemeler şartlı önerme olarak</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Halkalar (cut) olumsuzluktur; iç içe ikisi şart bildirir.</text><ellipse cx="130.0" cy="175.0" rx="100.0" ry="95.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><ellipse cx="157.5" cy="205.0" rx="57.5" ry="45.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="80.0" y="180.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">ölçüp biçmek</text><text x="157.0" y="210.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#2f6fb3">yaratmak</text><ellipse cx="345.0" cy="175.0" rx="100.0" ry="95.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><ellipse cx="372.5" cy="205.0" rx="57.5" ry="45.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="295.0" y="180.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">yaratmak</text><text x="372.0" y="210.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#2f6fb3">yaratılmış</text><ellipse cx="560.0" cy="175.0" rx="100.0" ry="95.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><ellipse cx="587.5" cy="205.0" rx="57.5" ry="45.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="510.0" y="180.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">yaratılmış</text><text x="587.0" y="210.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#2f6fb3">yaradılış</text><ellipse cx="775.0" cy="175.0" rx="100.0" ry="95.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><ellipse cx="802.5" cy="205.0" rx="57.5" ry="45.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="725.0" y="180.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">yaradılış</text><text x="802.0" y="210.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#2f6fb3">huy</text><ellipse cx="130.0" cy="405.0" rx="100.0" ry="95.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><ellipse cx="157.5" cy="435.0" rx="57.5" ry="45.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="80.0" y="410.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">huy</text><text x="157.0" y="440.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#2f6fb3">ahlâk</text><ellipse cx="345.0" cy="405.0" rx="100.0" ry="95.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><ellipse cx="372.5" cy="435.0" rx="57.5" ry="45.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="295.0" y="410.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">düzlemek</text><text x="372.0" y="440.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#3f8f3a">eskimek</text><ellipse cx="560.0" cy="405.0" rx="100.0" ry="95.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><ellipse cx="587.5" cy="435.0" rx="57.5" ry="45.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="510.0" y="410.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">düzlemek</text><text x="587.0" y="440.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#2c8c7c">şekli belirmiş</text><text x="770.0" y="410.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700" fill="#7a7a7a">kök dışı</text><ellipse cx="770.0" cy="400.0" rx="95.0" ry="90.0" fill="none" stroke="#2b2410" stroke-width="1.6"/><text x="770.0" y="390.0" text-anchor="middle" font-size="12" fill="#2b2410" >خَلُوق</text><text x="770.0" y="435.0" text-anchor="middle" font-size="10" fill="#2b2410" >(esastan türemez)</text><text x="450.0" y="560.0" text-anchor="middle" font-size="11" fill="#2b2410" >Kâğıt = doğru kabul edilen. Bir halka = değil. İç içe iki halka &quot;p ise q&quot; demektir: &quot;p olup q olmaması değil&quot;.</text><text x="450.0" y="580.0" text-anchor="middle" font-size="11" fill="#2b2410" >Misal: ilk çizge &quot;ölçüp biçmek varsa yaratmak vardır&quot; der. Son halka &quot;koku manası esastan türer değil&quot; der.</text></svg>