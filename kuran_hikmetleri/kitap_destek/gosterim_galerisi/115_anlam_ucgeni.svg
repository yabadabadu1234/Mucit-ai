<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">115. Anlam üçgeni: lafız, mana, masadak</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Aynı kökten üç kelime, üç ayrı üçgen.</text><path d="M160,120 L65,420" stroke="#2b2410" stroke-width="2"/><path d="M160,120 L255,420" stroke="#2b2410" stroke-width="2"/><path d="M65,420 L255,420" stroke="#2b2410" stroke-width="2" stroke-dasharray="6 4"/><text x="160.0" y="90.0" text-anchor="middle" font-size="10" fill="#6d6650" >MANA (zihindeki)</text><text x="160.0" y="108.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">yaratma fiili</text><text x="65.0" y="442.0" text-anchor="middle" font-size="10" fill="#6d6650" >LAFIZ</text><text x="65.0" y="466.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق</text><text x="255.0" y="442.0" text-anchor="middle" font-size="10" fill="#6d6650" >MASADAK (dıştaki)</text><text x="255.0" y="462.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">gök, yer, insan</text><path d="M450,120 L355,420" stroke="#2b2410" stroke-width="2"/><path d="M450,120 L545,420" stroke="#2b2410" stroke-width="2"/><path d="M355,420 L545,420" stroke="#2b2410" stroke-width="2" stroke-dasharray="6 4"/><text x="450.0" y="90.0" text-anchor="middle" font-size="10" fill="#6d6650" >MANA (zihindeki)</text><text x="450.0" y="108.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">huy</text><text x="355.0" y="442.0" text-anchor="middle" font-size="10" fill="#6d6650" >LAFIZ</text><text x="355.0" y="466.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خُلُق</text><text x="545.0" y="442.0" text-anchor="middle" font-size="10" fill="#6d6650" >MASADAK (dıştaki)</text><text x="545.0" y="462.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">cömertlik, sabır</text><path d="M740,120 L645,420" stroke="#2b2410" stroke-width="2"/><path d="M740,120 L835,420" stroke="#2b2410" stroke-width="2"/><path d="M645,420 L835,420" stroke="#2b2410" stroke-width="2" stroke-dasharray="6 4"/><text x="740.0" y="90.0" text-anchor="middle" font-size="10" fill="#6d6650" >MANA (zihindeki)</text><text x="740.0" y="108.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">eski</text><text x="645.0" y="442.0" text-anchor="middle" font-size="10" fill="#6d6650" >LAFIZ</text><text x="645.0" y="466.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَق</text><text x="835.0" y="442.0" text-anchor="middle" font-size="10" fill="#6d6650" >MASADAK (dıştaki)</text><text x="835.0" y="462.0" text-anchor="middle" font-size="11.5" fill="#2b2410" font-weight="700">yırtık bir elbise</text><text x="450.0" y="560.0" text-anchor="middle" font-size="11" fill="#2b2410" >Kesik kenar: lafız ile dıştaki şey arasında doğrudan bağ yoktur; bağ zihindeki mana üzerinden kurulur (Ogden ve Richards).</text></svg>