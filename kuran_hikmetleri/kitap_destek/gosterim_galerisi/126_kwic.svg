<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">126. Bağlamlı dizin (KWIC): her geçişte kelime ortada, çevresi iki yanda</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Manayı bağlam söyler; aynı kelime farklı komşularla farklı manaya gelir.</text><line x1="450" y1="70" x2="450" y2="560" stroke="#b3541e" stroke-dasharray="3 3"/><text x="380.0" y="110.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">وَالْأَرْضَ</text><text x="450.0" y="110.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">خَلَقَ السَّمَاوَاتِ</text><text x="520.0" y="110.0" text-anchor="start" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">الْحَمْدُ لِلَّهِ الَّذِي</text><text x="60.0" y="107.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">yaratmak</text><text x="860.0" y="107.0" text-anchor="end" font-size="10" fill="#6d6650" >En&#x27;âm 6:1</text><text x="380.0" y="174.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">عَظِيمٍ</text><text x="450.0" y="174.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">خُلُقٍ</text><text x="520.0" y="174.0" text-anchor="start" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">وَإِنَّكَ لَعَلَىٰ</text><text x="60.0" y="171.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">huy</text><text x="860.0" y="171.0" text-anchor="end" font-size="10" fill="#6d6650" >Kalem 68:4</text><text x="380.0" y="238.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">الْأَوَّلِينَ</text><text x="450.0" y="238.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">خُلُقُ</text><text x="520.0" y="238.0" text-anchor="start" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">إِنْ هَٰذَا إِلَّا</text><text x="60.0" y="235.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">âdet, yol</text><text x="860.0" y="235.0" text-anchor="end" font-size="10" fill="#6d6650" >Şuarâ 26:137</text><text x="380.0" y="302.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a"></text><text x="450.0" y="302.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">خَلَاقٍ</text><text x="520.0" y="302.0" text-anchor="start" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَا لَهُ فِي الْآخِرَةِ مِنْ</text><text x="60.0" y="299.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">pay</text><text x="860.0" y="299.0" text-anchor="end" font-size="10" fill="#6d6650" >Bakara 2:102</text><text x="380.0" y="366.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a"></text><text x="450.0" y="366.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">اخْتِلَاقٌ</text><text x="520.0" y="366.0" text-anchor="start" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">إِنْ هَٰذَا إِلَّا</text><text x="60.0" y="363.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">uydurma</text><text x="860.0" y="363.0" text-anchor="end" font-size="10" fill="#6d6650" >Sâd 38:7</text><text x="380.0" y="430.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">وَغَيْرِ مُخَلَّقَةٍ</text><text x="450.0" y="430.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">مُّخَلَّقَةٍ</text><text x="520.0" y="430.0" text-anchor="start" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مِن مُّضْغَةٍ</text><text x="60.0" y="427.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">şekli belirmiş</text><text x="860.0" y="427.0" text-anchor="end" font-size="10" fill="#6d6650" >Hac 22:5</text><text x="380.0" y="494.0" text-anchor="end" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مِنَ الطِّينِ</text><text x="450.0" y="494.0" text-anchor="middle" font-size="20" font-family="Amiri, Noto Naskh Arabic, serif" fill="#b3541e">تَخْلُقُ</text><text x="520.0" y="494.0" text-anchor="start" font-size="17" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">وَإِذْ</text><text x="60.0" y="491.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">şekil vermek</text><text x="860.0" y="491.0" text-anchor="end" font-size="10" fill="#6d6650" >Mâide 5:110</text><text x="450.0" y="600.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Kök ortada hizalı; sağında öncesi, solunda sonrası (Arapça sağdan okunur). Âyet yerleri hafızadan.</text></svg>