<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">52. Metro haritası: dallar birer hat, manalar durak</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Esas merkez istasyondur; şekli belirmiş iki hattın aktarma durağıdır.</text><polyline points="80,330 200,330 320,330 440,330 560,330 700,330" fill="none" stroke="#2f6fb3" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="320,330 400,250 400,430" fill="none" stroke="#2f6fb3" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="560,330 640,250 640,430" fill="none" stroke="#2f6fb3" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="80,330 200,470 300,470 420,560 500,470" fill="none" stroke="#3f8f3a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,330 300,470" fill="none" stroke="#2c8c7c" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="80,330 140,160 260,130" fill="none" stroke="#c26a1e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="330" r="11" fill="#fff" stroke="#2b2410" stroke-width="3"/><text x="80.0" y="312.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">esas</text><text x="80.0" y="358.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a"></text><circle cx="200" cy="330" r="11" fill="#fff" stroke="#2b2410" stroke-width="3"/><text x="200.0" y="312.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">ölçüp biçmek</text><text x="200.0" y="358.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><circle cx="320" cy="330" r="11" fill="#fff" stroke="#2b2410" stroke-width="3"/><text x="320.0" y="312.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">yaratmak</text><text x="320.0" y="358.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ خَلْق</text><circle cx="440" cy="330" r="7" fill="#fff" stroke="#2b2410" stroke-width="2"/><text x="440.0" y="312.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">yaradılış</text><text x="440.0" y="358.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة خِلْقِيّ</text><circle cx="560" cy="330" r="11" fill="#fff" stroke="#2b2410" stroke-width="3"/><text x="560.0" y="312.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">huy</text><text x="560.0" y="358.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيقَة خُلُق</text><circle cx="700" cy="330" r="7" fill="#fff" stroke="#2b2410" stroke-width="2"/><text x="700.0" y="312.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">ahlâk</text><text x="700.0" y="358.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَاق أَخْلَاقِيّ</text><circle cx="400" cy="250" r="7" fill="#fff" stroke="#2b2410" stroke-width="2"/><text x="400.0" y="232.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">yaratılmış</text><text x="400.0" y="278.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق مَخْلُوق</text><circle cx="400" cy="430" r="7" fill="#fff" stroke="#2b2410" stroke-width="2"/><text x="400.0" y="412.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">uydurmak</text><text x="400.0" y="458.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ تَخَلَّقَ</text><circle cx="640" cy="250" r="7" fill="#fff" stroke="#2b2410" s