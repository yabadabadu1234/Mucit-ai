ke="#2b2410" stroke-width="2"/><text x="140.0" y="142.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">pay</text><text x="140.0" y="188.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَاق</text><circle cx="260" cy="130" r="7" fill="#fff" stroke="#2b2410" stroke-width="2"/><text x="260.0" y="112.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">yakışmak</text><text x="260.0" y="158.0" text-anchor="middle" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيق أَخْلَق</text><text x="450.0" y="620.0" text-anchor="middle" font-size="11" fill="#2b2410" >Hat = dal · durak = mana · kalın halka = aktarma (birden çok hattın geçtiği mana)</text></svg>