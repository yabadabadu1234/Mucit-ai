<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">72. Heisig hikâyesi: her kelime bir anahtar mana, parçaları ve kısa bir sahne</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Hikâyeler hafıza için uyduruldu; harflerin bu manaları taşıdığı iddia edilmez.</text><rect x="25" y="80" width="270" height="260" rx="10" fill="#fff" stroke="#2b2410"/><text x="160.0" y="140.0" text-anchor="middle" font-size="36" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خلق</text><text x="160.0" y="178.0" text-anchor="middle" font-size="12.5" fill="#b3541e" font-weight="700">ANAHTAR: ölçüp biçmek</text><text x="160.0" y="202.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >parçalar: خ (hendek) · ل (değnek) · ق (kanca)</text><text x="160.0" y="235.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Terzi hendeğin başında değneğiyle ölçer,</text><text x="160.0" y="251.0" text-anchor="middle" font-size="10.5" fill="#2b2410" > kancayla deriyi tutup keser.</text><rect x="315" y="80" width="270" height="260" rx="10" fill="#fff" stroke="#2b2410"/><text x="450.0" y="140.0" text-anchor="middle" font-size="36" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَالِق</text><text x="450.0" y="178.0" text-anchor="middle" font-size="12.5" fill="#b3541e" font-weight="700">ANAHTAR: yaratan</text><text x="450.0" y="202.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >parçalar: خلق + ا (uzatma elifi)</text><text x="450.0" y="235.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Ölçüp biçeni değneği uzayıp dikilmiş gör</text><text x="450.0" y="251.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ürsün: işi yapan odur.</text><rect x="605" y="80" width="270" height="260" rx="10" fill="#fff" stroke="#2b2410"/><text x="740.0" y="140.0" text-anchor="middle" font-size="36" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَخْلُوق</text><text x="740.0" y="178.0" text-anchor="middle" font-size="12.5" fill="#b3541e" font-weight="700">ANAHTAR: yaratılmış</text><text x="740.0" y="202.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >parçalar: م (önündeki kap) + خلق + و</text><text x="740.0" y="235.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Ölçülüp biçilen şey bir kabın (م) içine </text><text x="740.0" y="251.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >konup sunulur.</text><rect x="25" y="360" width="270" height="260" rx="10" fill="#fff" stroke="#2b2410"/><text x="160.0" y="420.0" text-anchor="middle" font-size="36" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خُلُق</text><text x="160.0" y="458.0" text-anchor="middle" font-size="12.5" fill="#b3541e" font-weight="700">ANAHTAR: huy</text><text x="160.0" y="482.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >parçalar: خلق, ötreli</text><text x="160.0" y="515.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Ölçülüp biçilen kalıp insanın içine diki</text><text x="160.0" y="531.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >lir; dudaklar büzülür (ötre): içte kalan</text><text x="160.0" y="547.0" text-anchor="middle" font-size="10.5" fill="#2b2410" > şekil.</text><rect x="315" y="360" width="270" height="260" rx="10" fill="#fff" stroke="#2b2410"/><text x="450.0" y="420.0" text-anchor="middle" font-size="36" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِق</text><text x="450.0" y="458.0" text-anchor="middle" font-size="12.5" fill="#b3541e" font-weight="700">ANAHTAR: eskidi</text><text x="450.0" y="482.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >parçalar: خلق, esreli</text><text x="450.0" y="515.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Esre aşağı çeker: elbise aşağı sarkar, y</text><text x="450.0" y="531.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ıpranır.</text><rect x="605" y="360" width="270" height="260" rx="10" fill="#fff" stroke="#2b2410"/><text x="740.0" y="420.0" text-anchor="middle" font-size="36" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْتَلَقَ</text><text x="740.0" y="458.0" text-anchor="middle" font-size="12.5" fill="#b3541e" font-weight="700">ANAHTAR: uydurdu</text><text x="740.0" y="482.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >parçalar: ا + خ + ت + لق</text><text x="740.0" y="515.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Araya bir ت (tuhaf bir harf) sıkıştırılm</text><text x="740.0" y="531.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >ış: gerçek eserin içine sahte parça.</text></svg>