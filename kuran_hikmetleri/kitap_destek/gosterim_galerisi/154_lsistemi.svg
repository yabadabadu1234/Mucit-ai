<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">154. Yeniden yazma kaideleri (Lindenmayer sistemi): kaidelerden büyüyen bitki</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Sol üstte kaideler, altta her adımda dizinin hâli, sağda kaplumbağa çizimi.</text><text x="30.0" y="80.0" text-anchor="start" font-size="12" fill="#2b2410" font-weight="700">Başlangıç (aksiyom): E</text><text x="30" y="104" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410">E → E[A][B][C][H]</text><text x="30" y="122" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410">A → A[D][N]</text><text x="30" y="140" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410">D → D[J][K][L]</text><text x="30" y="158" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410">K → K[U]</text><text x="30" y="176" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410">U → U[X][Y][Z]</text><text x="30" y="194" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#2b2410">B → B[F][G]</text><text x="30.0" y="222.0" text-anchor="start" font-size="10" fill="#6d6650" >E=esas · A=ölçmek · B=düzlemek · C=pay · H=yakışmak · D=yaratmak · J=yaratılmış · K=yaradılış · L=uydurmak</text><text x="30.0" y="236.0" text-anchor="start" font-size="10" fill="#6d6650" >U=huy · X=ahlâk · Y=öfke · Z=huy takınmak · N=şekli belirmiş · F=eskimek · G=koku</text><text x="30" y="300" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#2b2410">n=0: E</text><text x="30" y="316" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#2b2410">n=1: E[A][B][C][H]</text><text x="30" y="332" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#2b2410">n=2: E[A[D][N]][B[F][G]][C][H]</text><text x="30" y="348" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#2b2410">n=3: E[A[D[J][K][L]][N]][B[F][G]][C][H]</text><line x1="620.0" y1="650.0" x2="620.0" y2="530.0" stroke="#b8860b" stroke-width="7.0" stroke-linecap="round"/><text x="624.0" y="533.0" text-anchor="start" font-size="8.5" fill="#6d6650" >esas</text><line x1="620.0" y1="530.0" x2="695.0" y2="474.0" stroke="#2f6fb3" stroke-width="5.6" stroke-linecap="round"/><text x="699.0" y="477.0" text-anchor="start" font-size="8.5" fill="#6d6650" >ölçüp biçmek</text><line x1="695.0" y1="474.0" x2="764.1" y2="450.3" stroke="#2f6fb3" stroke-width="4.2" stroke-linecap="round"/><text x="768.1" y="453.3" text-anchor="start" font-size="8.5" fill="#6d6650" >yaratmak</text><line x1="764.1" y1="450.3" x2="818.7" y2="466.6" stroke="#2f6fb3" stroke-width="2.8000000000000007" stroke-linecap="round"/><circle cx="818.7" cy="466.6" r="4" fill="#2f6fb3"/><text x="818.7" y="458.6" text-anchor="middle" font-size="9.5" fill="#2f6fb3" font-weight="700">yaratılmış</text><line x1="764.1" y1="450.3" x2="817.9" y2="431.8" stroke="#2f6fb3" stroke-width="2.8000000000000007" stroke-linecap="round"/><text x="821.9" y="434.8" text-anchor="start" font-size="8.5" fill="#6d6650" >yaradılış</text><line x1="817.9" y1="431.8" x2="860.0" y2="417.4" stroke="#2f6fb3" stroke-width="1.5" stroke-linecap="round"/><text x="864.0" y="420.4" text-anchor="start" font-size="8.5" fill="#6d6650" >huy</text><line x1="860.0" y1="417.4" x2="893.2" y2="427.3" stroke="#2f6fb3" stroke-width="1.5" stroke-linecap="round"/><circle cx="893.2" cy="427.3" r="4" fill="#2f6fb3"/><text x="893.2" y="419.3" text-anchor="middle" font-size="9.5" fill="#2f6fb3" font-weight="700">ahlâk</text><line x1="860.0" y1="417.4" x2="892.7" y2="406.2" stroke="#2f6fb3" stroke-width="1.5" stroke-linecap="round"/><circle cx="892.7" cy="406.2" r="4" fill="#2f6fb3"/><text x="892.7" y="398.2" text-anchor="middle" font-size="9.5" fill="#2f6fb3" font-weight="700">öfke</text><line x1="860.0" y1="417.4" x2="880.1" y2="389.2" stroke="#2f6fb3" stroke-width="1.5" stroke-linecap="round"/><circle cx="880.1" cy="389.2" r="4" fill="#2f6fb3"/><text x="880.1" y="381.2" text-anchor="middle" font-size="9.5" fill="#2f6fb3" font-weight="700">huy takınmak</text><line x1="764.1" y1="450.3" x2="797.2" y2="404.0" stroke="#2f6fb3" stroke-width="2.8000000000000007" stroke-linecap="round"/><circle cx="797.2" cy="404.0" r="4" fill="#2f6fb3"/><text x="797.2" y="396.0" text-anchor="middle" font-size="9.5" fill="#2f6fb3" font-weight="700">uydurmak</text><line x1="695.0" y1="474.0" x2="737.5" y2="414.6" stroke="#2c8c7c" stroke-width="4.2" stroke-linecap="round"/><circle cx="737.5" cy="414.6" r="4" fill="#2c8c7c"/><text x="737.5" y="406.6" text-anchor="middle" font-size="9.5" fill="#2c8c7c" font-weight="700">şekli belirmiş</text><line x1="620.0" y1="530.0" x2="648.6" y2="440.9" stroke="#3f8f3a" stroke-width="5.6" stroke-linecap="round"/><text x="652.6" y="443.9" text-anchor="start" font-size="8.5" fill="#6d6650" >düzlemek</text><line x1="648.6" y1="440.9" x2="691.0" y2="381.4" stroke="#3f8f3a" stroke-width="4.2" stroke-linecap="round"/><circle cx="691.0" cy="381.4" r="4" fill="#3f8f3a"/><text x="691.0" y="373.4" text-anchor="middle" font-size="9.5" fill="#3f8f3a" font-weight="700">eskimek</text><line x1="648.6" y1="440.9" x2="648.6" y2="367.9" stroke="#3f8f3a" stroke-width="4.2" stroke-linecap="round"/><circle cx="648.6" cy="367.9" r="4" fill="#3f8f3a"/><text x="648.6" y="359.9" text-anchor="middle" font-size="9.5" fill="#3f8f3a" font-weight="700">koku sürmek</text><line x1="620.0" y1="530.0" x2="591.4" y2="440.9" stroke="#c26a1e" stroke-width="5.6" stroke-linecap="round"/><circle cx="591.4" cy="440.9" r="4" fill="#c26a1e"/><text x="591.4" y="432.9" text-anchor="middle" font-size="9.5" fill="#c26a1e" font-weight="700">pay</text><line x1="620.0" y1="530.0" x2="545.0" y2="474.0" stroke="#a8478f" stroke-width="5.6" stroke-linecap="round"/><circle cx="545.0" cy="474.0" r="4" fill="#a8478f"/><text x="545.0" y="466.0" text-anchor="middle" font-size="9.5" fill="#a8478f" font-weight="700">yakışmak</text><text x="450.0" y="670.0" text-anchor="middle" font-size="11" fill="#2b2410" >Kaideler üst üste işletilince ağaç kendiliğinden büyür; her dal bir kaidenin izidir.</text></svg>