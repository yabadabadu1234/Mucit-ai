<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">127. Sual-cevap (ilmihal usulü): her mana bir suâlin cevabı</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Okuyan suâli okuyup cevabı kapatarak kendini yoklar.</text><text x="60.0" y="90.0" text-anchor="start" font-size="12.5" fill="#b3541e" font-weight="700">Sual: خلق kökünün aslı nedir?</text><text x="90.0" y="114.0" text-anchor="start" font-size="12" fill="#2b2410" >Cevap: Bir şeyi bir maksada göre ölçüp biçerek hazırlamaktır.</text><text x="60.0" y="166.0" text-anchor="start" font-size="12.5" fill="#b3541e" font-weight="700">Sual: Allah&#x27;a niçin Hâlık denir?</text><text x="90.0" y="190.0" text-anchor="start" font-size="12" fill="#2b2410" >Cevap: Her şeyi ölçüsüyle tamamlayıp var ettiği için.</text><text x="60.0" y="242.0" text-anchor="start" font-size="12.5" fill="#b3541e" font-weight="700">Sual: Huy (خُلُق) bu köke nasıl girer?</text><text x="90.0" y="266.0" text-anchor="start" font-size="12" fill="#2b2410" >Cevap: Yaradılışta nefse verilen kalıp, insanın huyu olur.</text><text x="60.0" y="318.0" text-anchor="start" font-size="12.5" fill="#b3541e" font-weight="700">Sual: Ahlâk nedir?</text><text x="90.0" y="342.0" text-anchor="start" font-size="12" fill="#2b2410" >Cevap: Huyların yerleşip bir düzene girmesidir.</text><text x="60.0" y="394.0" text-anchor="start" font-size="12.5" fill="#b3541e" font-weight="700">Sual: Eskimek (خَلِقَ) nereden gelir?</text><text x="90.0" y="418.0" text-anchor="start" font-size="12" fill="#2b2410" >Cevap: Düzlenen yüzey kullanıldıkça aşınır ve eskir.</text><text x="60.0" y="470.0" text-anchor="start" font-size="12.5" fill="#b3541e" font-weight="700">Sual: Uydurmak (اِخْتَلَقَ) niçin bu köktendir?</text><text x="90.0" y="494.0" text-anchor="start" font-size="12" fill="#2b2410" >Cevap: Olmayan sözü var göstermek, yaratmanın sahtesidir.</text><text x="60.0" y="546.0" text-anchor="start" font-size="12.5" fill="#b3541e" font-weight="700">Sual: Kazan (خِلْقِين) da bu kökten mi?</text><text x="90.0" y="570.0" text-anchor="start" font-size="12" fill="#2b2410" >Cevap: Hayır; Yunancadan gelmiştir.</text></svg>