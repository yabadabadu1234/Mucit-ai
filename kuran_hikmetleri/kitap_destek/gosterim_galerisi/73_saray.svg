<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">73. Hafıza sarayı: her dal bir oda, her mana odada bir köşe</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Kırmızı nokta = köşe. Odaların yerleşimi bu levha için yapıldı.</text><rect x="30" y="70" width="280" height="260" fill="#2f6fb3" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="40.0" y="90.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">Ölçüm odası</text><circle cx="50.0" cy="120" r="5" fill="#b3541e"/><text x="60.0" y="124.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">ölçüp biçmek</text><text x="60.0" y="144.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><circle cx="180.0" cy="120" r="5" fill="#b3541e"/><text x="190.0" y="124.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">şekli belirmiş</text><text x="190.0" y="144.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مُخَلَّق سَهْم مُخَلَّق</text><rect x="310" y="70" width="280" height="260" fill="#2f6fb3" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="320.0" y="90.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">Atölye (yaratma)</text><circle cx="330.0" cy="120" r="5" fill="#b3541e"/><text x="340.0" y="124.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">yaratmak</text><text x="340.0" y="144.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ خَلْق</text><circle cx="460.0" cy="120" r="5" fill="#b3541e"/><text x="470.0" y="124.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">uydurmak</text><text x="470.0" y="144.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ تَخَلَّقَ</text><rect x="590" y="70" width="280" height="130" fill="#2f6fb3" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="600.0" y="90.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">Sergi salonu</text><circle cx="610.0" cy="120" r="5" fill="#b3541e"/><text x="620.0" y="124.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">yaratılmış</text><text x="620.0" y="144.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلْق مَخْلُوق</text><rect x="590" y="200" width="280" height="130" fill="#2f6fb3" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="600.0" y="220.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">Kalıphane</text><circle cx="610.0" cy="250" r="5" fill="#b3541e"/><text x="620.0" y="254.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">yaradılış</text><text x="620.0" y="274.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة خِلْقِيّ</text><rect x="30" y="330" width="280" height="300" fill="#3f8f3a" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="40.0" y="350.0" text-anchor="start" font-size="11.5" fill="#3f8f3a" font-weight="700">Avlu (düzleme)</text><circle cx="50.0" cy="380" r="5" fill="#b3541e"/><text x="60.0" y="384.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">düzlemek</text><text x="60.0" y="404.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَق خَلْقَاء</text><circle cx="180.0" cy="380" r="5" fill="#b3541e"/><text x="190.0" y="384.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">şekli belirmiş</text><text x="190.0" y="404.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مُخَلَّق سَهْم مُخَلَّق</text><circle cx="50.0" cy="450" r="5" fill="#b3541e"/><text x="60.0" y="454.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">eskimek</text><text x="60.0" y="474.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْلَوْلَقَ خَلِقَ</text><circle cx="180.0" cy="450" r="5" fill="#b3541e"/><text x="190.0" y="454.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">koku sürmek</text><text x="190.0" y="474.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلُوق مُخَلَّق</text><rect x="310" y="330" width="280" height="300" fill="#2f6fb3" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="320.0" y="350.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">Gönül odası</text><circle cx="330.0" cy="380" r="5" fill="#b3541e"/><text x="340.0" y="384.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">huy</text><text x="340.0" y="404.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيقَة خُلُق</text><circle cx="460.0" cy="380" r="5" fill="#b3541e"/><text x="470.0" y="384.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">ahlâk</text><text x="470.0" y="404.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">أَخْلَاق أَخْلَاقِيّ</text><circle cx="330.0" cy="450" r="5" fill="#b3541e"/><text x="340.0" y="454.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">öfke</text><text x="340.0" y="474.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">تَخَلَّقَ</text><circle cx="460.0" cy="450" r="5" fill="#b3541e"/><text x="470.0" y="454.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">huy takınmak</text><text x="470.0" y="474.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">تَخَلَّقَ</text><rect x="590" y="330" width="140" height="150" fill="#c26a1e" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="600.0" y="350.0" text-anchor="start" font-size="11.5" fill="#c26a1e" font-weight="700">Hazine (pay)</text><circle cx="610.0" cy="380" r="5" fill="#b3541e"/><text x="620.0" y="384.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">pay</text><text x="620.0" y="404.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَاق</text><rect x="730" y="330" width="140" height="150" fill="#a8478f" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="740.0" y="350.0" text-anchor="start" font-size="11.5" fill="#a8478f" font-weight="700">Kapı (yakışma)</text><circle cx="750.0" cy="380" r="5" fill="#b3541e"/><text x="760.0" y="384.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">yakışmak</text><text x="760.0" y="404.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيق أَخْلَق</text><rect x="590" y="480" width="280" height="150" fill="#7a7a7a" fill-opacity=".08" stroke="#2b2410" stroke-width="3"/><text x="600.0" y="500.0" text-anchor="start" font-size="11.5" fill="#7a7a7a" font-weight="700">Mahzen (kök dışı)</text><circle cx="610.0" cy="530" r="5" fill="#b3541e"/><text x="620.0" y="534.0" text-anchor="start" font-size="10" fill="#2b2410" font-weight="700">kök dışı</text><text x="620.0" y="554.0" text-anchor="start" font-size="12" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقِين</text><text x="450.0" y="655.0" text-anchor="middle" font-size="11" fill="#2b2410" >Kapıdan girip odaları sırayla dolaşan kişi, her köşede bir manayı ve kelimesini görür.</text></svg>