<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">41. Kuvvet dinamiği (Talmy): her mana bir kuvvet çekişmesinin neticesi</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Meyiller ve galibiyet bu levha için yorumlandı.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><circle cx="100" cy="160" r="38" fill="#e8c766" stroke="#2b2410" stroke-width="1.5"/><text x="100.0" y="165.0" text-anchor="middle" font-size="14" fill="#2b2410" >●</text><path d="M230,122 A40,40 0 1,0 230,198 A26,40 0 1,1 230,122Z" fill="#9db8d9" stroke="#2b2410" stroke-width="1.5"/><text x="222.0" y="166.0" text-anchor="middle" font-size="16" fill="#2b2410" font-weight="700">+</text><line x1="195" y1="160" x2="145" y2="160" stroke="#b3541e" stroke-width="3" marker-end="url(#o)"/><text x="100.0" y="220.0" text-anchor="middle" font-size="10" fill="#2b2410" >madde (agonist)</text><text x="230.0" y="220.0" text-anchor="middle" font-size="10" fill="#2b2410" >ölçen el (antagonist)</text><text x="160.0" y="242.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >madde kendi hâlinde kalmaya meyleder; el ölçüp</text><text x="160.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#6d6650" > biçer, şekil verir</text><text x="160.0" y="290.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">netice: ölçüp biçmek / yaratmak</text><circle cx="390" cy="160" r="38" fill="#e8c766" stroke="#2b2410" stroke-width="1.5"/><text x="390.0" y="165.0" text-anchor="middle" font-size="14" fill="#2b2410" >●</text><path d="M520,122 A40,40 0 1,0 520,198 A26,40 0 1,1 520,122Z" fill="#9db8d9" stroke="#2b2410" stroke-width="1.5"/><text x="512.0" y="166.0" text-anchor="middle" font-size="16" fill="#2b2410" font-weight="700">+</text><line x1="485" y1="160" x2="435" y2="160" stroke="#b3541e" stroke-width="3" marker-end="url(#o)"/><text x="390.0" y="220.0" text-anchor="middle" font-size="10" fill="#2b2410" >elbise (agonist)</text><text x="520.0" y="220.0" text-anchor="middle" font-size="10" fill="#2b2410" >zaman ve sürtünme</text><text x="450.0" y="242.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >elbise dayanmaya meyleder; sürtünme galip geli</text><text x="450.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >r, yüzü düzleşir</text><text x="450.0" y="290.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">netice: eskimek</text><circle cx="680" cy="160" r="38" fill="#e8c766" stroke="#2b2410" stroke-width="1.5"/><text x="680.0" y="165.0" text-anchor="middle" font-size="14" fill="#2b2410" >●</text><path d="M810,122 A40,40 0 1,0 810,198 A26,40 0 1,1 810,122Z" fill="#9db8d9" stroke="#2b2410" stroke-width="1.5"/><text x="802.0" y="166.0" text-anchor="middle" font-size="16" fill="#2b2410" font-weight="700">+</text><line x1="775" y1="160" x2="725" y2="160" stroke="#b3541e" stroke-width="3" marker-end="url(#o)"/><text x="680.0" y="220.0" text-anchor="middle" font-size="10" fill="#2b2410" >nefis (agonist)</text><text x="810.0" y="220.0" text-anchor="middle" font-size="10" fill="#2b2410" >yaradılıştaki hâl</text><text x="740.0" y="242.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >yaradılış iç hâli nefse yerleştirir, sabit kıl</text><text x="740.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >ar</text><text x="740.0" y="290.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">netice: huy</text><circle cx="100" cy="420" r="38" fill="#e8c766" stroke="#2b2410" stroke-width="1.5"/><text x="100.0" y="425.0" text-anchor="middle" font-size="14" fill="#2b2410" ></text><path d="M230,382 A40,40 0 1,0 230,458 A26,40 0 1,1 230,382Z" fill="#9db8d9" stroke="#2b2410" stroke-width="1.5"/><text x="222.0" y="426.0" text-anchor="middle" font-size="16" fill="#2b2410" font-weight="700">−</text><line x1="195" y1="420" x2="145" y2="420" stroke="#b3541e" stroke-width="3" marker-end="url(#o)"/><text x="100.0" y="480.0" text-anchor="middle" font-size="10" fill="#2b2410" >huy (agonist)</text><text x="230.0" y="480.0" text-anchor="middle" font-size="10" fill="#2b2410" >öfke sebebi</text><text x="160.0" y="502.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >huy dengeye meyleder; sebep galip gelince taşa</text><text x="160.0" y="516.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >r</text><text x="160.0" y="550.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">netice: öfke</text><circle cx="390" cy="420" r="38" fill="#e8c766" stroke="#2b2410" stroke-width="1.5"/><text x="390.0" y="425.0" text-anchor="middle" font-size="14" fill="#2b2410" >●</text><path d="M520,382 A40,40 0 1,0 520,458 A26,40 0 1,1 520,382Z" fill="#9db8d9" stroke="#2b2410" stroke-width="1.5"/><text x="512.0" y="426.0" text-anchor="middle" font-size="16" fill="#2b2410" font-weight="700">−</text><line x1="485" y1="420" x2="435" y2="420" stroke="#b3541e" stroke-width="3" marker-end="url(#o)"/><text x="390.0" y="480.0" text-anchor="middle" font-size="10" fill="#2b2410" >kişi (agonist)</text><text x="520.0" y="480.0" text-anchor="middle" font-size="10" fill="#2b2410" >başkasının huyu</text><text x="450.0" y="502.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >kişi kendi huyunu bırakıp başkasınınkini kendi</text><text x="450.0" y="516.0" text-anchor="middle" font-size="9.5" fill="#6d6650" > gücüyle giyer</text><text x="450.0" y="550.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">netice: huy takınmak</text><circle cx="680" cy="420" r="38" fill="#e8c766" stroke="#2b2410" stroke-width="1.5"/><text x="680.0" y="425.0" text-anchor="middle" font-size="14" fill="#2b2410" >●</text><path d="M810,382 A40,40 0 1,0 810,458 A26,40 0 1,1 810,382Z" fill="#9db8d9" stroke="#2b2410" stroke-width="1.5"/><text x="802.0" y="426.0" text-anchor="middle" font-size="16" fill="#2b2410" font-weight="700">+</text><line x1="775" y1="420" x2="725" y2="420" stroke="#b3541e" stroke-width="3" marker-end="url(#o)"/><text x="680.0" y="480.0" text-anchor="middle" font-size="10" fill="#2b2410" >söz (agonist)</text><text x="810.0" y="480.0" text-anchor="middle" font-size="10" fill="#2b2410" >uyduran</text><text x="740.0" y="502.0" text-anchor="middle" font-size="9.5" fill="#6d6650" >aslı olmayan söz yokluğa meyleder; uyduran onu</text><text x="740.0" y="516.0" text-anchor="middle" font-size="9.5" fill="#6d6650" > var gösterir</text><text x="740.0" y="550.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">netice: uydurmak</text><text x="450.0" y="620.0" text-anchor="middle" font-size="10.5" fill="#2b2410" >Daire = agonist (kendi meylinde duran), yarım ay = antagonist (ona kuvvet veren); + daha güçlü olan, ok kuvvetin yönü.</text></svg>