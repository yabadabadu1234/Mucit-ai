<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">97. Frayer modeli: tarif, vasıflar, misaller, misal olmayanlar</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Misal olmayanlar sınırı çizer; kavram ancak hududuyla öğrenilir.</text><rect x="40" y="80" width="400" height="250" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="240.0" y="106.0" text-anchor="middle" font-size="13" fill="#b3541e" font-weight="700">TARİF</text><text x="240.0" y="150.0" text-anchor="middle" font-size="12" fill="#2b2410" >Bir şeyi bir maksada göre ölçüp biçerek</text><text x="240.0" y="174.0" text-anchor="middle" font-size="12" fill="#2b2410" >hazırlamak; buradan yaratmak doğar.</text><rect x="460" y="80" width="400" height="250" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="660.0" y="106.0" text-anchor="middle" font-size="13" fill="#b3541e" font-weight="700">VASIFLARI</text><text x="660.0" y="150.0" text-anchor="middle" font-size="12" fill="#2b2410" >• bir ölçü vardır</text><text x="660.0" y="174.0" text-anchor="middle" font-size="12" fill="#2b2410" >• bir maksat vardır</text><text x="660.0" y="198.0" text-anchor="middle" font-size="12" fill="#2b2410" >• bir yapan vardır</text><text x="660.0" y="222.0" text-anchor="middle" font-size="12" fill="#2b2410" >• netice bir şekildir</text><rect x="40" y="350" width="400" height="250" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="240.0" y="376.0" text-anchor="middle" font-size="13" fill="#b3541e" font-weight="700">MİSALLER</text><text x="240.0" y="420.0" text-anchor="middle" font-size="12" fill="#2b2410" >terzinin deriyi ölçüp biçmesi</text><text x="240.0" y="444.0" text-anchor="middle" font-size="12" fill="#2b2410" >Allah&#x27;ın gökleri yaratması</text><text x="240.0" y="468.0" text-anchor="middle" font-size="12" fill="#2b2410" >insanın huyu (içe verilen kalıp)</text><rect x="460" y="350" width="400" height="250" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="660.0" y="376.0" text-anchor="middle" font-size="13" fill="#b3541e" font-weight="700">MİSAL OLMAYANLAR</text><text x="660.0" y="420.0" text-anchor="middle" font-size="12" fill="#2b2410" >rastgele dağıtmak</text><text x="660.0" y="444.0" text-anchor="middle" font-size="12" fill="#2b2410" >yıkmak, bozmak</text><text x="660.0" y="468.0" text-anchor="middle" font-size="12" fill="#2b2410" >sözü uydurmak (sahte yaratma)</text><ellipse cx="440" cy="340" rx="110" ry="46" fill="#e8c766" stroke="#2b2410" stroke-width="2"/><text x="440.0" y="350.0" text-anchor="middle" font-size="26" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text></svg>