<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">89. Kıyas çarkı (ortaçağ mantık yazmaları): her dilim bir kıyas</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her mana bir kıyasın neticesi olarak okunur.</text><circle cx="450" cy="350" r="250" fill="none" stroke="#2b2410" stroke-width="1.5"/><circle cx="450" cy="350" r="160" fill="none" stroke="#2b2410" stroke-width="1.5"/><circle cx="450" cy="350" r="70" fill="none" stroke="#2b2410" stroke-width="1.5"/><text x="595.0" y="205.0" text-anchor="middle" font-size="9.5" fill="#2f6fb3" >büyük öncül: Ölçülen</text><text x="595.0" y="217.0" text-anchor="middle" font-size="9.5" fill="#2f6fb3" >her şey hazırlanmıştır</text><text x="531.3" y="268.7" text-anchor="middle" font-size="9.5" fill="#2f6fb3" >küçük: Yaratılan</text><text x="531.3" y="280.7" text-anchor="middle" font-size="9.5" fill="#2f6fb3" >ölçülmüştür</text><text x="662.1" y="133.9" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700">netice: Yaratılan hazırlanmıştır</text><text x="595.0" y="495.0" text-anchor="middle" font-size="9.5" fill="#7a3fb3" >büyük öncül: Yaradılış</text><text x="595.0" y="507.0" text-anchor="middle" font-size="9.5" fill="#7a3fb3" >nefse girerse huy olur</text><text x="531.3" y="431.3" text-anchor="middle" font-size="9.5" fill="#7a3fb3" >küçük: Huy</text><text x="531.3" y="443.3" text-anchor="middle" font-size="9.5" fill="#7a3fb3" >yaradılıştan gelir</text><text x="662.1" y="572.1" text-anchor="middle" font-size="10.5" fill="#7a3fb3" font-weight="700">netice: Huy hazırlanmış bir hâldir</text><text x="305.0" y="495.0" text-anchor="middle" font-size="9.5" fill="#3f8f3a" >büyük öncül: Düzlenen</text><text x="305.0" y="507.0" text-anchor="middle" font-size="9.5" fill="#3f8f3a" >yüzey aşınır</text><text x="368.7" y="431.3" text-anchor="middle" font-size="9.5" fill="#3f8f3a" >küçük: Elbise</text><text x="368.7" y="443.3" text-anchor="middle" font-size="9.5" fill="#3f8f3a" >kullanıldıkça düzlenir</text><text x="237.9" y="572.1" text-anchor="middle" font-size="10.5" fill="#3f8f3a" font-weight="700">netice: Elbise eskir</text><text x="305.0" y="205.0" text-anchor="middle" font-size="9.5" fill="#a8478f" >büyük öncül: İşe uyan</text><text x="305.0" y="217.0" text-anchor="middle" font-size="9.5" fill="#a8478f" >şey lâyıktır</text><text x="368.7" y="268.7" text-anchor="middle" font-size="9.5" fill="#a8478f" >küçük: Ölçülen şey</text><text x="368.7" y="280.7" text-anchor="middle" font-size="9.5" fill="#a8478f" >işine uyar</text><text x="237.9" y="133.9" text-anchor="middle" font-size="10.5" fill="#a8478f" font-weight="700">netice: Ölçülen şey lâyıktır</text><text x="450.0" y="354.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">ESAS</text><text x="450.0" y="650.0" text-anchor="middle" font-size="11" fill="#2b2410" >Dış halka büyük öncül, orta halka küçük öncül, en dışta netice. Çark döndükçe başka bir kıyas okunur.</text></svg>