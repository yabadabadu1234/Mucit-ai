<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">116. Greimas göstergebilim karesi: zıt, çelişik ve gerektiren dört köşe</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Bir mananın neyin karşıtı, neyin inkârı olduğu aynı şekilde görünür.</text><line x1="200" y1="130" x2="700" y2="130" stroke="#c0392b" stroke-width="2"/><text x="450.0" y="124.0" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">zıtlık</text><line x1="200" y1="470" x2="700" y2="470" stroke="#c26a1e" stroke-width="2"/><text x="450.0" y="464.0" text-anchor="middle" font-size="10.5" fill="#c26a1e" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">alt zıtlık</text><line x1="200" y1="130" x2="700" y2="470" stroke="#2b2410" stroke-width="2"/><text x="490.0" y="294.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">çelişki</text><line x1="700" y1="130" x2="200" y2="470" stroke="#2b2410" stroke-width="2"/><text x="450.0" y="294.0" text-anchor="middle" font-size="10.5" fill="#2b2410" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">çelişki</text><line x1="200" y1="470" x2="200" y2="130" stroke="#2f6fb3" stroke-width="2"/><text x="200.0" y="294.0" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">gerektirme</text><line x1="700" y1="470" x2="700" y2="130" stroke="#2f6fb3" stroke-width="2"/><text x="700.0" y="294.0" text-anchor="middle" font-size="10.5" fill="#2f6fb3" font-weight="700" stroke="#fffdf6" stroke-width="3" paint-order="stroke">gerektirme</text><rect x="90" y="100" width="220" height="60" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="200.0" y="124.0" text-anchor="middle" font-size="13" fill="#2b2410" font-weight="700">ÖLÇÜLÜ</text><text x="200.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >yaratılmış, lâyık</text><rect x="590" y="100" width="220" height="60" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="700.0" y="124.0" text-anchor="middle" font-size="13" fill="#2b2410" font-weight="700">BOZUK</text><text x="700.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >eskimiş</text><rect x="90" y="440" width="220" height="60" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="200.0" y="464.0" text-anchor="middle" font-size="13" fill="#2b2410" font-weight="700">BOZUK OLMAYAN</text><text x="200.0" y="484.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >yeni, düz</text><rect x="590" y="440" width="220" height="60" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="700.0" y="464.0" text-anchor="middle" font-size="13" fill="#2b2410" font-weight="700">ÖLÇÜSÜZ</text><text x="700.0" y="484.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >uydurma</text><text x="450.0" y="590.0" text-anchor="middle" font-size="11" fill="#2b2410" >Kökün manaları dört köşeye dağılır; uydurmak, ölçülü yaratmanın çelişiği olarak yerini bulur.</text></svg>