<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">59. Eniyilik tablosu (Optimality Theory): bir yerde hangi mananın kazandığı</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Kaideler ve sırası bu levha için kuruldu.</text><text x="860.0" y="80.0" text-anchor="end" font-size="18" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خُلُق   ←   إِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ</text><rect x="40" y="94" width="770" height="28" fill="#2b2410"/><text x="48.0" y="113.0" text-anchor="start" font-size="11" fill="#fff" font-weight="700">aday mana</text><text x="285.0" y="113.0" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">VEZNE-SADIK</text><text x="435.0" y="113.0" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">BAĞLAMA-UYGUN</text><text x="585.0" y="113.0" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">KÖKE-YAKIN</text><text x="735.0" y="113.0" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">İKTİSAT</text><rect x="40" y="122" width="170" height="30" fill="#fbf6e6" stroke="#e2d9bd"/><rect x="210" y="122" width="150" height="30" fill="#fbf6e6" stroke="#e2d9bd"/><rect x="360" y="122" width="150" height="30" fill="#fbf6e6" stroke="#e2d9bd"/><rect x="510" y="122" width="150" height="30" fill="#fbf6e6" stroke="#e2d9bd"/><rect x="660" y="122" width="150" height="30" fill="#fbf6e6" stroke="#e2d9bd"/><text x="48.0" y="142.0" text-anchor="start" font-size="11" fill="#2b2410" font-weight="700">☞ huy</text><text x="585.0" y="143.0" text-anchor="middle" font-size="14" fill="#b3541e" >*</text><rect x="40" y="152" width="170" height="30" fill="#fff" stroke="#e2d9bd"/><rect x="210" y="152" width="150" height="30" fill="#fff" stroke="#e2d9bd"/><rect x="360" y="152" width="150" height="30" fill="#