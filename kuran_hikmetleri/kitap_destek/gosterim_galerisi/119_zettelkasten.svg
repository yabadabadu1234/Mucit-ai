<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">119. Zettelkasten (Luhmann fiş kutusu): numaralı kartlar ve çapraz göndermeler</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Yeni bir fikir, kendisini doğuran kartın numarasına harf eklenerek yerleşir.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="60" y="90" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="70.0" y="110.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1</text><text x="160.0" y="142.0" text-anchor="middle" font-size="11" fill="#2b2410" >ölçüp biçerek hazırlamak (esas)</text><rect x="60" y="220" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="70.0" y="240.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1a</text><text x="160.0" y="272.0" text-anchor="middle" font-size="11" fill="#2b2410" >ölçmek → yaratmak</text><rect x="60" y="350" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="70.0" y="370.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1a1</text><text x="160.0" y="402.0" text-anchor="middle" font-size="11" fill="#2b2410" >yaratılmış, mahlûk</text><rect x="280" y="350" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="290.0" y="370.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1a2</text><text x="380.0" y="402.0" text-anchor="middle" font-size="11" fill="#2b2410" >yaradılış → huy</text><rect x="280" y="480" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="290.0" y="500.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1a2a</text><text x="380.0" y="532.0" text-anchor="middle" font-size="11" fill="#2b2410" >huy → ahlâk</text><rect x="500" y="220" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="510.0" y="240.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1b</text><text x="600.0" y="272.0" text-anchor="middle" font-size="11" fill="#2b2410" >düzlemek</text><rect x="500" y="350" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="510.0" y="370.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1b1</text><text x="600.0" y="402.0" text-anchor="middle" font-size="11" fill="#2b2410" >eskimek</text><rect x="720" y="350" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="730.0" y="370.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">1b2</text><text x="820.0" y="402.0" text-anchor="middle" font-size="11" fill="#2b2410" >koku sürmek</text><rect x="720" y="90" width="200" height="90" fill="#fffef0" stroke="#2b2410" filter="drop-shadow(2px 3px 2px #0003)"/><text x="730.0" y="110.0" text-anchor="start" font-size="13" fill="#b3541e" font-weight="700">2</text><text x="820.0" y="142.0" text-anchor="middle" font-size="11" fill="#2b2410" >kazan (kök dışı)</text><path d="M480,380 Q490.0,380.0 500,380" stroke="#2f6fb3" stroke-width="1.5" fill="none" stroke-dasharray='5 3' marker-end="url(#o)"/><text x="490.0" y="377.0" text-anchor="middle" font-size="9.5" fill="#b3541e" stroke="#fffdf6" stroke-width="3" paint-order="stroke">bkz: aşınan huy?</text><path d="M920,380 Q490.0,380.0 60,380" stroke="#2f6fb3" stroke-width="1.5" fill="none" stroke-dasharray='5 3' marker-end="url(#o)"/><text x="490.0" y="377.0" text-anchor="middle" font-size="9.5" fill="#b3541e" stroke="#fffdf6" stroke-width="3" paint-order="stroke">bkz: kokulanmış (مُخَلَّق)</text><text x="450.0" y="610.0" text-anchor="middle" font-size="11" fill="#2b2410" >Numara, kartın yerini söyler: 1a2a, 1a2&#x27;nin devamıdır. Kesik ok, ağacın dışından kurulan bağdır.</text></svg>