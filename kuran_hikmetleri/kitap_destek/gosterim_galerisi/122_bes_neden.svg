<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">122. Beş neden: en uzak manadan &quot;neden?&quot; diye sorarak esasa inmek</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Her cevap bir sonraki suâli doğurur.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="150" y="80" width="560" height="56" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="430.0" y="113.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">0. Ahlâk neden bu köktendir?</text><path d="M430,136 Q445.0,153.0 460,170" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="180" y="170" width="560" height="56" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="460.0" y="203.0" text-anchor="middle" font-size="12" fill="#2b2410" >1. Çünkü huyların düzenidir. Huy neden bu köktendir?</text><path d="M460,226 Q475.0,243.0 490,260" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="210" y="260" width="560" height="56" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="490.0" y="293.0" text-anchor="middle" font-size="12" fill="#2b2410" >2. Çünkü yaradılışın nefse vurmasıdır. Yaradılış neden?</text><path d="M490,316 Q505.0,333.0 520,350" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="240" y="350" width="560" height="56" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="520.0" y="383.0" text-anchor="middle" font-size="12" fill="#2b2410" >3. Çünkü yaratılanın kalıbıdır. Yaratmak neden?</text><path d="M520,406 Q535.0,423.0 550,440" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="270" y="440" width="560" height="56" rx="8" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="550.0" y="473.0" text-anchor="middle" font-size="12" fill="#2b2410" >4. Çünkü ölçülen şeyin tamamlanmasıdır. Ölçmek neden?</text><path d="M550,496 Q565.0,513.0 580,530" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="300" y="530" width="560" height="56" rx="8" fill="#f3eedd" stroke="#b8860b" stroke-width="1.6"/><text x="580.0" y="563.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">5. Çünkü hazırlamanın ilk işidir: ESAS</text></svg>