<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">56. İlk sahne (Tyler ve Evans): bütün manalar tek bir beden sahnesinden</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Sahnenin her anı bir manaya dönüşür.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="30" y="80" width="300" height="160" rx="6" fill="#fff" stroke="#b8860b" stroke-width="1.6"/><text x="38.0" y="96.0" text-anchor="start" font-size="10.5" fill="#b8860b" font-weight="700">İLK SAHNE (beden tecrübesi)</text><text x="38.0" y="113.0" text-anchor="start" font-size="10" fill="#2b2410" >deriyi, tahtayı ölçer</text><text x="38.0" y="128.0" text-anchor="start" font-size="10" fill="#2b2410" >keser, düzler</text><text x="38.0" y="143.0" text-anchor="start" font-size="10" fill="#2b2410" >parçayı işe uydurur</text><text x="38.0" y="158.0" text-anchor="start" font-size="10" fill="#2b2410" >ortaya bir eser çıkar</text><text x="38.0" y="173.0" text-anchor="start" font-size="10" fill="#2b2410" >eser zamanla aşınır</text><rect x="520" y="80" width="350" height="62" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.8"/><text x="535.0" y="106.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">ölçmek = tayin etmek</text><text x="860.0" y="130.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلَقَ</text><line x1="330" y1="160" x2="520" y2="111" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><rect x="520" y="156" width="350" height="62" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.8"/><text x="535.0" y="182.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">ortaya çıkan eser = yaratılmış</text><text x="860.0" y="206.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">مَخْلُوق</text><line x1="330" y1="160" x2="520" y2="187" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><rect x="520" y="232" width="350" height="62" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.8"/><text x="535.0" y="258.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">eserin kalıbı = yaradılış</text><text x="860.0" y="282.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خِلْقَة</text><line x1="330" y1="160" x2="520" y2="263" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><rect x="520" y="308" width="350" height="62" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.8"/><text x="535.0" y="334.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">içe verilen kalıp = huy</text><text x="860.0" y="358.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خُلُق</text><line x1="330" y1="160" x2="520" y2="339" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><rect x="520" y="384" width="350" height="62" rx="8" fill="#fff" stroke="#a8478f" stroke-width="1.8"/><text x="535.0" y="410.0" text-anchor="start" font-size="11.5" fill="#a8478f" font-weight="700">işe uymak = lâyık olmak</text><text x="860.0" y="434.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِيق</text><line x1="330" y1="160" x2="520" y2="415" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><rect x="520" y="460" width="350" height="62" rx="8" fill="#fff" stroke="#3f8f3a" stroke-width="1.8"/><text x="535.0" y="486.0" text-anchor="start" font-size="11.5" fill="#3f8f3a" font-weight="700">aşınmak = eskimek</text><text x="860.0" y="510.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">خَلِق</text><line x1="330" y1="160" x2="520" y2="491" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><rect x="520" y="536" width="350" height="62" rx="8" fill="#fff" stroke="#2f6fb3" stroke-width="1.8"/><text x="535.0" y="562.0" text-anchor="start" font-size="11.5" fill="#2f6fb3" font-weight="700">sözde eser yapmak = uydurmak</text><text x="860.0" y="586.0" text-anchor="end" font-size="15" font-family="Amiri, Noto Naskh Arabic, serif" fill="#1a1a1a">اِخْتَلَقَ</text><line x1="330" y1="160" x2="520" y2="567" stroke="#2b2410" stroke-width="1.6" marker-end="url(#o)"/><text x="180.0" y="300.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >Soldaki sahne bir kere görülünce sağdaki mecazlar ayrıca ezberlenmez.</text></svg>