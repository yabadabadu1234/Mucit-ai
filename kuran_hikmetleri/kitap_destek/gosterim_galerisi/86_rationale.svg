<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">86. Rationale gerekçe haritası: öncüller birlikte bir gerekçe kutusunda</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Yeşil = destek, kırmızı = itiraz; itiraza da itiraz edilebilir.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="300" y="70" width="300" height="60" rx="6" fill="#f3eedd" stroke="#2b2410" stroke-width="1.6"/><text x="450.0" y="87.0" text-anchor="middle" font-size="11" fill="#2b2410" font-weight="700">İDDİA</text><text x="450.0" y="104.0" text-anchor="middle" font-size="10" fill="#2b2410" >خلق: ölçüp biçerek hazırlamak esastır</text><rect x="60" y="200" width="240" height="154" rx="8" fill="#3f8f3a" fill-opacity=".08" stroke="#3f8f3a" stroke-width="2"/><text x="180.0" y="218.0" text-anchor="middle" font-size="10.5" fill="#3f8f3a" font-weight="700">GEREKÇE (öncüller birlikte)</text><rect x="72" y="228" width="216" height="52" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="180.0" y="246.0" text-anchor="middle" font-size="10" fill="#2b2410" >Öncül: ölçmek yapmanın ilk</text><text x="180.0" y="259.0" text-anchor="middle" font-size="10" fill="#2b2410" >adımıdır</text><rect x="72" y="290" width="216" height="52" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="180.0" y="308.0" text-anchor="middle" font-size="10" fill="#2b2410" >Öncül: yaratılan ölçülü olur</text><line x1="180" y1="200" x2="450" y2="132" stroke="#3f8f3a" stroke-width="2" marker-end="url(#o)"/><rect x="330" y="200" width="240" height="154" rx="8" fill="#3f8f3a" fill-opacity=".08" stroke="#3f8f3a" stroke-width="2"/><text x="450.0" y="218.0" text-anchor="middle" font-size="10.5" fill="#3f8f3a" font-weight="700">GEREKÇE (öncüller birlikte)</text><rect x="342" y="228" width="216" height="52" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="450.0" y="246.0" text-anchor="middle" font-size="10" fill="#2b2410" >Öncül: düzlemek de hazırlamaktır</text><rect x="342" y="290" width="216" height="52" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="450.0" y="308.0" text-anchor="middle" font-size="10" fill="#2b2410" >Öncül: eskiyen yüzey düzleşir</text><line x1="450" y1="200" x2="450" y2="132" stroke="#3f8f3a" stroke-width="2" marker-end="url(#o)"/><rect x="600" y="200" width="240" height="92" rx="8" fill="#c0392b" fill-opacity=".08" stroke="#c0392b" stroke-width="2"/><text x="720.0" y="218.0" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">İTİRAZ (öncüller birlikte)</text><rect x="612" y="228" width="216" height="52" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.6"/><text x="720.0" y="246.0" text-anchor="middle" font-size="10" fill="#2b2410" >Öncül: koku bir hazırlık bildirmez</text><line x1="720" y1="200" x2="450" y2="132" stroke="#c0392b" stroke-width="2" marker-end="url(#o)"/><rect x="600" y="360" width="240" height="60" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="720.0" y="377.0" text-anchor="middle" font-size="11" fill="#3f8f3a" font-weight="700">İTİRAZA İTİRAZ</text><text x="720.0" y="394.0" text-anchor="middle" font-size="10" fill="#2b2410" >Koku sürmek yüzeyi düzler: B dalına</text><text x="720.0" y="407.0" text-anchor="middle" font-size="10" fill="#2b2410" >girer</text><line x1="720" y1="360" x2="720" y2="294" stroke="#3f8f3a" stroke-width="2" marker-end="url(#o)"/><text x="450.0" y="470.0" text-anchor="middle" font-size="11" fill="#2b2410" >Bir gerekçenin öncülleri tek başına değil, ancak birlikte iddiayı taşır (birleşik gerekçe).</text></svg>