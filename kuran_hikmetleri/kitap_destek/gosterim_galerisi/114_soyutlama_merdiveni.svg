<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">114. Soyutlama merdiveni (Hayakawa): somuttan soyuta basamak basamak</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Aynı kökün manaları elle tutulandan düşünceye doğru dizilir.</text><rect x="180" y="564" width="420" height="44" fill="#7a7a7a" fill-opacity=".15" stroke="#7a7a7a" stroke-width="2"/><text x="390.0" y="592.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">kazandaki koku sürülmüş deri parçası</text><text x="610.0" y="592.0" text-anchor="start" font-size="11" fill="#b3541e" >en somut</text><rect x="220" y="486" width="420" height="44" fill="#2f6fb3" fill-opacity=".15" stroke="#2f6fb3" stroke-width="2"/><text x="430.0" y="514.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">ölçülüp biçilmiş deri</text><rect x="260" y="408" width="420" height="44" fill="#2f6fb3" fill-opacity=".15" stroke="#2f6fb3" stroke-width="2"/><text x="470.0" y="436.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">yaratılmış her şey</text><rect x="300" y="330" width="420" height="44" fill="#2f6fb3" fill-opacity=".15" stroke="#2f6fb3" stroke-width="2"/><text x="510.0" y="358.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">her şeyin yaradılışı, kalıbı</text><rect x="340" y="252" width="420" height="44" fill="#2f6fb3" fill-opacity=".15" stroke="#2f6fb3" stroke-width="2"/><text x="550.0" y="280.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">insanın huyu</text><rect x="380" y="174" width="420" height="44" fill="#2f6fb3" fill-opacity=".15" stroke="#2f6fb3" stroke-width="2"/><text x="590.0" y="202.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">ahlâk ilmi</text><rect x="420" y="96" width="420" heigh