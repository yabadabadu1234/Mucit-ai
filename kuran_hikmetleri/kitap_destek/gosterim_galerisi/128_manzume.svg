<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">128. Manzume (öğretici şiir): kökün bütün manaları altı beyitte</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Klasik eğitimde nahiv, sarf, ferâiz böyle ezberletilirdi.</text><text x="430.0" y="110.0" text-anchor="end" font-size="14" fill="#2b2410" font-style="italic">Halk ölçüp biçmektir, aslı budur,</text><text x="470.0" y="110.0" text-anchor="start" font-size="14" fill="#2b2410" font-style="italic">Hâlık her şeyi ölçüyle kurar.</text><circle cx="450" cy="105" r="3" fill="#b3541e"/><text x="430.0" y="190.0" text-anchor="end" font-size="14" fill="#2b2410" font-style="italic">Ölçülen tamamlanınca mahlûk olur,</text><text x="470.0" y="190.0" text-anchor="start" font-size="14" fill="#2b2410" font-style="italic">Mahlûkun kalıbına hilkat denir.</text><circle cx="450" cy="185" r="3" fill="#b3541e"/><text x="430.0" y="270.0" text-anchor="end" font-size="14" fill="#2b2410" font-style="italic">Hilkat nefse girince huy (hulk) olur,</text><text x="470.0" y="270.0" text-anchor="start" font-size="14" fill="#2b2410" font-style="italic">Huylar çoğalınca ahlâk bilinir.</text><circle cx="450" cy="265" r="3" fill="#b3541e"/><text x="430.0" y="350.0" text-anchor="end" font-size="14" fill="#2b2410" font-style="italic">Düzlenen yüzey aşınır, eskir (halika),</text><text x="470.0" y="350.0" text-anchor="start" font-size="14" fill="#2b2410" font-style="italic">Koku sürülen şey düzlenir.</text><circle cx="450" cy="345" r="3" fill="#b3541e"/><text x="430.0" y="430.0" text-anchor="end" font-size="14" fill="#2b2410" font-style="italic">İşe ayrılan şey pay (halâk) olur,</text><text x="470.0" y="430.0" text-anchor="start" font-size="14" fill="#2b2410" font-style="italic">İşine uyan şeye halîk denir.</text><circle cx="450" cy="425" r="3" fill="#b3541e"/><text x="430.0" y="510.0" text-anchor="end" font-size="14" fill="#2b2410" font-style="italic">Olmayanı var etmek ihtilâktır,</text><text x="470.0" y="510.0" text-anchor="start" font-size="14" fill="#2b2410" font-style="italic">Kazan (hılkîn) yabancıdır, bu köke girmez.</text><circle cx="450" cy="505" r="3" fill="#b3541e"/><text x="450.0" y="610.0" text-anchor="middle" font-size="10.5" fill="#6d6650" >Elfiye ve tuhfe usulü: ilim beyitle öğretilir, ezberlenen beyit manayı taşır. Beyitler bu levha için yazıldı, vezinli değildir.</text></svg>