<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">88. Porphyry ağacı (arbor porphyriana): cins ve fasıl ile ikili bölünme</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Mantık kitaplarının tarif ağacı: en umumîden en hususîye.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="320" y="80" width="260" height="40" rx="6" fill="#f3eedd" stroke="#2b2410"/><text x="450.0" y="105.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">hazırlamak (cins)</text><line x1="450" y1="120" x2="450" y2="210" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><text x="440.0" y="160.0" text-anchor="end" font-size="10.5" fill="#2f6fb3" >fasıl: ölçerek</text><line x1="580" y1="100" x2="700" y2="100" stroke="#2b2410" marker-end="url(#o)"/><text x="640.0" y="92.0" text-anchor="middle" font-size="10" fill="#c26a1e" >fasıl: düzleyerek</text><text x="710.0" y="105.0" text-anchor="start" font-size="11" fill="#2b2410" >→ düzlemek, eskimek, koku</text><rect x="320" y="210" width="260" height="40" rx="6" fill="#f3eedd" stroke="#2b2410"/><text x="450.0" y="235.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">ölçerek hazırlamak</text><line x1="450" y1="250" x2="450" y2="340" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><text x="440.0" y="290.0" text-anchor="end" font-size="10.5" fill="#2f6fb3" >fasıl: tamamlanana dek</text><line x1="580" y1="230" x2="700" y2="230" stroke="#2b2410" marker-end="url(#o)"/><text x="640.0" y="222.0" text-anchor="middle" font-size="10" fill="#c26a1e" >fasıl: bir işe ayırarak</text><text x="710.0" y="235.0" text-anchor="start" font-size="11" fill="#2b2410" >→ pay (C), lâyık (H)</text><rect x="320" y="340" width="260" height="40" rx="6" fill="#f3eedd" stroke="#2b2410"/><text x="450.0" y="365.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">yaratmak</text><line x1="450" y1="380" x2="450" y2="470" stroke="#2b2410" stroke-width="2" marker-end="url(#o)"/><text x="440.0" y="420.0" text-anchor="end" font-size="10.5" fill="#2f6fb3" >fasıl: eşyaya</text><line x1="580" y1="360" x2="700" y2="360" stroke="#2b2410" marker-end="url(#o)"/><text x="640.0" y="352.0" text-anchor="middle" font-size="10" fill="#c26a1e" >fasıl: nefse</text><text x="710.0" y="365.0" text-anchor="start" font-size="11" fill="#2b2410" >→ yaratılmış, yaradılış</text><rect x="320" y="470" width="260" height="40" rx="6" fill="#f3eedd" stroke="#2b2410"/><text x="450.0" y="495.0" text-anchor="middle" font-size="12" fill="#2b2410" font-weight="700">nefse verilen kalıp: huy</text><text x="450.0" y="530.0" text-anchor="middle" font-size="11" fill="#7a3fb3" font-weight="700">fasıl: yerleşmiş → ahlâk   ·   fasıl: taşmış → öfke</text><text x="450.0" y="600.0" text-anchor="middle" font-size="11" fill="#2b2410" >Her basamakta cins ikiye bölünür; bir kol aşağı iner, öteki yana ayrılır.</text></svg>