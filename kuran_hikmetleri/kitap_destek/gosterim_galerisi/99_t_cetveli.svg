<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">99. T-cetveli: yan yana iki şeyin karşılıklı vasıfları</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Aynı satırdaki iki hücre birbirinin karşılığıdır.</text><line x1="450" y1="80" x2="450" y2="600" stroke="#2b2410" stroke-width="3"/><line x1="40" y1="120" x2="860" y2="120" stroke="#2b2410" stroke-width="3"/><text x="245.0" y="108.0" text-anchor="middle" font-size="13" fill="#2f6fb3" font-weight="700">خَلْق  (fethalı): DIŞTAKİ ŞEKİL</text><text x="655.0" y="108.0" text-anchor="middle" font-size="13" fill="#7a3fb3" font-weight="700">خُلُق  (ötreli): İÇTEKİ ŞEKİL</text><text x="245.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >göze görünen suret</text><text x="655.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >göze görünmeyen huy</text><text x="245.0" y="220.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >bedenin yaradılışı</text><text x="655.0" y="220.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >nefsin yaradılışı</text><text x="245.0" y="280.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >ölçü dışta belli</text><text x="655.0" y="280.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >ölçü davranışta belli</text><text x="245.0" y="340.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >güzelliği: hüsn-i halk</text><text x="655.0" y="340.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >güzelliği: hüsn-i hulk</text><text x="245.0" y="400.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >çoğulu: خَلَائِق</text><text x="655.0" y="400.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >çoğulu: أَخْلَاق</text><text x="245.0" y="460.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >ilmi: anatomi, tabiat</text><text x="655.0" y="460.0" text-anchor="middle" font-size="12.5" fill="#2b2410" >ilmi: ahlâk</text></svg>