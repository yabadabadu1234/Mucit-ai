<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Inter, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fffdf6"/><text x="18" y="30" font-size="19" font-weight="700" fill="#2b2410">108. Karar ağacı: bir kelimenin manasını sorulara cevap vererek bulmak</text><text x="18" y="50" font-size="11.5" fill="#6d6650">Hareke ve fâile göre dallanır.</text><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b2410"/></marker></defs><rect x="330" y="70" width="240" height="40" rx="6" fill="#fff" stroke="#2b2410" stroke-width="1.6"/><text x="450.0" y="88.0" text-anchor="middle" font-size="10" fill="#2b2410" >Fiilin ortasındaki hareke?</text><path d="M450,110 Q300.0,140.0 150,170" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="40" y="170" width="220" height="64" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.6"/><text x="150.0" y="187.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">fetha: خَلَقَ</text><text x="150.0" y="204.0" text-anchor="middle" font-size="10" fill="#2b2410" >Mef&#x27;ûlü var mı?</text><path d="M150,234 Q115.0,282.0 80,330" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="115.0" y="279.0" text-anchor="middle" font-size="9.5" fill="#b3541e" stroke="#fffdf6" stroke-width="3" paint-order="stroke">var</text><rect x="20" y="330" width="120" height="50" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="80.0" y="348.0" text-anchor="middle" font-size="10" fill="#2b2410" >yarattı / ölçtü</text><path d="M150,234 Q185.0,282.0 220,330" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="185.0" y="279.0" text-anchor="middle" font-size="9.5" fill="#b3541e" stroke="#fffdf6" stroke-width="3" paint-order="stroke">ifti&#x27;âl babında</text><rect x="160" y="330" width="120" height="50" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="220.0" y="348.0" text-anchor="middle" font-size="10" fill="#2b2410" >uydurdu</text><path d="M450,110 Q450.0,140.0 450,170" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="340" y="170" width="220" height="64" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.6"/><text x="450.0" y="187.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">esre: خَلِقَ</text><text x="450.0" y="204.0" text-anchor="middle" font-size="10" fill="#2b2410" >fâil elbise mi?</text><path d="M450,234 Q415.0,282.0 380,330" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="415.0" y="279.0" text-anchor="middle" font-size="9.5" fill="#b3541e" stroke="#fffdf6" stroke-width="3" paint-order="stroke">evet</text><rect x="320" y="330" width="120" height="50" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="380.0" y="348.0" text-anchor="middle" font-size="10" fill="#2b2410" >eskidi</text><path d="M450,110 Q600.0,140.0 750,170" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><rect x="640" y="170" width="220" height="64" rx="6" fill="#fff" stroke="#2f6fb3" stroke-width="1.6"/><text x="750.0" y="187.0" text-anchor="middle" font-size="11" fill="#2f6fb3" font-weight="700">ötre: خَلُقَ</text><text x="750.0" y="204.0" text-anchor="middle" font-size="10" fill="#2b2410" >fâil kimse mi?</text><path d="M750,234 Q715.0,282.0 680,330" stroke="#2b2410" stroke-width="1.5" fill="none"  marker-end="url(#o)"/><text x="715.0" y="279.0" text-anchor="middle" font-size="9.5" fill="#b3541e" stroke="#fffdf6" stroke-width="3" paint-order="stroke">evet</text><rect x="620" y="330" width="120" height="50" rx="6" fill="#fff" stroke="#3f8f3a" stroke-width="1.6"/><text x="680.0" y="348.0" text-anchor="middle" font-size="10" fill="#2b2410" >yaraştı, lâyık oldu</text><text x="450.0" y="450.0" text-anchor="middle" font-size="11" fill="#2b2410" >Okuyan, kelimeyi gördüğünde ağacı yukarıdan aşağı izler ve tek bir yaprağa varır.</text></svg>