<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kavram Uzayı</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><style>
:root{--zemin:#fbf8ef;--yazi:#2b2410;--ince:#8a7f62}@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--zemin:#1d1b16;--yazi:#eee6cf;--ince:#a99f83}}
body{margin:0;background:var(--zemin);color:var(--yazi);font-family:Georgia,serif}#lej{padding:8px 16px;font-size:13px;display:flex;flex-wrap:wrap;gap:12px}

.k text{font-family:Amiri,serif;font-size:10px;fill:var(--yazi)}.kad{font-size:15px;font-weight:bold;text-anchor:middle;fill:var(--yazi);paint-order:stroke;stroke:var(--zemin);stroke-width:4;pointer-events:none}
.bo{fill:none;stroke:var(--ince);stroke-dasharray:3 3;stroke-width:.8}#bil{position:fixed;right:12px;top:44px;max-width:300px;background:var(--zemin);border:1px solid var(--ince);padding:8px;font-size:13px;display:none}
.cz{stroke:#b8860b;stroke-width:1.5}</style></head><body><div id="lej"><span><i style="background:#b3541e"></i>canlı ve beden</span><span><i style="background:#2f6fb3"></i>cisim ve eşya</span><span><i style="background:#3f7f3a"></i>fiil ve hadise</span><span><i style="background:#8a3fa0"></i>his ve nefis</span><span><i style="background:#b8860b"></i>hâl ve vasıf</span><span><i style="background:#2c8c7c"></i>insan ve toplum</span><span><i style="background:#a0304a"></i>söz ve haber</span><span><i style="background:#5a6b2a"></i>tabiat</span><span><i style="background:#6d5bd0"></i>tasnifsiz</span><span><i style="background:#c06a00"></i>zihin ve ilim</span><span><i style="background:#777"></i>ölçü, mekân ve zaman</span><span style="color:var(--ince)">· her kök bir hücre · kalın sınır: kavram uzayı · ince sınır: mana bölgesi · köke dokun: en yakın dört kök</span></div>
