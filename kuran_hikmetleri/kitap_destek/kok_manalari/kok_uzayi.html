er onlar «İşittik, itaat ettik, dinle ve bizi gözet» deselerdi şüphesiz kendileri için daha hayırlı ve daha doğru olacaktı; fakat küfürleri (gerçeği kabul etmemeleri) sebebiyle Allah onları lânetlemiştir. Artık pek az inanırlar.","4:47":"Ey ehl-i kitap! Biz, birtakım yüzleri silip dümdüz ederek arkalarına çevirmeden, yahut onları, cumartesi adamları gibi lânetlemeden önce (davranarak), size gelenleri doğrulamak üzere indirdiğimize (Kitab’a) iman edin; Allah’ın emri mutlaka yerine gelecektir.","4:49":"Kendilerini temize çıkaranlara ne dersin! Hayır, Allah dilediğini temize çıkarır ve hiç kimse kıl payı kadar haksızlık görmez.","4:51":"Kendilerine Kitap’tan nasip verilenleri görmedin mi? Putlara ve bâtıla (tanrılara) iman ediyorlar, sonra da kâfirler için: «Bunlar, Allah’a iman edenlerden daha doğru yoldadır» diyorlar!","4:53":"Yoksa onların mülkten (hükümranlıktan) bir nasipleri mi var? Öyle olsaydı insanlara çekirdek filizi (kadar bir şey bile) vermezlerdi.","4:56":"Şüphesiz âyetlerimizi inkâr edenleri gün gelecek bir ateşe sokacağız; onların derileri pişip acı duymaz hale geldikçe, derilerini başka derilerle değiştiririz ki acıyı duysunlar! Allah daima üstün ve hakîmdir.","4:60":"Sana indirilene ve senden önce indirilenlere inandıklarını ileri sürenleri görmedin mi? Tâğut’a inanmamaları kendilerine emrolunduğu halde, Tâğut’un önünde muhakemeleşmek istiyorlar. Halbuki şeytan onları büsbütün saptırmak istiyor.","4:62":"Elleriyle yaptıkları yüzünden başlarına bir felâket gelince hemen, biz yalnızca iyilik etmek ve arayı bulmak istedik, diye yemin ederek sana nasıl gelirler!","4:65":"Hayır, Rabbine andolsun ki aralarında çıkan anlaşmazlık hususunda seni hakem kılıp sonra da verdiğin hükümden içlerinde hiçbir sıkıntı duymaksızın (onu) tam manasıyla kabullenmedikçe iman etmiş olmazlar.","4:69":"Kim Allah’a ve Resûl’e itaat ederse işte onlar, Allah’ın kendilerine lütuflarda bulunduğu peygamberler, sıddîkler, şehidler ve salih kişilerle beraberdir. Bunlar ne güzel arkadaştır!","4:71":"Ey iman edenler! Tedbirinizi alın; bölük bölük savaşa çıkın, yahut (gerektiğinde) topyekün savaşın.","4:72":"İçinizden bazıları vardır ki (cihad konusunda) pek ağırdan alırlar. Eğer size bir felâket erişirse: «Allah bana lütfetti de onlarla beraber bulunmadım» der.","4:73":"Eğer Allah’tan size bir lütuf erişirse -sanki sizinle onun arasında (zahirî) bir dostluk yokmuş gibi- «Keşke onlarla beraber olsaydım da ben de büyük bir başarı kazansaydım!» der.","4:78":"Nerede olursanız olun ölüm size ulaşır; sarp ve sağlam kalelerde olsanız bile! Kendilerine bir iyilik dokunsa «Bu Allah’tan» derler; başlarına bir kötülük gelince de «Bu senden» derler. «Hepsi Allah’tandır» de. Bu adamlara ne oluyor ki bir türlü laf anlamıyorlar!","4:83":"Onlara güven veya korkuya dair bir haber gelince hemen onu yayarlar; halbuki onu, Resûl’e veya aralarında yetki sahibi kimselere götürselerdi, onların arasından işin içyüzünü anlayanlar, onun ne olduğunu bilirlerdi. Allah’ın size lütuf ve rahmeti olmasaydı, pek azınız müstesna, şeytana uyup giderdiniz.","4:84":"Artık Allah yolunda savaş. Sen, kendinden başkası (sebebiyle) sorumlu tutulmazsın. Müminleri de teşvik et. Umulur ki Allah kâfirlerin gücünü kırar (güçleriyle size zarar vermelerini önler). Allah’ın gücü daha çetin ve cezası daha şiddetlidir.","4:85":"Kim iyi bir işe aracılık ederse onun da o işten bir nasibi olur. Kim kötü bir işe aracılık ederse onun da ondan bir payı olur. Allah her şeyin karşılığını vericidir.","4:88":"Size ne oldu da münafıklar hakkında iki gruba ayrıldınız? Halbuki Allah onları kendi ettikleri yüzünden baş aşağı etmiştir (küfürlerine döndürmüştür). Allah’ın saptırdığını doğru yola getirmek mi istiyorsunuz? Allah’ın saptırdığı kimse için asla (doğruya) yol bulamazsın!","4:92":"Yanlışlıkla olması dışında bir müminin bir mümini öldürmeye hakkı olamaz. Yanlışlıkla bir mümini öldüren kimsenin, mümin bir köle azat etmesi ve ölenin ailesine teslim edilecek bir diyet vermesi gereklidir. Meğer ki ölünün ailesi o diyeti bağışlamış ola. (Bu takdirde diyet vermez). Eğer öldürülen mümin olduğu halde, size düşman olan bir toplumdan ise mümin bir köle azat etmek lâzımdır. Eğer kendileriyle aranızda antlaşma bulunan bir toplumdan ise ailesine teslim edilecek bir diyet ve bir mümin köleyi azat etmek gerekir. Bunları bulamayan kimsenin, Allah tarafından tevbesinin kabulü için iki ay peşpeşe oruç tutması lâzımdır. Allah her şeyi bilendir, hikmet sahibidir.","4:93":"Kim bir mümini kasden öldürürse cezası, içinde ebediyen kalacağı cehennemdir. Allah ona gazap etmiş, onu lânetlemiş ve onun için büyük bir azap hazırlamıştır.","4:94":"Ey iman edenler! Allah yolunda savaşa çıktığınız zaman iyi anlayıp dinleyin. Size selam verene, dünya hayatının geçici menfaatine göz dikerek «Sen mümin değilsin» demeyin. Çünkü Allah’ın nezdinde sayısız ganimetler vardır. Önceden siz de böyle iken Allah size lütfetti; o halde iyi anlayıp dinleyin. Şüphesiz Allah bütün yaptıklarınızdan haberdardır.","4:100":"Allah yolunda hicret eden kimse yeryüzünde gidecek bir çok güzel yer ve bolluk (imkân) bulur. Kim Allah ve Resûlü uğrunda hicret ederek evinden çıkar da sonra kendisine ölüm yetişirse artık onun mükâfatı Allah’a düşer. Allah da çok bağışlayıcı ve esirgeyicidir.","4:101":"Yeryüzünde sefere çıktığınız zaman kâfirlerin size kötülük etmelerinden endişe ederseniz, namazı kısaltmanızda size bir günah yoktur. Şüphesiz kâfirler, sizin apaçık düşmanınızdır.","4:102":"Sen de içlerinde bulunup onlara namaz kıldırdığın zaman, onlardan bir kısmı seninle beraber namaza dursunlar, silahlarını (yanlarına) alsınlar, böylece (namazı kılıp) secde ettiklerinde (diğerleri) arkanızda olsunlar. Sonra henüz namazını kılmamış olan (bu) diğer gurup gelip seninle beraber namazlarını kılsınlar ve onlar da ihtiyat tedbirlerini ve silahlarını alsınlar. O kâfirler arzu ederler ki siz silahlarınızdan ve eşyanızdan gafil olsanız da üstünüze birden baskın yapsalar. Eğer size yağmurdan bir eziyet olur yahut hasta bulunursanız silahlarınızı bırakmanızda size günah yoktur. Yine de tedbirinizi alın. Şüphesiz Allah, kâfirler için alçaltıcı bir azap hazırlamıştır.","4:112":"Kim kasıtlı veya kasıtsız bir günah kazanır da sonra onu bir suçsuzun üzerine atarsa, muhakkak ki, büyük bir iftira ve apaçık bir günah yüklenmiş olur.","4:117":"Onlar (müşrikler) O’nu bırakıp yalnızca bir takım dişilerden (dişi isimli tanrılardan) istiyorlar, ancak inatçı şeytandan dilekte bulunuyorlar.","4:119":"«Onları mutlaka saptıracağım, muhakkak onları boş kuruntulara boğacağım, kesinlikle onlara emredeceğim de hayvanların kulaklarını yaracaklar (putlar için nişanlayacaklar), şüphesiz onlara emredeceğim de Allah’ın yarattığını değiştirecekler» (dedi). Kim Allah’ı bırakır da şeytanı dost edinirse elbette apaçık bir ziyana düşmüştür.","4:121":"İşte onların yeri cehennemdir; ondan kaçıp kurtulacak bir yer de bulamayacaklardır.","4:128":"Eğer bir kadın kocasının geçimsizliğinden yahut kendisinden yüz çevirmesinden endişe ederse, aralarında bir sulh yapmalarında onlara günah yoktur. Sulh (daima) hayırlıdır. Zaten nefisler kıskançlığa hazırdır. Eğer iyi geçinir ve Allah’tan korkarsanız şüphesiz Allah yaptıklarınızdan haberdardır.","4:129":"Üzerine düşüp uğraşsanız da kadınlar arasında âdil davranmaya güç yetiremezsiniz; bâri birisine tamamen kapılıp da diğerini askıya alınmış gibi bırakmayın. Eğer arayı düzeltir, günahtan sakınırsanız Allah şüphesiz çok bağışlayıcı ve esirgeyicidir.","4:140":"O (Allah), Kitap’ta size şöyle indirmiştir ki: Allah’ın âyetlerinin inkâr edildiğini yahut onlarla alay edildiğini işittiğiniz zaman, onlar bundan başka bir söze dalıncaya (konuya geçinceye) kadar kâfirlerle beraber oturmayın; yoksa siz de onlar gibi olursunuz. Elbette Allah, münafıkları ve kâfirleri cehennemde bir araya getirecektir.","4:141":"Sizi gözetleyip duranlar, eğer size Allah’tan bir zafer (nasib) olursa, «Sizinle beraber değil miydik?» derler. Kâfirlerin (zaferden) bir nasipleri olursa (bu sefer de onlara), «Sizi yenip (öldürebileceğimiz halde öldürmeyip) müminlerden korumadık mı?» derler. Artık Allah kıyamet gününde aranızda hükmedecektir ve kâfirler için müminler aleyhine asla bir yol vermeyecektir.","4:142":"Şüphesiz münafıklar Allah’a oyun etmeye kalkışıyorlar; halbuki Allah onların oyunlarını başlarına çevirmektedir. Onlar namaza kalktıkları zaman üşenerek kalkarlar, insanlara gösteriş yaparlar, Allah’ı da pek az hatıra getirirler.","4:143":"Bunların arasında bocalayıp durmaktalar; ne onlara (bağlanıyorlar) ne bunlara. Allah’ın şaşırttığı kimseye asla bir (çıkar) yol bulamazsın.","4:145":"Şüphe yok ki münafıklar cehennemin en alt katındadırlar. Artık onlara asla bir yardımcı bulamazsın.","4:155":"Sözlerinden dönmeleri, Allah’ın âyetlerini inkâr etmeleri, haksız yere peygamberleri öldürmeleri ve «Kalplerimiz kılıflanmıştır» demeleri sebebiyle (onları lânetledik, türlü belâlar verdik. Onların kalpleri kılıflı değildir;) tam aksine küfürleri sebebiyle Allah o kalpler üzerine mühür vurmuştur; pek azı müstesna artık iman etmezler.","4:157":"Ve «Allah elçisi Meryem oğlu İsa’yı öldürdük» demeleri yüzünden (onları lânetledik). Halbuki onu ne öldürdüler, ne de astılar; fakat (öldürdükleri) onlara İsa gibi gösterildi. Onun hakkında ihtilâfa düşenler bundan dolayı tam bir kararsızlık içindedirler; bu hususta zanna uymak dışında hiçbir (sağlam) bilgileri yoktur ve kesin olarak onu öldürmediler.","4:163":"Biz Nuh’a ve ondan sonraki peygamberlere vahyettiğimiz gibi sana da vahyettik. Ve (nitekim) İbrahim’e, İsmail’e, İshak’a, Yakub’a, esbâta (torunlara), İsa’ya, Eyyûb’e, Yunus’a, Harun’a ve Süleyman’a vahyettik. Davud’a da Zebûr’u verdik.","4:168":"İnkâr edip zulmedenleri Allah asla bağışlayacak değildir. Onları (başka) bir yola iletecek de değildir.","4:171":"Ey ehl-i kitap! Dininizde aşırı gitmeyin ve Allah hakkında, gerçekten başkasını söylemeyin. Meryem oğlu İsa Mesîh, ancak Allah’ın resûlüdür, (o) Allah’ın, Meryem’e ulaştırdığı «kün: Ol» kelimesi(nin eseri)dir, O’ndan bir ruhtur. (O’nun tarafından gönderilmiş, yahut teyit edilmiş, yahut da Cebrail tarafından üfürülmüş bir ruhtur). Şu halde Allah’a ve peygamberlerine iman edin. «(Tanrı) üçtür» demeyin, sizin için hayırlı olmak üzere bundan vazgeçin. Allah ancak bir tek Allah’tır. O, çocuğu olmaktan münezzehtir. Göklerde ve yerde ne varsa hepsi O’nundur. Vekil olarak Allah yeter.","4:172":"Ne Mesîh ve ne de Allah’a yakın melekler, Allah’ın kulu olmaktan geri dururlar. O’na kulluktan geri durup büyüklenen kimselerin hepsini (Allah) yakında huzuruna toplayacaktır.","5:1":"Ey iman edenler! Akitleri(n gereğini) yerine getiriniz. İhramlı iken avlanmayı helal saymamak üzere (aşağıda) size okunacaklar dışında kalan hayvanlar, sizin için helâl kılındı. Allah dilediğine hükmeder.","5:2":"Ey iman edenler! Allah’ın (koyduğu, dinî) işaretlerine, haram aya, (Allah’a hediye edilmiş) kurbana, (ondaki) gerdanlıklara, Rablerinin lütuf ve rızasını arayarak Beyt-i Haram’a yönelmiş kimselere (tecavüz ve) saygısızlık etmeyin. İhramdan çıkınca avlanabilirsiniz. Mescid-i Haram’a girmenizi önledikleri için bir topluma karşı beslediğiniz kin sizi tecavüze sevketmesin! İyilik ve (Allah’ın yasaklarından) sakınma üzerinde yardımlaşın, günah ve düşmanlık üzerine yardımlaşmayın. Allah’tan korkun; çünkü Allah’ın cezası çetindir.","5:3":"Leş, kan, domuz eti, Allah’tan başkası adına boğazlanan, boğulmuş, (taş, ağaç vb. ile) vurulup öldürülmüş, yukarıdan yuvarlanıp ölmüş, boynuzlanıp ölmüş (hayvanlar ile) canavarların yediği hayvanlar -ölmeden yetişip kestikleriniz müstesna- dikili taşlar (putlar) üzerine boğazlanmış hayvanlar ve fal oklarıyle kısmet aramanız size haram kılındı. Bunlar yoldan çıkmaktır. Bugün kâfirler, sizin dininizden (onu yok etmekten) ümit kesmişlerdir. Artık onlardan korkmayın, benden korkun. Bugün size dininizi ikmal ettim, üzerinize nimetimi tamamladım ve sizin için din olarak İslâm’ı beğendim. Kim, gönülden günaha yönelmiş olmamak üzere açlık halinde dara düşerse (haram etlerden yiyebilir). Çünkü Allah çok bağışlayıcı ve esirgeyicidir.","5:4":"Kendileri için nelerin helâl kılındığını sana soruyorlar; de ki: Bütün iyi ve temiz şeyler size helâl kılınmıştır. Allah’ın size öğrettiğinden öğretip avcı hale getirdiğiniz hayvanların sizin için yakaladıklarından da yeyin ve üzerine Allah’ın adını anın (besmele çekin). Allah’tan korkun. Allah’ın hesabı pek çabuktur.","5:6":"Ey iman edenler! Namaz kılmaya kalktığınız zaman yüzlerinizi, dirseklerinize kadar ellerinizi yıkayın; başlarınızı meshedip, topuklara kadar ayaklarınızı da (yıkayın). Eğer cünüp oldunuz ise, boy abdesti alın. Hasta, yahut yolculuk halinde bulunursanız, yahut biriniz tuvaletten gelirse, yahut da kadınlara dokunmuşsanız (cinsî birleşme yapmışsanız) ve bu hallerde su bulamamışsanız temiz toprakla teyemmüm edin de yüzünüzü ve (dirseklere kadar) ellerinizi onunla meshedin. Allah size herhangi bir güçlük çıkarmak istemez; fakat sizi tertemiz kılmak ve size (ihsan ettiği) nimetini tamamlamak ister; umulur ki şükredersiniz.","5:12":"Andolsun ki Allah, İsrailoğullarından söz almıştı. (Kefil olarak) içlerinden on iki de başkan göndermiştik. Allah onlara şöyle demişti: Ben sizinle beraberim. Eğer namazı dosdoğru kılar, zekâtı verir, peygamberlerime inanır, onları desteklerseniz ve Allah’a güzel borç verirseniz (ihtiyacı olanlara Allah rızası için faizsiz borç verirseniz) andolsun ki sizin günahlarınızı örterim ve sizi, zemininden ırmaklar akan cennetlere sokarım. Bundan sonra sizden kim inkâr yolunu tutarsa doğru yoldan sapmış olur.","5:14":"«Biz hıristiyanlarız» diyenlerden de kesin sözlerini almıştık ama onlar da kendilerine zikredilen (verilen öğütlerin veya Kitab’ın) önemli bir bölümünü unuttular. Bu sebeple kıyamete kadar aralarına düşmanlık ve kin saldık. Yakında Allah onlara yaptıklarını haber verecektir.","5:19":"Ey ehl-i kitap! Peygamberlerin arası kesildiği bir sırada size elçimiz geldi. Gerçekleri size açıklıyor ki (kıyamette): «Bize bir müjdeleyici ve uyarıcı gelmedi» demiyesiniz. İşte size müjdeleyici ve uyarıcı gelmiştir. Allah her şeye hakkıyle kadirdir.","5:22":"Onlar şu cevabı verdiler: Yâ Musa! Orada zorba bir toplum var; onlar oradan çıkmadıkça biz oraya asla girmeyeceğiz. Eğer oradan çıkarlarsa biz de hemen gireriz.","5:26":"Allah, «Öyleyse orası (arz-ı mukaddes) onlara kırk yıl yasaklanmıştır; (bu müddet içinde) yeryüzünde şaşkın şaşkın dolaşacaklar. Artık sen, yoldan çıkmış toplum için üzülme» dedi.","5:31":"Derken Allah, kardeşinin cesedini nasıl gömeceğini ona göstermek için yeri eşeleyen bir karga gönderdi. (Katil kardeş) «Yazıklar olsun bana! Şu karga kadar da olamadım mı ki, kardeşimin cesedini gömeyim» dedi ve ettiğine yananlardan oldu.","5:33":"Allah ve Resûlüne karşı savaşanların ve yeryüzünde (hak) düzeni bozmaya çalışanların cezası ancak ya (acımadan) öldürülmeleri, ya asılmaları, yahut el ve ayaklarının çaprazlama kesilmesi, yahut da bulundukları yerden sürülmeleridir. Bu onların dünyadaki rüsvaylığıdır. Onlar için ahirette de büyük azap vardır.","5:35":"Ey iman edenler! Allah’tan korkun. O’na yaklaşmaya yol arayın ve yolunda cihad edin ki kurtuluşa eresiniz.","5:38":"Hırsızlık eden erkek ve kadının, yaptıklarına karşılık bir ceza ve Allah’tan bir ibret olmak üzere ellerini kesin. Allah izzet ve hikmet sahibidir.","5:42":"Hep yalana kulak verir, durmadan haram yerler. Sana gelirlerse, ister aralarında hüküm ver, ister onlardan yüz çevir. Eğer onlardan yüz çevirirsen sana hiçbir zarar veremezler. Ve eğer hüküm verirsen, aralarında adaletle hükmet. Allah âdil olanları sever.","5:44":"Biz, içinde doğruya rehberlik ve nur olduğu halde Tevrat’ı indirdik. Kendilerini (Allah’a) vermiş peygamberler onunla yahudilere hükmederlerdi. Allah’ın Kitab’ını korumaları kendilerinden istendiği için Rablerine teslim olmuş zâhidler ve bilginler de (onunla hükmederlerdi). Hepsi ona (hak olduğuna) şahitlerdi. Şu halde (Ey yahudiler ve hakimler!) İnsanlardan korkmayın, benden korkun. Âyetlerimi az bir bedel karşılığında satmayın. Kim Allah’ın indirdiği (hükümler) ile hükmetmezse işte onlar kâfirlerin ta kendileridir.","5:45":"Tevrat’ta onlara şöyle yazdık: Cana can, göze göz, buruna burun, kulağa kulak, dişe diş (karşılık ve cezadır). Yaralar da kısastır (Her yaralama misli ile cezalandırılır). Kim bunu (kısası) bağışlarsa kendisi için o keffâret olur. Kim Allah’ın indirdiği ile hükmetmezse işte onlar zalimlerdir.","5:46":"Kendinden önce gelen Tevrat’ı doğrulayıcı olarak peygamberlerin izleri üzerine, Meryem oğlu İsa’yı arkalarından gönderdik. Ve ona, içinde doğruya rehberlik ve nûr bulunmak, önündeki Tevrat’ı tasdik etmek, sakınanlara bir hidayet ve öğüt olmak üzere İncil’i verdik.","5:48":"Sana da, daha önceki kitabı doğrulamak ve onu korumak üzere hak olarak Kitab’ı (Kur’an’ı) gönderdik. Artık aralarında Allah’ın indirdiği ile hükmet; sana gelen gerçeği bırakıp da onların arzularına uyma. (Ey ümmetler!) Her birinize bir şerîat ve bir yol verdik. Allah dileseydi sizleri bir tek ümmet yapardı; fakat size verdiğinde (yol ve şerîatlerde) sizi denemek için (böyle yaptı). Öyleyse iyi işlerde birbirinizle yarışın. Hepinizin dönüşü Allah’adır. Artık size, üzerinde ayrılığa düştüğünüz şeyleri(n gerçek tarafını) O haber verecektir.","5:54":"Ey iman edenler! Sizden kim dininden dönerse (bilsin ki) Allah, sevdiği ve kendisini seven müminlere karşı alçak gönüllü (şefkatli), kâfirlere karşı onurlu ve zorlu bir toplum getirecektir. (Bunlar) Allah yolunda cihad ederler ve hiçbir kınayanın kınamasından korkmazlar (hiçbir kimsenin kınamasına aldırmazlar). Bu, Allah’ın, dilediğine verdiği lütfudur. Allah’ın lütfu ve ilmi geniştir.","5:56":"Kim Allah’ı, Resûlünü ve iman edenleri dost edinirse (bilsin ki) üstün gelecek olanlar şüphesiz Allah’ın tarafını tutanlardır.","5:57":"Ey iman edenler! Sizden önce kendilerine Kitap verilenlerden dininizi alay ve oyun konusu edinenleri ve kâfirleri dost edinmeyin. Allah’tan korkun; eğer müminler iseniz.","5:64":"Yahudiler, Allah’ın eli bağlıdır (sıkıdır) , dediler. Hay dedikleri yüzünden elleri bağlanası ve lânet olasılar! Bilâkis, Allah’ın elleri açıktır, dilediği gibi verir. Andolsun ki sana Rabbinden indirilen, onlardan çoğunun azgınlığını ve küfrünü arttırır. Aralarına, kıyamete kadar (sürecek) düşmanlık ve kin soktuk. Ne zaman savaş için bir ateş yakmışlarsa (fitneyi uyandırmışlarsa) Allah onu söndürmüştür. Onlar yeryüzünde bozgunculuğa koşarlar; Allah ise bozguncuları sevmez.","5:66":"Eğer onlar Tevrat’ı, İncil’i ve Rablerinden onlara indirileni (Kur’an’ı) doğru dürüst uygulasalardı, şüphesiz hem üstlerinden, hem de ayaklarının altından yerlerdi (yeraltı ve yerüstü servetlerinden istifade ederek refah içinde yaşarlardı). Onlardan aşırılığa kaçmayan (iktisatlı, mutedil) bir zümre vardır; fakat çoğunun yaptıkları ne kötüdür!","5:75":"Meryem oğlu Mesîh ancak bir resûldür. Ondan önce de (birçok) resûller gelip geçmiştir. Anası da çok doğru bir kadındır. Her ikisi de yemek yerlerdi. Bak, onlara delilleri nasıl açıklıyoruz, sonra bak nasıl (haktan) yüz çeviriyorlar.","5:82":"İnsanlar içerisinde iman edenlere düşmanlık bakımından en şiddetli olarak yahudiler ile, şirk koşanları bulacaksın. Onlar içinde iman edenlere sevgi bakımından en yakın olarak da «Biz hıristiyanlarız» diyenleri bulacaksın. Çünkü onların içinde keşişler ve râhipler vardır ve onlar büyüklük taslamazlar.","5:83":"Resûle indirileni duydukları zaman, tanış çıktıkları gerçekten dolayı gözlerinden yaşlar boşandığını görürsün. Derler ki: «Rabbimiz! İman ettik, bizi (hakka) şahit olanlarla beraber yaz.»","5:90":"Ey iman edenler! Şarap, kumar, dikili taşlar (putlar), fal ve şans okları birer şeytan işi pisliktir; bunlardan uzak durun ki kurtuluşa eresiniz.","5:94":"Ey iman edenler! Allah sizi ellerinizin ve mızraklarınızın erişeceği bir avlanma ile (onu yasak ederek) dener ki gizlide (kimsenin görmediği yerde, gerçekten) kendisinden kimin korktuğu ortaya çıksın. Kim bundan sonra sınırı aşarsa onun için acı bir azap vardır.","5:103":"Allah bahîra, sâibe, vasîle ve hâm diye bir şey (meşru) kılmamıştır. Fakat kâfirler, yalan yere Allah’a iftira etmektedirler ve onların çoğunun da kafaları çalışmaz.","5:106":"Ey iman edenler! Birinize ölüm gelip çatınca vasiyet esnasında içinizden iki adalet sahibi kişi aranızda şahitlik etsin. Yahut seferde iken başınıza ölüm musibeti gelmişse sizden olmayan, başka iki kişi (şahit olsun). Eğer şüpheye düşerseniz o iki şahidi namazdan sonra alıkorsunuz; «Bu vasiyet karşılığında hiçbir şeyi satın almayacağız, akraba (menfaatine) de olsa; Allah (için yaptığımız) şahitliği gizlemiyeceğiz, (aksini yaparsak) bu takdirde biz elbette günahkârlardan oluruz» diye Allah üzerine yemin ederler.","5:107":"Bu şahitlerin (sonradan yalan söyleyerek) bir günah kazandıkları anlaşılırsa, (şahitlerin) haklarına tecavüz ettiği ölüye daha yakın olan (mirasçılardan) iki kişi onların yerini alır ve «Andolsun ki bizim şahitliğimiz onların şahitliğinden daha gerçektir ve biz (kimsenin hakkına) tecavüz etmedik, aksi takdirde biz, elbette zalimlerden oluruz» diye Allah’a yemin ederler.","5:112":"Hani havârîler «Ey Meryem oğlu İsa, Rabbin bize gökten, donatılmış bir sofra indirebilir mi?» demişlerdi. O, «Îman etmiş kimseler iseniz Allah’tan korkun» cevabını vermişti.","6:6":"Görmediler mi ki, onlardan önce yeryüzünde size vermediğimiz bütün imkânları kendilerine verdiğimiz, gökten üzerlerine bol bol yağmurlar indirip evlerinin altından ırmaklar akıttığımız nice nesilleri helâk ettik. Biz onları, günahları sebebiyle helâk ettik ve onların ardından başka nesiller yarattık.","6:7":"Eğer sana kâğıt üzerine yazılmış bir kitap indirseydik de onlar elleriyle onu tutmuş olsalardı, yine de inkâr ediciler: Bu, apaçık büyüden başka bir şey değildir, derlerdi.","6:10":"Senden önceki peygamberlerle de alay edilmiş, bu yüzden onlarla alay edenleri alay ettikleri şey (azap) kuşatıvermişti.","6:14":"De ki: Gökleri ve yeri yoktan var eden, yedirdiği halde yedirilmeyen Allah’tan başkasını mı dost edineceğim! De ki: Bana müslüman olanların ilki olmam emredildi ve sakın müşriklerden olma! (denildi).","6:17":"Eğer Allah seni bir zarara uğratırsa, onu kendisinden başka giderecek yoktur. Ve eğer sana bir hayır verirse, (bunu da geri alacak yoktur). Şüphesiz O herşeye kadirdir.","6:18":"O, kullarının üstünde her türlü tasarrufa sahiptir. O, hüküm ve hikmet sahibidir, herşeyden haberdardır.","6:25":"Onlardan seni (okuduğun Kur’an’ı) dinleyenler de vardır. Fakat onu anlamalarına engel olmak için kalplerinin üstüne perdeler, kulaklarına da ağırlık verdik. Onlar her türlü mucizeyi görseler bile yine de ona inanmazlar. Hatta o kâfirler sana geldiklerinde: «Bu Kur’an eskilerin masallarından başka bir şey değildir» diyerek seninle tartışırlar.","6:26":"Onlar, hem insanları Peygamber’e yaklaşmaktan vazgeçirmeye çalışırlar, hem de kendileri ondan uzaklaşırlar. Oysa onlar farkında olmadan ancak kendilerini helak ederler.","6:27":"Onların ateşin karşısında durdurulup «Ah, keşke dünyaya geri gönderilsek de bir daha Rabbimizin âyetlerini yalanlamasak ve inananlardan olsak!» dediklerini bir görsen!..","6:31":"Allah’ın huzuruna çıkmayı yalanlayanlar gerçekten ziyana uğramıştır. Nihayet onlara Kıyamet vakti ansızın gelip çatınca, onlar, günahlarını sırtlarına yüklenerek diyecekler ki: «Dünyada iyi amelleri terketmemizden dolayı vah bize!» Dikkat edin, yüklendikleri şey ne kötüdür!","6:32":"Dünya hayatı bir oyun ve eğlenceden başka bir şey değildir. Müttakî olanlar için ahiret yurdu muhakkak ki daha hayırlıdır. Hâla akıl erdiremiyor musunuz?","6:33":"Onların söylediklerinin hakikaten seni üzmekte olduğunu biliyoruz. Aslında onlar seni yalanlamıyorlar, fakat o zalimler açıkça Allah’ın âyetlerini inkâr ediyorlar.","6:42":"Andolsun ki, senden önceki ümmetlere de elçiler gönderdik. Ardından boyun eğsinler diye onları darlık ve hastalıklara uğrattık.","6:44":"Kendilerine yapılan uyarıları unuttuklarında, (indirmiş olduğumuz sıkıntı ve musibetleri kaldırıp) üzerlerine her şeyin kapılarını açtık. Nihayet kendilerine verilenler yüzünden şımardıkları zaman onları ansızın yakaladık, birdenbire onlar bütün ümitlerini yitirdiler.","6:46":"De ki: Ne dersiniz; eğer Allah kulaklarınızı sağır, gözlerinizi kör eder, kalplerinizi de mühürlerse bunları size Allah’tan başka hangi tanrı geri verebilir! Bak, delilleri nasıl açıklıyoruz. Onlar hâla yüz çeviriyorlar!","6:50":"De ki: Ben size, Allah’ın hazineleri benim yanımdadır, demiyorum. Ben gaybı da bilmem. Size, ben bir meleğim de demiyorum. Ben, sadece bana vahyolunana uyarım. De ki: Kör ile gören hiç bir olur mu? Hiç düşünmez misiniz?","6:52":"Rablerinin rızasını isteyerek sabah akşam O’na yalvaranları kovma! Onların hesabından sana bir sorumluluk; senin hesabından da onlara herhangi bir sorumluluk yoktur ki bunları kovup da zalimlerden olasın!","6:59":"Gaybın anahtarları Allah’ın yanındadır; onları O’ndan başkası bilmez. O, karada ve denizde ne varsa bilir; O’nun ilmi dışında bir yaprak bile düşmez. O yerin karanlıkları içindeki tek bir taneyi dahi bilir. Yaş ve kuru ne varsa hepsi apaçık bir kitaptadır.","6:64":"De ki: Ondan ve bütün sıkıntılardan sizi Allah kurtarır. Sonra siz yine O’na ortak koşarsınız.","6:65":"De ki: «Allah’ın size üstünüzden (gökten) veya ayaklarınızın altından (yerden) bir azap göndermeğe ya da birbirinize düşürüp kiminize kiminizin hıncını tattırmaya gücü yeter.» Bak, anlasınlar diye âyetlerimizi nasıl açıklıyoruz!","6:70":"Dinlerini bir oyuncak ve bir eğlence edinen ve dünya hayatının aldattığı kimseleri (bir tarafa) bırak! Kazandıkları sebebiyle hiçbir nefsin felâkete dûçar olmaması için Kur’an ile nasihat et. O nefis için Allah’tan başka ne dost vardır, ne de şefaatçı. O, bütün varını fidye olarak verse, yine de ondan kabul edilmez. Onlar kazandıkları (günahlar) yüzünden helâke sürüklenmiş kimselerdir. İnkâr ettiklerinden dolayı onlar için kaynar sudan ibaret bir içecek ve elem verici bir azap vardır.","6:71":"De ki: Allah’ı bırakıp da bize fayda veya zarar veremeyecek olan şeylere mi tapalım? Allah bizi doğru yola ilettikten sonra şeytanların saptırıp şaşkın olarak çöle düşürmek istedikleri, arkadaşlarının ise: «Bize gel!» diye doğru yola çağırdıkları şaşkın kimse gibi gerisin geri (inkârcılığa) mı döndürüleceğiz? De ki: Allah’ın hidayeti doğru yolun ta kendisidir. Bize âlemlerin Rabbine teslim olmamız emredilmiştir.","6:74":"İbrahim, babası Âzer’e: Birtakım putları tanrılar mı ediniyorsun? Doğrusu ben seni de kavmini de apaçık bir sapıklık içinde görüyorum, demişti.","6:76":"Gecenin karanlığı onu kaplayınca bir yıldız gördü, Rabbim budur, dedi. Yıldız batınca, batanları sevmem, dedi.","6:77":"Ay’ı doğarken görünce, Rabbim budur, dedi. O da batınca, Rabbim bana doğru yolu göstermezse elbette yoldan sapan topluluklardan olurum, dedi.","6:84":"Biz O’na İshak ve (İshak’ın oğlu) Yakub’u da armağan ettik; hepsini de doğru yola ilettik. Daha önce de Nuh’u ve O’nun soyundan Davud’u, Süleyman’ı, Eyyub’u, Yusuf’u, Musa’yı ve Harun’u doğru yola iletmiştik; Biz iyi davrananları işte böyle mükâfatlandırırız.","6:85":"Zekeriyya, Yahya, İsa ve İlyas’ı da (doğru yola iletmiştik). Hepsi de iyilerden idi.","6:86":"İsmail, Elyesa’, Yunus ve Lût’u da (hidayete erdirdik). Hepsini âlemlere üstün kıldık.","6:90":"İşte o peygamberler Allah’ın hidayet ettiği kimselerdir. Sen de onların yoluna uy. De ki: Ben buna (peygamberlik görevime) karşılık sizden bir ücret istemiyorum. Bu (Kur’an) âlemler için ancak bir öğüttür.","6:93":"Allah’a karşı yalan uydurandan yahut kendisine hiçbir şey vahyedilmemişken «Bana da vahyolundu» diyenden ve «Ben de Allah’ın indirdiği âyetlerin benzerini indireceğim» diyenden daha zalim kim vardır! O zalimler, ölümün (boğucu) dalgaları içinde, melekler de pençelerini uzatmış, onlara: «Haydi canlarınızı kurtarın! Allah’a karşı gerçek olmayanı söylemenizden ve O’nun âyetlerine karşı kibirlilik taslamış olmanızdan ötürü, bugün alçaklık azabı ile cezalandırılacaksınız!» derken onların halini bir görsen!","6:94":"Andolsun ki, sizi ilk defa yarattığımız gibi teker teker bize geleceksiniz ve (dünyada) size verdiğimiz şeyleri arkanızda bırakacaksınız. Yaratılışınızda ortaklarımız sandığınız şefaatçılarınızı da yanınızda göremeyeceğiz. Andolsun, aranız açılmış ve (tanrı) sandığınız şeyler sizden kaybolup gitmiştir.","6:95":"Şüphesiz Allah, tohumu ve çekirdeği çatlatandır, ölüden diriyi çıkaran, diriden de ölüyü çıkarandır. İşte Allah budur. O halde (haktan) nasıl dönersiniz!","6:97":"O, kara ve denizin karanlıklarında kendileri ile yol bulasınız diye sizin için yıldızları yaratandır. Gerçekten biz, bilen bir toplum için âyetleri geniş geniş açıkladık.","6:98":"O, sizi bir tek nefisten (Âdem’den) yaratandır. (Sizin için) bir kalma yeri, bir de emanet olarak konulacağınız yer vardır. Anlayan bir toplum için âyetleri ayrıntılı bir şekilde açıkladık.","6:99":"O, gökten su indirendir. İşte biz her çeşit bitkiyi onunla bitirdik. O bitkiden de kendisinde üstüste binmiş taneler bitireceğimiz bir yeşillik; hurmanın tomurcuğundan sarkan salkımlar; üzüm bağları; bir kısmı birbirine benzeyen, bir kısmı da benzemeyen zeytin ve nar bahçeleri meydana getirdik. Meyve verirken ve olgunlaştığı zaman her birinin meyvesine bakın! Kuşkusuz bütün bunlarda inanan bir toplum için ibretler vardır.","6:100":"Cinleri Allah’a ortak koştular. Oysa ki onları da Allah yaratmıştı. Bilgisizce O’na oğullar ve kızlar yakıştırdılar. Hâşâ! O, onların ileri sürdüğü vasıflardan uzak ve yücedir.","6:103":"Gözler O’nu göremez; halbuki O, gözleri görür. O, eşyayı pek iyi bilen, her şeyden haberdar olandır.","6:110":"Yine O’na iman etmedikleri ilk durumdaki gibi onların gönüllerini ve gözlerini ters çeviririz. Ve onları şaşkın olarak azgınlıkları içerisinde bırakırız.","6:112":"Böylece biz, her peygambere insan ve cin şeytanlarını düşman kıldık. (Bunlar), aldatmak için birbirlerine yaldızlı sözler fısıldarlar. Rabbin dileseydi onu da yapamazlardı. Artık onları uydurdukları şeylerle başbaşa bırak.","6:113":"Âhirete inanmayanların kalpleri ona (yaldızlı söze) kansın, ondan hoşlansınlar ve işledikleri suçu işlemeye devam etsinler diye (böyle yaparlar).","6:116":"Yeryüzünde bulunanların çoğuna uyacak olursan, seni Allah’ın yolundan saptırırlar. Onlar zandan başka bir şeye tâbi olmaz, yalandan başka söz de söylemezler.","6:125":"Allah kimi doğru yola iletmek isterse onun kalbini İslâm’a açar; kimi de saptırmak isterse göğe çıkıyormuş gibi kalbini iyice daraltır. Allah inanmayanların üstüne işte böyle murdarlık verir.","6:136":"Allah’ın yarattığı ekinlerle hayvanlardan Allah’a pay ayırıp zanlarınca, bu Allah’a, bu da ortaklarımıza (putlarımıza) dediler. Ortakları için ayrılan Allah’a ulaşmıyor, fakat Allah için ayrılan ortaklarına ulaşıyor! Ne kötü hüküm veriyorlar?","6:141":"Çardaklı ve çardaksız (üzüm) bahçeleri, ürünleri çeşit çeşit hurmaları, ekinleri, birbirine benzer ve benzemez biçimde zeytin ve narları yaratan O’dur. Herbiri meyve verdiği zaman meyvesinden yeyin. Devşirilip toplandığı gün de hakkını (zekât ve sadakasını) verin, fakat israf etmeyin; çünkü Allah israf edenleri sevmez.","6:143":"(Dişi ve erkek olarak) sekiz eş yarattı: Koyundan iki, keçiden iki... De ki: O, bunların erkeklerini mi, dişilerini mi, yoksa bu iki dişinin rahimlerinde bulunan yavruları mı haram etti? Eğer doğru iseniz bana ilimle söyleyin.","6:144":"Deveden de iki, sığırdan da iki (yarattı.) De ki: O bunların erkeklerini mi, dişilerini mi, yoksa bu iki dişinin rahimlerinde bulunan yavruları mı haram kıldı? Yoksa Allah’ın size böyle vasiyet ettiğine şahit mi oldunuz? Bilgisizce insanları saptırmak için Allah’a karşı yalan uydurandan kim daha zalimdir! Şüphesiz Allah o zalimler topluluğunu doğru yola iletmez.","6:146":"Yahudilere bütün tırnaklı hayvanları haram kıldık. Sırtlarında yahut bağırsaklarında taşıdıkları ya da kemiğe karışan yağlar hariç olmak üzere sığır ve koyunun iç yağlarını da onlara haram kıldık. Bu, zulümleri yüzünden onlara verdiğimiz cezâdır. Biz elbette doğru söyleyeniz.","6:150":"De ki: Allah şunu yasak etti, diye şehadet edecek şahitlerinizi getirin! Eğer onlar şahitlik ederlerse, sen onlarla beraber şahitlik etme; âyetlerimizi yalanlayanların ve ahiret gününe inanmayanların arzularına uyma. Onlar, Rablerine eş tutuyorlar.","6:151":"De ki: Gelin Rabbinizin size neleri haram kıldığını okuyayım: O’na hiçbir şeyi ortak koşmayın, ana-babaya iyilik edin, fakirlik korkusuyla çocuklarınızı öldürmeyin -sizin de onların da rızkını biz veririz-; kötülüklerin açığına da gizlisine de yaklaşmayın ve Allah’ın yasakladığı cana haksız yere kıymayın! İşte bunlar Allah’ın size emrettikleridir. Umulur ki düşünüp anlarsınız.","6:152":"Rüşd çağına erişinceye kadar, yetimin malına, sadece en iyi tutumla yaklaşın; ölçü ve tartıyı adaletle yapın. Biz herkese ancak gücünün yettiği kadarını yükleriz. Söz söylediğiniz zaman, yakınlarınız dahi olsa adaletli olun, Allah’a verdiğiniz sözü tutun. İşte Allah size, iyice düşünesiniz diye bunları emretti.","7:1":"Elif. Lâm. Mîm. Sâd.","7:4":"Nice memleketler var ki biz onları helâk ettik. Azabımız onlara geceleyin yahut gündüz istirahat ederlerken geldi.","7:10":"Doğrusu biz sizi yeryüzüne yerleştirdik ve orada size geçim vasıtaları verdik. Ne kadar da az şükrediyorsunuz!","7:18":"Allah buyurdu: Haydi, yerilmiş ve kovulmuş olarak oradan çık! Andolsun ki, onlardan kim sana uyarsa, sizin hepinizi cehenneme dolduracağım!","7:20":"Derken şeytan, birbirine kapalı ayıp yerlerini kendilerine göstermek için onlara vesvese verdi ve: Rabbiniz size bu ağacı sırf melek olursunuz veya ebedî kalanlardan olursunuz diye yasakladı, dedi.","7:21":"Ve onlara: Ben gerçekten size öğüt verenlerdenim, diye yemin etti.","7:22":"Böylece onları hile ile aldattı. Ağacın meyvesini tattıklarında ayıp yerleri kendilerine göründü. Ve cennet yapraklarından üzerlerini örtmeye başladılar. Rableri onlara: Ben size o ağacı yasaklamadım mı ve şeytan size apaçık bir düşmandır, demedim mi? diye nidâ etti.","7:26":"Ey Âdem oğulları! Size ayıp yerlerinizi örtecek giysi, süslenecek elbise yarattık. Takvâ elbisesi... İşte o daha hayırlıdır. Bunlar Allah’ın âyetlerindendir. Belki düşünüp öğüt alırlar (diye onları indirdi).","7:29":"De ki: Rabbim adaleti emretti. Her secde ettiğinizde yüzlerinizi O’na çevirin ve dini yalnız Allah’a has kılarak O’na yalvarın. İlkin sizi yarattığı gibi (yine O’na) döneceksiniz.","7:40":"Bizim âyetlerimizi yalanlayıp da onlara karşı kibirlenmek isteyenler var ya, işte onlara gök kapıları açılmayacak ve onlar, deve iğne deliğine girinceye kadar cennete giremiyeceklerdir! Suçluları işte böyle cezalandırırız!","7:44":"Cennet ehli cehennem ehline: Biz Rabbimizin bize vadettiğini gerçek bulduk, siz de Rabbinizin size vadettiğini gerçek buldunuz mu? diye seslenir. «Evet!» derler. Ve aralarından bir çağrıcı, Allah’ın lâneti zalimlerin üzerine olsun! diye bağırır.","7:46":"İki taraf (cennetlikler ve cehennemlikler) arasında bir perde ve A’râf üzerinde de herkesi simalarından tanıyan adamlar vardır ki, bunlar henüz cennete giremedikleri halde (girmeyi) umarak cennet ehline: «Selâm size!» diye seslenirler.","7:54":"Şüphesiz ki Rabbiniz, gökleri ve yeri altı günde yaratan, sonra Arş’a istivâ eden, geceyi, durmadan kendisini kovalayan gündüze bürüyüp örten; güneşi, ayı ve yıldızları emrine boyun eğmiş durumda yaratan Allah’tır. Bilesiniz ki, yaratmak da emretmek de O’na mahsustur. Âlemlerin Rabbi Allah ne yücedir!","7:57":"Rüzgârları rahmetinin önünde müjde olarak gönderen O’dur. Sonunda onlar (o rüzgârlar), ağır bulutları yüklenince onu ölü bir memlekete sevkederiz. Orada suyu indirir ve onunla türlü türlü meyveler çıkarırız. İşte ölüleri de böyle çıkaracağız. Her halde bundan ibret alırsınız.","7:58":"Rabbinin izniyle güzel memleketin bitkisi (güzel) çıkar; kötü olandan ise faydasız bitkiden başka birşey çıkmaz. İşte biz, şükreden bir kavim için âyetleri böyle açıklıyoruz.","7:73":"Semûd kavmine de kardeşleri Salih’i (gönderdik). Dedi ki: Ey kavmim! Allah’a kulluk edin; sizin O’ndan başka tanrınız yoktur. Size Rabbinizden açık bir delil gelmiştir. O da, size bir mucize olarak Allah’ın şu devesidir. Onu bırakın, Allah’ın arzında yesin, (içsin); ona kötülük etmeyin; sonra sizi elem verici bir azap yakalar.","7:74":"Düşünün ki, (Allah) Âd kavminden sonra yerlerine sizi getirdi. Ve yeryüzünde sizi yerleştirdi: Onun düzlüklerinde saraylar yapıyorsunuz, dağlarında evler yontuyorsunuz. Artık Allah’ın nimetlerini hatırlayın da yeryüzünde fesatçılar olarak karışıklık çıkarmayın.","7:77":"Derken o dişi deveyi ayaklarını keserek öldürdüler ve Rablerinin emrinden dışarı çıktılar da: Ey Salih! Eğer sen gerçekten peygamberlerdensen bizi tehdit ettiğin azabı bize getir, dediler.","7:78":"Bunun üzerine onları o (gürültülü) sarsıntı yakaladı da yurtlarında diz üstü dona kaldılar.","7:83":"Biz de onu ve karısından başka aile efradını kurtardık; çünkü karısı geride kalanlardan (kâfirlerden) idi.","7:85":"Medyen’e de kardeşleri Şuayb’ı (gönderdik). Dedi ki: Ey kavmim! Allah’a kulluk edin, sizin ondan başka tanrınız yoktur. Size Rabbinizden açık bir delil gelmiştir; artık ölçüyü, tartıyı tam yapın, insanların eşyalarını eksik vermeyin. Düzeltilmesinden sonra yeryüzünde bozgunculuk yapmayın. Eğer inananlar iseniz bunlar sizin için daha hayırlıdır.","7:98":"Ya da o ülkelerin halkı kuşluk vakti eğlenirlerken kendilerine azabımızın gelmeyeceğinden emin mi oldular?","7:107":"Bunun üzerine Musa asasını yere attı. O hemen apaçık bir ejderha oluverdi!","7:111":"(111-112) Dediler ki: Onu da kardeşini de beklet; şehirlere toplayıcılar (memurlar) yolla. Bütün bilgili sihirbazları sana getirsinler.","7:117":"Biz de Musa’ya, «Asanı at!» diye vahyettik. Bir de baktılar ki bu, onların uydurduklarını yakalayıp yutuyor.","7:132":"Ve dediler ki: «Bizi sihirlemek için ne mucize getirirsen getir, biz sana inanacak değiliz.»","7:133":"Biz de ayrı ayrı mucizeler olarak onların üzerine tufan, çekirge, haşere, kurbağalar ve kan gönderdik; yine de büyüklük tasladılar ve günahkâr bir kavim oldular.","7:135":"Biz, ulaşacakları bir müddete kadar onlardan azabı kaldırınca hemen sözlerinden dönüverdiler.","7:137":"Hor görülüp ezilmekte olan o kavmi (yahudileri) de, içini bereketle doldurduğumuz yerin doğu taraflarına ve batı taraflarına mirasçı kıldık. Sabırlarına karşılık Rabbinin İsrailoğullarına verdiği güzel söz yerine geldi. Firavun ve kavminin yapmakta olduklarını ve yetiştirdikleri bahçeleri helâk ettik.","7:139":"Şüphesiz bunların içinde bulundukları (din) yıkılmıştır, yapmakta oldukları da bâtıldır.","7:143":"Musa tayin ettiğimiz vakitte (Tûr’a) gelip de Rabbi onunla konuşunca «Rabbim! Bana (kendini) göster; seni göreyim!» dedi. (Rabbi): «Sen beni asla göremezsin. Fakat şu dağa bak, eğer o yerinde durabilirse sen de beni göreceksin!» buyurdu. Rabbi o dağa tecelli edince onu paramparça etti, Musa da baygın düştü. Ayılınca dedi ki: Seni noksan sıfatlardan tenzih ederim, sana tevbe ettim. Ben inananların ilkiyim.","7:145":"Nasihat ve her şeyin açıklamasına dair ne varsa hepsini Musa için levhalarda yazdık. (Ve dedik ki): Bunları kuvvetle tut, kavmine de onun en güzelini almalarını emret. Yakında size, yoldan çıkmışların yurdunu göstereceğim.","7:148":"(Tûr’a giden) Musa’nın arkasından kavmi, zinet takımlarından, böğürebilen bir buzağı heykelini (tanrı) edindiler. Görmediler mi ki o, onlarla ne konuşuyor ne de onlara yol gösteriyor? Onu (tanrı olarak) benimsediler ve zalimler oldular.","7:150":"Musa, kızgın ve üzgün bir halde kavmine dönünce: «Benden sonra arkamdan ne kötü işler yapmışsınız! Rabbinizin emrini (beklemeyip) acele mi ettiniz?» dedi. Tevrat levhalarını yere attı ve kardeşinin (Harun’un) başını tutup kendine doğru çekmeye başladı. (Kardeşi): «Anam oğlu! Bu kavim beni cidden zayıf gördüler ve nerede ise beni öldüreceklerdi. Sen de düşmanları bana güldürme ve beni bu zalim kavimle beraber tutma!» dedi.","7:154":"Musa’nın öfkesi dinince levhaları aldı. Onlardaki yazıda Rablerinden korkanlar için hidayet ve rahmet (haberi) vardı.","7:160":"Biz İsrailoğullarını oymaklar halinde oniki kabileye ayırdık. Kavmi kendisinden su isteyince, Musa’ya, «Asanı taşa vur!» diye vahyettik. Derhal ondan oniki pınar fışkırdı. Her kabile içeceği yeri belledi. Sonra üzerlerine bulutla gölge yaptık, onlara kudret helvası ve bıldırcın eti indirdik. (Onlara dedik ki) «Size verdiğimiz rızıkların temizlerinden yeyin.» Ama onlar (emirlerimizi dinlememekle) bize değil kendilerine zulmediyorlardı.","7:163":"Onlara, deniz kıyısında bulunan şehir halkının durumunu sor. Hani onlar cumartesi gününe saygısızlık gösterip haddi aşıyorlardı. Çünkü cumartesi tatili yaptıkları gün, balıklar meydana çıkarak akın akın onlara gelirdi, cumartesi tatili yapmadıkları gün de gelmezlerdi. İşte böylece biz, yoldan çıkmalarından dolayı onları imtihan ediyorduk.","7:164":"İçlerinden bir topluluk: «Allah’ın helâk edeceği yahut şiddetli bir şekilde azap edeceği bir kavme ne diye öğüt veriyorsunuz?» dedi. (Öğüt verenler) dediler ki: Rabbinize mazeret beyan edelim diye bir de sakınırlar ümidiyle (öğüt veriyoruz).","7:171":"Bir zamanlar dağı İsrailoğullarının üzerine gölge gibi kaldırdık da üstlerine düşecek sandılar. «Size verdiğimi (Kitab’ı) kuvvetle tutun ve içinde olanı hatırlayın ki korunasınız» dedik.","7:175":"Onlara (yahudilere), kendisine âyetlerimizden verdiğimiz ve fakat onlardan sıyrılıp çıkan, o yüzden de şeytanın takibine uğrayan ve sonunda azgınlardan olan kimsenin haberini oku.","7:176":"Dileseydik elbette onu bu âyetler sayesinde yükseltirdik. Fakat o, dünyaya saplandı ve hevesinin peşine düştü. Onun durumu tıpkı köpeğin durumuna benzer: Üstüne varsan da dilini çıkarıp solur, bıraksan da dilini sarkıtıp solur. İşte âyetlerimizi yalanlayan kavmin durumu böyledir. Kıssayı anlat; belki düşünürler.","7:180":"En güzel isimler (el-esmâü’l-hüsnâ) Allah’ındır. O halde O’na o güzel isimlerle dua edin. Onun isimleri hakkında eğri yola gidenleri bırakın. Onlar yapmakta olduklarının cezasına çarptırılacaklardır.","7:183":"Onlara mühlet veririm; (ama) benim cezam çetindir.","7:187":"Sana kıyameti, ne zaman gelip çatacağını soruyorlar. De ki: Onun ilmi ancak Rabbimin katındadır. Onun vaktini O’ndan başkası açıklayamaz. O göklere de yere de ağır gelmiştir. O size ansızın gelecektir. Sanki sen onu biliyormuşsun gibi sana soruyorlar. De ki: Onun bilgisi ancak Allah’ın katındadır; ama insanların çoğu bilmezler.","7:193":"Onları doğru yola çağırırsanız size uymazlar; onları çağırsanız da, sukût etseniz de sizin için birdir.","7:195":"Onların yürüyecekleri ayakları mı var, yoksa tutacakları elleri mi var veya görecekleri gözleri mi var yahut işitecekleri kulakları mı var (neleri var)? De ki: «Ortaklarınızı çağırın, sonra bana (istediğiniz) tuzağı kurun ve bana göz bile açtırmayın!»","7:200":"Eğer şeytanın fitlemesi seni dürterse hemen Allah’a sığın. Çünkü O, işitendir, bilendir.","7:204":"Kur’an okunduğu zaman onu dinleyin ve susun ki size merhamet edilsin.","7:205":"Kendi kendine, yalvararak ve ürpererek, yüksek olmayan bir sesle sabah akşam Rabbini an. Gafillerden olma.","8:1":"Sana savaş ganimetlerini soruyorlar. De ki: Ganimetler Allah ve Peygamber’e aittir. O halde siz (gerçek) müminler iseniz Allah’tan korkun, aranızı düzeltin, Allah ve Resûlüne itaat edin.","8:2":"Müminler ancak, Allah anıldığı zaman yürekleri titreyen, kendilerine Allah’ın âyetleri okunduğunda imanlarını artıran ve yalnız Rablerine dayanıp güvenen kimselerdir.","8:7":"Hatırlayın ki, Allah size, iki taifeden (kervan veya Kureyş ordusundan) birinin sizin olduğunu vadediyordu; siz de kuvvetsiz olanın (kervanın) sizin olmasını istiyordunuz. Oysa Allah, sözleriyle hakkı gerçekleştirmek ve (Kureyş ordusunu yok ederek) kâfirlerin ardını kesmek istiyordu.","8:9":"Hatırlayın ki, siz Rabbinizden yardım istiyordunuz. O da, ben peşpeşe gelen bin melek ile size yardım edeceğim, diyerek duanızı kabul buyurdu.","8:12":"Hani Rabbin meleklere: «Muhakkak ben sizinle beraberim; haydi iman edenlere destek olun; Ben kâfirlerin yüreğine korku salacağım; vurun boyunlarına! Vurun onların bütün parmaklarına! diye vahyediyordu.","8:15":"Ey müminler! Toplu halde kâfirlerle karşılaştığınız zaman onlara arkanızı dönmeyin. (Korkup kaçmayın).","8:16":"Tekrar savaşmak için bir tarafa çekilme veya diğer bölüğe ulaşıp mevzi tutma durumu dışında, kim öyle bir günde onlara arka çevirirse muhakkak ki o, Allah’ın gazabını hak etmiş olarak döner. Onun yeri de cehennemdir. Orası, varılacak ne kötü yerdir!","8:35":"Onların Beytullah yanındaki duaları da ıslık çalmak ve el çırpmaktan başka bir şey değildir. (Ey kâfirler!) İnkâr etmekte olduğunuz şeylerden ötürü şimdi azabı tadın!","8:37":"(Bu toplama) Allah’ın murdarı temizden ayıklaması (mümini kâfirden ayırması) ve bütün murdarların bir kısmını diğer bir kısmının üstüne koyup hepsini yığarak cehenneme atması içindir. İşte onlar ziyana uğrayanların kendileridir.","8:38":"İnkâr edenlere, (sana düşmanlıktan) vazgeçerlerse, geçmiş günahlarının bağışlanacağını söyle. Yok geri dönerlerse kendilerinden öncekilerin hali gözlerinin önündedir!","8:42":"Hatırlayın ki, (Bedir savaşında) siz vâdinin yakın kenarında (Medine tarafında) idiniz, onlar da uzak kenarında (Mekke tarafında) idiler. Kervan da sizden daha aşağıda (deniz sahilinde) idi. Eğer (savaş için) sözleşmiş olsaydınız, sözleştiğiniz vakit hususunda ihtilâfa düşerdiniz. Fakat Allah, gerekli olan emri yerine getirmesi, helâk olanın açık bir delille (gözüyle gördükten sonra) helâk olması, yaşayanın da açık bir delille yaşaması için (böyle yaptı). Çünkü Allah hakkıyla işitendir, bilendir.","8:47":"Çalım satmak, insanlara gösteriş yapmak ve (insanları) Allah yolundan alıkoymak için yurtlarından çıkanlar (kâfirler) gibi olmayın. Allah onların yaptıklarını çepeçevre kuşatmıştır.","8:48":"Hani şeytan onlara yaptıklarını güzel gösterdi de: Bugün insanlardan size galip gelecek kimse yoktur, şüphesiz ben de sizin yardımcınızım, dedi. Fakat iki ordu birbirini görünce ardına döndü ve: Ben sizden uzağım, ben sizin göremediklerinizi (melekleri) görüyorum, ben Allah’tan korkuyorum; Allah’ın azabı şiddetlidir, dedi.","8:57":"Eğer savaşta onları yakalarsan, ibret almaları için onlar ile (onlara vereceğin ceza ile) arkalarında bulunan kimseleri de dağıt.","8:67":"Yeryüzünde ağır basıncaya (küfrün belini kırıncaya) kadar, hiçbir peygambere esirleri bulunması yaraşmaz. Siz geçici dünya malını istiyorsunuz, halbuki Allah (sizin için) ahireti istiyor. Allah güçlüdür, hikmet sahibidir.","9:2":"(Ey müşrikler!) Yeryüzünde dört ay daha dolaşın. İyi bilin ki siz Allah’ı âciz bırakacak değilsiniz; Allah ise kâfirleri rezil (ve perişan) edecektir.","9:5":"Haram aylar çıkınca müşrikleri bulduğunuz yerde öldürün; onları yakalayın, onları hapsedin ve onları her gözetleme yerinde oturup bekleyin. Eğer tevbe eder, namazı dosdoğru kılar, zekâtı da verirlerse artık yollarını serbest bırakın. Allah yarlığayan, esirgeyendir.","9:8":"Nasıl olabilir ki! Onlar size galip gelselerdi, sizin hakkınızda ne ahit, ne de antlaşma gözetirlerdi. Onlar ağızlarıyla sizi razı ediyorlar, halbuki kalpleri (buna) karşı çıkıyor. Çünkü onların çoğu yoldan çıkmışlardır.","9:14":"Onlarla savaşın ki, Allah sizin ellerinizle onları cezalandırsın; onları rezil etsin; sizi onlara galip kılsın ve mümin toplumun kalplerini ferahlatsın.","9:24":"De ki: Eğer babalarınız, oğullarınız, kardeşleriniz, eşleriniz, hısım akrabanız kazandığınız mallar, kesada uğramasından korktuğunuz ticaret, hoşlandığınız meskenler size Allah’tan, Resûlünden ve Allah yolunda cihad etmekten daha sevgili ise, artık Allah emrini getirinceye kadar bekleyin. Allah fâsıklar topluluğunu hidayete erdirmez.","9:25":"Andolsun ki Allah, birçok yerde (savaş alanlarında) ve Huneyn savaşında size yardım etmişti. Hani çokluğunuz size kendinizi beğendirmiş, fakat sizi hezimete uğramaktan kurtaramamıştı. Yeryüzü bütün genişliğine rağmen size dar gelmişti, sonunda (bozularak) gerisin geri dönmüştünüz.","9:28":"Ey iman edenler! Müşrikler ancak bir pisliktir. Onun için bu yıllarından sonra Mescid-i Haram’a yaklaşmasınlar. Eğer yoksulluktan korkarsanız, (biliniz ki) Allah dilerse sizi kendi lütfundan zengin edecektir. Şüphesiz Allah iyi bilendir, hikmet sahibidir.","9:29":"Kendilerine Kitap verilenlerden Allah’a ve ahiret gününe inanmayan, Allah ve Resûlünün haram kıldığını haram saymayan ve hak dini kendine din edinmeyen kimselerle, küçülerek elleriyle cizye verinceye kadar savaşın.","9:30":"Yahudiler, Uzeyr Allah’ın oğludur, dediler. Hıristiyanlar da, Mesîh (İsa) Allah’ın oğludur dediler. Bu onların ağızlarıyla geveledikleri sözlerdir. (Sözlerini) daha önce kâfir olmuş kimselerin sözlerine benzetiyorlar. Allah onları kahretsin! Nasıl da (haktan bâtıla) döndürülüyorlar!","9:34":"Ey iman edenler! (Biliniz ki), hahamlardan ve râhiplerden birçoğu insanların mallarını haksız yollardan yerler ve (insanları) Allah yolundan engellerler. Altın ve gümüşü yığıp da onları Allah yolunda harcamayanlar yok mu, işte onlara elem verici bir azabı müjdele!","9:35":"(Bu paralar) cehennem ateşinde kızdırılıp bunlarla onların alınları, yanları ve sırtları dağlanacağı gün (onlara denilir ki): «İşte bu kendiniz için biriktirdiğiniz servettir. Artık yığmakta olduğunuz şeylerin (azabını) tadın!»","9:37":"(Haram ayları) ertelemek, sadece kâfirlikte ileri gitmektir. Çünkü onunla, kâfir olanlar saptırılır. Allah’ın haram kıldığının sayısını bozmak ve O’nun haram kıldığını helâl kılmak için (haram ayını) bir yıl helâl sayarlar, bir yıl da haram sayarlar. (Böylece) onların kötü işleri kendilerine güzel gösterilmiştir. Allah kâfirler topluluğunu hidayete erdirmez.","9:40":"Eğer siz ona (Resûlullah’a) yardım etmezseniz (bu önemli değil); ona Allah yardım etmiştir: Hani, kâfirler onu, iki kişiden biri olarak (Ebu Bekir ile birlikte Mekke’den) çıkarmışlardı; hani onlar mağaradaydı; o, arkadaşına. Üzülme, çünkü Allah bizimle beraberdir, diyordu. Bunun üzerine Allah ona (sükûnet sağlayan) emniyetini indirdi, onu sizin görmediğiniz bir ordu ile destekledi ve kâfir olanların sözünü alçalttı. Allah’ın sözü ise zaten yücedir. Çünkü Allah üstündür, hikmet sahibidir.","9:46":"Eğer onlar (savaşa) çıkmak isteselerdi elbette bunun için bir hazırlık yaparlardı. Fakat Allah onların davranışlarını çirkin gördü ve onları geri koydu; onlara «Oturanlarla (kadın ve çocuklarla) beraber oturun!» denildi.","9:55":"(Ey Muhammed!) Onların malları ve çocukları seni imrendirmesin. Çünkü Allah bunlarla, ancak dünya hayatında onların azaplarını çoğaltmayı ve onların kâfir olarak canlarının çıkmasını istiyor.","9:57":"Eğer sığınacak bir yer yahut (barınabilecek) mağaralar veya (sokulabilecek) bir delik bulsalardı, koşarak o tarafa yönelip giderlerdi.","9:58":"Onlardan sadakaların (taksimi) hususunda seni ayıplayanlar da vardır. Sadakalardan onlara da (bir pay) verilirse razı olurlar, şayet onlara sadakalardan verilmezse hemen kızarlar.","9:60":"Sadakalar (zekâtlar) Allah’tan bir farz olarak ancak, yoksullara, düşkünlere, (zekât toplayan) memurlara, gönülleri (İslâm’a) ısındırılacak olanlara, (hürriyetlerini satın almaya çalışan) kölelere, borçlulara, Allah yolunda olana, yolda kalana mahsustur. Allah pek iyi bilendir, hikmet sahibidir.","9:72":"Allah, mümin erkeklere ve mümin kadınlara, içinde ebedî kalmak üzere altından ırmaklar akan cennetler ve Adn cennetlerinde güzel meskenler vâdetti. Allah’ın rızası ise hepsinden büyüktür. İşte büyük kurtuluş da budur.","9:82":"Artık kazanmakta olduklarının cezası olarak az gülsünler, çok ağlasınlar!","9:84":"Onlardan ölmüş olan hiçbirine asla namaz kılma; onun kabri başında da durma! Çünkü onlar, Allah ve Resûlünü inkâr ettiler ve fâsık olarak öldüler.","9:90":"Bedevîlerden, (mazeretleri olduğunu) iddia edenler, kendilerine izin verilsin diye geldiler. Allah ve Resûlüne yalan söyleyenler de oturup kaldılar. Onlardan kâfir olanlara elem verici bir azap erişecektir.","9:97":"Bedevîler, kâfirlik ve münafıklık bakımından hem daha beter, hem de Allah’ın Resûlüne indirdiği kanunları tanımamaya daha yatkındır. Allah çok iyi bilendir, hikmet sahibidir.","9:108":"Onun içinde asla namaz kılma! İlk günden takvâ üzerine kurulan mescit (Kuba Mescidi) içinde namaz kılman elbette daha doğrudur. Onda temizlenmeyi seven adamlar vardır. Allah da çok temizlenenleri sever.","9:109":"Binasını Allah korkusu ve rızası üzerine kuran kimse mi daha hayırlıdır, yoksa yapısını yıkılacak bir yarın kenarına kurup, onunla beraber kendisi de çöküp cehennem ateşine giden kimse mi? Allah zalimler topluluğunu doğru yola iletmez.","9:114":"İbrahim’in babası için af dilemesi, sadece ona verdiği sözden dolayı idi. Ne var ki, onun Allah’ın düşmanı olduğu kendisine belli olunca, ondan uzaklaştı. Şüphesiz ki İbrahim çok yumuşak huylu ve pek sabırlı idi.","9:120":"Medine halkına ve onların çevresinde bulunan bedevî Araplara Allah’ın Resûlünden geri kalmaları ve onun canından önce kendi canlarını düşünmeleri yakışmaz. İşte onların Allah yolunda bir susuzluğa, bir yorgunluğa ve bir açlığa dûçar olmaları, kâfirleri öfkelendirecek bir yere (ayak) basmaları ve düşmana karşı bir başarı kazanmaları, ancak bunların karşılığında kendilerine salih bir amel yazılması içindir. Çünkü Allah iyilik yapanların mükâfatını zayi etmez.","10:1":"Elif. Lâm. Râ. İşte bunlar hikmet dolu Kitâb’ın âyetleridir.","10:22":"Sizi karada ve denizde gezdiren O’dur. Hatta siz gemilerde bulunduğunuz, o gemiler de içindekileri tatlı bir rüzgârla alıp götürdükleri ve (yolcular) bu yüzden neşelendikleri zaman, o gemiye şiddetli bir fırtına gelip çatar, her yerden onlara dalgalar hücum eder ve onlar çepeçevre kuşatıldıklarını anlarlar da dini yalnız Allah’a halis kılarak: «Andolsun eğer bizi bundan kurtarırsan mutlaka şükredenlerden olacağız» diye Allah’a yalvarırlar.","10:24":"Dünya hayatının durumu, gökten indirdiğimiz bir su gibidir ki, insanların ve hayvanların yiyeceklerinden olan yeryüzü bitkileri o su sayesinde gürleşip birbirine girer. Nihayet yeryüzü zinetini takınıp, (rengârenk) süslendiği ve sahipleri de onun üzerinde kudret sahibi olduklarını sandıkları bir sırada, bir gece veya gündüz ona emrimiz (âfetimiz) gelir de onu sanki dün yerinde yokmuş gibi kökünden koparılarak biçilmiş bir hale getiririz. İşte iyi düşünecek kavimler için âyetlerimizi böyle açıklıyoruz.","10:26":"Güzel davrananlara daha güzel karşılık, bir de fazlası vardır. Onların yüzlerine ne bir toz (kara leke) bulaşır ne de bir horluk (gelir). İşte onlar cennet ehlidirler. Ve onlar orada ebedî kalacaklardır.","10:61":"Ne zaman sen bir işte bulunsan, ne zaman Kur’an’dan bir şey okusan ve siz ne zaman bir iş yaparsanız, o işe daldığınız zaman biz mutlaka üstünüzde şahidizdir. Ne yerde ne gökte zerre ağırlığınca bir şey Rabbinden uzak (ve gizli) kalmaz. Bundan daha küçüğü ve daha büyüğü yoktur ki apaçık kitapta (levh-i mahfuzda) bulunmasın.","10:78":"Onlar dediler ki: Babalarımızı üzerinde bulduğumuz (dinden) bizi döndüresin ve yeryüzünde ululuk sizin ikinizin olsun diye mi bize geldin? Halbuki biz size inanacak değiliz.","10:92":"(Ey Firavun!) Senden sonra geleceklere ibret olman için, bugün senin bedenini (cansız olarak) kurtaracağız. İşte insanlardan bir çoğu, hakikaten âyetlerimizden gafildirler.","11:23":"İnanıp da güzel işler yapan ve Rablerine gönülden boyun eğenlere gelince, işte onlar cennet ehlidir. Onlar orada ebedî kalırlar.","11:27":"Kavminden ileri gelen kâfirler dediler ki: «Biz seni sadece bizim gibi bir insan olarak görüyoruz. Bizden, basit görüşle hareket eden alt tabakamızdan başkasının sana uyduğunu görmüyoruz. Ve sizin bize karşı bir üstünlüğünüzü de görmüyoruz. Bilakis sizin yalancılar olduğunuzu düşünüyoruz.»","11:28":"(Nuh) dedi ki: Ey kavmim! Eğer ben Rabbim tarafından (bildirilen) açık bir delil üzerinde isem ve O bana kendi katından bir rahmet vermiş de bu size gizli tutulmuşsa, buna ne dersiniz? Siz onu istemediğiniz halde biz sizi ona zorlayacak mıyız?","11:31":"Ben size: «Allah’ın hazineleri benim yanımdadır» demiyorum, gaybı da bilmem. «Ben bir meleğim» de demiyorum. Sizin gözlerinizin hor gördüğü kimseler için, «Allah onlara asla bir hayır vermeyecektir» diyemem. Onların kalplerinde olanı, Allah daha iyi bilir. Onları kovduğum takdirde ben gerçekten zalimlerden olurum.»","11:40":"Nihayet emrimiz gelip de sular coşup yükselmeye başlayınca Nuh’a dedik ki: «(Canlı çeşitlerinin) her birinden birer çift ile -(boğulacağına dair) aleyhinde söz geçmiş olanlar dışında- aileni ve iman edenleri gemiye yükle!» Zaten onunla beraber pek azı iman etmişti.","11:44":"(Nihayet) «Ey yer suyunu yut! Ve ey gök (suyunu) tut!» denildi. Su çekildi; iş bitirildi; (gemi de) Cûdî (dağının) üzerine yerleşti. Ve: «O zalimler topluluğunun canı cehenneme!» denildi.","11:56":"«Ben, benim de Rabbim, sizin de Rabbiniz olan Allah’a dayandım. Çünkü yürüyen hiçbir varlık yoktur ki, O, onun perçeminden tutmuş olmasın. Şüphesiz Rabbim dosdoğru yoldadır.»","11:67":"Zulmedenleri de o korkunç ses yakaladı ve yurtlarında diz üstü çökekaldılar.","11:69":"Andolsun ki elçilerimiz (melekler) İbrahim’e müjde getirdiler ve: «Selam (sana) » dediler. O da: «(Size de)selam» dedi ve hemen kızartılmış bir buzağı getirdi.","11:70":"Ellerini yemeğe uzatmadıklarını görünce, onları yadırgadı ve onlardan dolayı içine bir korku düştü. Dediler ki: Korkma! (biz melekleriz). Lût kavmine gönderildik.","11:72":"(İbrahim’in karısı:) Olacak şey değil! Ben bir kocakarı, bu kocam da bir ihtiyar iken çocuk mu doğuracağım? Bu gerçekten şaşılacak bir şey! dedi.","11:73":"(Melekler) dediler ki: Allah’ın emrine şaşıyor musun? Ey ev halkı! Allah’ın rahmeti ve bereketleri sizin üzerinizdedir. Şüphesiz ki O, övülmeye lâyıktır, iyiliği boldur.","11:74":"İbrahim’den korku gidip kendisine müjde gelince, Lût kavmi hakkında (adeta) bizimle mücadeleye başladı.","11:75":"İbrahim cidden yumuşak huylu, bağrı yanık, kendisini Allah’a vermiş biri idi.","11:77":"Elçilerimiz Lût’a gelince, (Lût) onların yüzünden üzüldü ve onlardan dolayı içi daraldı da «Bu, çetin bir gündür» dedi.","11:78":"Lût’un kavmi, koşarak onun yanına geldiler. Daha önce de o kötü işleri yapmaktaydılar. (Lût): «Ey kavmim! İşte şunlar kızlarımdır (onlarla evlenin); sizin için onlar daha temizdir. Allah’tan korkun ve misafirlerimin önünde beni rezil etmeyin! İçinizde aklı başında bir adam yok mu!» dedi.","11:80":"(Lût:) Keşke benim size karşı (koyacak) bir gücüm olsaydı veya güçlü bir kaleye sığınabilseydim! dedi.","11:81":"(Melekler) dediler ki: Ey Lût! Biz Rabbinin elçileriyiz. Onlar sana asla dokunamazlar. Sen gecenin bir kısmında ailenle (yola çıkıp) yürü. Karından başka sizden hiçbiri geride kalmasın. Çünkü onlara gelecek olan (azap) şüphesiz ona da isabet edecektir. Onlara vâdolunan (helâk) zamanı, sabah vaktidir. Sabah yakın değil mi?","11:82":"Emrimiz gelince, oranın altını üstüne getirdik ve üzerlerine (balçıktan) pişirilip istif edilmiş taşlar yağdırdık.","11:91":"Dediler ki: Ey Şuayb! Söylediklerinin çoğunu anlamıyoruz ve içimizde seni cidden zayıf (âciz) görüyoruz! Eğer kabilen olmasa, seni mutlaka taşlayarak öldürürüz. Sen bizden üstün değilsin.","11:98":"Firavun, kıyamet gününde kavminin önüne düşecek ve onları (çekip) ateşe götürecektir. Varacakları yer ne kötü yerdir!","11:99":"Onlar burada da, kıyamet gününde de lânete uğratıldılar. (Onlara) verilen bu armağan ne kötü armağandır!","11:101":"Onlara biz zulmetmedik; fakat, onlar kendilerine zulmettiler. Rabbinin (azap) emri geldiğinde, Allah’ı bırakıp da taptıkları tanrıları, onlara hiçbir şey sağlamadı, ziyanlarını artırmaktan başka bir şeye yaramadı.","11:105":"O geldiği gün Allah’ın izni olmadan hiç kimse konuşamaz. Onlardan kimi bedbahttır, kimi mutlu.","11:106":"Bedbaht olanlar ateştedirler, orada onların (öyle feci) nefes alıp vermeleri vardır ki.","11:108":"Mutlu olanlara gelince, onlar da cennettedirler. Rabbinin dilediği hariç, gökler ve yer durdukça onlar da orada ebedî kalacaklardır. Bu (nimetler) bitmez, tükenmez bir lütuftur.","11:114":"Gündüzün iki ucunda, gecenin de ilk saatlerinde namaz kıl. Çünkü iyilikler kötülükleri (günahları) giderir. Bu, öğüt almak isteyenlere bir hatırlatmadır.","11:116":"Sizden önceki asırlarda yeryüzünde (insanları) bozgunculuktan alıkoyacak faziletli kimseler bulunsaydı ya! Fakat onlardan, kurtuluşa erdirdiğimiz az bir kısmı müstesnadır (bunlar görevlerini yaptılar). Zulmedenler ise, kendilerine verilen refahın peşine düştüler. Zaten günahkâr idiler.","12:9":"(Aralarında dediler ki:) Yusuf’u öldürün veya onu (uzak) bir yere atın ki babanızın teveccühü yalnız size kalsın! Ondan sonra da (tevbe ederek) sâlih kimseler olursunuz!","12:10":"Onlardan biri: Yusuf’u öldürmeyin, eğer mutlaka yapacaksanız onu kuyunun dibine atın da geçen kervanlardan biri onu alsın (götürsün), dedi.","12:12":"Yarın onu bizimle beraber (kıra) gönder de bol bol yesin (içsin), oynasın. Biz onu mutlaka koruruz.»","12:13":"(Babaları) dedi ki: Onu götürmeniz beni mutlaka üzer. Siz ondan habersizken onu bir kurdun yemesinden korkarım.","12:18":"Gömleğinin üstünde sahte bir kan ile geldiler. (Ya’kub) dedi ki: Bilakis nefisleriniz size (kötü) bir işi güzel gösterdi. Artık (bana düşen) hakkıyla sabretmektir. Anlattığınız karşısında (bana) yardım edecek olan, ancak Allah’tır.","12:19":"Bir kervan geldi ve sucularını (kuyuya) gönderdiler, o da (gidip) kovasını saldı, (Yusuf’u görünce) «Müjde! İşte bir oğlan!» dedi. Onu bir ticaret malı olarak sakladılar. Allah onların yaptıklarını çok iyi bilir.","12:20":"(Kafile Mısır’a vardığında) onu değersiz bir pahaya, sayılı birkaç dirheme sattılar. Onlar zaten ona değer vermemişlerdi.","12:23":"Evinde bulunduğu kadın, onun nefsinden murat almak istedi, kapıları iyice kapattı ve «Haydi gel!» dedi. O da «(Hâşâ), Allah’a sığınırım! Zira kocanız benim velinimetimdir, bana güzel davrandı. Gerçek şu ki, zalimler iflah olmaz!» dedi.","12:25":"İkisi de kapıya doğru koştular. Kadın onun gömleğini arkadan yırttı. Kapının yanında onun kocasına rastladılar. Kadın dedi ki: Senin ailene kötülük etmek isteyenin cezası, zindana atılmaktan veya elem verici bir işkenceden başka ne olabilir!","12:30":"Şehirdeki bazı kadınlar dediler ki: Azizin karısı, delikanlısının nefsinden murat almak istiyormuş; Yusuf’un sevdası onun kalbine işlemiş! Biz onu gerçekten açık bir sapıklık içinde görüyoruz.","12:31":"Kadın, onların dedikodusunu duyunca, onlara dâvetçi gönderdi; onlar için dayanacak yastıklar hazırladı. Onlardan herbirine bir bıçak verdi. (Kadınlar meyveleri soyarken Yusuf’a): «Çık karşılarına!» dedi. Kadınlar onu görünce, onun büyüklüğünü anladılar. (Şaşkınlıklarından) ellerini kestiler ve dediler ki: Hâşâ Rabbimiz! Bu bir beşer değil... Bu ancak üstün bir melektir!","12:33":"(Yusuf:) Rabbim! Bana zindan, bunların benden istediklerinden daha iyidir! Eğer onların hilelerini benden çevirmezsen, onlara meyleder ve cahillerden olurum! dedi.","12:36":"Onunla birlikte zindana iki delikanlı daha girdi. Onlardan biri dedi ki: Ben (rüyada) şarap sıktığımı gördüm. Diğeri de: Ben de başımın üstünde kuşların yemekte olduğu bir ekmek taşıdığımı gördüm. Bunun yorumunu bize haber ver. Çünkü biz seni güzel davrananlardan görüyoruz, dedi.","12:43":"Kral dedi ki: Ben (rüyada) yedi arık ineğin yediği yedi semiz inek gördüm. Ayrıca, yedi yeşil başak ve diğerlerini de kuru gördüm. Ey ileri gelenler! Eğer rüya yorumluyorsanız, benim rüyamı da bana yorumlayınız.","12:44":"(Yorumcular) dediler ki: Bunlar karmakarışık düşlerdir. Biz böyle düşlerin yorumunu bilenlerden değiliz.","12:49":"Sonra bunun ardından da bir yıl gelecek ki, o yılda insanlara (Allah tarafından) yardım olunacak ve o yılda (meyvesuyu ve yağ) sıkacaklar.","12:50":"(Adam bu yorumu getirince) kral dedi ki: «Onu bana getirin!» Elçi, Yusuf’a geldiği zaman, (Yusuf) dedi ki: «Efendine dön de ona: Ellerini kesen o kadınların zoru neydi? diye sor. Şüphesiz benim Rabbim onların hilesini çok iyi bilir.»","12:51":"(Kral kadınlara) dedi ki: Yusuf’un nefsinden murat almak istediğiniz zaman durumunuz neydi? Kadınlar, Hâşâ! Allah için, biz ondan hiçbir kötülük görmedik, dediler. Azizin karısı da dedi ki: «Şimdi gerçek ortaya çıktı. Ben onun nefsinden murat almak istemiştim. Şüphesiz ki o doğru söyleyenlerdendir.»","12:59":"(Yusuf) onların yüklerini hazırlayınca dedi ki: «Sizin bababir kardeşinizi de bana getirin. Görmüyor musunuz, ben ölçeği tam dolduruyorum ve ben misafirperverlerin en iyisiyim.","12:62":"(Yusuf) emrindeki gençlere dedi ki: Sermayelerini yüklerinin içine koyun. Olur ki ailelerine döndüklerinde bunun farkına varırlar da belki geri gelirler.","12:65":"Eşyalarını açtıklarında sermayelerinin kendilerine geri verildiğini gördüler. Dediler ki: Ey babamız! Daha ne istiyoruz. İşte sermâyemiz de bize geri verilmiş. (Onunla yine) ailemize yiyecek getiririz, kardeşimizi koruruz ve bir deve yükü de fazla alırız. Çünkü bu (seferki aldığımız) az bir miktardır.","12:68":"Babalarının kendilerine emrettiği yerden (çeşitli kapılardan) girdiklerinde (onun emrini yerine getirdiler. Fakat bu tedbir) Allah’tan gelecek hiçbir şeyi onlardan savamazdı; ancak Ya’kub içindeki bir dileği açığa vurmuş oldu. Şüphesiz o, ilim sahibiydi, çünkü ona biz öğretmiştik. Fakat insanların çoğu bilmezler.","12:70":"(Yusuf) onların yükünü hazırladığı zaman maşrabayı kardeşinin yükü içine koydu! (Kafile hareket ettikten) sonra bir tellal: Ey kafile! Siz hırsızsınız! diye seslendi.","12:71":"(Yusuf’un kardeşleri) onlara dönerek: Ne arıyorsunuz? dediler.","12:72":"Kralın su kabını arıyoruz; onu getirene bir deve yükü (bahşiş) var dediler. (İçlerinden biri:) Ben buna kefilim, dedi.","12:76":"Bunun üzerine Yusuf, kardeşinin yükünden önce onların yüklerini (aramaya) başladı. Sonra da onu, kardeşinin yükünden çıkarttı. İşte biz Yusuf’a böyle bir tedbir öğrettik, yoksa kralın kanununa göre kardeşini tutamayacaktı. Ancak Allah’ın dilemesi hariç. Biz kimi dilersek onu derecelerle yükseltiriz. Zira her ilim sahibinin üstünde daha iyi bilen birisi vardır.","12:80":"Ondan ümitlerini kesince, (meseleyi) gizli görüşmek üzere ayrılıp (bir kenara) çekildiler. Büyükleri dedi ki: «Babanızın sizden Allah adına söz aldığını, daha önce de Yusuf hakkında işlediğiniz kusuru bilmiyor musunuz? Babam bana izin verinceye veya benim için Allah hükmedinceye kadar bu yerden asla ayrılmayacağım. O hükmedenlerin en hayırlısıdır.","12:85":"(Oğulları:) «Allah’a andolsun ki sen hâla Yusuf’u anıyorsun. Sonunda ya hasta olacaksın ya da büsbütün helâk olacaksın!» dediler.","12:86":"(Ya’kub:) Ben gam ve kederimi sadece Allah’a arzediyorum. Ve ben sizin bilemiyeceğiniz şeyleri Allah tarafından (vahiy ile) biliyorum, dedi.","12:88":"Yusuf’un yanına girdiklerinde dediler ki: Ey aziz! Bizi ve ailemizi kıtlık bastı ve biz değersiz bir sermaye ile geldik. Hakkımızı tam ölçerek ver. Ayrıca bize bağışta da bulun. Şüphesiz Allah sadaka verenleri mükâfatlandırır.","12:92":"(Yusuf) dedi ki: «Bugün sizi kınamak yok, Allah sizi affetsin! O, merhametlilerin en merhametlisidir.»","12:94":"Kafile (Mısır’dan) ayrılınca, babaları (yanındakilere): Eğer bana bunamış demezseniz inanın ben Yusuf’un kokusunu alıyorum! dedi.","13:1":"Elif. Lâm. Mîm. Râ. Bunlar, Kitab’ın âyetleridir. Sana Rabbinden indirilen haktır, fakat insanların çoğu inanmazlar.","13:4":"Yeryüzünde birbirine komşu kıtalar, üzüm bağları, ekinler, bir kökten ve çeşitli köklerden dallanmış hurma ağaçları vardır. Bunların hepsi bir su ile sulanır. (Böyle iken) yemişlerinde onların bir kısmını bir kısmına üstün kılarız. İşte bunlarda akıllarını kullanan bir toplum için ibretler vardır.","13:5":"(Resûlüm! Kâfirlerin seni yalanlamalarına) şaşıyorsan, asıl şaşılacak şey onların: «Biz toprak olduğumuz zaman yeniden mi yaratılacağız?» demeleridir. İşte onlar, Rablerini inkâr edenlerdir; işte onlar (kıyamet gününde) boyunlarında tasmalar bulunanlardır. Ve onlar ateş ehlidir. Onlar, orada ebedî kalacaklardır!","13:10":"Sizden, sözü gizleyenle onu açığa vuran, geceleyin gizlenenle gündüzün yürüyen (onun ilminde) eşittir.","13:13":"Gök gürültüsü Allah’ı hamd ile tesbih eder. Melekler de O’nun heybetinden dolayı tesbih ederler. Onlar, Allah hakkında mücâdele edip dururken O, yıldırımlar gönderip onlarla dilediğini çarpar. Ve O, azabı pek şiddetli olandır.","13:17":"O, gökten su indirdi de vâdiler kendi hacimlerince sel olup aktı. Bu sel, üste çıkan bir köpüğü yüklenip götürdü. Süs veya (diğer) eşya yapmak isteyerek ateşte erittikleri şeylerden de buna benzer köpük olur. İşte Allah hak ile bâtıla böyle misal verir. Köpük atılıp gider. İnsanlara fayda veren şeye gelince, o yeryüzünde kalır. İşte Allah böyle misaller getirir.","13:31":"Eğer okunan bir Kitapla dağlar yürütülseydi veya onunla yer parçalansaydı, yahut onunla ölüler konuşturulsaydı (o Kitap yine bu Kur’an olacaktı). Fakat bütün işler Allah’a aittir. İman edenler hâla bilmediler mi ki, Allah dileseydi bütün insanları hidayete erdirirdi? Allah’ın vâdi gelinceye kadar inkâr edenlere, yaptıklarından dolayı ya ansızın büyük bir belâ gelmeye devam edecek veya o belâ evlerinin yakınına inecek. Allah, vâdinden asla dönmez.","13:39":"Allah dilediğini siler, (dilediğini de) sabit bırakır. Bütün kitapların aslı onun yanındadır.","14:17":"Onu yudumlamaya çalışacak, fakat boğazından geçiremeyecek ve ona her yandan ölüm gelecek, oysa o ölecek değildir (ki azaptan kurtulsun). Bundan ötede şiddetli bir azap da vardır.","14:18":"Rablerini inkâr edenlerin durumu (şudur): Onların amelleri fırtınalı bir günde rüzgârın şiddetle savurduğu küle benzer. Kazandıklarından hiçbir şeyi elde edemezler. İyiden iyiye sapıtma işte budur.","14:21":"(Kıyamet gününde) hepsi Allah’ın huzuruna çıkacak ve zayıflar o büyüklük taslayanlara diyecekler ki: «Biz sizin tâbilerinizdik. Şimdi siz, Allah’ın azabından herhangi bir şeyi bizden savabilir misiniz?» Onlar da diyecekler ki: «(Ne yapalım) Allah bizi hidayete erdirseydi biz de sizi doğru yola iletirdik. Şimdi sızlansak da sabretsek de birdir. Çünkü bizim için sığınacak bir yer yoktur.»","14:22":"(Hesapları görülüp) iş bitirilince, şeytan diyecek ki: «Şüphesiz Allah size gerçek olanı vâdetti, ben de size vâdettim ama, size yalancı çıktım. Zaten benim size karşı bir gücüm yoktu. Ben, sadece sizi (inkâra) çağırdım, siz de benim davetime hemen koştunuz. O halde beni yermeyin, kendinizi yerin. Ne ben sizi kurtarabilirim, ne de siz beni kurtarabilirsiniz! Kuşkusuz daha önce ben, beni (Allah’a) ortak koşmanızı reddettim.» Şüphesiz zalimler için elem verici bir azap vardır.","14:24":"Görmedin mi Allah nasıl bir misal getirdi: Güzel bir sözü, kökü (yerde) sabit, dalları gökte olan güzel bir ağaca (benzetti).","14:26":"Kötü bir sözün misali, gövdesi yerden koparılmış, o yüzden ayakta durma imkânı olmayan (kötü) bir ağaca benzer.","14:28":"Allah’ın nimetine nankörlükle karşılık veren ve sonunda kavimlerini helâk yurduna sürükleyenleri görmedin mi?","14:34":"O size istediğiniz her şeyden verdi. Allah’ın nimetini sayacak olsanız sayamazsınız. Doğrusu insan çok zalim, çok nankördür!","14:42":"(Resûlüm!) Sakın, Allah’ı zalimlerin yaptıklarından habersiz sanma! Ancak, Allah onları (cezalandırmayı), korkudan gözlerin dışarı fırlayacağı bir güne erteliyor.","14:43":"Zihinleri bomboş olarak kendilerine bile dönüp bakamaz durumda, gözleri göğe dikilmiş bir vaziyette koşarlar.","14:44":"Kendilerine azabın geleceği, bu yüzden zalimlerin: «Ey Rabbimiz! Yakın bir müddete kadar bize süre ver de senin davetine uyalım ve peygamberlere tâbi olalım» diyecekleri gün hakkında insanları uyar. (Onlara denilir ki:) «Daha önce, sizin için bir zevâl olmadığına, yemin etmemiş miydiniz?»","14:49":"O gün, günahkârların zincire vurulmuş olduğunu görürsün.","14:50":"Onların gömlekleri katrandandır, yüzlerini de ateş bürümektedir.","15:2":"İnkâr edenler zaman zaman, keşke biz de müslüman olsaydık, diye arzu ederler.","15:3":"Onları bırak; yesinler, eğlensinler ve boş ümit onları oyalayadursun. (Kötü sonucu) yakında bilecekler!","15:12":"İşte böylece biz onu, (inkârcılığı) suçluların kalplerine sokarız.","15:14":"(14-15) Onlara gökten bir kapı açsak da oradan yukarı çıksalar, yine de «Gözlerimiz boyandı, daha doğrusu bize büyü yapılmıştır.» derler.","15:18":"Ancak kulak hırsızlığı eden müstesna. Onun da peşine açık bir alev sütunu düşmüştür.","15:22":"Biz, rüzgârları aşılayıcı olarak gönderdik ve gökten bir su indirdik de onunla su ihtiyacınızı karşıladık. (Biz bunları yapmasaydık) siz onu (yeterli) suyu depolayamazdınız.","15:26":"Andolsun biz insanı, (pişmiş) kuru bir çamurdan, şekillenmiş kara balçıktan yarattık.","15:55":"Sana gerçeği müjdeledik, sakın ümitsizliğe düşenlerden olma! dediler.","15:68":"(68-69) (Lût) onlara «Bunlar benim misafirimdir. Sakın beni utandırmayın; Allah’tan korkun, beni rezil etmeyin!» dedi.","15:75":"İşte bunda ibret alanlar için işaretler vardır.","15:78":"Eyke halkı da gerçekten zalim idiler.","15:88":"Sakın onlardan bazı sınıflara verdiğimiz dünya malına göz dikme, onlardan dolayı üzülme ve müminlere alçak gönüllü ol.","15:91":"Onlar, Kur’an’ı tutarsız parçalar olarak nitelendirenlere gelince,","15:94":"Sana emrolunanı açıkça söyle ve ortak koşanlardan yüz çevir!","16:4":"O, insanı bir damla sudan yarattı. Fakat bakarsın ki (insan) Rabbine apaçık bir hasım oluvermiştir.","16:5":"Hayvanları da O yarattı. Onlarda sizin için ısıtıcı (şeyler) ve birçok faydalar vardır. Onlardan bir kısmını da yersiniz.","16:8":"Atları, katırları ve eşekleri binmeniz ve (gözlere) zinet olsun diye (yarattı). Allah şu anda bilemeyeceğiniz daha nice (nakil vasıtaları) yaratır.","16:14":"İçinden taze et (balık) yemeniz ve takacağınız bir süs (eşyası) çıkarmanız için denizi emrinize veren O’dur. Gemilerin denizde (suları) yara yara gittiklerini de görüyorsun. (Bütün bunlar) onun lütfunu aramanız ve nimetine şükretmeniz içindir.","16:26":"Onlardan öncekiler de (peygamberlere) hile yapmışlardı. Sonunda Allah da onların binalarını temellerinden söktü üstlerindeki tavan da tepelerine çöktü. Bu azap onlara, farkedemedikleri bir yerden gelmişti.","16:45":"(45-46) Kötülük tuzakları kuranlar, Allah’ın, kendilerini yere geçirmeyeceğinden veya kendilerine bilemeyecekleri bir yerden azabın gelmeyeceğinden veya onlar dönüp dolaşırlarken Allah’ın kendilerini yakalamayacağından emin mi oldular? Onlar (Allah’ı) âciz bırakacak değillerdir.","16:48":"Allah’ın yarattığı herhangi bir şeyi görmediler mi? Onun gölgeleri, küçülerek ve Allah’a secde ederek sağa sola döner.","16:52":"Göklerde ve yerde ne varsa, O’nundur, din de yalnız O’nundur. O halde Allah’tan başkasından mı korkuyorsunuz?","16:53":"Nimet olarak size ulaşan ne varsa, Allah’tandır. Sonra size bir zarar dokunduğu zaman da yalnız O’na yalvarırsınız.","16:59":"Kendisine verilen müjdenin kötülüğünden dolayı kavminden gizlenir. Onu, aşağılık duygusu içinde yanında mı tutsun, yoksa toprağa mı gömsün! Bakın ki, verdikleri hüküm ne kadar kötüdür!","16:66":"Kuşkusuz sizin için hayvanlarda da büyük bir ibret vardır. Zira size, onların karınlarındaki fışkı ile kan arasından (gelen), içenlerin boğazından kolayca geçen hâlis bir süt içiriyoruz.","16:72":"Allah size kendi nefislerinizden eşler yarattı, eşlerinizden de sizin için oğullar ve torunlar yarattı ve sizi temiz gıdalarla rızıklandırdı. Onlar hâla bâtıla inanıp Allah’ın nimetine nankörlük mü ediyorlar?","16:77":"Göklerin ve yerin gaybı Allah’a aittir. Kıyametin kopması ise, göz açıp kapama gibi veya daha az bir zamandan ibarettir. Şüphesiz Allah, her şeye kadirdir.","16:79":"Göğün boşluğunda emre boyun eğdirilmiş olarak uçuşan kuşları görmediler mi? Onları orada Allah’tan başkası tutamaz. Kuşkusuz bunda inanan bir toplum için ibretler vardır.","16:80":"Allah, evlerinizi sizin için bir huzur ve sükûn yeri yaptı ve sizin için davar derilerinden gerek göç gününüzde, gerekse konaklama gününüzde, kolayca taşıyacağınız evler; yünlerinden, yapağılarından ve kıllarından bir süreye kadar (faydalanacağınız) bir ev eşyası ve bir ticaret malı meydana getirdi.","16:84":"Her ümmetten bir şahit göndereceğimiz gün, artık ne kâfir olanlara (özür dilemelerine) izin verilir ne de onların özür dilemeleri istenir.","16:91":"Antlaşma yaptığınız zaman, Allah’ın ahdini yerine getirin ve Allah’ı üzerinize şahit tutarak, pekiştirdikten sonra yeminleri bozmayın. Şüphesiz Allah, yapacağınız şeyleri pek iyi bilir.","16:92":"Bir toplum diğer bir toplumdan (sayıca ve malca) daha çok olduğu için yeminlerinizi, aranızda bir fesat aracı edinerek ipliğini sağlamca büktükten sonra, çözüp bozan (kadın) gibi olmayın. Allah, bununla sizi imtihan etmektedir. Hakkında ihtilafa düşmekte olduğunuz şeyi kıyamet gününde mutlaka size açıklayacaktır.","16:96":"Sizin yanınızdaki (dünya malı) tükenir, Allah katındakiler ise bâkidir. Elbette sabırlı davrananlara yapmakta olduklarının en güzeliyle mükâfatlarını vereceğiz.","16:103":"Şüphesiz biz onların: «Kur’an’ı ona ancak bir insan öğretiyor» dediklerini biliyoruz. Kendisine nisbet ettikleri şahsın dili yabancıdır. Halbuki bu (Kur’an) apaçık bir Arapçadır.","17:5":"Bunlardan ilkinin zamanı gelince, üzerinize güçlü kuvvetli kullarımızı gönderdik. Bunlar, evlerin arasında dolaşarak (sizi) aradılar. Bu, yerine getirilmiş bir vaad idi.","17:13":"Her insanın amelini (veya kaderini) boynuna bağladık. İnsan için kıyamet gününde, açılmış olarak önüne konacak bir kitap çıkarırız.","17:20":"Hepsine, onlara da bunlara da (dünyayı isteyenlere de ahireti isteyenlere de) Rabbinin ihsanından (istediklerini) veririz. Rabbinin ihsanı kısıtlanmış değildir.","17:23":"Rabbin, sadece kendisine kulluk etmenizi, ana babanıza da iyi davranmanızı kesin bir şekilde emretti. Onlardan biri veya her ikisi senin yanında yaşlanırsa, kendilerine «of!» bile deme; onları azarlama; ikisine de güzel söz söyle.","17:26":"Bir de akrabaya, yoksula, yolcuya hakkını ver. Gereksiz yere de saçıp savurma.","17:32":"Zinaya yaklaşmayın. Zira o, bir hayâsızlıktır ve çok kötü bir yoldur.","17:35":"Ölçtüğünüz zaman tastamam ölçün ve doğru terazi ile tartın. Bu, hem daha iyidir hem de neticesi bakımından daha güzeldir.","17:37":"Yeryüzünde böbürlenerek dolaşma. Çünkü sen (ağırlık ve azametinle) ne yeri yarabilir ne de dağlarla ululuk yarışına girebilirsin.","17:45":"Biz, Kur’an okuduğun zaman, seninle ahirete inanmayanların arasına gizleyici bir örtü çekeriz.","17:49":"Bir de onlar dediler ki: Sahi biz, bir kemik yığını ve kokuşmuş bir toprak olmuş iken, yepyeni bir hilkatte diriltileceğiz, öyle mi!","17:51":"(50-51) De ki: İster taş olun, ister demir, isterse gözünüzde büyüyen herhangi bir mahlûk! (Bunlar, Allah’ın sizi yeniden diriltmesini güçleştirmez.) Diyecekler ki: «Bizi tekrar (hayata) kim döndürecek?» De ki: Sizi ilk kez yaratan. Bunun üzerine onlar sana alaylı bir tarzda başlarını sallayacak ve «Ne zamanmış o?» diyecekler. De ki: Yakın olsa gerek!","17:62":"Dedi ki: «Şu benden üstün kıldığına da bir bak! Yemin ederim ki, eğer beni kıyamete kadar yaşatırsan, pek azı dışında, onun neslini kendime bağlayacağım!»","17:63":"Allah buyurdu: Git! Onlardan kim sana uyarsa, iyi bilin ki hepinizin cezası cehennemdir. Tam bir ceza!","17:64":"Onlardan gücünün yettiği kimseleri dâvetinle şaşırt; süvarilerinle, yayalarınla onları yaygaraya boğ; mallarına, evlâtlarına ortak ol, kendilerine vaadlerde bulun. Şeytan, insanlara, aldatmadan başka bir şey vâdetmez.","17:68":"O’nun, sizi kara tarafında yerin dibine geçirmeyeceğinden, yahut başınıza taş yağdırmayacağından emin misiniz? Sonra kendinize bir koruyucu da bulamazsınız.","17:69":"Yahut O’nun, sizi bir kez daha oraya (denize) gönderip üzerinize bir kasırga yollayarak, inkâr etmiş olmanız sebebiyle sizi boğmayacağından emin misiniz? Sonra, bundan dolayı kendinize (intikamınızı almak için) bizi arayıp soracak bir destekçi de bulamazsınız.","17:78":"Gündüzün güneş dönüp gecenin karanlığı bastırıncaya kadar (belli vakitlerde) namaz kıl; bir de sabah namazını. Çünkü sabah namazı şahitlidir.","17:79":"Gecenin bir kısmında uyanarak, sana mahsus bir nafile olmak üzere namaz kıl. (Böylece) Rabbinin, seni, övgüye değer bir makama göndereceği umulur.","17:84":"De ki: Herkes, kendi mizaç ve meşrebine göre iş yapar. Bu durumda kimin doğru bir yol tuttuğunu Rabbiniz en iyi bilendir.","17:90":"Onlar: «Sen, dediler, bizim için yerden bir kaynak fışkırtmadıkça sana asla inanmayacağız.»","17:92":"«Yahut, iddia ettiğin gibi, üzerimize gökten parçalar yağdırmalısın veya Allah’ı ve melekleri gözümüzün önüne getirmelisin.»","17:93":"«Yahut da altından bir evin olmalı, y
