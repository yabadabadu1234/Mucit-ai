rı ve kavimler","#e7c7a6",14],["Savaş, gazve ve Medine dönemi","#e7b1a6",4],["Peygamberlik, vahiy ve Kur'ân","#e7e3a6",9],["Hukuk, ibadet ve aile","#bce7a6",10],["Mümin, takva ve sabır","#a6e7c1",3],["İnsan ve nefs","#a6e7e2",9],["Tevhid, kâinat ve kozmik deliller","#a6cce7",4],["Diğer","#d3cbbb",22]],"ME":{"1:1":"Rahmân ve rahîm olan Allah’ın adıyla.","1:2":"Hamd (övme ve övülme), âlemlerin Rabbi Allah’a mahsustur.","1:4":"Ceza gününün mâlikidir.","1:5":"(Rabbimiz!) Ancak sana kulluk ederiz ve yalnız senden medet umarız.","1:6":"Bize doğru yolu göster.","1:7":"Kendilerine lütuf ve ikramda bulunduğun kimselerin yolunu; gazaba uğramışların ve sapmışların yolunu değil!","2:1":"Elif. Lâm. Mîm.","2:2":"O kitap (Kur’an); onda asla şüphe yoktur. O, müttakîler (sakınanlar ve arınmak isteyenler) için bir yol göstericidir.","2:3":"Onlar gayba inanırlar, namaz kılarlar, kendilerine verdiğimiz mallardan Allah yolunda harcarlar.","2:4":"Yine onlar, sana indirilene ve senden önce indirilene iman ederler; ahiret gününe de kesinkes inanırlar.","2:5":"İşte onlar, Rablerinden gelen bir hidayet üzeredirler ve kurtuluşa erenler de ancak onlardır.","2:6":"Gerçek şu ki, kâfir olanları (azap ile) korkutsan da korkutmasan da onlar için birdir; iman etmezler.","2:7":"Allah onların kalplerini ve kulaklarını mühürlemiştir. Onların gözlerine de bir çeşit perde gerilmiştir ve onlar için (dünya ve ahirette) büyük bir azap vardır.","2:8":"İnsanlardan bazıları da vardır ki, inanmadıkları halde «Allah’a ve ahiret gününe inandık» derler.","2:9":"Onlar (kendi akıllarınca) güya Allah’ı ve müminleri aldatırlar. Halbuki onlar ancak kendilerini aldatırlar ve bunun farkında değillerdir.","2:10":"Onların kalblerinde bir hastalık vardır. Allah da onların hastalığını çoğaltmıştır. Söylemekte oldukları yalanlar sebebiyle de onlar için elîm bir azap vardır.","2:11":"Onlara: Yeryüzünde fesat çıkarmayın, denildiği zaman, «Biz ancak ıslah edicileriz» derler.","2:12":"Şunu bilin ki, onlar bozguncuların ta kendileridir, lâkin anlamazlar.","2:13":"Onlara: İnsanların iman ettiği gibi siz de iman edin, denildiği vakit «Biz hiç, sefihlerin (akılsız ve ahmak kişilerin) iman ettikleri gibi iman eder miyiz!» derler. Biliniz ki, sefihler ancak kendileridir, fakat bunu bilmezler (veya bilmezlikten gelirler).","2:14":"(Bu münafıklar) müminlerle karşılaştıkları vakit «(Biz de) iman ettik» derler. (Kendilerini saptıran) şeytanları ile başbaşa kaldıklarında ise: Biz sizinle beraberiz, biz onlarla (müminlerle) sadece alay ediyoruz, derler.","2:15":"Gerçekte, Allah onlarla istihza (alay) eder de azgınlıklarında onlara fırsat verir, bu yüzden onlar bir müddet başıboş dolaşırlar.","2:16":"İşte onlar, hidayete karşılık dalâleti satın alanlardır. Ancak onların bu ticareti kazançlı olmamış ve kendileri de doğru yola girememişlerdir.","2:17":"Onların (münafıkların) durumu, (karanlık gecede) bir ateş yakan kimse misalidir. O ateş yanıp da etrafını aydınlattığı anda Allah, hemen onların aydınlığını giderir ve onları karanlıklar içinde bırakır; (artık hiçbir şeyi) görmezler.","2:18":"Onlar sağırlar, dilsizler ve körlerdir. Bu sebeple onlar geri dönemezler.","2:19":"Yahut (onların durumu), gökten sağanak halinde boşanan, içinde yoğun karanlıklar, gürültü ve şimşek bulunan yağmur(a tutulmuş kimselerin durumu) gibidir. O münafıklar yıldırımlardan gelecek ölüm korkusuyla parmaklarını kulaklarına tıkarlar. Halbuki Allah, kâfirleri çepeçevre kuşatmıştır.","2:20":"(O esnada) şimşek sanki gözlerini çıkaracakmış gibi çakar, onlar için etrafı aydınlatınca orada birazcık yürürler, karanlık üzerlerine çökünce de oldukları yerde kalırlar. Allah dileseydi elbette onların kulaklarını sağır, gözlerini kör ederdi. Allah şüphesiz her şeye kadirdir.","2:21":"Ey insanlar! Sizi ve sizden öncekileri yaratan Rabbinize kulluk ediniz. Umulur ki, böylece korunmuş (Allah’ın azabından kendinizi kurtarmış) olursunuz.","2:22":"O Rab ki, yeri sizin için bir döşek, göğü de (kubbemsi) bir tavan yaptı. Gökten su indirerek onunla, size besin olsun diye (yerden) çeşitli ürünler çıkardı. Artık bunu bile bile Allah’a şirk koşmayın.","2:23":"Eğer kulumuza indirdiklerimizden herhangi bir şüpheye düşüyorsanız, haydi onun benzeri bir sûre getirin, eğer iddianızda doğru iseniz Allah’tan gayri şahitlerinizi (yardımcılarınızı) da çağırın.","2:24":"Bunu yapamazsanız -ki elbette yapamayacaksınız- yakıtı, insan ve taş olan cehennem ateşinden sakının. Çünkü o ateş kâfirler için hazırlanmıştır.","2:25":"İman edip iyi davranışlarda bulunanlara, içinden ırmaklar akan cennetler olduğunu müjdele! O cennetlerdeki bir meyveden kendilerine rızık olarak yedirildikçe: Bundan önce dünyada bize verilenlerdendir bu, derler. Bu rızıklar onlara (bazı yönlerden dünyadakine) benzer olarak verilmiştir. Onlar için cennette tertemiz eşler de vardır. Ve onlar orada ebedî kalıcılardır.","2:26":"Şüphesiz Allah (hakkı açıklamak için) sivrisinek ve onun da ötesinde bir varlığı misal getirmekten çekinmez. İman etmişlere gelince, onlar böyle misallerin Rablerinden gelen hak ve gerçek olduğunu bilirler. Kâfir olanlara gelince: Allah böyle misal vermekle ne murat eder? derler. Allah onunla birçok kimseyi saptırır, birçoklarını da doğru yola yöneltir. Verdiği misallerle Allah ancak fâsıkları saptırır (çünkü bunlar birer imtihandır).","2:27":"Onlar öyle (fâsıklar) ki, Allah’a kesin söz verdikten sonra sözlerinden dönerler. Allah’ın, ziyaret edilip hal ve hatırının sorulmasını istediği kimseleri ziyaretten vazgeçerler ve yeryüzünde fitne ve fesat çıkarırlar. İşte onlar gerçekten zarara uğrayanlardır.","2:28":"Siz cansız iken size can veren Allah’ı nasıl inkâr edersiniz? Sonra sizi öldürecek, tekrar sizi diriltecek ve sonunda O’na döndürüleceksiniz.","2:29":"O, yerde ne varsa hepsini sizin için yarattı. Sonra (kendine has bir şekilde) semaya yöneldi, onu yedi gök olarak yaratıp düzenledi (tanzim etti). O, her şeyi hakkıyla bilendir.","2:30":"Hatırla ki Rabbin meleklere: Ben yeryüzünde bir halife yaratacağım, dedi. Onlar: Bizler hamdinle seni tesbih ve seni takdis edip dururken, yeryüzünde fesat çıkaracak, orada kan dökecek birini mi yaratacaksın? dediler. Allah da onlara: Sizin bilemiyeceğinizi herhalde ben bilirim, dedi.","2:31":"Allah Âdem’e bütün isimleri, öğretti. Sonra onları önce meleklere arzedip: Eğer siz sözünüzde sadık iseniz, şunların isimlerini bana bildirin, dedi.","2:32":"Melekler: Yâ Rab! Seni noksan sıfatlardan tenzih ederiz, senin bize öğrettiklerinden başka bizim bilgimiz yoktur. Şüphesiz alîm ve hakîm olan ancak sensin, dediler.","2:33":"(Bunun üzerine:) Ey Âdem! Eşyanın isimlerini meleklere anlat, dedi. Âdem onların isimlerini onlara anlatınca: Ben size, muhakkak semâvat ve arzda görülmeyenleri (oralardaki sırları) bilirim. Bundan da öte, gizli ve açık yapmakta olduklarınızı da bilirim, dememiş miydim? dedi.","2:34":"Hani biz meleklere (ve cinlere): Âdem’e secde edin, demiştik. İblis hariç hepsi secde ettiler. O yüz çevirdi ve büyüklük tasladı, böylece kâfirlerden oldu.","2:35":"Biz: Ey Âdem! Sen ve eşin (Havva) beraberce cennete yerleşin; orada kolaylıkla istediğiniz zaman her yerde cennet nimetlerinden yeyin; sadece şu ağaca yaklaşmayın. Eğer bu ağaçtan yerseniz her ikiniz de kendine kötülük eden zalimlerden olursunuz, dedik.","2:36":"Şeytan onların ayaklarını kaydırıp haddi tecavüz ettirdi ve içinde bulundukları (cennetten) onları çıkardı. Bunun üzerine: Bir kısmınız diğerine düşman olarak ininiz, sizin için yeryüzünde barınak ve belli bir zamana dek yaşamak vardır, dedik.","2:37":"Bu durum devam ederken Âdem, Rabbinden bir takım ilhamlar aldı ve derhal tevbe etti. Çünkü Allah tevbeleri kabul eden ve merhameti bol olandır.","2:38":"Dedik ki: Hepiniz cennetten inin! Eğer benden size bir hidayet gelir de her kim hidayetime tâbi olursa onlar için herhangi bir korku yoktur ve onlar üzüntü çekmezler.","2:39":"İnkâr edip âyetlerimizi yalanlayanlara gelince, onlar cehennemliktir, onlar orada ebedî kalırlar.","2:40":"Ey İsrailoğulları! Size verdiğim nimetlerimi hatırlayın, bana verdiğiniz sözü yerine getirin ki, ben de size vâdettiklerimi vereyim. Yalnızca benden korkun.","2:41":"Elinizdekini (Tevrat’ın aslını) tasdik edici olarak indirdiğime (Kur’an’a) iman edin. Sakın onu inkâr edenlerin ilki olmayın! Âyetlerimi az bir karşılık ile satmayın, yalnız benden (benim azabımdan) korkun.","2:42":"Bilerek hakkı bâtıl ile karıştırmayın, hakkı gizlemeyin.","2:43":"Namazı tam kılın, zekâtı hakkıyla verin, rükû edenlerle beraber rükû edin.","2:44":"(Ey bilginler!) Sizler Kitab’ı (Tevrat’ı) okuduğunuz (gerçekleri bildiğiniz) halde, insanlara iyiliği emredip kendinizi unutuyor musunuz? Aklınızı kullanmıyor musunuz?","2:45":"Sabır ve namaz ile Allah’tan yardım isteyin. Şüphesiz o (sabır ve namaz), Allah’a saygıdan kalbi ürperenler dışında herkese zor ve ağır gelen bir görevdir.","2:46":"Onlar, kesinlikle Rablerine kavuşacaklarını ve O’na döneceklerini düşünen ve bunu kabullenen kimselerdir.","2:47":"Ey İsrailoğulları! Size verdiğim nimetimi ve sizi (bir zamanlar) cümle âleme üstün kıldığımı hatırlayın.","2:48":"Öyle bir günden korkun ki, o günde hiç kimse başkası için herhangi bir ödemede bulunamaz; hiç kimseden (Allah izin vermedikçe) şefaat kabul olunmaz, fidye alınmaz; onlara asla yardım da yapılmaz.","2:49":"Hatırlayın ki, sizi, Firavun taraftarlarından kurtardık. Çünkü onlar size azabın en kötüsünü reva görüyorlar, yeni doğan erkek çocuklarınızı kesiyorlar, (fenalık için) kızlarınızı hayatta bırakıyorlardı. Aslında o size reva görülenlerde Rabbinizden büyük bir imtihan vardı.","2:50":"Bir zamanlar biz sizin için denizi yardık, sizi kurtardık, Firavun’un taraftarlarını da, siz bakıp dururken denizde boğduk.","2:51":"Musa’ya kırk gece (vahyetmek üzere) söz vermiştik. Sonra haksızlık ederek buzağıyı (tanrı) edindiniz.","2:52":"O davranışlarınızdan sonra (akıllanıp) şükredersiniz diye sizi affettik.","2:54":"Musa kavmine demişti ki: Ey kavmim! Şüphesiz siz, buzağıyı (tanrı) edinmekle kendinize kötülük ettiniz. Onun için Yaradanınıza tevbe edin de nefislerinizi (kötü duygularınızı) öldürün. Öyle yapmanız Yaratıcınızın katında sizin için daha iyidir. Böylece Allah tevbenizi kabul etmiş olur. Çünkü acıyıp tevbeleri kabul eden ancak O’dur.","2:55":"Bir zamanlar: Ey Musa! Biz Allah’ı açıkça görmedikçe asla sana inanmayız, demiştiniz de bakıp durur olduğunuz halde hemen sizi yıldırım çarpmıştı.","2:56":"Sonra ölümünüzün ardından sizi dirilttik ki şükredesiniz.","2:57":"Ve sizi bulutla gölgeledik, size kudret helvası ve bıldırcın gönderdik ve «Verdiğimiz güzel nimetlerden yeyiniz» (dedik). Hakikatta onlar bize değil sadece kendilerine kötülük ediyorlardı.","2:58":"(İsrailoğullarına:) Bu kasabaya girin, orada bulunanlardan dilediğiniz şekilde bol bol yeyin, kapısından eğilerek girin, (girerken) «Hıtta!» (Yâ Rabbi bizi affet) deyin ki, sizin hatalarınızı bağışlayalım; zira biz, iyi davrananlara (karşılığını) fazlasıyla vereceğiz, demiştik.","2:59":"Fakat zalimler, kendilerine söylenenleri başka sözlerle değiştirdiler. Bunun üzerine biz, yapmakta oldukları kötülükler sebebiyle zalimlerin üzerine gökten acı bir azap indirdik.","2:60":"Musa (çölde) kavmi için su istemişti de biz ona: Değneğinle taşa vur! demiştik. Derhal (taştan) oniki kaynak fışkırdı. Her bölük, içeceği kaynağı bildi. (Onlara:) Allah’ın rızkından yeyin, için, sakın yeryüzünde bozgunculuk etmeyin, dedik.","2:61":"Hani siz (verilen nimetlere karşılık): Ey Musa! Bir tek yemekle yetinemeyiz; bizim için Rabbine dua et de yerin bitirdiği şeylerden; sebzesinden, hıyarından, sarımsağından, mercimeğinden, soğanından bize çıkarsın, dediniz. Musa ise: Daha iyiyi daha kötü ile değiştirmek mi istiyorsunuz? O halde şehre inin. Zira istedikleriniz sizin için orada var, dedi. İşte (bu hadiseden sonra) üzerlerine aşağılık ve yoksulluk damgası vuruldu. Allah’ın gazabına uğradılar. Bu musibetler (onların başına), Allah’ın âyetlerini inkâra devam etmeleri, haksız olarak peygamberleri öldürmeleri sebebiyle geldi. Bunların hepsi, sadece isyanları ve taşkınlıkları sebebiyledir.","2:62":"Şüphesiz iman edenler; yahudilerden, hıristiyanlardan ve sâbiîlerden de Allah’a ve ahiret gününe inanıp sâlih amel işleyenler için Rableri katında mükâfatlar vardır. Onlar için herhangi bir korku yoktur onlar üzüntü çekmeyeceklerdir.","2:63":"Sizden sağlam bir söz almış, Tûr dağının altında, size verdiğimizi kuvvetle tutun, onda bulunanları daima hatırlayın, umulur ki, korunursunuz (demiştik de);","2:64":"Ondan sonra sözünüzden dönmüştünüz. Eğer sizin üzerinizde Allah’ın ihsanı ve rahmeti olmasaydı, muhakkak zarara uğrayanlardan olurdunuz.","2:65":"İçinizden cumartesi günü azgınlık edip de, bu yüzden kendilerine: Aşağılık maymunlar olun! dediklerimizi elbette bilmektesiniz.","2:66":"Biz bunu (maymunlaşmış insanları), hadiseyi bizzat görenlere ve sonradan gelenlere bir ibret dersi, müttakîler için de bir öğüt vesilesi kıldık.","2:67":"Musa, kavmine: Allah bir sığır kesmenizi emrediyor, demişti de: Bizimle alay mı ediyorsun? demişlerdi. O da: Cahillerden olmaktan Allah’a sığınırım, demişti.","2:68":"«Bizim adımıza Rabbine dua et, bize onun ne olduğunu açıklasın» dediler. Musa: Allah diyor ki: «O, ne yaşlı ne de körpe; ikisi arasında bir inek.» Size emredileni hemen yapın, dedi.","2:69":"Bu defa: Bizim için Rabbine dua et, bize onun rengini açıklasın, dediler. «O diyor ki: Sarı renkli, parlak tüylü, bakanların içini açan bir inektir» dedi.","2:71":"(Musa) dedi ki: Allah şöyle buyuruyor: O, henüz boyunduruk altına alınmayan, yer sürmeyen, ekin sulamayan, serbest dolaşan (salma), renginde hiç alacası bulunmayan bir inektir. «İşte şimdi gerçeği anlattın» dediler ve bunun üzerine (onu bulup) kestiler, ama az kalsın kesmeyeceklerdi.","2:72":"Hani siz bir adam öldürmüştünüz de onun hakkında birbirinizle atışmıştınız. Halbuki Allah gizlemekte olduğunuzu ortaya çıkaracaktır.","2:74":"(Ne var ki) bunlardan sonra yine kalpleriniz katılaştı. Artık kalpleriniz taş gibi yahut daha da katıdır. Çünkü taşlardan öylesi var ki, içinden ırmaklar kaynar. Öylesi de var ki, çatlar da ondan su fışkırır. Taşlardan bir kısmı da Allah korkusuyla yukardan aşağı yuvarlanır. Allah yapmakta olduklarınızdan gafil değildir.","2:75":"Şimdi (ey müminler!) onların size inanacaklarını mı umuyorsunuz? Oysa ki, onlardan bir zümre, Allah’ın kelâmını işitirler de iyice anladıktan sonra, bile bile onu tahrif ederlerdi.","2:76":"(Münafıklar) inananlarla karşılaştıklarında «İman ettik» derler. Birbirleriyle başbaşa kaldıkları vakit ise: Allah’ın size açtıklarını (Tevrat’taki bilgileri), Rabbiniz katında sizin aleyhinize hüccet getirmeleri için mi onlara anlatıyorsunuz; bunları düşünemiyor musunuz? derler.","2:77":"Onlar bilmezler mi ki, gizlediklerini de açıkça yaptıklarını da Allah bilmektedir.","2:78":"İçlerinde bir takım ümmîler vardır ki, Kitab’ı (Tevrat’ı) bilmezler. Bütün bildikleri kulaktan dolma şeylerdir. Onlar sadece zan ve tahminde bulunuyorlar.","2:79":"Elleriyle (bir) Kitap yazıp sonra onu az bir bedel karşılığında satmak için «Bu Allah katındandır» diyenlere yazıklar olsun! Elleriyle yazdıklarından ötürü vay haline onların! Ve kazandıklarından ötürü vay haline onların!","2:80":"İsrailoğulları: Sayılı birkaç gün müstesna, bize ateş dokunmayacaktır, dediler. De ki (onlara): Siz Allah katından bir söz mü aldınız -ki Allah sözünden caymaz-, yoksa Allah hakkında bilmediğiniz şeyleri mi söylüyorsunuz?","2:81":"Hayır! Kim bir kötülük eder de kötülüğü kendisini çepeçevre kuşatırsa işte o kimseler cehennemliktirler. Onlar orada devamlı kalırlar.","2:83":"Vaktiyle biz, İsrailoğullarından: Yalnızca Allah’a kulluk edeceksiniz, ana-babaya, yakın akrabaya, yetimlere, yoksullara iyilik edeceksiniz diye söz almış ve «İnsanlara güzel söz söyleyin, namazı kılın, zekâtı verin» diye de emretmiştik. Sonunda azınız müstesna, yüz çevirerek dönüp gittiniz.","2:84":"(Ey İsrailoğulları!) Birbirinizin kanını dökmeyeceğinize, birbirinizi yurtlarınızdan çıkarmayacağınıza dair sizden söz almıştık. Her şeyi görerek sonunda bunları kabul etmiştiniz.","2:85":"Bu misakı kabul eden sizler, (verdiğiniz sözün tersine) birbirinizi öldürüyor, aranızdan bir zümreyi yurtlarından çıkarıyor, kötülük ve düşmanlıkta onlara karşı birleşiyorsunuz. Onları yurtlarından çıkarmak size haram olduğu halde (hem çıkarıyor hem de) size esirler olarak geldiklerinde fidye verip onları kurtarıyorsunuz. Yoksa siz Kitab’ın bir kısmına inanıp bir kısmını inkâr mı ediyorsunuz? Sizden öyle davrananların cezası dünya hayatında ancak rüsvaylık; kıyamet gününde ise en şiddetli azaba itilmektir. Allah sizin yapmakta olduklarınızdan asla gafil değildir.","2:86":"İşte onlar, ahirete karşılık dünya hayatını satın alan kimselerdir. Bu yüzden ne azapları hafifletilecek ne de kendilerine yardım edilecektir.","2:87":"Andolsun biz Musa’ya Kitab’ı verdik. Ondan sonra ardarda peygamberler gönderdik. Meryem oğlu İsa’ya da deliller verdik. Ve onu, Rûhu’l-Kudüs (Cebrail) ile destekledik. Ama ne zaman size bir peygamber nefislerinizin hoşlanmadığı bir şey getirdiyse büyüklük taslayarak kimini yalanladığınız kimini de öldürdüğünüz doğru değil mi!","2:88":"(Yahudiler peygamberlerle alay ederek) «Kalplerimiz perdelidir» dediler. Hayır; küfür ve isyanları sebebiyle Allah onlara lânet etmiştir. O yüzden çok az inanırlar.","2:89":"Daha önce kâfirlere karşı zafer isterlerken kendilerine Allah katından ellerindeki (Tevrat’ı) doğrulayan bir kitap gelip de (Tevrat’tan) bilip öğrendikleri gerçekler karşılarına dikilince onu inkâr ettiler. İşte Allah’ın lâneti böyle inkârcılaradır.","2:90":"Allah’ın kullarından dilediğine peygamberlik ihsan etmesini kıskandıkları için Allah’ın indirdiğini (Kur’an’ı) inkâr ederek kendilerini harcamaları ne kötü bir şeydir! Böylece onlar, gazap üstüne gazaba uğradılar. Ayrıca kâfirler için alçaltıcı bir azap vardır.","2:91":"Kendilerine: Allah’ın indirdiğine iman edin, denilince: Biz sadece bize indirilene (Tevrat’a) inanırız, derler ve ondan başkasını inkâr ederler. Halbuki o Kur’an, kendi ellerinde bulunan Tevrat’ı doğrulayıcı olarak gelmiş hak kitaptır. (Ey Muhammed!) Onlara: Şayet siz gerçekten inanıyor idiyseniz daha önce Allah’ın peygamberlerini neden öldürüyordunuz? deyiver.","2:94":"(Ey Muhammed, onlara:) Şayet (iddia ettiğiniz gibi) ahiret yurdu Allah katında diğer insanlara değil de yalnızca size aitse ve bu iddianızda doğru iseniz haydi ölümü temenni edin (bakalım), de.","2:95":"Onlar, kendi elleriyle önceden yaptıkları işler (günah ve isyanları) sebebiyle hiç bir zaman ölümü temenni etmeyeceklerdir. Allah zalimleri iyi bilir.","2:96":"Yemin olsun ki, sen onları yaşamaya karşı insanların en düşkünü olarak bulursun. Putperestlerden her biri de arzular ki, bin sene yaşasın. Oysa yaşatılması onu azaptan uzaklaştırmaz. Allah onların yapmakta olduklarını eksiksiz görür.","2:97":"De ki: Cebrail’e kim düşman ise şunu iyi bilsin ki Allah’ın izniyle Kur’an’ı senin kalbine bir hidayet rehberi, önce gelen kitapları doğrulayıcı ve müminler için de müjdeci olarak o indirmiştir.","2:98":"Kim, Allah’a, meleklerine, peygamberlerine, Cebrail’e ve Mikâil’e düşman olursa bilsin ki Allah da inkârcı kâfirlerin düşmanıdır.","2:99":"Andolsun ki sana apaçık âyetler indirdik. (Ey Muhammed!) Onları ancak fasıklar inkâr eder.","2:100":"Ne zaman onlar bir antlaşma yaptılarsa, yine kendilerinden bir grup onu bozmadı mı? Zaten onların çoğu iman etmez.","2:101":"Allah tarafından kendilerine, yanlarında bulunanı tasdik edici bir elçi gelince ehl-i kitaptan bir gurup, sanki Allah’ın kitabını bilmiyormuş gibi onu arkalarına atıp terkettiler.","2:102":"Süleyman’ın hükümranlığı hakkında onlar, şeytanların uydurup söylediklerine tâbi oldular. Halbuki Süleyman büyü yapıp kâfir olmadı. Lâkin şeytanlar kâfir oldular. Çünkü insanlara sihri ve Babil’de Hârut ile Mârut isimli iki meleğe indirileni öğretiyorlardı. Halbuki o iki melek, herkese: Biz ancak imtihan için gönderildik, sakın yanlış inanıp da kâfir olmayasınız, demeden hiç kimseye (sihir ilmini) öğretmezlerdi. Onlar, o iki melekden, karı ile koca arasını açacak şeyleri öğreniyorlardı. Oysa büyücüler, Allah’ın izni olmadan hiç kimseye zarar veremezler. Onlar, kendilerine fayda vereni değil de zarar vereni öğrenirler. Sihri satın alanların (ona inanıp para verenlerin) ahiretten nasibi olmadığını çok iyi bilmektedirler. Karşılığında kendilerini sattıkları şey ne kötüdür! Keşke bunu anlasalardı!","2:103":"Eğer iman edip kendilerini kötülükten korusalardı, şüphesiz, Allah tarafından verilecek sevap daha hayırlı olacaktı. Keşke bunları anlasalardı!","2:104":"Ey iman edenler! «Râinâ» demeyin, «unzurnâ» deyin. (Söylenenleri) dinleyin. Kâfirler için elem verici bir azap vardır.","2:105":"(Ey müminler!) Ehl-i Kitaptan kâfirler ve putperestler de Rabbinizden size bir hayır indirilmesini istemezler. Halbuki Allah rahmetini dilediğine verir. Allah büyük lütuf sahibidir.","2:106":"Biz, bir âyetin hükmünü yürürlükten kaldırır veya onu unutturursak (ertelersek) mutlaka daha iyisini veya benzerini getiririz. Bilmez misin ki Allah her şeye kadirdir.","2:108":"Yoksa siz de (ey müslümanlar), daha önce Musa’ya sorulduğu gibi peygamberinize sorular sormak mı istiyorsunuz? Kim imanı küfre değişirse, şüphesiz dosdoğru yoldan sapmış olur.","2:109":"Ehl-i kitaptan çoğu, hakikat kendilerine apaçık belli olduktan sonra, sırf içlerindeki kıskançlıktan ötürü, sizi imanınızdan vazgeçirip küfre döndürmek istediler. Yine de siz, Allah onlar hakkındaki emrini getirinceye kadar affedip bağışlayın. Şüphesiz Allah her şeye kadirdir.","2:111":"(Ehl-i kitap:) Yahudiler yahut hıristiyanlar hariç hiç kimse cennete giremeyecek, dediler. Bu onların kuruntusudur. Sen de onlara: Eğer sahiden doğru söylüyorsanız delilinizi getirin, de.","2:112":"Bilâkis, kim muhsin olarak yüzünü Allah’a döndürürse (Allah’a hakkıyla kulluk ederse) onun ecri Rabbi katındadır. Öyleleri için ne bir korku vardır, ne de üzüntü çekerler.","2:113":"Hepsi de kitabı (Tevrat ve İncil’i) okumakta oldukları halde Yahudiler: Hıristiyanlar doğru yolda değillerdir, dediler. Hıristiyanlar da: Yahudiler doğru yolda değillerdir, dediler. (Kitabı) bilmeyenler de birbirleri hakkında tıpkı onların söylediklerini söylediler. Allah, ihtilâfa düştükleri hususlarda kıyamet günü onlar hakkında hükmünü verecektir.","2:114":"Allah’ın mescidlerinde O’nun adının anılmasına engel olan ve onların harap olmasına çalışandan daha zalim kim vardır! Aslında bunların oralara ancak korkarak girmeleri gerekir. (Başka türlü girmeye hakları yoktur.) Bunlar için dünyada rezillik, ahirette de büyük azap vardır.","2:115":"Doğu da Allah’ındır batı da. Nereye dönerseniz Allah’ın yüzü (zatı) oradadır. Şüphesiz Allah’(ın rahmeti ve nimeti) geniştir, O her şeyi bilendir.","2:116":"«Allah çocuk edindi» dediler. Hâşâ! O, bundan münezzehtir. Göklerde ve yerde olanların hepsi O’nundur, hepsi O’na boyun eğmiştir.","2:117":"(O), göklerin ve yerin eşsiz yaratıcısıdır. Bir şeyi dilediğinde ona sadece «Ol!» der, o da hemen oluverir.","2:119":"Doğrusu biz seni Hak (Kur’an) ile müjdeleyici ve uyarıcı olarak gönderdik. Sen cehennemliklerden sorumlu değilsin.","2:120":"Dinlerine uymadıkça yahudiler de hıristiyanlar da asla senden razı olmayacaklardır. De ki: Doğru yol, ancak Allah’ın yoludur. Sana gelen ilimden sonra onların arzularına uyacak olursan, andolsun ki, Allah’tan sana ne bir dost ne de bir yardımcı vardır.","2:124":"Bir zamanlar Rabbi İbrahim’i bir takım kelimelerle sınamış, onları tam olarak yerine getirince: Ben seni insanlara önder yapacağım, demişti. «Soyumdan da (önderler yap, yâ Rabbi!) » dedi. Allah: Ahdim zalimlere ermez (onlar için söz vermem) buyurdu.","2:125":"Biz, Beyt’i (Kâbe’yi) insanlara toplanma mahalli ve güvenli bir yer kıldık. Siz de İbrahim’in makamından bir namaz yeri edinin (orada namaz kılın). İbrahim ve İsmail’e: Tavaf edenler, ibadete kapananlar, rükû ve secde edenler için Evim’i temiz tutun, diye emretmiştik.","2:126":"İbrahim de demişti ki: Ey Rabbim! Burayı emin bir şehir yap, halkından Allah’a ve ahiret gününe inananları çeşitli meyvelerle besle. Allah buyurdu ki: Kim inkâr ederse onu az bir süre faydalandırır, sonra onu cehennem azabına sürüklerim. Ne kötü varılacak yerdir orası!","2:127":"Bir zamanlar İbrahim, İsmail ile beraber Beytullah’ın temellerini yükseltiyor, (şöyle diyorlardı:) Ey Rabbimiz! Bizden bunu kabul buyur; şüphesiz sen işitensin, bilensin.","2:128":"Ey Rabbimiz! Bizi sana boyun eğenlerden kıl, neslimizden de sana itaat eden bir ümmet çıkar, bize ibadet usullerimizi göster, tevbemizi kabul et; zira, tevbeleri çokça kabul eden, çok merhametli olan ancak sensin.","2:129":"Ey Rabbimiz! Onlara, içlerinden senin âyetlerini kendilerine okuyacak, onlara kitap ve hikmeti öğretecek, onları temizleyecek bir peygamber gönder. Çünkü üstün gelen, her şeyi yerli yerince yapan yalnız sensin.","2:130":"İbrahim’in dininden kendini bilmezlerden başka kim yüz çevirir? Andolsun ki, biz onu dünyada (elçi) seçtik, şüphesiz o ahirette de iyilerdendir.","2:132":"Bunu İbrahim de kendi oğullarına vasiyet etti, Ya’kub da, «Oğullarım! Allah sizin için bu dini (İslâm’ı) seçti. O halde sadece müslümanlar olarak ölünüz» (dediler).","2:133":"Yoksa Ya’kub’a ölüm geldiği zaman siz orada mı idiniz? O zaman (Ya’kub) oğullarına: Benden sonra kime kulluk edeceksiniz? demişti. Onlar: Senin ve ataların İbrahim, İsmail ve İshak’ın ilâhı olan tek Allah’a kulluk edeceğiz; biz ancak O’na teslim olmuşuzdur, dediler.","2:135":"(Yahudiler ve hıristiyanlar müslümanlara:) Yahudi ya da hıristiyan olun ki, doğru yolu bulasınız, dediler. De ki: Hayır! Biz, hanîf olan İbrahim’in dinine uyarız. O, müşriklerden değildi.","2:136":"«Biz, Allah’a ve bize indirilene; İbrahim, İsmail, İshak, Ya’kub ve esbâta indirilene, Musa ve İsa’ya verilenlerle Rableri tarafından diğer peygamberlere verilenlere, onlardan hiçbiri arasında fark gözetmeksizin inandık ve biz sadece Allah’a teslim olduk» deyin.","2:137":"Eğer onlar da sizin inandığınız gibi inanırlarsa doğru yolu bulmuş olurlar; dönerlerse mutlaka anlaşmazlık içine düşmüş olurlar. Onlara karşı Allah sana yeter. O işitendir, bilendir.","2:138":"Allah’ın (verdiği) rengiyle boyandık. Allah’tan daha güzel rengi kim verebilir? Biz ancak O’na kulluk ederiz (deyin).","2:143":"İşte böylece sizin insanlığa şahitler olmanız, Resûl’ün de size şahit olması için sizi mutedil bir millet kıldık. Senin yöneldiğin yeri (Kâbe’yi) biz ancak Peygamber’e uyanı, ökçeleri üzerinde geri dönenden ayırdetmemiz için kıble yaptık. Bu, Allah’ın hidayet verdiği kimselerden başkasına elbette ağır gelir. Allah sizin imanınızı asla zayi edecek değildir. Zira Allah insanlara karşı şefkatli ve merhametlidir.","2:144":"(Ey Muhammed!) Biz senin yüzünün göğe doğru çevrilmekte olduğunu (yücelerden haber beklediğini) görüyoruz. İşte şimdi, seni memnun olacağın bir kıbleye döndürüyoruz. Artık yüzünü Mescid-i Haram tarafına çevir. (Ey müslümanlar!) Siz de nerede olursanız olun, (namazda) yüzlerinizi o tarafa çevirin. Şüphe yok ki, ehl-i kitap, onun Rablerinden gelen gerçek olduğunu çok iyi bilirler. Allah onların yapmakta olduklarından habersiz değildir.","2:147":"Gerçek olan, Rabbinden gelendir. O halde kuşkulananlardan olma!","2:148":"Herkesin yöneldiği bir kıblesi vardır. (Ey müminler!) Siz hayır işlerinde yarışın. Nerede olursanız olun sonunda Allah hepinizi bir araya getirir. Şüphesiz Allah her şeye kadirdir.","2:152":"Öyle ise siz beni (ibadetle) anın ki ben de sizi anayım. Bana şükredin; sakın bana nankörlük etmeyin!","2:155":"Andolsun ki sizi biraz korku ve açlık; mallardan, canlardan ve ürünlerden biraz azaltma (fakirlik) ile deneriz. (Ey Peygamber!) Sabredenleri müjdele!","2:158":"Şüphe yok ki, Safa ile Merve Allah’ın koyduğu nişanlardandır. Her kim Beytullah’ı ziyaret eder veya umre yaparsa onları tavaf etmesinde kendisine bir günah yoktur. Her kim gönüllü olarak bir iyilik yaparsa şüphesiz Allah kabul eder ve (yapılanı) hakkıyla bilir.","2:160":"Ancak tevbe edip durumlarını düzeltenler ve gerçeği açıkça ortaya koyanlar başkadır. Zira ben onların tevbelerini kabul ederim. Ben tevbeyi çokça kabul eden ve çokça esirgeyenim.","2:164":"Şüphesiz göklerin ve yerin yaratılmasında, gece ile gündüzün birbiri peşinden gelmesinde, insanlara fayda veren şeylerle yüklü olarak denizde yüzüp giden gemilerde, Allah’ın gökten indirip de ölü haldeki toprağı canlandırdığı suda, yeryüzünde her çeşit canlıyı yaymasında, rüzgârları ve yer ile gök arasında emre hazır bekleyen bulutları yönlendirmesinde düşünen bir toplum için (Allah’ın varlığını ve birliğini isbatlayan) birçok deliller vardır.","2:165":"İnsanlardan bazıları Allah’tan başkasını Allah’a denk tanrılar edinir de onları Allah’ı sever gibi severler. İman edenlerin Allah’a olan sevgileri ise (onlarınkinden) çok daha fazladır. Keşke zalimler azabı gördükleri zaman (anlayacakları gibi) bütün kuvvetin Allah’a ait olduğunu ve Allah’ın azabının çok şiddetli olduğunu önceden anlayabilselerdi.","2:166":"İşte o zaman (görecekler ki) kendilerine uyulup arkalarından gidilenler, uyanlardan hızla uzaklaşırlar ve (o anda her iki taraf da) azabı görmüş, nihayet aralarındaki bağlar kopup parçalanmıştır.","2:167":"(Kötülere) uyanlar şöyle derler: Ah, keşke bir daha dünyaya geri gitmemiz mümkün olsaydı da, şimdi onların bizden uzaklaştıkları gibi biz de onlardan uzaklaşsaydık! Böylece Allah onlara, işlerini, pişmanlık ve üzüntü kaynağı olarak gösterir ve onlar artık ateşten çıkamazlar.","2:168":"Ey insanlar! Yeryüzünde bulunanların helâl ve temiz olanlarından yeyin, şeytanın peşine düşmeyin; zira şeytan sizin açık bir düşmanınızdır.","2:169":"O size ancak kötülüğü, çirkini ve Allah hakkında bilmediğiniz şeyleri söylemenizi emreder.","2:170":"Onlara (müşriklere): Allah’ın indirdiğine uyun, denildiği zaman onlar, «Hayır! Biz atalarımızı üzerinde bulduğumuz yola uyarız» dediler. Ya ataları bir şey anlamamış, doğruyu da bulamamış idiyseler?","2:171":"(Hidayet çağrısına kulak vermeyen) kâfirlerin durumu, sadece çobanın bağırıp çağırmasını işiten hayvanların durumuna benzer. Çünkü onlar sağırlar, dilsizler ve körlerdir. Bu sebeple düşünmezler.","2:173":"Allah size ancak ölüyü (leşi), kanı, domuz etini ve Allah’tan başkası adına kesileni haram kıldı. Her kim bunlardan yemeye mecbur kalırsa, başkasının hakkına saldırmadan ve haddi aşmadan bir miktar yemesinde günah yoktur. Şüphe yok ki Allah çokça bağışlayan çokça esirgeyendir","2:174":"Allah’ın indirdiği kitaptan bir şeyi (âhir zaman Peygamberinin vasıflarını) gizleyip onu az bir paha ile değişenler yok mu, işte onların yeyip de karınlarına doldurdukları, ateşten başka bir şey değildir. Kıyamet günü Allah ne kendileriyle konuşur ve ne de onları temize çıkarır. Orada onlar için can yakıcı bir azap vardır.","2:177":"İyilik, yüzlerinizi doğu ve batı tarafına çevirmeniz değildir. Asıl iyilik, o kimsenin yaptığıdır ki, Allah’a, ahiret gününe, meleklere, kitaplara, peygamberlere inanır. (Allah’ın rızasını gözeterek) yakınlara, yetimlere, yoksullara, yolda kalmışlara, dilenenlere ve kölelere sevdiği maldan harcar, namaz kılar, zekât verir. Antlaşma yaptığı zaman sözlerini yerine getirir. Sıkıntı, hastalık ve savaş zamanlarında sabreder. İşte doğru olanlar, bu vasıfları taşıyanlardır. Müttakîler ancak onlardır!","2:178":"Ey iman edenler! Öldürülenler hakkında size kısas farz kılındı. Hüre hür, köleye köle, kadına kadın (öldürülür). Ancak her kimin cezası, kardeşi (öldürülenin velisi) tarafından bir miktar bağışlanırsa artık (taraflar) hakkaniyete uymalı ve (öldüren) ona (gereken diyeti) güzellikle ödemelidir. Bu söylenenler, Rabbinizden bir hafifletme ve rahmettir. Her kim bundan sonra haddi aşarsa muhakkak onun için elem verici bir azap vardır.","2:179":"Ey akıl sahipleri! Kısasta sizin için hayat vardır. Umulur ki suç işlemekten sakınırsınız.","2:182":"Her kim, vasiyet edenin haksızlığa yahut günaha meyletmesinden endişe eder de (alâkalıların) aralarını bulursa kendisine günah yoktur. Şüphesiz Allah çok bağışlayan hem de esirgeyendir.","2:183":"Ey iman edenler! Oruç sizden önce gelip geçmiş ümmetlere farz kılındığı gibi size de farz kılındı. Umulur ki korunursunuz.","2:184":"Sayılı günlerde olmak üzere (oruç size farz kılındı). Sizden her kim hasta yahut yolcu olursa (tutamadığı günler kadar) diğer günlerde kaza eder. (İhtiyarlık veya şifa umudu kalmamış hastalık gibi devamlı mazereti olup da) oruç tutmaya güçleri yetmeyenlere bir fakiri doyuracak fidye gerekir. Bununla beraber kim gönüllü olarak hayır yaparsa, bu kendisi için daha iyidir. Eğer bilirseniz (güçlüğüne rağmen) oruç tutmanız sizin için daha hayırlıdır.","2:185":"Ramazan ayı, insanlara yol gösterici, doğrunun ve doğruyu eğriden ayırmanın açık delilleri olarak Kur’an’ın indirildiği aydır. Öyle ise sizden ramazan ayını idrak edenler onda oruç tutsun. Kim o anda hasta veya yolcu olursa (tutamadığı günler sayısınca) başka günlerde kaza etsin. Allah sizin için kolaylık ister, zorluk istemez. Bütün bunlar, sayıyı tamamlamanız ve size doğru yolu göstermesine karşılık, Allah’ı tazim etmeniz, şükretmeniz içindir.","2:186":"Kullarım sana, beni sorduğunda (söyle onlara): Ben çok yakınım. Bana dua ettiği vakit dua edenin dileğine karşılık veririm. O halde (kullarım da) benim davetime uysunlar ve bana inansınlar ki doğru yolu bulalar.","2:187":"Oruç gecesinde kadınlarınıza yaklaşmak size helâl kılındı. Onlar sizin için birer elbise, siz de onlar için birer elbisesiniz. Allah sizin kendinize kötülük ettiğinizi bildi ve tevbenizi kabul edip sizi bağışladı. Artık (ramazan gecelerinde) onlara yaklaşın ve Allah’ın sizin için takdir ettiklerini isteyin. Sabahın beyaz ipliği (aydınlığı), siyah ipliğinden (karanlığından) ayırt edilinceye kadar yeyin, için, sonra akşama kadar orucu tamamlayın. Mescitlerde ibadete çekilmiş olduğunuz zamanlarda kadınlarla birleşmeyin. Bunlar Allah’ın koyduğu sınırlardır. Sakın bu sınırlara yaklaşmayın. İşte böylece Allah âyetlerini insanlara açıklar. Umulur ki korunurlar.","2:188":"Mallarınızı aranızda haksız sebeplerle yemeyin. Kendiniz bilip dururken, insanların mallarından bir kısmını haram yollardan yemeniz için o malları hakimlere (idarecilere veya mahkeme hakimlerine) vermeyin.","2:189":"Sana, hilâl şeklinde yeni doğan ayları sorarlar. De ki: Onlar, insanlar ve özellikle hac için vakit ölçüleridir. İyi davranış, asla evlere arkalarından gelip girmeniz değildir. Lâkin iyi davranış, korunan (ve ölçülü giden) kimsenin davranışıdır. Evlere kapılarından girin, Allah’tan korkun, umulur ki kurtuluşa erersiniz.","2:191":"Onları (size karşı savaşanları) yakaladığınız yerde öldürün. Sizi çıkardıkları yerden siz de onları çıkarın. Fitne, adam öldürmekten daha kötüdür. Mescid-i Haram’da onlar sizinle savaşmadıkça, siz de onlarla savaşmayın. Eğer onlar size karşı savaş açarlarsa siz de onları öldürün. İşte kâfirlerin cezası böyledir.","2:192":"Eğer onlar (savaştan) vazgeçerlerse, (şunu iyi bilin ki) Allah gafûr ve rahîmdir.","2:195":"Allah yolunda harcayın. Kendi ellerinizle kendinizi tehlikeye atmayın. Yaptığınızı güzel yapın; Allah güzel yapanları sever.","2:196":"Haccı ve umreyi Allah için tam yapın. Eğer (bunlardan) alıkonursanız kolayınıza gelen kurbanı gönderin. Kurban, yerine varıncaya kadar başlarınızı tıraş etmeyin. Sizden her kim hasta olursa yahut başından bir rahatsızlığı varsa, oruç veya sadaka veya kurban olmak üzere fidye gerekir. (Hac yolculuğu için) emin olduğunuz vakit kim hac günlerine kadar umre ile faydalanmak isterse, kolayına gelen bir kurban kesmek gerekir. Kurban kesmeyen kimse hac günlerinde üç, memleketine döndüğü zaman yedi olmak üzere oruç tutar ki, hepsi tam on gündür. Bu söylenenler, ailesi Mescid-i Haram civarında oturmayanlar içindir. Allah’tan korkun. Biliniz ki Allah’ın vereceği ceza ağırdır.","2:197":"Hac, bilinen aylardadır. Kim o aylarda hacca niyet ederse (ihramını giyerse), hac esnasında kadına yaklaşmak, günah sayılan davranışlara yönelmek, kavga etmek yoktur. Ne hayır işlerseniz Allah onu bilir. (Ey müminler! Ahiret için) azık edinin. Bilin ki azığın en hayırlısı takvâdır. Ey akıl sahipleri! Benden (emirlerime muhalefetten) sakının.","2:198":"(Hac mevsiminde ticaret yaparak) Rabbinizden gelecek bir lütfu (kazancı) aramanızda size herhangi bir günah yoktur. Arafat’tan ayrılıp akın ettiğinizde Meş’ar-i Haram’da Allah’ı zikredin ve O’nu size gösterdiği şekilde anın. Şüphesiz siz daha önce yanlış gidenlerden idiniz","2:202":"İşte onlar için, kazandıklarından büyük bir nasip vardır. (Şüphesiz) Allah’ın hesabı çok süratlidir.","2:203":"Sayılı günlerde (eyyam-ı teşrikte telbiye ve tekbir getirerek) Allah’ı anın. Kim iki gün içinde acele edip (Mina’dan Mekke’ye) dönmek isterse, ona günah yoktur. Kim geri kalırsa ona da günah yoktur. Bunlar günahtan sakınanlar içindir. Allah’tan korkun ve bilin ki hepiniz O’nun huzurunda toplanacaksınız.","2:204":"İnsanlardan öyleleri vardır ki, dünya hayatı hakkında söyledikleri senin hoşuna gider. Hatta böylesi kalbinde olana (samimi olduğuna) Allah’ı şahit tutar. Halbuki o, hasımların en yamanıdır.","2:205":"O, dönüp gitti mi (yahut bir iş başına geçti mi) yeryüzünde ortalığı fesada vermek, ekinleri tahrip edip nesilleri bozmak için çalışır. Allah bozgunculuğu sevmez.","2:206":"Böylesine «Allah’tan kork!» denilince benlik ve gurur kendisini günaha sevkeder. (Ceza ve azap olarak) ona cehennem yeter. O ne kötü yerdir!","2:208":"Ey iman edenler! Hep birden barışa girin. Sakın şeytanın peşinden gitmeyin. Çünkü o, apaçık düşmanınızdır.","2:210":"Onlar, ille de buluttan gölgeler içinde Allah’ın ve meleklerinin gelmesini mi beklerler? Halbuki iş bitirilmiştir. (Allah nizamı artık değişmez.) Bütün işler yalnızca Allah’a döndürülür.","2:212":"Kâfir olanlar için dünya hayatı câzip kılındı. (Bu yüzden) onlar, iman edenler ile alay ederler. Oysa ki, (iman edip) inkârdan sakınanlar kıyamet gününde onların üstündedir. Allah dilediğine hesapsız lutufta bulunur.","2:214":"(Ey müminler!) Yoksa siz, sizden önce gelip geçenlerin başına gelenler size de gelmeden cennete gireceğinizi mi sandınız? Yoksulluk ve sıkıntı onlara öylesine dokunmuş ve öyle sarsılmışlardı ki, nihayet Peygamber ve beraberindeki müminler: Allah’ın yardımı ne zaman! dediler. Bilesiniz ki Allah’ın yardımı yakındır.","2:216":"Hoşunuza gitmediği halde savaş size farz kılındı. Sizin için daha hayırlı olduğu halde bir şeyi sevmemeniz mümkündür. Sizin için daha kötü olduğu halde bir şeyi sevmeniz de mümkündür. Allah bilir, siz bilmezsiniz.","2:217":"Sana haram ayı, yani onda savaşmayı soruyorlar. De ki: O ayda savaşmak büyük bir günahtır. (İnsanları) Allah yolundan çevirmek, Allah’ı inkâr etmek, Mescid-i Haram’ın ziyaretine mâni olmak ve halkını oradan çıkarmak ise Allah katında daha büyük günahtır. Fitne de adam öldürmekten daha büyük bir günahtır. Onlar eğer güçleri yeterse, sizi dininizden döndürünceye kadar size karşı savaşa devam ederler. Sizden kim, dininden döner ve kâfir olarak ölürse, onların yaptıkları işler dünyada da ahirette de boşa gider. Onlar cehennemliktirler ve orada devamlı kalırlar.","2:218":"İman edenler ve hicret edip Allah yolunda cihad edenler var ya, işte bunlar, Allah’ın rahmetini umabilirler. Allah, gafûr ve rahîmdir.","2:219":"Sana, şarap ve kumar hakkında soru sorarlar. De ki: Her ikisinde de büyük bir günah ve insanlar için bir takım faydalar vardır. Ancak her ikisinin de günahı faydasından daha büyüktür. Yine sana iyilik yolunda ne harcayacaklarını sorarlar. «İhtiyaç fazlasını» de. Allah size âyetleri böyle açıklar ki düşünesiniz.","2:220":"Dünya ve ahiret hakkında (lehinize olan davranışları düşünün ve ona göre hareket edin). Sana yetimler hakkında soruyorlar. De ki: Onları iyi yetiştirmek (yüz üstü bırakmaktan) daha hayırlıdır. Eğer onlarla birlikte yaşarsanız, (unutmayın ki) onlar sizin kardeşlerinizdir. Allah, işleri bozanla düzelteni bilir. Eğer Allah dileseydi, sizi de zahmet ve meşakkate sokardı. Çünkü Allah güçlüdür, hakîmdir.","2:221":"İman etmedikçe putperest kadınlarla evlenmeyin. Beğenseniz bile, putperest bir kadından, imanlı bir câriye kesinlikle daha iyidir. İman etmedikçe putperest erkekleri de (kızlarınızla) evlendirmeyin. Beğenseniz bile, putperest bir kişiden inanmış bir köle kesinlikle daha iyidir. Onlar (müşrikler) cehenneme çağırır. Allah ise, izni (ve yardımı) ile cennete ve mağfirete çağırır. Allah, düşünüp anlasınlar diye âyetlerini insanlara açıklar.","2:222":"Sana kadınların ay halini sorarlar. De ki: O, bir rahatsızlıktır. Bu sebeple ay halinde olan kadınlardan uzak durun. Temizleninceye kadar onlara yaklaşmayın. Temizlendikleri vakit, Allah’ın size emrettiği yerden onlara yaklaşın. Şunu iyi bilin ki, Allah tevbe edenleri de sever, temizlenenleri de sever.","2:223":"Kadınlarınız sizin için bir tarladır. Tarlanıza nasıl dilerseniz öyle varın. Kendiniz için önceden (uygun davranışlarla) hazırlık yapın. Allah’tan korkun, biliniz ki siz O’na kavuşacaksınız. (Yâ Muhammed!) müminleri müjdele!","2:224":"Yeminlerinizden dolayı Allah’ı (O’nun adını), iyilik etmenize, O’ndan sakınmanıza ve insanların arasını düzeltmenize engel kılmayın. Allah işitir ve bilir.","2:225":"Allah sizi kasıtsız yeminlerinizden sorumlu tutmaz. Lâkin kasıtlı yaptığınız yeminlerinizden dolayı sizi sorumlu tutar. Allah gafûrdur, halîmdir.","2:226":"Kadınlarına yaklaşmamaya yemin edenler dört ay beklerler. Eğer (bu müddet içinde) kadınlarına dönerlerse, şüphesiz Allah çokça bağışlayan ve esirgeyendir.","2:227":"Eğer (müddeti içinde dönmeyip kadınlarını) boşamaya karar verirlerse (ayrılırlar). Biliniz ki, Allah işitir ve bilir.","2:228":"Boşanmış kadınlar, kendi başlarına (evlenmeden) üç ay hali (hayız veya temizlik müddeti) beklerler. Eğer onlar Allah’a ve ahiret gününe gerçekten inanmışlarsa, rahimlerinde Allah’ın yarattığını gizlemeleri kendilerine helâl olmaz. Eğer kocalar barışmak isterlerse, bu durumda boşadıkları kadınları geri almaya daha fazla hak sahibidirler. Kadınların da ödevlerine denk belli hakları vardır. Ancak erkekler, kadınlara göre bir derece üstünlüğe sahiptirler. Allah azîzdir, hakîmdir.","2:229":"Boşama iki defadır. Bundan sonrası ya iyilikle tutmak ya da güzellikle salıvermektir. Kadınlara verdiklerinizden (boşanma esnasında) bir şey almanız size helâl olmaz. Ancak erkek ve kadın Allah’ın sınırlarında kalıp evlilik haklarını tam tatbik edememekten korkarlarsa bu durum müstesna. (Ey müminler!) Siz de karı ile kocanın, Allah’ın sınırlarını, hakkıyla muhafaza etmelerinden kuşkuya düşerseniz, kadının (erkeğe) fidye vermesinde her iki taraf için de sakınca yoktur. Bu söylenenler Allah’ın koyduğu sınırlardır. Sakın onları aşmayın. Kim Allah’ın sınırlarını aşarsa işte onlar zalimlerdir.","2:231":"Kadınları boşadığınız ve onlar da bekleme müddetlerini bitirdikleri vakit ya onları iyilikle tutun yahut iyilikle bırakın. Fakat haksızlık ederek ve zarar vermek için onları nikâh altında tutmayın. Kim bunu yaparsa muhakkak kendine kötülük etmiş olur. Allah’ın âyetlerini eğlenceye almayın. Allah’ın sizin üzerinizdeki nimetini, (size verdiği hidayeti), size öğüt vermek üzere indirdiği Kitab’ı ve hikmeti hatırlayın. Allah’tan korkun. Bilesiniz ki Allah, her şeyi bilir.","2:232":"Kadınları boşadığınız ve onlar da bekleme müddetlerini bitirdikleri vakit, aralarında iyilikle anlaştıkları takdirde, onların (eski) kocalarıyla evlenmelerine engel olmayın. İşte bununla içinizden Allah’a ve ahiret gününe inanan kimselere öğüt verilmektedir. Bu öğüdü tutmanız kendiniz için en iyisi ve en temizidir. Allah bilir, siz bilmezsiniz.","2:233":"Emzirmeyi tamamlatmak isteyen (baba) için, anneler çocuklarını iki tam yıl emzirirler. Onların örfe uygun olarak beslenmesi ve giyimi baba tarafına aittir. Bir insan ancak gücü yettiğinden sorumlu tutulur. Hiçbir anne, çocuğu sebebiyle, hiçbir baba da çocuğu yüzünden zarara uğratılmamalıdır. Onun benzeri (nafaka temini) vâris üzerine de gerekir. Eğer ana ve baba birbiriyle görüşerek ve karşılıklı anlaşarak çocuğu memeden kesmek isterlerse, kendilerine günah yoktur. Çocuklarınızı (süt anne tutup) emzirtmek istediğiniz takdirde, süt anneye vermekte olduğunuzu iyilikle teslim etmeniz şartıyla, üzerinize günah yoktur. Allah’tan korkun. Bilin ki Allah, yapmakta olduklarınızı görür.","2:234":"Sizden ölenlerin, geride bıraktıkları eşleri, kendi başlarına (evlenmeden) dört ay on gün beklerler. Bekleme müddetlerini bitirdikleri vakit, kendileri hakkında yaptıkları meşru işlerde size bir günah yoktur. Allah yapmakta olduklarınızı bilir.","2:235":"(İddet beklemekte olan) kadınlarla evlenme hususundaki düşüncelerinizi üstü kapalı biçimde anlatmanızda veya onu içinizde gizli tutmanızda size günah yoktur. Allah bilir ki siz onları anacaksınız. Lâkin, meşru sözler söylemeniz müstesna, sakın onlara gizlice buluşma sözü vermeyin. Farz olan bekleme müddeti dolmadan, nikâh kıymaya kalkışmayın. Bilin ki Allah, gönlünüzdekileri bilir. Bu sebeple Allah’tan sakının. Şunu iyi bilin ki Allah gafûrdur, halîmdir.","2:236":"Nikâhtan sonra henüz dokunmadan veya onlar için belli bir mehir tayin etmeden kadınları boşarsanız bunda size mehir zorunluğu yoktur. Bu durumda onlara müt’a (hediye cinsinden bir şeyler) verin. Zengin olan durumuna göre, fakir de durumuna göre vermelidir. Münasip bir müt’a vermek iyiler için bir borçtur.","2:237":"Kendilerine mehir tayin ederek evlendiğiniz kadınları, temas etmeden boşarsanız, tayin ettiğiniz mehrin yarısı onların hakkıdır. Ancak kadınların vazgeçmesi veya nikâh bağı elinde bulunanın (velinin) vazgeçmesi hali müstesna, affetmeniz (mehirden vazgeçmeniz), takvâya daha uygundur. Aranızda iyilik ve ihsanı unutmayın. Şüphesiz Allah yapmakta olduklarınızı hakkıyla görür.","2:238":"Namazlara ve orta namaza devam edin. Allah’a saygı ve bağlılık içinde namaz kılın.","2:239":"Eğer (herhangi bir şeyden) korkarsanız (namazlarınızı) yürüyerek yahut binmiş olarak (kılın). Güvene kavuştuğunuz zaman, siz bilmezken Allah’ın size öğrettiği şekilde O’nu anın (namaz kılın).","2:245":"Verdiğinin kat kat fazlasını kendisine ödemesi için Allah’a güzel bir borç (isteyene faizsiz ödünç) verecek yok mu? Darlık veren de bolluk veren de Allah’tır. Sadece O’na döndürüleceksiniz.","2:246":"Musa’dan sonra, Benî İsrail’den ileri gelen kimseleri görmedin mi? Kendilerine gönderilmiş bir peygambere: «Bize bir hükümdar gönder ki (onun komutasında) Allah yolunda savaşalım» demişlerdi. «Ya size savaş yazılır da savaşmazsanız?» dedi. «Yurtlarımızdan çıkarılmış, çocuklarımızdan uzaklaştırılmış olduğumuz halde Allah yolunda neden savaşmayalım?» dediler. Kendilerine savaş yazılınca, içlerinden pek azı hariç, geri dönüp kaçtılar. Allah zalimleri iyi bilir.","2:247":"Peygamberleri onlara: Bilin ki Allah, Tâlût’u size hükümdar olarak gönderdi, dedi. Bunun üzerine: Biz, hükümdarlığa daha lâyık olduğumuz halde, kendisine servet ve zenginlik yönünden geniş imkânlar verilmemişken o bize nasıl hükümdar olur? dediler. «Allah sizin üzerinize onu seçti, ilimde ve bedende ona üstünlük verdi. Allah mülkünü dilediğine verir. Allah her şeyi ihata eden ve her şeyi bilendir» dedi.","2:248":"Peygamberleri onlara: Onun hükümdarlığının alâmeti, Tabut’un size gelmesidir. Meleklerin taşıdığı o Tabut’un içinde Rabbinizden size bir ferahlık ve sükûnet, Musa ve Harun hanedanlarının bıraktıklarından bir kalıntı vardır. Eğer inanmış kimseler iseniz sizin için bunda şüphesiz bir alâmet vardır, dedi.","2:249":"Tâlût askerlerle beraber (cihad için) ayrılınca: Biliniz ki Allah sizi bir ırmakla imtihan edecek. Kim ondan içerse benden değildir. Eliyle bir avuç içen müstesna kim ondan içmezse bendendir, dedi. İçlerinden pek azı müstesna hepsi ırmaktan içtiler. Tâlût ve iman edenler beraberce ırmağı geçince: Bugün bizim Câlût’a ve askerlerine karşı koyacak hiç gücümüz yoktur, dediler. Allah’ın huzuruna varacaklarına inananlar: Nice az sayıda bir birlik Allah’ın izniyle çok sayıdaki birliği yenmiştir. Allah sabredenlerle beraberdir, dediler.","2:250":"Câlût ve askerleriyle savaşa tutuştuklarında: Ey Rabbimiz! Yüreğimizi sabırla doldur; bize direnme gücü ver; kâfir kavme karşı bize yardım et, dediler.","2:251":"Sonunda Allah’ın izniyle onları yendiler. Davud da Câlût’u öldürdü. Allah ona (Davud’a) hükümdarlık ve hikmet verdi, dilediği ilimlerden ona öğretti. Eğer Allah’ın insanlardan bir kısmını diğerleriyle savması olmasaydı elbette yeryüzü altüst olurdu. Lâkin Allah bütün insanlığa karşı lütuf ve kerem sahibidir.","2:254":"Ey iman edenler! Kendisinde artık alış-veriş, dostluk ve kayırma bulunmayan gün (kıyamet) gelmeden önce, size verdiğimiz rızıktan hayır yolunda harcayın. Gerçekleri inkâr edenler elbette zalimlerdir.","2:255":"Allah, O’ndan başka tanrı yoktur; O, hayydir, kayyûmdur. Kendisine ne uyku gelir ne de uyuklama. Göklerde ve yerdekilerin hepsi O’nundur. İzni olmadan O’nun katında kim şefaat edebilir? O, kullarının yaptıklarını ve yapacaklarını bilir. (O’na hiçbir şey gizli kalmaz.) O’nun bildirdiklerinin dışında insanlar O’nun ilminden hiçbir şeyi tam olarak bilemezler. O’nun kürsüsü gökleri ve yeri içine alır, onları koruyup gözetmek kendisine zor gelmez. O, yücedir, büyüktür.","2:256":"Dinde zorlama yoktur. Artık doğrulukla eğrilik birbirinden ayrılmıştır. O halde kim tâğutu reddedip Allah’a inanırsa, kopmayan sağlam kulpa yapışmıştır. Allah işitir ve bilir.","2:258":"Allah kendisine mülk (hükümdarlık ve zenginlik) verdiği için şımararak Rabbi hakkında İbrahim ile tartışmaya gireni (Nemrut’u) görmedin mi! İşte o zaman İbrahim: Rabbim hayat veren ve öldürendir, demişti. O da: Hayat veren ve öldüren benim, demişti. İbrahim: Allah güneşi doğudan getirmektedir; haydi sen de onu batıdan getir, dedi. Bunun üzerine kâfir apışıp kaldı. Allah zalim kimseleri hidayete erdirmez.","2:259":"Yahut görmedin mi o kimseyi ki, evlerinin duvarları çatıları üzerine çökmüş (alt üst olmuş) bir kasabaya uğradı; «Ölümünden sonra Allah bunları nasıl diriltir acaba!» dedi. Bunun üzerine Allah onu öldürüp yüz sene bıraktı; sonra tekrar diriltti. Ne kadar kaldın? dedi. «Bir gün yahut daha az» dedi. Allah ona: Hayır, yüz sene kaldın. Yiyeceğine ve içeceğine bak, henüz bozulmamıştır. Eşeğine de bak. Seni insanlara bir ibret kılalım diye (yüz sene ölü tuttuk, sonra tekrar dirilttik). Şimdi sen kemiklere bak, onları nasıl düzenliyor, sonra ona nasıl et giydiriyoruz, dedi. Durum kendisince anlaşılınca: Şimdi iyice biliyorum ki, Allah her şeye kadirdir, dedi.","2:260":"İbrahim Rabbine: Ey Rabbim! Ölüyü nasıl dirilttiğini bana göster, demişti. Rabbi ona: Yoksa inanmadın mı? dedi. İbrahim: Hayır! İnandım, fakat kalbimin mutmain olması için (görmek istedim), dedi. Bunun üzerine Allah: Öyleyse dört tane kuş yakala, onları yanına al, sonra (kesip parçala), her dağın başına onlardan bir parça koy. Sonra da onları kendine çağır; koşarak sana gelirler. Bil ki Allah azîzdir, hakîmdir, buyurdu.","2:261":"Allah yolunda mallarını harcayanların örneği, yedi başak bitiren bir dane gibidir ki, her başakta yüz dane vardır. Allah dilediğine kat kat fazlasını verir. Allah’ın lütfu geniştir, O herşeyi bilir.","2:263":"Güzel söz ve bağışlama, arkasından incitme gelen sadakadan daha iyidir. Allah zengindir, acelesi de yoktur.","2:264":"Ey iman edenler! Allah’a ve ahiret gününe inanmadığı halde malını gösteriş için harcayan kimse gibi, başa kakmak ve incitmek suretiyle, yaptığınız hayırlarınızı boşa çıkarmayın. Böylesinin durumu, üzerinde biraz toprak bulunan düz kayaya benzer ki, sağanak bir yağmur isabet etmiş de onu çıplak pürüzsüz kaya haline getirivermiştir. Bunlar kazandıklarından hiçbir şeye sahip olamazlar. Allah, kâfirleri doğru yola iletmez.","2:265":"Allah’ın rızasını kazanmak ve ruhlarındaki cömertliği kuvvetlendirmek için mallarını hayra sarfedenlerin durumu, bir tepede kurulmuş güzel bir bahçeye benzer ki, üzerine bol yağmur yağmış da iki kat ürün vermiştir. Bol yağmur yağmasa bile bir çisinti düşer (de yine ürün verir). Allah, yaptıklarınızı görmektedir.","2:266":"Sizden biriniz arzu eder mi ki, hurma ve üzüm ağaçlarıyla dolu, arasından sular akan ve kendisi için orada her çeşit meyveden (bir miktar) bulunan bir bahçesi olsun da, bakıma muhtaç çoluk çocuğu varken kendisine ihtiyarlık gelip çatsın, bahçeye de içinde ateş bulunan bir kasırga isabet ederek yakıp kül etsin! (Elbette bunu kimse arzu etmez.) İşte düşünüp anlayasınız diye Allah size âyetleri açıklar.","2:267":"Ey iman edenler! Kazandıklarınızın iyilerinden ve rızık olarak yerden size çıkardıklarımızdan hayra harcayın. Size verilse, gözünüzü yummadan alamayacağınız kötü malı, hayır diye vermeye kalkışmayın. Biliniz ki Allah zengindir, övgüye lâyıktır.","2:268":"Şeytan sizi fakirlikle korkutur ve size cimriliği telkin eder. Allah ise size katından bir mağfiret ve bir lütuf vâdeder. Allah herşeyi ihata eden ve herşeyi bilendir.","2:271":"Eğer sadakaları (zekât ve benzeri hayırları) açıktan verirseniz ne âlâ! Eğer onu fakirlere gizlice verirseniz, işte bu sizin için daha hayırlıdır. Allah da bu sebeple sizin günahlarınızı örter. Allah, yapmakta olduklarınızı bilir.","2:273":"(Yapacağınız hayırlar,) kendilerini Allah yoluna adamış, bu sebeple yeryüzünde kazanç için dolaşamayan fakirler için olsun. Bilmeyen kimseler, iffetlerinden dolayı onları zengin zanneder. Sen onları simalarından tanırsın. Çünkü onlar yüzsüzlük ederek istemezler. Yaptığınız her hayrı muhakkak Allah bilir.","2:275":"Faiz yiyenler (kabirlerinden), şeytan çarpmış kimselerin cinnet nöbetinden kalktığı gibi kalkarlar. Bu hal onların «Alım-satım tıpkı faiz gibidir» demeleri yüzündendir. Halbuki Allah, alım-satımı helâl, faizi haram kılmıştır. Bundan sonra kime Rabbinden bir öğüt gelir de faizden vazgeçerse, geçmişte olan kendisinindir ve artık onun işi Allah’a kalmıştır. Kim tekrar faize dönerse, işte onlar cehennemliktir, orada devamlı kalırlar.","2:276":"Allah faizi tüketir (Faiz karışan malın bereketini giderir), sadakaları ise bereketlendirir. Allah küfürde ve günahta ısrar eden hiç kimseyi sevmez.","2:279":"Şayet (faiz hakkında söylenenleri) yapmazsanız, Allah ve Resûlü tarafından (faizcilere karşı) açılan savaştan haberiniz olsun. Eğer tevbe edip vazgeçerseniz, sermayeniz sizindir; ne haksızlık etmiş ne de haksızlığa uğramış olursunuz.","2:282":"Ey iman edenler! Belirlenmiş bir süre için birbirinize borçlandığınız vakit onu yazın. Bir kâtip onu aranızda adaletle yazsın. Hiçbir kâtip Allah’ın kendisine öğrettiği gibi yazmaktan geri durmasın; (her şeyi olduğu gibi) yazsın. Üzerinde hak olan kimse (borçlu) da yazdırsın, Rabbinden korksun ve borcunu asla eksik yazdırmasın. Şayet borçlu sefih veya aklı zayıf veya kendisi söyleyip yazdıramayacak durumda ise, velisi adaletle yazdırsın. Erkeklerinizden iki de şahit bulundurun. Eğer iki erkek bulunamazsa rıza göstereceğiniz şahitlerden bir erkek ile -biri yanılırsa diğerinin ona hatırlatması için- iki kadın (olsun). Çağırıldıkları vakit şahitler gelmemezlik etmesin. Büyük veya küçük, vâdesine kadar hiçbir şeyi yazmaktan sakın üşenmeyin. Böyle yapmanız Allah nezdinde daha adaletli, şehadet için daha sağlam, şüpheye düşmemeniz için daha uygundur. Ancak aranızda yapıp bitirdiğiniz peşin bir ticaret olursa, bu durum farklıdır. Bu durumda onu yazmamanızda sizin için bir sakınca yoktur. (Genellikle) alış-veriş yaptığınızda şahit tutun. Ne yazan, ne de şahit zarara uğratılsın. Eğer bunu yaparsanız (zarar verirseniz) şüphe yok ki bu, sizin yoldan çıkmanız demektir. Allah’tan korkun. Allah size gerekli olanı öğretiyor. Allah her şeyi bilmektedir.","2:283":"Yolculukta olur da, yazacak kimse bulamazsanız (borca karşılık) alınmış bir rehin de yeterlidir. Birbirinize bir emanet bırakırsanız, emanet bırakılan kimse emaneti sahibine versin ve (bu hususta) Rabbi olan Allah’tan korksun. Şahitliği, bildiklerinizi gizlemeyin. Kim onu gizlerse, bilsin ki onun kalbi günahkârdır. Allah yapmakta olduklarınızı bilir.","2:286":"Allah her şahsı, ancak gücünün yettiği ölçüde mükellef kılar. Herkesin kazandığı (hayır) kendine, yapacağı (şer) de kendinedir. Rabbimiz! Unutursak veya hataya düşersek bizi sorumlu tutma. Ey Rabbimiz! Bizden öncekilere yüklediğin gibi bize de ağır bir yük yükleme. Ey Rabbimiz! Bize gücümüzün yetmediği işler de yükleme! Bizi affet! Bizi bağışla! Bize acı! Sen bizim mevlâmızsın. Kâfirler topluluğuna karşı bize yardım et!","3:3":"(3-4) (Resûlüm!) O, sana Kitab’ı hak ve önceki kitapları tasdik edici olarak tedricen indirmiş; daha önce de, insanlara doğru yolu göstermek üzere Tevrat ile İncil’i indirmişti. Furkan’ı da indirdi. Bilinmeli ki, Allah’ın âyetlerini inkâr edenler için şiddetli bir azap vardır. Allah, suçlunun hakkından gelen mutlak güç sahibidir.","3:4":"(3-4) (Resûlüm!) O, sana Kitab’ı hak ve önceki kitapları tasdik edici olarak tedricen indirmiş; daha önce de, insanlara doğru yolu göstermek üzere Tevrat ile İncil’i indirmişti. Furkan’ı da indirdi. Bilinmeli ki, Allah’ın âyetlerini inkâr edenler için şiddetli bir azap vardır. Allah, suçlunun hakkından gelen mutlak güç sahibidir.","3:7":"Sana Kitab’ı indiren O’dur. Onun (Kur’an’ın) bazı âyetleri muhkemdir ki, bunlar Kitab’ın esasıdır. Diğerleri de müteşâbihtir. Kalplerinde eğrilik olanlar, fitne çıkarmak ve onu tevil etmek için ondaki müteşâbih âyetlerin peşine düşerler. Halbuki Onun tevilini ancak Allah bilir. İlimde yüksek pâyeye erişenler ise: Ona inandık; hepsi Rabbimiz tarafındandır, derler. (Bu inceliği) ancak aklıselim sahipleri düşünüp anlar.","3:8":"(Onlar şöyle yakarırlar:) Rabbimiz! Bizi doğru yola ilettikten sonra kalplerimizi eğriltme. Bize tarafından rahmet bağışla. Lütfu en bol olan sensin.","3:11":"(Onların yolu) Firavun hanedanının ve onlardan öncekilerin tuttuğu yola benzer. Onlar bizim âyetlerimizi yalanladılar, Allah da kendilerini günahları yüzünden yakalayıverdi. Allah’ın cezası çok şiddetlidir.","3:13":"(Bedir’de) karşı karşıya gelen şu iki gurubun halinde sizin için büyük bir ibret vardır. Biri Allah yolunda çarpışan bir gurup, diğeri ise bunları apaçık kendilerinin iki misli gören kâfir bir gurup. Allah dilediğini yardımı ile destekler. Elbette bunda basiret sahipleri için büyük bir ibret vardır.","3:14":"Nefsanî arzulara, (özellikle) kadınlara, oğullara, yığın yığın biriktirilmiş altın ve gümüşe, salma atlara, sağmal hayvanlara ve ekinlere karşı düşkünlük insanlara çekici kılındı. Bunlar, dünya hayatının geçici menfaatleridir. Halbuki varılacak güzel yer, Allah’ın katındadır.","3:24":"Onların bu tutumları: Bize ateş, sadece sayılı günlerde dokunacaktır, demelerinin bir sonucudur. Onların vaktiyle uydurdukları şeyler de dinleri hakkında kendilerini yanıltmıştır.","3:26":"(Resûlüm!) De ki: Mülkün gerçek sahibi olan Allah’ım! Sen mülkü dilediğine verirsin ve mülkü dilediğinden geri alırsın. Dilediğini yüceltir, dilediğini de alçaltırsın. Her türlü iyilik senin elindedir. Gerçekten sen her şeye kadirsin.","3:27":"Geceyi gündüze katar, gündüzü de geceye katarsın. Ölüden diriyi çıkarır, diriden de ölüyü çıkarırsın. Dilediğine de sayısız rızık verirsin.","3:29":"De ki: İçinizdekileri gizleseniz de açığa vursanız da Allah onu bilir. Göklerde ve yerde olanları da bilir. Allah her şeye kadirdir.","3:30":"Herkesin, iyilik olarak yaptıklarını da kötülük olarak yaptıklarını da karşısında hazır bulduğu günde (insan) isteyecek ki kötülükleri ile kendisi arasında uzun bir mesafe bulunsun. Allah, kendisine karşı (gelmekten) sizi sakındırıyor. Allah kullarına çok şefkatlidir.","3:33":"(33-34) Allah birbirinden gelme bir nesil olarak Âdem’i, Nuh’u, İbrahim ailesi ile İmrân ailesini seçip âlemlere üstün kıldı. Allah işiten ve bilendir.","3:36":"Onu doğurunca, Allah, ne doğurduğunu bilip dururken: Rabbim! Ben onu kız doğurdum. Oysa erkek, kız gibi değildir. Ona Meryem adını verdim. Kovulmuş şeytana karşı onu ve soyunu senin korumanı diliyorum, dedi.","3:37":"Rabbi Meryem’e hüsnü kabul gösterdi; onu güzel bir bitki gibi yetiştirdi. Zekeriyya’yı da onun bakımı ile görevlendirdi. Zekeriyya, onun yanına, mâbede her girişinde orada bir rızık bulur ve «Ey Meryem, bu sana nereden geliyor?» der; o da: Bu, Allah tarafındandır. Allah, dilediğine sayısız rızık verir, derdi.","3:38":"Orada Zekeriyya, Rabbine dua etti: Rabbim! Bana tarafından hayırlı bir nesil bağışla. Şüphesiz sen duayı hakkıyla işitensin, dedi.","3:39":"Zekeriyya mâbedde durmuş namaz kılarken melekler ona şöyle nida ettiler: Allah sana, kendisi tarafından gelen bir Kelime’yi tasdik edici, efendi, iffetli ve sâlihlerden bir peygamber olarak Yahya’yı müjdeler.","3:40":"Zekeriyya: Rabbim! dedi, bana ihtiyarlık gelip çattığına, üstelik karım da kısır olduğuna göre benim nasıl oğlum olabilir? Allah şöyle buyurdu: İşte böyledir; Allah dilediğini yapar.","3:41":"Zekeriyya: Rabbim! (Oğlum olacağına dair) bana bir alâmet göster, dedi. Allah buyurdu ki: Senin için alâmet, insanlara, üç gün, işaretten başka söz söylememendir. Ayrıca Rabbini çok an, sabah akşam tesbih et.","3:44":"(Resûlüm!) Bunlar, bizim sana vahiy yoluyla bildirmekte olduğumuz gayb haberlerindendir. İçlerinden hangisi Meryem’i himayesine alacak diye kur’a çekmek üzere kalemlerini atarlarken sen onların yanında değildin; onlar (bu yüzden) çekişirken de yanlarında değildin.","3:45":"Melekler demişlerdi ki: Ey Meryem! Allah sana kendisinden bir Kelime’yi müjdeliyor. Adı Meryem oğlu İsa’dır. Mesîh’tir; dünyada da, ahirette de itibarlı ve Allah’ın kendisine yakın kıldıklarındandır.","3:46":"O, sâlihlerden olarak beşikte iken ve yetişkinlik halinde insanlara (peygamber sözleri ile) konuşacak.","3:49":"O, İsrailoğullarına bir elçi olacak (ve onlara şöyle diyecek:) Size Rabbinizden bir mucize getirdim: Size çamurdan bir kuş sureti yapar, ona üflerim ve Allah’ın izni ile o kuş oluverir. Yine Allah’ın izni ile körü ve alacalıyı iyileştirir, ölüleri diriltirim. Ayrıca evlerinizde ne yeyip ne biriktirdiğinizi size haber veririm. Eğer inanan kimseler iseniz, bunda sizin için bir ibret vardır.","3:52":"İsa, onlardaki inkârcılığı sezince: Allah yolunda bana yardımcı olacaklar kimlerdir? dedi. Havârîler: Biz, Allah yolunun yardımcılarıyız; Allah’a inandık, şahit ol ki bizler müslümanlarız, cevabını verdiler.","3:54":"(Yahudiler) tuzak kurdular; Allah da onların tuzaklarını bozdu. Allah, tuzak kuranların hayırlısıdır.","3:61":"Sana bu ilim geldikten sonra seninle bu konuda çekişenlere de ki: Geliniz, sizler ve bizler de dahil olmak üzere, siz kendi çocuklarınızı biz de kendi çocuklarımızı, siz kendi kadınlarınızı, biz de kendi kadınlarımızı çağıralım, sonra da dua edelim de Allah’tan yalancılar üzerine lânet dileyelim.","3:75":"Ehl-i kitaptan öylesi vardır ki, ona yüklerle mal emanet bıraksan, onu sana noksansız iade eder. Fakat onlardan öylesi de vardır ki, ona bir dinar emanet bıraksan, tepesine dikilip durmazsan onu sana iade etmez. Bu da onların, «Ümmîlere karşı yaptıklarımızdan dolayı bize vebal yoktur» demelerindendir. Allah adına bile bile yalan söylüyorlar.","3:78":"Ehl-i kitaptan bir gurup, okuduklarını kitaptan sanasınız diye kitabı okurken dillerini eğip bükerler. Halbuki okudukları Kitap’tan değildir. Söyledikleri Allah katından olmadığı halde: Bu Allah katındandır, derler. Onlar bile bile Allah’a iftira ediyorlar.","3:79":"Hiçbir insanın, Allah’ın kendisine Kitap, hikmet ve peygamberlik vermesinden sonra (kalkıp) insanlara: Allah’ı bırakıp bana kul olun! demesi mümkün değildir. Bilakis (şöyle demesi gerekir): Okutmakta ve öğretmekte olduğunuz Kitap uyarınca Rabbe hâlis kullar olunuz.","3:96":"Şüphesiz, âlemlere bereket ve hidayet kaynağı olarak insanlar için kurulan ilk ev (mâbet), Mekke’deki (Kâbe)dir.","3:99":"De ki: Ey ehl-i kitap! (Gerçeği) görüp bildiğiniz halde niçin Allah’ın yolunu eğri göstermeye yeltenerek müminleri Allah yolundan çevirmeye kalkışıyorsunuz? Allah yaptıklarınızdan habersiz değildir.","3:101":"Size Allah’ın âyetleri okunurken, üstelik Allah Resûlü de aranızda iken nasıl inkâra saparsınız? Her kim Allah’a bağlanırsa kesinlikle doğru yola iletilmiştir.","3:103":"Hep birlikte Allah’ın ipine (İslâm’a) sımsıkı yapışın; parçalanmayın. Allah’ın size olan nimetini hatırlayın: Hani siz birbirinize düşman kişiler idiniz de O, gönüllerinizi birleştirmişti ve O’nun nimeti sayesinde kardeş kimseler olmuştunuz. Yine siz bir ateş çukurunun tam kenarında iken oradan da sizi O kurtarmıştı. İşte Allah size âyetlerini böyle açıklar ki doğru yolu bulasınız.","3:104":"Sizden, hayra çağıran, iyiliği emredip kötülüğü meneden bir topluluk bulunsun. İşte onlar kurtuluşa erenlerdir.","3:106":"Nice yüzlerin ağardığı, nice yüzlerin de karardığı günü (düşünün.) İmdi, yüzleri kararanlara: İnanmanızdan sonra kâfir mi oldunuz? Öyle ise inkâr etmiş olmanız yüzünden tadın azabı! (denilir).","3:111":"Onlar (ehl-i kitap) size, incitmekten başka bir zarar veremezler. Sizinle savaşa girecek olsalar, size arkalarını dönüp kaçarlar. Sonra kendilerine yardım da edilmez.","3:117":"Onların, bu dünya hayatında yapmakta oldukları harcamaların durumu, kendilerine zulmetmiş olan bir kavmin ekinlerini vurup da mahveden kavurucu bir rüzgârın durumu gibidir. Onlara Allah zulmetmedi; fakat onlar kendilerine zulmediyorlar.","3:118":"Ey iman edenler! Kendi dışınızdakileri sırdaş edinmeyin. Çünkü onlar size fenalık etmekten asla geri durmazlar, hep sıkıntıya düşmenizi isterler. Gerçekten, kin ve düşmanlıkları ağızlarından (dökülen sözlerinden) belli olmaktadır. Kalplerinde sakladıkları (düşmanlıkları) ise daha büyüktür. Eğer düşünüp anlıyorsanız, âyetlerimizi size açıklamış bulunuyoruz.","3:119":"İşte siz öyle kimselersiniz ki, onlar sizi sevmedikleri halde siz onları seversiniz. Siz, bütün kitaplara inanırsınız; onlar ise, sizinle karşılaştıklarında «İnandık» derler; kendi başlarına kaldıklarında da, size olan kinlerinden dolayı parmaklarının uçlarını ısırırlar. De ki: Kininizden (kahrolup) ölün! Şüphesiz Allah kalplerin içindekini hakkıyla bilmektedir.","3:120":"Size bir iyilik dokunsa, bu onları tasalandırır; başınıza bir musibet gelse, buna da sevinirler. Eğer sabreder ve korunursanız, onların hilesi size hiçbir zarar vermez. Şüphesiz Allah, onların yaptıklarını çepeçevre kuşatmıştır.","3:121":"Hani sen, sabah erkenden müminleri savaş mevzilerine yerleştirmek için ailenden ayrılmıştın...-Allah, hakkıyle işiten ve bilendir.-","3:122":"O zaman içinizden iki bölük bozulmaya yüz tutmuştu. Halbuki Allah onların yardımcısı idi. Müminler, yalnız Allah’a dayanıp güvensinler.","3:123":"Andolsun, sizler güçsüz olduğunuz halde Allah, Bedir’de de size yardım etmişti. Öyle ise, Allah’tan sakının ki O’na şükretmiş olasınız.","3:125":"Evet, siz sabır gösterir ve Allah’tan sakınırsanız, onlar (düşmanlarınız) hemen şu anda üzerinize gelseler, Rabbiniz, nişanlı beş bin melekle sizi takviye eder.","3:127":"(127-128) Allah, kâfirlerden bir kısmının kökünü kessin veya onları perişan etsin, böylece bozulmuş bir halde dönüp gitsinler -ki bu işte senin yapacağın bir şey yoktur- yahut (müslüman olsunlar da) tevbelerini kabul etsin, ya da (ısrar ederlerse) onlara azap etsin diye (Allah Bedir’de size yardım etti). Çünkü onlar zalimdirler.","3:134":"O takvâ sahipleri ki, bollukta da darlıkta da Allah için harcarlar; öfkelerini yutarlar ve insanları affederler. Allah da güzel davranışta bulunanları sever.","3:137":"Sizden önce nice (milletler hakkında) ilâhî kanunlar gelip geçmiştir. Onun için, yeryüzünde gezin dolaşın da (Allah’ın âyetlerini) yalan sayanların âkıbeti ne olmuş, görün!","3:139":"Gevşeklik göstermeyin, üzüntüye kapılmayın. Eğer inanmışsanız, üstün gelecek olan sizsiniz.","3:140":"Eğer siz (Uhud’da) bir acıya uğradınızsa, (Bedir’de de düşmanınız olan) o kavim de benzer bir acıya uğramıştır. O günleri biz insanlar arasında döndürür dururuz (zaferi bazen bir topluma bazen öteki topluma nasip ederiz.) Ta ki Allah, iman edenleri ortaya çıkarsın ve aranızdan şahitler edinsin. Allah zalimleri sevmez.","3:141":"Bir de (böylece) Allah, iman edenleri günahlardan temize çıkarmak, kâfirleri de helâk etmek ister.","3:144":"Muhammed, ancak bir peygamberdir. Ondan önce de peygamberler gelip geçmiştir. Şimdi o ölür ya da öldürülürse, gerisin geriye (eski dininize) mi döneceksiniz? Kim (böyle) geri dönerse, Allah’a hiçbir şekilde zarar vermiş olmayacaktır. Allah, şükredenleri mükâfatlandıracaktır.","3:146":"Nice peygamberler vardı ki, beraberinde birçok Allah erleri bulunduğu halde savaştılar da, bunlar, Allah yolunda başlarına gelenlerden dolayı gevşeklik ve zaaf göstermediler, boyun eğmediler. Allah sabredenleri sever.","3:147":"Onların sözleri, sadece şöyle demekten ibaretti: Ey Rabbimiz! Günahlarımızı ve işimizdeki taşkınlığımızı bağışla; ayaklarımızı (yolunda) sabit kıl; kâfirler topluluğuna karşı bizi muzaffer kıl!","3:151":"Allah’ın, hakkında hiçbir delil indirmediği şeyleri O’na ortak koşmaları sebebiyle, kâfirlerin kalplerine yakında korku salacağız. Gidecekleri yer de cehennemdir. Zalimlerin varacağı yer ne kötüdür!","3:153":"O zaman Peygamber arkanızdan sizi çağırdığı halde siz, durmadan (savaş alanından) uzaklaşıyor, hiç kimseye dönüp bakmıyordunuz. (Allah) size keder üstüne keder verdi ki, bundan dolayı gerek elinizden gidene, gerekse başınıza gelenlere üzülmeyesiniz. Allah yaptıklarınızdan haberdardır.","3:154":"Sonra o kederin arkasından Allah size bir güven indirdi ki, (bu güvenin yol açtığı) uyuklama hali bir kısmınızı kaplıyordu. Kendi canlarının kaygısına düşmüş bir gurup da, Allah’a karşı haksız yere cahiliye devrindekine benzer düşüncelere kapılıyorlar, «Bu işten bize ne!» diyorlardı. De ki: İş (zafer, yardım, herşeyin karar ve buyruğu) tamamen Allah’a aittir. Onlar, sana açıklayamadıklarını içlerinde gizliyorlar. «Bu işten bize bir şey olsaydı, burada öldürülmezdik» diyorlar. Şöyle de: Evlerinizde kalmış olsaydınız bile, öldürülmesi takdir edilmiş olanlar, öldürülüp düşecekleri yerlere kendiliklerinden çıkıp giderlerdi. Allah, içinizdekileri yoklamak ve kalplerinizdekileri temizlemek için (böyle yaptı). Allah içinizde ne varsa hepsini bilir.","3:156":"Ey iman edenler! Sizler, inkâr edenler ve yeryüzünde sefere çıkan veya savaşan kardeşleri hakkında: «Eğer bizim yanımızda kalsalardı ölmezler, öldürülmezlerdi» diyenler gibi olmayın. Allah bu kanaatı onların kalplerine (kaybettikleri yakınları için onulmaz) bir hasret (yarası) olarak koydu. Canı veren de alan da Allah’tır. Allah, yaptıklarınızı hakkıyla görür.","3:159":"O vakit Allah’tan bir rahmet ile onlara yumuşak davrandın! Şayet sen kaba, katı yürekli olsaydın, hiç şüphesiz, etrafından dağılıp giderlerdi. Şu halde onları affet; bağışlanmaları için dua et; iş hakkında onlara danış. Kararını verdiğin zaman da artık Allah’a dayanıp güven. Çünkü Allah, kendisine dayanıp güvenenleri sever.","3:160":"Allah size yardım ederse, artık size üstün gelecek hiç kimse yoktur. Eğer sizi bırakıverirse, ondan sonra size kim yardım eder? Müminler ancak Allah’a güvenip dayanmalıdırlar.","3:161":"Bir peygambere, emanete hıyanet yaraşmaz. Kim emanete (devlet malına) hıyanet ederse, kıyamet günü, hainlik ettiği şeyin günahı boynuna asılı olarak gelir. Sonra herkese -asla haksızlığa uğratılmaksızın-kazandığı tastamam verilir.","3:162":"Allah’ın hoşnutluğunu gözetenle Allah’ın hışmına uğrayan bir olur mu hiç? Berikisinin yeri cehennemdir. Cehennem ise ne kötü bir varış noktasıdır.","3:167":"(166-167) İki birliğin karşılaştığı gün sizin başınıza gelenler, ancak Allah’ın dilemesiyle olmuştur ki, bu da, müminleri ayırdetmesi ve münafıkları ortaya çıkarması için idi. Bunlara: «Gelin, Allah yolunda çarpışın; ya da savunma yapın» denildiği zaman, «Harbetmeyi bilseydik, elbette sizin peşinizden gelirdik» dediler. Onlar o gün, imandan çok, kâfirliğe yakın idiler. Ağızlarıyla, kalplerinde olmayanı söylüyorlardı. Halbuki Allah, onların içlerinde gizlediklerini daha iyi bilir.","3:170":"(169-170) Allah yolunda öldürülenleri sakın ölü sanmayın. Bilakis onlar diridirler; Allah’ın, lütuf ve kereminden kendilerine verdikleri ile sevinçli bir halde Rableri yanında rızıklara mazhar olmaktadırlar. Arkalarından gelecek ve henüz kendilerine katılmamış olan şehit kardeşlerine de hiçbir keder ve korku bulunmadığı müjdesinin sevincini duymaktadırlar.","3:176":"(Resûlüm) İnkârda yarışanlar sana kaygı vermesin. Çünkü onlar, Allah’a hiçbir zarar veremezler. Allah onlara, ahiretten yana bir nasip vermemek istiyor. Onlar için çok büyük bir azap vardır.","3:178":"İnkâr edenler sanmasınlar ki, kendilerine mühlet vermemiz onlar için daha hayırlıdır. Onlara ancak günahlarını arttırmaları için fırsat veriyoruz. Onlar için alçaltıcı bir azap vardır.","3:179":"Allah, müminleri (şu) bulunduğunuz durumda bırakacak değildir; sonunda murdarı temizden ayıracaktır. Bununla beraber Allah, size gaybı da bildirecek değildir. Fakat Allah, elçilerinden dilediğini ayırdeder. O halde Allah’a ve peygamberlerine iman edin. Eğer iman eder, takvâ sahibi olursanız sizin için de çok büyük bir ecir vardır.","3:180":"Allah’ın, kereminden kendilerine verdiklerini (infakta) cimrilik gösterenler, sanmasınlar ki o, kendileri için hayırlıdır; tersine bu onlar için pek fenadır. Cimrilik ettikleri şey de kıyamet gününde boyunlarına dolanacaktır. Göklerin ve yerin mirası Allah’ındır. Allah bütün yaptıklarınızdan haberdardır.","3:184":"(Resûlüm!) Eğer seni yalancılıkla itham ettilerse (yadırgama); gerçekten, senden önce apaçık mucizeler, sahifeler ve aydınlatıcı kitap getiren nice peygamberler de yalancılıkla itham edildi.","3:185":"Her canlı ölümü tadacaktır. Ve ancak kıyamet günü yaptıklarınızın karşılığı size tastamam verilecektir. Kim cehennemden uzaklaştırılıp cennete konursa o, gerçekten kurtuluşa ermiştir. Bu dünya hayatı ise aldatma metâından başka bir şey değildir.","3:191":"Onlar, ayakta dururken, otururken, yanları üzerine yatarken (her vakit) Allah’ı anarlar, göklerin ve yerin yaratılışı hakkında derin derin düşünürler (ve şöyle derler:) Rabbimiz! Sen bunu boşuna yaratmadın. Seni tesbih ederiz. Bizi cehennem azabından koru!","3:200":"Ey iman edenler! Sabredin; (düşman karşısında) sebat gösterin; (cihad için) hazırlıklı ve uyanık bulunun ve Allah’tan korkun ki başarıya erişebilesiniz.","4:2":"Yetimlere mallarını verin, temizi pis olanla değişmeyin, onların mallarını kendi mallarınıza katarak (kendi malınızmış gibi) yemeyin; çünkü bu, büyük bir günahtır.","4:3":"Eğer (kendileriyle evlendiğiniz takdirde) yetimlerin haklarına riayet edememekten korkarsanız beğendiğiniz (veya size helâl olan) kadınlardan ikişer, üçer, dörder alın. Haksızlık yapmaktan korkarsanız bir tane alın; yahut da sahip olduğunuz (cariyeler) ile yetinin. Bu, adaletten ayrılmamanız için en uygun olanıdır.","4:4":"Kadınlara mehirlerini gönül rızası ile (cömertçe) verin; eğer gönül hoşluğu ile o mehrin bir kısmını size bağışlarlarsa onu da afiyetle yeyin.","4:6":"Evlilik çağına gelinceye kadar yetimleri (gözetip) deneyin, eğer onlarda akılca bir olgunlaşma görürseniz hemen mallarını kendilerine verin. Büyüyecekler (de geri alacaklar) diye o malları israf ile ve tez elden yemeyin. Zengin olan (veli) iffetli olmaya çalışsın, yoksul olan da (ihtiyaç ve emeğine) uygun olarak yesin. Mallarını kendilerine verdiğiniz zaman yanlarında şahit bulundurun. Hesap sorucu olarak da Allah yeter.","4:8":"(Mirastan payı olmayan) yakınlar, yetimler ve yoksullar miras taksiminde hazır bulunursa bundan, onları da rızıklandırın ve onlara güzel söz söyleyin.","4:9":"Geriye eli ermez, gücü yetmez çocuklar bıraktıkları takdirde (halleri ne olur) diye korkacak olanlar (yetimlere haksızlık etmekten) korkup titresinler; Allah’tan sakınsınlar ve doğru söz söylesinler.","4:10":"Haksızlıkla yetimlerin mallarını yiyenler şüphesiz karınlarına ancak ateş tıkınmış olurlar; zaten onlar alevlenmiş ateşe gireceklerdir.","4:11":"Allah size, çocuklarınız hakkında, erkeğe, kadının payının iki misli (miras vermenizi) emreder. (Çocuklar) ikiden fazla kadın iseler, ölünün bıraktığının üçte ikisi onlarındır. Eğer yalnız bir kadınsa yarısı onundur. Ölenin çocuğu varsa, ana-babasından her birinin mirastan altıda bir hissesi vardır. Eğer çocuğu yok da ana-babası ona vâris olmuş ise, anasına üçte bir (düşer). Eğer ölenin kardeşleri varsa, anasına altıda bir (düşer. Bütün bu paylar ölenin) yapacağı vasiyetten ve borçtan sonradır. Babalarınız ve oğullarınızdan hangisinin size, fayda bakımından daha yakın olduğunu bilemezsiniz. Bunlar Allah tarafından konmuş farzlardır (paylardır). Şüphesiz Allah ilim ve hikmet sahibidir.","4:18":"Yoksa kötülükleri yapıp yapıp da içlerinden birine ölüm gelip çatınca «Ben şimdi tevbe ettim» diyenler ile kâfir olarak ölenler için (kabul edilecek) tevbe yoktur. Onlar için acı bir azap hazırlamışızdır.","4:21":"Vaktiyle siz birbirinizle haşir-neşir olduğunuz ve onlar sizden sağlam bir teminat almış olduğu halde onu nasıl geri alırsınız!","4:22":"Geçmişte olanlar bir yana, babalarınızın evlendiği kadınlarla evlenmeyin; çünkü bu bir hayasızlıktır, iğrenç bir şeydir ve kötü bir yoldur.","4:23":"Analarınız, kızlarınız, kızkardeşleriniz, halalarınız, teyzeleriniz, kardeş kızları, kızkardeş kızları, sizi emziren analarınız, süt bacılarınız, eşlerinizin anaları, kendileriyle birleştiğiniz eşlerinizden olup evlerinizde bulunan üvey kızlarınız size haram kılındı. Eğer onlarla (nikâhlanıp da) henüz birleşmemişseniz kızlarını almanızda size bir mahzur yoktur. Kendi sulbünüzden olan oğullarınızın eşleri ve iki kız kardeşi birden almak da size haram kılındı; ancak geçen geçmiştir. Allah çok bağışlayıcı ve esirgeyicidir.","4:24":"(Harp esiri olarak) sahip olduğunuz cariyeler müstesna, evli kadınlar da size haram kılındı. Allah’ın size emri budur. Bunlardan başkasını, namuslu olmak ve zina etmemek üzere mallarınızla (mehirlerini vererek) istemeniz size helâl kılındı. Onlardan faydalanmanıza karşılık kararlaştırılmış olan mehirlerini verin. Mehir kesiminden sonra (bir miktar indirim için) karşılıklı anlaşmanızda size günah yoktur. Şüphesiz Allah ilim ve hikmet sahibidir.","4:25":"İçinizden, imanlı hür kadınlarla evlenmeye gücü yetmeyen kimse, ellerinizin altında bulunan imanlı genç kızlarınız (sayılan) cariyelerinizden alsın. Allah sizin imanınızı daha iyi bilmektedir. Hep aynı köktensiniz (insanlık bakımından aranızda fark yoktur). Öyle ise iffetli yaşamaları, zina etmemeleri ve gizli dost da tutmamaları şartı ve sahiplerinin izni ile onları (cariyeleri) nikâhlayıp alın, mehirlerini de normal miktarda verin. Evlendikten sonra bir fuhuş yaparlarsa onlara, hür kadınların cezasının yarısı (uygulanır). Bu (cariye ile evlenme izni), içinizden günaha düşmekten korkanlar içindir. Sabretmeniz ise sizin için daha hayırlıdır. Allah çok bağışlayıcı ve esirgeyicidir.","4:27":"Allah sizin tevbenizi kabul etmek ister; şehvetlerine uyanlar (kötü arzuların esiri olanlar) ise büsbütün yoldan çıkmanızı isterler.","4:30":"Kim düşmanlık ve haksızlık ile bunu (haram yemeyi veya öldürmeyi) yaparsa (bilsin ki) onu ateşe koyacağız; bu ise Allah’a çok kolaydır.","4:31":"Eğer yasaklandığınız büyük günahlardan kaçınırsanız, sizin küçük günahlarınızı örteriz ve sizi şerefli bir yere sokarız.","4:35":"Eğer karı-kocanın aralarının açılmasından korkarsanız, erkeğin ailesinden bir hakem ve kadının ailesinden bir hakem gönderin. Bunlar barıştırmak isterlerse Allah aralarını bulur; şüphesiz Allah her şeyi bilen, her şeyden haberdar olandır.","4:36":"Allah’a ibadet edin ve O’na hiçbir şeyi ortak koşmayın. Ana-babaya, akrabaya, yetimlere, yoksullara, yakın komşuya, uzak komşuya, yakın arkadaşa, yolcuya, ellerinizin altında bulunanlara (köle, cariye, hizmetçi ve benzerlerine) iyi davranın; Allah kendini beğenen ve daima böbürlenip duran kimseyi sevmez.","4:38":"Allah’a ve ahiret gününe inanmadıkları halde mallarını, insanlara gösteriş için sarfedenler de (ahirette azaba dûçâr olurlar). Şeytan bir kimseye arkadaş olursa, ne kötü bir arkadaştır o!","4:40":"Şüphe yok ki Allah zerre kadar haksızlık etmez. (Kulun yaptığı iş, eğer bir kötülük ise, onun cezasını adaletle verir.) İyilik olursa onu katlar (kat kat arttırır), kendinden de büyük mükâfat verir.","4:43":"Ey iman edenler! Siz sarhoş iken -ne söylediğinizi bilinceye kadar- cünüp iken de -yolcu olan müstesna- gusül edinceye kadar namaza yaklaşmayın. Eğer hasta olur veya bir yolculuk üzerinde bulunursanız, yahut sizden biriniz ayak yolundan gelirse, yahut kadınlara dokunup da (bu durumlarda) su bulamamışsanız o zaman temiz bir toprakla teyemmüm edin: Yüzlerinize ve ellerinize sürün. Şüphesiz Allah çok affedici ve bağışlayıcıdır.","4:46":"Yahudilerden bir kısmı kelimeleri yerlerinden değiştirirler, dillerini eğerek, bükerek ve dine saldırarak (Peygambere karşı) «İşittik ve karşı geldik», «dinle, dinlemez olası», «râinâ» derler. Eğ
