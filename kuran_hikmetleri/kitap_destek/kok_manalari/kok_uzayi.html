a da göğe çıkmalısın. Bize, okuyacağımız bir kitap indirmediğin sürece (göğe) çıktığına da asla inanmayız.» De ki: Rabbimi tenzih ederim. Ben, sadece beşer bir elçiyim.","17:97":"Allah kime hidayet verirse, işte doğru yolu bulan odur; kimi de hidayetten uzak tutarsa, artık onlara, Allah’tan başka dostlar bulamazsın. Kıyamet gününde onları kör, dilsiz ve sağır bir halde yüzükoyun haşrederiz. Onların varacağı ve kalacağı yer cehennemdir ki, ateşi yavaşladıkça onun alevini artırırız.","17:101":"Andolsun biz, Musa’ya açık açık dokuz âyet verdik. Haydi İsrailoğullarına sor. Musa onlara geldiğinde Firavun ona, «Ey Musa! dedi, senin büyülenmiş olduğunu sanıyorum!»","17:102":"(Musa Firavun’a:) «Pek âlâ biliyorsun ki, dedi, bunları, birer ibret olmak üzere, ancak, göklerin ve yerin Rabbi indirdi. Ey Firavun! Ben de senin hakikaten mahvolduğunu sanıyorum!»","17:104":"Arkasından da İsrailoğullarına: «O topraklarda oturun! Ahiret vâdi tahakkuk edince, hepinizi toplayıp bir araya getireceğiz» dedik.","17:107":"De ki: Siz ona ister inanın, ister inanmayın; şu bir gerçek ki, bundan önce kendilerine ilim verilen kimselere o (Kur’an) okununca, derhal yüz üstü secdeye kapanırlar.","17:110":"De ki: «İster Allah deyin, ister Rahman deyin. Hangisini deseniz olur. Çünkü en güzel isimler O’na hastır.» Namazında yüksek sesle okuma; onda sesini fazla da kısma; ikisinin arası bir yol tut.","18:6":"Bu yeni Kitab’a inanmazlarsa (ve bu yüzden helâk olurlarsa) arkalarından üzüntüyle neredeyse kendini harap edeceksin.","18:8":"(Bununla beraber) biz mutlaka oradaki her şeyi kupkuru bir toprak yapacağız.","18:9":"(Resûlüm)! Yoksa sen, bizim âyetlerimizden Ashâb-ı Kehf ve Ashâb-ı Rakîm’in durumlarını şaşırtıcı mı buldun?","18:14":"Onların kalplerini metîn kıldık. O yiğitler (o yerin hükümdarı karşısında) ayağa kalkarak dediler ki: «Bizim Rabbimiz, göklerin ve yerin Rabbidir. Biz, O’ndan başkasına tanrı demeyiz. Yoksa saçma sapan konuşmuş oluruz.","18:17":"(Resûlüm! Orada bulunsaydın) güneşi görürdün: Doğduğu zaman mağaralarının sağına meyleder; batarken de sol taraftan onlara isabet etmeden geçerdi. (Böylece) onlar (güneş ışığından rahatsız olmaksızın) mağaranın bir köşesinde (uyurlardı). İşte bu, Allah’ın âyetlerindendir. Allah kime hidayet ederse, işte o, hakka ulaşmıştır, kimi de hidayetten mahrum ederse artık onu doğruya yöneltecek bir dost bulamazsın.","18:18":"Kendileri uykuda oldukları halde sen onları uyanık sanırdın. Onları sağa sola çevirirdik. Köpekleri de mağaranın girişinde ön ayaklarını uzatmış yatmakta idi. Eğer onların durumlarına muttali olsa idin dönüp onlardan kaçardın ve gördüklerin yüzünden için korku ile dolardı.","18:29":"Ve de ki: Hak, Rabbinizdendir. Öyle ise dileyen iman etsin, dileyen inkâr etsin. Biz, zalimlere öyle bir cehennem hazırladık ki, onun duvarları kendilerini çepe çevre kuşatmıştır. (Susuzluktan) imdat dileyecek olsalar imdatlarına, erimiş maden gibi yüzleri haşlayan bir su ile cevap verilir. Ne fena bir içecek ve ne kötü bir kalma yeri!","18:31":"İşte onlara, alt taraflarından ırmaklar akan Adn cennetleri vardır. Onlar Adn cennetlerinde tahtlar üzerine kurularak orada altın bileziklerle bezenecekler; ince ve kalın dîbâdan yeşil elbiseler giyecekler. Ne güzel karşılık ve ne güzel kalma yeri!","18:32":"Onlara, şu iki adamı misal olarak anlat: Bunlardan birine iki üzüm bağı vermiş, her ikisinin de etrafını hurmalarla donatmış, aralarında da ekinler bitirmiştik.","18:35":"(Böyle gurur ve kibirle) kendisine zulmederek bağına girdi. Şöyle dedi: «Bunun, hiçbir zaman yok olacağını sanmam.»","18:40":"«Belki Rabbim bana, senin bağından daha iyisini verir; senin bağına ise gökten yıldırımlar gönderir de bağ kupkuru bir toprak haline gelir.»","18:45":"Onlara şunu da misal göster: Dünya hayatı, gökten indirdiğimiz bir su gibidir ki, bu su sayesinde yeryüzünün bitkisi (önce gelişip) birbirine karışmış; arkasından rüzgârın savurduğu çerçöp haline gelmiştir. Allah, her şey üzerinde iktidar sahibidir.","18:47":"(Düşün) o günü ki, dağları yerinden götürürüz ve yeryüzünün çırılçıplak olduğunu görürsün. Hiçbirini bırakmaksızın onları (tüm ölüleri) mahşerde toplamış olacağız.","18:48":"Ve hepsi sıra sıra Rabbinin huzuruna çıkarılmışlardır: Andolsun ki sizi ilk defasında yarattığımız şekilde bize geldiniz. Oysa size vâdedilenlerin tahakkuk edeceği bir zaman tayin etmediğimizi sanmıştınız, değil mi?","18:49":"Kitap ortaya konmuştur: Suçluların, onda yazılı olanlardan korkmuş olduklarını görürsün. «Vay halimize! derler, bu nasıl kitapmış! Küçük büyük hiçbir şey bırakmaksızın (yaptıklarımızın) hepsini sayıp dökmüş!» Böylece yaptıklarını karşılarında bulmuşlardır. Senin Rabbin hiç kimseye zulmetmez.","18:51":"Ben onları (İblis ve soyunu) ne göklerin ve yerin yaratılışına, ne de bizzat kendilerinin yaratılışına şahit tuttum. Ben yoldan çıkaranları yardımcı edinecek değilim.","18:52":"Yine o günü (düşünün ki, Allah, kâfirlere): Benim ortaklarım olduklarını ileri sürdüğünüz şeyleri çağırın! buyurur. Çağırmışlardır onları; fakat kendilerine cevap vermemişlerdir. Biz onların arasına tehlikeli bir uçurum koyduk.","18:56":"Biz resulleri, sadece müjdeleyiciler ve uyarıcılar olarak göndeririz. Kâfir olanlar ise, hakkı bâtıla dayanarak ortadan kaldırmak için bâtıl yolla mücadele verirler. Onlar âyetlerimizi ve uyarıldıkları şeyleri alaya almışlardır.","18:58":"Senin, bağışı bol olan Rabbin merhamet sahibidir; şayet yaptıkları yüzünden onları (hemen) muaheze edecek olsaydı, onlara azabı çarçabuk verirdi. Fakat kendilerine tanınmış belli bir süre vardır ki, artık bundan kaçıp kurtulacakları bir sığınak bulamayacaklardır.","18:60":"Bir vakit Musa genç adamına demişti ki: «Durup dinlenmeyeceğim; tâ iki denizin birleştiği yere kadar varacağım, yahut senelerce yürüyeceğim.»","18:63":"(Genç adam:) Gördün mü! dedi, kayaya sığındığımız sırada balığı unuttum. Onu hatırlamamı bana şeytandan başkası unutturmadı. O, şaşılacak bir şekilde denizde yolunu tutup gitmişti.","18:71":"Bunun üzerine yürüdüler. Nihayet gemiye bindikleri zaman o (Hızır) gemiyi deldi. Musa: Halkını boğmak için mi onu deldin? Gerçekten sen (ziyanı) büyük bir iş yaptın! dedi.","18:77":"Yine yürüdüler. Nihayet bir köy halkına varıp onlardan yiyecek istediler. Ancak köy halkı onları misafir etmekten kaçındılar. Derken orada yıkılmak üzere bulunan bir duvarla karşılaştılar. (Hızır) hemen onu doğrulttu. Musa: Dileseydin, elbet buna karşı bir ücret alırdın, dedi.","18:79":"«Gemi var ya, o, denizde çalışan yoksul kimselerindi. Onu kusurlu kılmak istedim. (Çünkü) onların arkasında, her (sağlam) gemiyi gasbetmekte olan bir kral vardı.»","18:94":"Dediler ki: Ey Zülkarneyn! Bu memlekette Ye’cûc ve Me’cûc bozgunculuk yapmaktadırlar. Bizimle onlar arasında bir sed yapman için sana bir vergi verelim mi?","18:95":"Dedi ki: «Rabbimin beni içinde bulundurduğu nimet ve kudret daha hayırlıdır. Siz bana kuvvetinizle destek olun da, sizinle onlar arasına aşılmaz bir engel yapayım.»","18:101":"(100-101) Ve, gözleri beni görmeye kapalı bulunan, kulak vermeye de tahammül edemez olan kâfirleri o gün cehennemle yüz yüze getirmişizdir.","18:107":"İman edip iyi davranışlarda bulunanlara gelince, onlar için makam olarak Firdevs cennetleri vardır.","19:1":"Kâf. Hâ. Yâ. Ayn. Sâd.","19:4":"Rabbim! dedi, benden (vücudumdan), kemiklerim zayıfladı, saçım başım ağardı. Ve ben, Rabbim, sana (ettiğim) dua sayesinde hiç bedbaht olmadım.","19:13":"Tarafımızdan ona kalp yumuşaklığı ve temizlik de (verdik). O, çok sakınan bir kimse idi.","19:23":"Doğum sancısı onu bir hurma ağacına (dayanmaya) sevketti. «Keşke, dedi, bundan önce ölseydim de unutulup gitseydim!»","19:25":"«Hurma dalını kendine doğru silkele ki, üzerine taze, olgun hurma dökülsün.»","19:56":"Kitapta İdris’i de an. Hakikaten o, pek doğru bir insan, bir peygamberdi.","19:68":"Öyle ise, Rabbine andolsun ki, muhakkak surette onları şeytanlarla birlikte mahşerde toplayacağız; sonra onları diz üstü çökmüş vaziyette cehennemin çevresinde hazır bulunduracağız.","19:71":"İçinizden, oraya uğramayacak hiçbir kimse yoktur. Bu, Rabbin için kesinleşmiş bir hükümdür.","19:79":"Kesinlikle hayır! Biz onun söylediğini yazacağız ve azabını uzattıkça uzatacağız.","19:82":"Hayır, hayır! (Taptıkları), onların ibadetlerini tanımayacaklar ve onlara hasım olacaklar.","19:83":"(Resûlüm!) Görmedin mi? Biz, kâfirlerin üzerine, kendilerini iyice (isyankârlığa) sevkeden şeytanları gönderdik.","19:85":"(85-87) Takvâ sahiplerini heyet halinde çok merhametli olan Allah’ın huzurunda topladığımız, günahkârları da susuz olarak cehenneme sürdüğümüz gün, Rahmân nezdinde söz ve izin alandan başkalarının şefâata güçleri yetmeyecektir.","19:89":"Hakikaten siz, pek çirkin bir şey ortaya attınız.","19:90":"Bundan dolayı, neredeyse gökler çatlayacak, yer yarılacak, dağlar yıkılıp düşecektir!","19:98":"Biz, onlardan önce nice nesilleri helâk ettik. Sen, onlardan herhangi birinden (bir varlık emâresi) hissediyor veya onlara ait cılız bir ses işitiyor musun?","20:1":"Tâ. Hâ.","20:6":"Göklerde, yerde ve ikisi arasında bulunan şeyler ile toprağın altında olanlar hep O’nundur.","20:10":"Hani o, bir ateş görmüş ve ailesine: Bekleyin! Eminim ki bir ateş gördüm. Belki ondan size bir meş’ale getiririm veya ateşin yanında bir rehber bulurum, demişti.","20:12":"Muhakkak ki ben, evet ben senin Rabbinim! Hemen pabuçlarını çıkar! Çünkü sen kutsal vâdi Tuvâ’dasın!","20:18":"O, benim asamdır, dedi, ona dayanırım, onunla davarlarıma yaprak silkelerim; benim ona başkaca ihtiyaçlarım da vardır.","20:22":"Bir de elini koltuğunun altına sok ki, bir başka mucize olmak üzere o, kusursuz ve lekesiz beyazlıkta çıksın.","20:31":"Onun sayesinde arkamı kuvvetlendir.","20:39":"Musa’yı sandığa koy; sonra onu denize (Nil’e) bırak; deniz onu kıyıya atsın da, benim düşmanım ve onun düşmanı olan biri onu alsın. (Ey Musa! Sevilmen) ve benim nezaretimde yetiştirilmen için sana kendimden sevgi verdim.","20:42":"Sen ve kardeşin birlikte âyetlerimi götürün. Beni anmayı ihmal etmeyin.","20:53":"O, yeri size beşik yapan ve onda size yollar açan, gökten de su indirendir. Onunla biz çeşitli bitkilerden çiftler çıkardık.","20:63":"Şöyle dediler: «Bu ikisi, muhakkak ki, sihirleriyle sizi yurdunuzdan çıkarmak ve sizin örnek yolunuzu ortadan kaldırmak isteyen iki sihirbazdırlar sadece.»","20:85":"Allah buyurdu: Senden sonra biz, kavmini (Harun ile kalan İsrailoğullarını) imtihan ettik ve Sâmirî onları yoldan çıkardı.","20:94":"(Harun:) Ey annemin oğlu! dedi, saçımı sakalımı, yolma! Ben, senin: «İsrailoğullarının arasına ayrılık düşürdün; sözümü tutmadın!» demenden korktum.","20:97":"Musa: Defol! dedi, artık hayatın boyunca sen: «Bana dokunmayın!» diyeceksin. Ayrıca senin için, kurtulamayacağın bir ceza günü var. Tapmakta olduğun tanrına da bak! Yemin ederim, biz onu yakacağız; sonra da onu parça parça edip denize savuracağız!","20:102":"O günde Sûr’a üflenir ve biz o zaman günahkârları, gözleri (korkudan) gömgök bir halde mahşerde toplarız.","20:106":"Böylece yerlerini dümdüz, bomboş bırakacaktır.","20:107":"Orada ne bir iniş, ne de bir yokuş görebileceksin.","20:108":"O gün insanlar, dâvetçiye (İsrafil’e) uyacaklar. Ona karşı yan çizmek yoktur. Artık, çok esirgeyici Allah hürmetine sesler kısılmıştır. Bu yüzden, fısıltıdan başka bir ses işitemezsin.","20:111":"Bütün yüzler (insanlar), diri ve her şeye hakim olan Allah için eğilip boyun bükmüştür. Zulüm yüklenen ise, gerçekten perişan olmuştur.","20:112":"Her kim, mümin olarak iyi olan işlerden yaparsa, artık o, ne zulümden ne de hakkının çiğnenmesinden korkar.","20:118":"Şimdi burada senin için ne acıkmak vardır, ne de çıplak kalmak.","20:124":"Kim de beni anmaktan yüz çevirirse şüphesiz onun sıkıntılı bir hayatı olacak ve biz onu, kıyamet günü kör olarak haşredeceğiz.","20:131":"Sakın, kendilerini denemek için onlardan bir kesimi faydalandırdığımız dünya hayatının çekiciliğine gözlerini dikme! Rabbinin nimeti hem daha hayırlı, hem de daha süreklidir.","20:133":"Onlar: (Muhammed) bize Rabbinden bir mucize getirmeli değil miydi? dediler. Önce gelen kitaplardakinin apaçık delili (Kur’an) onlara gelmedi mi?","21:11":"Zalim olan nice beldeyi kırıp geçirdik; arkasından da nice başka topluluklar vücuda getirdik.","21:12":"Azabımızı hissettiklerinde bir de bakarsın ki oralardan (azap bölgesinden) kaçıyorlar!","21:15":"Biz kendilerini, kuruyup biçilmiş ekine, sönmüş ateşe çevirinceye kadar bu feryatları sürüp gider.","21:18":"Bilakis biz, hakkı bâtılın tepesine bindiririz de o, bâtılın işini bitirir. Bir de bakarsınız ki, bâtıl yok olup gitmiştir. (Allah’a) yakıştırdığınız sıfatlardan dolayı yazıklar olsun size!","21:30":"İnkâr edenler, göklerle yer bitişik bir halde iken bizim, onları birbirinden kopardığımızı ve her canlı şeyi sudan yarattığımızı görüp düşünmediler mi? Yine de inanmazlar mı?","21:31":"Onları sarsmasın diye yeryüzünde bir takım dağlar diktik. Orada geniş geniş yollar açtık; ta ki maksatlarına ulaşsınlar.","21:42":"De ki: Allah’a karşı sizi gece gündüz kim koruyacak? Buna rağmen onlar Rablerini anmaktan yüz çevirirler.","21:46":"Andolsun, onlara Rabbinin azabından ufak bir esinti dokunsa, hiç şüphesiz, «Vah bize! Hakikaten biz zalim kimselermişiz!» derler.","21:47":"Biz, kıyamet günü için adalet terazileri kurarız. Artık kimseye, hiçbir şekilde haksızlık edilmez. (Yapılan iş,) bir hardal tanesi kadar dahi olsa, onu (adalet terazisine) getiririz. Hesap gören olarak biz (herkese) yeteriz.","21:63":"Belki de bu işi şu büyükleri yapmıştır. Hadi onlara sorun; eğer konuşuyorlarsa! dedi.","21:65":"Sonra tekrar eski inanç ve tartışmalarına döndüler: Sen bunların konuşmadığını pek âlâ biliyorsun, dediler.","21:69":"«Ey ateş! İbrahim için serinlik ve esenlik ol!» dedik.","21:78":"Davud ve Süleyman’ı da (an). Bir zaman, bir ekin konusunda hüküm veriyorlardı: bir gurup insanın koyun sürüsü, geceleyin başıboş bir vaziyette bu ekinin içine dağılıp ziyan vermişti. Biz onların hükmünü görüp bilmekte idik.","21:79":"Böylece bunu (bu fetvayı) Süleyman’a biz anlatmıştık. Biz, onların her birine hüküm (hükümdarlık, peygamberlik) ve ilim verdik. Kuşları ve tesbih eden dağları da Davud’a boyun eğdirdik. (Bunları) biz yapmaktayız.","21:82":"Şeytanlar arasından da, onun için dalgıçlık eden (ve inciler çıkaran) ve bundan başka işler görenler vardı. Biz onları gözetim altında tutuyorduk.","21:87":"Zünnûn’u da (Yunus’u da zikret). O öfkeli bir halde geçip gitmişti; bizim kendisini asla sıkıştırmayacağımızı zannetmişti. Nihayet karanlıklar içinde: «Senden başka hiçbir tanrı yoktur. Seni tenzih ederim. Gerçekten ben zalimlerden oldum!» diye niyaz etti.","21:91":"Irzını iffetle korumuş olanı (Meryem’i de an.) Biz ona ruhumuzdan üfledik; onu ve oğlunu cümle âlem için bir ibret kıldık.","21:96":"Nihayet Ye’cûc ve Me’cûc (sedleri) açıldığı ve onlar her tepeden akın ettiği zaman;","21:103":"En büyük dehşet dahi onları tasalandırmaz. Melekler kendilerini şöyle karşılar: İşte bu size vâdedilmiş olan (mutlu) gününüzdür.","22:2":"Onu gördüğünüz gün, her emzikli kadın emzirdiği çocuğu unutur, her gebe kadın çocuğunu düşürür. İnsanları da sarhoş bir halde görürsün. Oysa onlar sarhoş değillerdir; fakat Allah’ın azabı çok dehşetlidir!","22:5":"Ey insanlar! Eğer yeniden dirilmekten şüphede iseniz, şunu bilin ki, biz sizi topraktan, sonra nutfeden, sonra alakadan (aşılanmış yumurtadan), sonra uzuvları (önce) belirsiz, (sonra) belirlenmiş canlı et parçasından (uzuvları zamanla oluşan ceninden) yarattık ki size (kudretimizi) gösterelim. Ve dilediğimizi, belirlenmiş bir süreye kadar rahimlerde bekletiriz; sonra sizi bir bebek olarak dışarı çıkarırız. Sonra güçlü çağınıza ulaşmanız için (sizi büyütürüz). İçinizden kimi vefat eder; yine içinizden kimi de ömrün en verimsiz çağına kadar götürülür; ta ki bilen bir kimse olduktan sonra bir şey bilmez hale gelsin. Sen, yeryüzünü de kupkuru ve ölü bir halde görürsün; fakat biz, üzerine yağmur indirdiğimizde o, kıpırdanır, kabarır ve her çeşitten (veya çiftten) iç açıcı bitkiler verir.","22:9":"(8-9) İnsanlardan bazısı, bir bilgisi, bir rehberi ve (vahye dayanan) aydınlatıcı bir kitabı olmadığı halde, sırf Allah yolundan saptırmak için yanını eğip bükerek (kibir ve azamet içinde) Allah hakkında tartışmaya kalkar. Onun için dünyada bir rezillik vardır; kıyamet gününde ise ona yakıcı azabı tattıracağız.","22:17":"Mümin olanlar, yahudi olanlar, sâbiîler, hıristiyanlar, mecûsîler ve müşrik olanlara gelince, muhakkak ki Allah, bunlar arasında kıyamet gününde (ayrı ayrı) hükmünü verir. Çünkü Allah her şeyi hakkıyla bilendir.","22:19":"Şu iki gurup, Rableri hakkında çekişen iki hasımdır: İmdi, inkâr edenler için ateşten bir elbise biçilmiştir. Onların başlarının üstünden kaynar su dökülecektir!","22:20":"Bununla, karınlarının içindeki (organlar) ve derileri eritilecektir!","22:21":"Bir de onlar için demir kamçılar vardır!","22:23":"Muhakkak ki Allah, iman edip iyi davranışlarda bulunanları, zemininden ırmaklar akan cennetlere kabul eder. Bunlar orada altın bileziklerle ve incilerle bezenirler. Orada giyecekleri ise ipektir.","22:27":"(27-28) İnsanlar arasında haccı ilân et ki, gerek yaya olarak, gerekse nice uzak yoldan gelen yorgun argın develer üzerinde, kendilerine ait bir takım yararları yakînen görmeleri, Allah’ın kendilerine rızık olarak verdiği kurbanlık hayvanlar üzerine belli günlerde Allah’ın ismini anmaları (kurban kesmeleri için) sana (Kâbe’ye) gelsinler. Artık ondan hem kendiniz yeyin, hem de yoksula, fakire yedirin.","22:29":"Sonra kirlerini gidersinler; adaklarını yerine getirsinler ve o Eski Ev’i (Kâbe’yi) tavaf etsinler.","22:30":"Durum böyle. Her kim, Allah’ın emir ve yasaklarına saygı gösterirse, bu, Rabbinin katında kendisi için daha hayırlıdır. (Haram olduğu) size okunanların dışında kalan hayvanlar size helâl kılındı. O halde, pislikten, putlardan sakının; yalan sözden sakının.","22:31":"Kendisine ortak koşmaksızın Allah’ın hanifleri (O’nun birliğini tanıyan müminler olun). Kim Allah’a ortak koşarsa sanki o, gökten düşüp parçalanmış da kendisini kuşlar kapmış, yahut rüzgâr onu uzak bir yere sürüklemiş (bir nesne) gibidir.","22:36":"Biz, büyük baş hayvanları da sizin için Allah’ın (dininin) işaretlerinden (kurban) kıldık. Onlarda sizin için hayır vardır. Şu halde onlar, ayakları üzerine dururken üzerlerine Allah’ın ismini anınız (ve kurban ediniz). Yan üstü yere düştüklerinde ise, artık (canı çıktığında) onlardan hem kendiniz yeyin, hem de ihtiyacını gizleyen-gizlemeyen fakirlere yedirin. İşte bu hayvanları biz, şükredesiniz diye sizin istifadenize verdik.","22:40":"Onlar, başka değil, sırf «Rabbimiz Allah’tır» dedikleri için haksız yere yurtlarından çıkarılmış kimselerdir. Eğer Allah, bir kısım insanları (kötülüklerini) diğer bir kısmı ile defedip önlemeseydi, mutlak surette, içlerinde Allah’ın ismi bol bol anılan manastırlar, kiliseler, havralar ve mescidler yıkılır giderdi. Allah, kendisine (kendi dinine) yardım edenlere muhakkak surette yardım eder. Hiç şüphesiz Allah, güçlüdür, galiptir.","22:45":"Nitekim, birçok memleket vardı ki, o memleket (halkı) zulmetmekte iken, biz onları helâk ettik. Şimdi o ülkelerde duvarlar, (çökmüş) tavanların üzerine yıkılmıştır. Nice kullanılmaz hale gelmiş kuyular ve (ıssız kalmış) ulu saraylar vardır.","22:55":"İnkâr edenler, kendilerine o saat ansızın gelinceye, yahut da (kendileri için hayır yönünden) kısır bir günün azabı gelinceye kadar onun (Kur’an) hakkında hep şüphe içindedirler.","22:72":"Âyetlerimiz açık açık kendilerine okunduğunda, kâfirlerin suratlarında hoşnutsuzluk sezersin. Onlar, kendilerine âyetlerimizi okuyanların neredeyse üzerlerine saldırırlar. De ki: Size bundan (bu öfke ve huzursuzluğunuzdan) daha kötüsünü bildireyim mi? Cehennem! Allah, onu kâfirlere (ceza olarak) bildirdi. O, ne kötü sondur!","22:73":"Ey insanlar! (Size) bir misal verildi; şimdi onu dinleyin: Allah’ı bırakıp da yalvardıklarınız (taptıklarınız) bunun için bir araya gelseler bile bir sineği dahi yaratamazlar. Sinek onlardan bir şey kapsa, bunu ondan geri de alamazlar. İsteyen de âciz, kendinden istenen de!","23:12":"Andolsun biz insanı, çamurdan (süzülüp çıkarılmış) bir özden yarattık.","23:19":"Böylece onun (yağmurun) sayesinde sizin yararınıza hurma bahçeleri ve üzüm bağları meydana getirdik. Bunlarda sizin için birçok meyveler vardır ve siz onlardan yersiniz.","23:20":"Tûr-i Sînâ’da da yetişen bir ağaç daha meydana getirdik ki, bu ağaç hem yağ hem de yiyenlerin ekmeğine katık edecekleri (zeytin) verir.","23:36":"«Bu size vaâdedilen (öldükten sonra yeniden dirilmek, gerçek olmaktan) çok uzak!»","23:41":"Nitekim, vukuu kaçınılmaz olan korkunç bir ses yakalayıverdi onları! Kendilerini hemen sel süprüntüsüne çevirdik. Zalimler topluluğunun canı cehenneme!","23:44":"Sonra biz peyderpey peygamberlerimizi gönderdik. Herhangi bir ümmete peygamberlerinin geldiği her defasında, onlar bu peygamberi yalanladılar; biz de onları birbiri ardından yok ettik ve onları ibret hikâyelerine dönüştürdük. Artık iman etmeyen kavmin canı cehenneme!","23:74":"Ahirete inanmayanlar ise, ısrarla yoldan çıkmaktadırlar.","23:75":"Eğer onlara acıyıp da içinde bulundukları sıkıntıyı giderseydik, iyice körleşerek azgınlıklarında direnirlerdi.","23:97":"Ve de ki: Rabbim! Şeytanların kışkırtmalarından sana sığınırım!","23:100":"«Ta ki boşa geçirdiğim dünyada iyi iş (ve hareketler) yapayım.» Hayır! Bu onun ağzından çıkan (boş) bir laftan ibarettir. Onların gerisinde ise, yeniden dirilecekleri güne kadar (süren) bir berzah vardır.","23:101":"Sûra üflendiği zaman artık aralarında akrabalık bağları kalmamıştır; birbirlerini de arayıp sormazlar.","23:104":"Ateş yüzlerini yakar; orada suratları çirkin ve gülünç bir halde bulunurlar.","23:115":"Sizi sadece boş yere yarattığımızı ve sizin hakikaten huzurumuza geri getirilmeyeceğinizi mi sandınız?","24:30":"(Resûlüm!) Mümin erkeklere, gözlerini (harama) dikmemelerini, ırzlarını da korumalarını söyle. Çünkü bu, kendileri için daha temiz bir davranıştır. Şüphesiz Allah, onların yapmakta olduklarından haberdardır.","24:31":"Mümin kadınlara da söyle: Gözlerini (harama bakmaktan) korusunlar; namus ve iffetlerini esirgesinler. Görünen kısımları müstesna olmak üzere, zinetlerini teşhir etmesinler. Baş örtülerini, yakalarının üzerine (kadar) örtsünler. Kocaları, babaları, kocalarının babaları, kendi oğulları, kocalarının oğulları, erkek kardeşleri, erkek kardeşlerinin oğulları, kız kardeşlerinin oğulları, kendi kadınları (mümin kadınlar), ellerinin altında bulunanlar (köleleri), erkeklerden, ailenin kadınına şehvet duymayan hizmetçi vb. tâbi kimseler, yahut henüz kadınların gizli kadınlık hususiyetlerinin farkında olmayan çocuklardan başkasına zinetlerini göstermesinler. Gizlemekte oldukları zinetleri anlaşılsın diye ayaklarını yere vurmasınlar (Dikkatleri üzerine çekecek tarzda yürümesinler). Ey müminler! Hep birden Allah’a tevbe ediniz ki kurtuluşa eresiniz.","24:32":"Aranızdaki bekârları, kölelerinizden ve cariyelerinizden elverişli olanları evlendirin. Eğer bunlar fakir iseler, Allah kendi lütfu ile onları zenginleştirir. Allah, (lütfu) geniş olan ve (her şeyi) bilendir.","24:35":"Allah, göklerin ve yerin nûrudur. O’nun nûrunun temsili, içinde lamba bulunan bir kandillik gibidir. O lamba kristal bir fanus içindedir; o fanus da sanki inciye benzer bir yıldız gibidir ki, doğuya da, batıya da nisbet edilemeyen mübarek bir ağaçtan, yani zeytinden (çıkan yağdan) tutuşturulur. Onun yağı, neredeyse, kendisine ateş değmese dahi ışık verir. (Bu,) nûr üstüne nûrdur. Allah dilediği kimseyi nûruna eriştirir. Allah insanlara (işte böyle) temsiller getirir. Allah her şeyi bilir.","24:43":"Görmez misin ki Allah bir takım bulutları (çıkarıp) sürüyor; sonra onları bir araya getirip üstüste yığıyor. İşte görüyorsun ki bunlar arasından yağmur çıkıyor. O, gökten, oradaki dağlardan (dağlar büyüklüğünde bulutlardan) dolu indirir. Artık onu dilediğine isabet ettirir; dilediğinden de onu uzak tutar; (bu bulutların) şimşeğinin parıltısı neredeyse gözleri alır!","24:49":"Ama, eğer (Allah ve Resûlünün hükmettiği) hak kendi lehlerine ise, ona boyun eğip gelirler.","24:50":"Kalplerinde bir hastalık mı var; yoksa şüphe içinde midirler, yahut Allah ve Resûlünün kendilerine zulüm ve haksızlık edeceğinden mi korkuyorlar? Hayır, asıl zalimler kendileridir!","24:63":"(Ey müminler!) Peygamber’i, kendi aranızda birbirinizi çağırır gibi çağırmayın. İçinizden, birini siper edinerek sıvışıp gidenleri muhakkak ki Allah bilmektedir. Bu sebeple, onun emrine aykırı davrananlar, başlarına bir belâ gelmesinden veya kendilerine çok elemli bir azap isabet etmesinden sakınsınlar.","25:23":"Onların yaptıkları her bir (iyi) işi ele alırız, onu saçılmış zerreler haline getiririz (değersiz kılarız).","25:28":"Yazık bana! Keşke falancayı (bâtıl yolcusunu) dost edinmeseydim!","25:32":"İnkâr edenler: Kur’an ona bir defada topluca indirilmeli değil miydi? dediler. Biz onu senin kalbine iyice yerleştirmek için böyle yaptık (parça parça indirdik) ve onu tane tane (ayırarak) okuduk.","25:33":"Onların sana getirdikleri hiçbir temsil yoktur ki, (onun karşılığında) sana doğrusunu ve daha açığını getirmeyelim.","25:38":"Âd’ı, Semûd’u, Ress halkını ve bunlar arasında daha birçok nesilleri de (inkârcılıklarından ötürü helâk ettik).","25:53":"Birinin suyu tatlı ve susuzluğu giderici, diğerininki tuzlu ve acı iki denizi salıveren ve aralarına bir engel, aşılmaz bir sınır koyan O’dur.","25:61":"Gökte burçları var eden, onların içinde bir çerağ (güneş) ve nurlu bir ay barındıran Allah, yüceler yücesidir.","25:77":"(Resûlüm!) De ki: (Kulluk ve) yalvarmanız olmasa, Rabbim size ne diye değer versin? (Ey inkârcılar! Size Resûl’ün bildirdiklerini) kesinkes yalan saydınız; onun için azap yakanızı bırakmayacaktır!","26:1":"Tâ. Sîn. Mîm.","26:4":"Biz dilesek, onların üzerine gökten bir mucize indiririz de, ona boyunları eğilip kalır.","26:50":"«Zararı yok, dediler, (nasıl olsa) biz şüphesiz Rabbimize döneceğiz.»","26:54":"«Esasen bunlar, sayıları az, bölük pörçük bir cemaattır.»","26:63":"Bunun üzerine Musa’ya: Asân ile denize vur! diye vahyettik. (Vurunca deniz) derhal yarıldı (on iki yol açıldı), her bölük koca bir dağ gibi oldu.","26:94":"(94-95) Artık onlar, o azgınlar ve İblis orduları, toptan oraya tepetaklak (cehenneme) atılırlar.","26:119":"Bunun üzerine biz onu ve beraberindekileri, o dolu geminin içinde (taşıyarak) kurtardık.","26:128":"Siz her yüksek yere bir alâmet dikerek eğleniyor musunuz?","26:149":"(Böyle sanıp) dağlardan ustaca evler yontuyorsunuz (oyup yapıyorsunuz).","26:168":"Lût: Doğrusu, dedi, ben sizin bu işinizden tiksinmekteyim!","26:225":"(225-226) Onların her vâdide başıboş dolaştıklarını ve gerçekte yapmadıkları şeyleri söylediklerini görmedin mi?","27:1":"Tâ. Sîn. Bunlar Kur’an’ın, apaçık bir Kitab’ın âyetleridir.","27:17":"Süleyman’ın, cinlerden, insanlardan ve kuşlardan müteşekkil orduları toplandı; hepsi birarada (onun tarafından) düzenli olarak sevkediliyordu.","27:18":"Nihayet Karınca vâdisine geldikleri zaman, bir karınca: Ey karıncalar! Yuvalarınıza girin; Süleyman ve ordusu farkına varmadan sizi ezmesin! dedi.","27:19":"(Süleyman) onun sözünden dolayı gülümsedi ve dedi ki: Ey Rabbim! Beni, gerek bana gerekse ana babama verdiğin nimete şükretmeye ve hoşnut olacağın iyi işler yapmaya muvaffak kıl. Rahmetinle, beni iyi kulların arasına kat.","27:20":"(Süleyman) kuşları gözden geçirdi ve şöyle dedi: Hüdhüd’ü niçin göremiyorum? Yoksa kayıplara mı karıştı?","27:22":"Çok geçmeden (Hüdhüd) gelip: Ben, dedi, senin bilmediğin bir şeyi öğrendim. Sebe’den sana çok doğru (ve önemli) bir haber getirdim.","27:25":"(Şeytan böyle yapmış ki) göklerde ve yerde gizleneni açığa çıkaran, gizlediğinizi ve açıkladığınızı bilen Allah’a secde etmesinler.","27:39":"Cinlerden bir ifrit: Sen makamından kalkmadan ben onu sana getiririm. Gerçekten bu işe gücüm yeter ve bana güvenebilirsiniz, dedi.","27:42":"Melike gelince: Senin tahtın da böyle mi? dendi. O şöyle cevap verdi: Tıpkı o! (Süleyman şöyle dedi): Bize daha önce (Allah’tan) bilgi verilmiş ve biz müslüman olmuştuk.","27:44":"Ona: Köşke gir! dendi. Melike onu görünce derin bir su sandı ve eteğini yukarı çekti. Süleyman: Bu, billûrdan yapılmış, şeffaf bir zemindir, dedi. Melike dedi ki: Rabbim! Ben gerçekten kendime yazık etmişim. Süleyman’la beraber âlemlerin Rabbi olan Allah’a teslim oldum.","27:60":"(Onlar mı hayırlı) yoksa gökleri ve yeri yaratan, gökten size su indiren mi? O suyla, bir ağacını bile bitirmeye gücünüzün yetmediği güzel güzel bahçeler bitirdik. Allah’tan başka bir tanrı mı var! Doğrusu onlar sapıklıkta devam eden bir güruhtur.","27:61":"(Onlar mı hayırlı) yoksa yeryüzünü oturmaya elverişli kılan, aralarından (yer altından ve üstünden) nehirler akıtan, arz için sabit dağlar yaratan, iki deniz arasına engel koyan mı? Allah’tan başka bir tanrı mı var! Doğrusu onların çoğu (hakikatleri) bilmiyorlar.","27:83":"O gün, her ümmet içinden âyetlerimizi yalan sayanlardan bir cemaat toplarız da onlar toplu olarak (hesap yerine) sevkedilirler.","27:88":"Sen dağları görürsün de, onları yerinde durur sanırsın. Oysa onlar bulutların yürümesi gibi yürümektedirler. (Bu,) her şeyi sapasağlam yapan Allah’ın sanatıdır. Şüphesiz ki O, yaptıklarınızdan tamamıyla haberdardır.","27:90":"(Rablerinin huzuruna) kötülükle gelen kimseler ise yüzükoyun cehenneme atılırlar. (Onlara) «Ancak yaptıklarınızın karşılığını görmektesiniz!» (denir).","28:6":"Ve o yerde onları hakim kılmak; Firavun ile Hâmân’a ve ordularına, onlardan (İsrailoğullarından gelecek diye) korktukları şeyi göstermek (istiyorduk).","28:15":"Musa, ahalisinin habersiz olduğu bir sırada şehre girdi. Orada, biri kendi tarafından, diğeri düşman tarafından olan iki adamı birbiriyle döğüşür buldu. Kendi tarafından olanı, düşmana karşı ondan yardım diledi. Musa da ötekine, bir yumruk vurup ölümüne sebep oldu. (Bunun üzerine:) Bu şeytan işidir. O, gerçekten saptırıcı, apaçık bir düşman, dedi.","28:23":"Musa, Medyen suyuna varınca, orada (hayvanlarını) sulayan bir çok insan buldu. Onların gerisinde de, (hayvanlarını) engelleyen iki kadın gördü. Onlara: Derdiniz nedir? dedi. Şöyle cevap verdiler: Çobanlar sulayıp çekilmeden biz (onların içine sokulup hayvanlarımızı) sulamayız; babamız da çok yaşlıdır.","28:27":"(Şuayb) dedi ki: Bana sekiz yıl çalışmana karşılık şu iki kızımdan birini sana nikâhlamak istiyorum. Eğer on yıla tamamlarsan artık o kendinden; yoksa sana ağırlık vermek istemem. İnşallah beni iyi kimselerden (işverenlerden) bulacaksın.","28:29":"Sonunda Musa süreyi doldurup ailesiyle yola çıkınca, Tûr tarafından bir ateş gördü. Ailesine: Siz (burada) bekleyin; ben bir ateş gördüm, belki oradan size bir haber yahut ısınmanız için bir ateş parçası getiririm, dedi.","28:30":"Oraya gelince, o mübarek yerdeki vâdinin sağ kıyısından, (oradaki) ağaç tarafından kendisine şöyle seslenildi: Ey Musa! Bil ki ben, bütün âlemlerin Rabbi olan Allah’ım.","28:32":"«Elini koynuna sok; kusursuz, bembeyaz çıkacaktır. Korkudan (açılan) kollarını kendine çek. İşte bu ikisi Firavun ve onun adamlarına karşı Rabbin tarafından iki kesin delildir. Çünkü onlar, yoldan çıkan bir kavim olmuşlardır» (diye seslenildi).","28:34":"Kardeşim Harun’un dili benimkinden daha düzgündür. Onu da beni doğrulayan bir yardımcı olarak benimle birlikte gönder. Zira bana yalancılık ithamında bulunmalarından endişe ediyorum.","28:35":"Allah buyurdu: Seni kardeşinle destekleyeceğiz ve size öyle bir kudret vereceğiz ki, âyetlerimiz (mucize yardımlarımız) sayesinde onlar size erişemiyecekler. Siz ve size tâbi olanlar üstün geleceksiniz.","28:42":"Bu dünyada arkalarına lânet taktık. Onlar, kıyamet gününde de kötülenmişler arasındadır.","28:71":"(Resûlüm!) De ki: Düşündünüz mü hiç, eğer Allah üzerinizde geceyi ta kıyamet gününe kadar aralıksız devam ettirse, Allah’tan başka size bir ışık getirecek tanrı kimdir? Hâla işitmeyecek misiniz?","28:76":"Karun, Musa’nın kavminden idi de, onlara karşı azgınlık etmişti. Biz ona öyle hazineler vermiştik ki, anahtarlarını güçlü kuvvetli bir topluluk zor taşırdı. Kavmi ona şöyle demişti: Şımarma! Bil ki Allah şımarıkları sevmez.","28:82":"Daha dün onun yerinde olmayı isteyenler: Demek ki, Allah rızkı, kullarından dilediğine bol veriyor, dilediğine de az. Şayet Allah bize lütufta bulunmuş olmasaydı, bizi de yerin dibine geçirirdi. Vay! Demek ki inkârcılar iflâh olmazmış! demeye başladılar.","29:41":"Allah’tan başka dostlar edinenlerin durumu, örümceğin durumu gibidir. Örümcek bir yuva edinir; halbuki yuvaların en çürüğü şüphesiz örümcek yuvasıdır. Keşke bilselerdi!","29:48":"Sen bundan önce ne bir yazı okur, ne de elinle onu yazardın. Öyle olsaydı, bâtıla uyanlar kuşku duyarlardı.","30:2":"(2-5) Rumlar, (Arapların bulunduğu bölgeye) en yakın bir yerde yenilgiye uğradılar. Halbuki onlar, bu yenilgilerinden sonra birkaç yıl içinde galip geleceklerdir. Eninde sonunda emir Allah’ındır. O gün müminler de Allah’ın yardımıyla sevineceklerdir. Allah, dilediğine yardım eder. O, mutlak güç sahibidir, çok esirgeyicidir.","30:15":"İman edip iyi işler yapanlara gelince, onlar, cennette nimetlere ve sevince mazhar olacaklardır.","30:17":"(17-18) Haydi siz, akşama ulaştığınızda (akşam ve yatsı vaktinde) sabaha kavuştuğunuzda, gündüzün sonunda ve öğle vaktine eriştiğinizde Allah’ı tesbih edin (namaz kılın), ki göklerde ve yerde hamd O’na mahsustur.","31:12":"Andolsun biz Lokman’a: Allah’a şükret! diyerek hikmet verdik. Şükreden ancak kendisi için şükretmiş olur. Nankörlük eden de bilsin ki, Allah hiçbir şeye muhtaç değildir, her türlü övgüye lâyıktır.","31:18":"Küçümseyerek insanlardan yüz çevirme ve yeryüzünde böbürlenerek yürüme. Zira Allah, kendini beğenmiş övünüp duran kimseleri asla sevmez.","31:20":"Allah’ın, göklerde ve yerdeki (nice varlık ve imkânları) sizin emrinize verdiğini, nimetlerini açık ve gizli olarak size bolca ihsan ettiğini görmediniz mi? Yine de, insanlar içinde, -bilgisi, rehberi ve aydınlatıcı bir kitabı yokken- Allah hakkında tartışan kimseler vardır.","31:32":"Dağlar gibi dalgalar onları kuşattığı zaman, dini tamamen Allah’a has kılarak (ihlâsla) O’na yalvarırlar. Allah onları karaya çıkararak kurtardığı vakit içlerinden bir kısmı orta yolu tutar. Zaten bizim âyetlerimizi, ancak nankör hâinler bilerek inkâr eder.","32:8":"Sonra onun zürriyetini, dayanıksız bir suyun özünden üretmiştir.","32:16":"Korkuyla ve umutla Rablerine yalvarmak üzere (ibadet ettikleri için), vücutları yataklardan uzak kalır ve kendilerine verdiğimiz rızıktan Allah yolunda harcarlar.","33:4":"Allah, bir adamın içinde iki kalp yaratmadığı gibi, «zıhâr» yaptığınız eşlerinizi de analarınız yerinde tutmadı ve evlâtlıklarınızı da öz oğullarınız olarak tanımadı. Bunlar sizin ağızlarınıza geliveren sözlerden ibarettir. Allah ise gerçeği söyler ve doğru yola O eriştirir.","33:10":"Onlar hem yukarınızdan hem aşağı tarafınızdan (vâdinin üstünden ve alt yanından) üzerinize yürüdükleri zaman; gözler yıldığı, yürekler gırtlağa geldiği ve siz Allah hakkında türlü türlü şeyler düşündüğünüz zaman;","33:13":"Onlardan bir gurup da demişti ki: Ey Yesribliler (Medineliler)! Artık sizin için durmanın sırası değil, haydi dönün! İçlerinden bir kısmı ise: Gerçekten evlerimiz emniyette değil, diyerek Peygamber’den izin istiyordu; oysa evleri tehlikede değildi, sadece kaçmayı arzuluyorlardı.","33:18":"Allah, içinizden (savaştan) alıkoyanları ve yandaşlarına: «Bize katılın» diyenleri gerçekten biliyor. Zaten bunların pek azı savaşa gelir.","33:19":"(Gelseler de) size karşı pek hasistirler. Hele korku gelip çattı mı, üzerine ölüm baygınlığı çökmüş gibi gözleri dönerek sana baktıklarını görürsün. Korku gidince ise, mala düşkünlük göstererek sizi sivri dilleri ile incitirler. Onlar iman etmiş değillerdir; bunun için Allah onların yaptıklarını boşa çıkarmıştır. Bu, Allah’a göre kolaydır.","33:23":"Müminler içinde Allah’a verdikleri sözde duran nice erler var. İşte onlardan kimi, sözünü yerine getirip o yolda canını vermiştir; kimi de (şehitliği) beklemektedir. Onlar hiçbir şekilde (sözlerini) değiştirmemişlerdir.","33:26":"Allah, ehl-i kitaptan, onlara (müşrik ordularına) yardım edenleri kalelerinden indirdi ve kalplerine korku düşürdü; bir kısmını öldürüyor, bir kısmını da esir alıyordunuz.","33:37":"(Resûlüm!) Hani Allah’ın nimet verdiği, senin de kendisine iyilik ettiğin kimseye: Eşini yanında tut, Allah’tan kork! diyordun. Allah’ın açığa vuracağı şeyi, insanlardan çekinerek içinde gizliyordun. Oysa asıl korkmana lâyık olan Allah’tır. Zeyd, o kadından ilişiğini kesince biz onu sana nikâhladık ki evlâtlıkları, karılarıyla ilişkilerini kestiklerinde (o kadınlarla evlenmek isterlerse) müminlere bir güçlük olmasın. Allah’ın emri yerine getirilmiştir.","34:7":"Kâfir olanlar (kendi aralarında) şöyle dediler: Çürüyüp paramparça olduğunuz vakit yeniden dirileceğinizi söyleyerek haber veren kişiyi gösterelim mi?","34:11":"Geniş zırhlar imal et, dokumasını ölçülü yap. (Ey Davud hanedanı!) İyi işler yapın. Kuşkusuz ben, yaptıklarınızı görmekteyim, diye (vahyettik).","34:13":"Onlar Süleyman’a kalelerden, heykellerden, havuzlar kadar (geniş) leğenlerden, sabit kazanlardan ne dilerse yaparlardı. Ey Davud ailesi! Şükredin. Kullarımdan şükreden azdır!","34:16":"Ama onlar yüz çevirdiler. Bu yüzden üzerlerine Arim selini gönderdik. Onların iki bahçesini, buruk yemişli, acı ılgınlı ve içinde biraz da sedir ağacı bulunan iki (harap) bahçeye çevirdik.","34:52":"(İş işten geçtikten sonra:) «Ona inandık» demişlerdir, ama uzak yerden (dünya hayatı gelip geçtikten sonra) imana kavuşmak onlar için nasıl mümkün olur?","35:13":"Allah, geceyi gündüzün içine sokar, gündüzü de gecenin içine sokar; güneş ve ayı emri altına almıştır. Her biri belirtilmiş bir süreye kadar akıp gider. İşte (bütün bunları yapan) Rabbiniz Allah’tır. Mülk O’nundur. O’nu bırakıp da kendilerine taptıklarınız ise, bir çekirdek kabuğuna bile sahip değillerdir.","35:35":"O (Rab) ki lütfuyla bizi asıl oturulacak yurda (cennete) yerleştirdi. Artık orada bize ne bir yorgunluk dokunacak ne de orada bize bir usanç gelecektir.","36:1":"Yâsîn,","36:8":"Biz, onların boyunlarına halkalar geçirdik. O halkalar çenelere kadar dayanmaktadır. Bu yüzden kafaları yukarı kalkıktır.","36:39":"Ay için de birtakım menziller (yörüngeler) tayin ettik. Nihayet o, eğri hurma dalı gibi (hilâl) olur da geri döner.","36:51":"Nihayet Sûr’a üfürülecek. Bir de bakarsın ki onlar kabirlerinden kalkıp koşarak Rablerine giderler.","36:55":"O gün cennetlikler, gerçekten nimetler içinde safa sürerler.","36:67":"Eğer dilesek oldukları yerde onların şekillerini değiştirirdik de ne ileriye gitmeye güçleri yeterdi ne de geri gelmeye!","36:78":"Kendi yaratılışını unutarak bize karşı misal getirmeye kalkışıyor ve: «Şu çürümüş kemikleri kim diriltecek?» diyor.","37:2":"(1-4) Saf saf dizilmişlere, toplayıp sürenlere, zikir okuyanlara yemin ederim ki, ilâhınız birdir.","37:10":"Ancak (meleklerin konuşmalarından) bir söz kapan olursa, onu da delip geçen bir parlak ışık takip eder.","37:11":"Şimdi sor onlara! Yaratma bakımından onlar mı daha zor, yoksa bizim yarattığımız (insanlar) mı? Şüphesiz biz kendilerini yapışkan bir çamurdan yarattık.","37:45":"Onlara pınardan (doldurulmuş) kadehler dolaştırılır.","37:46":"Berraktır, içenlere lezzet verir.","37:47":"O içkide ne sersemletme vardır ne de onunla sarhoş olurlar.","37:62":"(62-63) Şimdi, ziyafet olarak, cennet ehli için anılan bu nimetler mi daha hayırlı, yoksa zakkum ağacı mı? Biz onu (zakkumu) zalimler için bir fitne (imtihan) kıldık.","37:67":"Sonra zakkum yemeğinin üzerine onlar için, kaynar su karıştırılmış bir içki vardır.","37:89":"Ben hastayım, dedi.","37:91":"(91-92) Yavaşça putlarının yanına vardı. (Oraya konmuş yemekleri görünce:) Yemiyor musunuz? Neden konuşmuyorsunuz? dedi.","37:94":"(Putperestler) koşarak İbrahim’e geldiler.","37:103":"(103-106) Her ikisi de teslim olup, onu alnı üzerine yatırınca: Ey İbrahim! Rüyayı gerçekleştirdin. Biz iyileri böyle mükâfatlandırırız. Bu, gerçekten, çok açık bir imtihandır, diye seslendik.","37:140":"Hani o, dolu bir gemiye binip kaçmıştı.","37:141":"Gemide olanlarla karşılıklı kur’a çektiler de kaybedenlerden oldu.","37:142":"Yunus kendini kınayıp dururken onu bir balık yuttu.","37:146":"Ve üstüne (gölge yapması için) kabak türünden geniş yapraklı bir nebat bitirdik.","37:177":"Azap yurtlarına indiğinde, uyarılanların (fakat yola gelmeyenlerin) sabahı ne kötü olur!","38:1":"(1-2) Sâd. Öğüt veren Kur’an’a yemin ederim ki, küfredenler, (iddia ettiklerinin) aksine, bir gurur ve tefrika içindedirler.","38:3":"Onlardan önce nice nesilleri helâk ettik. O zaman feryat ettiler. Halbuki artık kurtulma zamanı değildi.","38:12":"(12-13) Onlardan önce Nuh kavmi, Âd kavmi, kazıklar sahibi Firavun, Semûd, Lût kavmi ve Eyke halkı da peygamberleri yalanladılar. İşte bunlar da (peygamberlere karşı) birleşen topluluklardır.","38:16":"Rabbimiz! Bizim payımızı hesap gününden önce ver, dediler.","38:23":"(Onlardan biri şöyle dedi:) Bu, kardeşimdir. Onun doksan dokuz koyunu var. Benimse bir tek koyunum var. Böyle iken «Onu da bana ver» dedi ve tartışmada beni yendi.","38:31":"Akşama doğru kendisine, üç ayağının üzerine durup bir ayağını tırnağının üzerine diken çalımlı ve safkan koşu atları sunulmuştu.","38:36":"(36-38) Bunun üzerine biz de, istediği yere onun emriyle kolayca giden rüzgârı, bina kuran ve dalgıçlık yapan şeytanları, demir halkalarla bağlı diğer yaratıkları onun emrine verdik.","38:44":"Eline bir demet sap al da onunla vur, yeminini böyle yerine getir. Gerçekten biz Eyyub’u sabırlı (bir kul) bulmuştuk. O, ne iyi kuldu! Daima Allah’a yönelirdi.","38:59":"(İnkârcıların liderlerine:) İşte bu sizinle beraber cehenneme girecek topluluktur (denildiğinde, liderler:) Onlar rahat yüzü görmesin (derler). Onlar mutlaka ateşe gireceklerdir.","39:5":"Allah, gökleri ve yeri hak ile yarattı. Geceyi gündüzün üzerine örtüyor, gündüzü de gecenin üzerine sarıyor. Güneşi ve ayı emri altına almıştır. Her biri belli bir süreye kadar akıp gider. Dikkat et! O, azîzdir ve çok bağışlayandır.","39:21":"Görmedin mi? Allah gökten bir su indirdi, onu yerdeki kaynaklara yerleştirdi, sonra onunla türlü türlü renklerde ekinler yetiştiriyor. Sonra onlar kurur da sapsarı olduklarını görürsün. Sonra da onu kuru bir kırıntı yapar. Şüphesiz bunlarda akıl sahipleri için bir öğüt vardır.","39:23":"Allah sözün en güzelini, birbiriyle uyumlu ve bıkılmadan tekrar tekrar okunan bir kitap olarak indirdi. Rablerinden korkanların, bu Kitab’ın etkisinden tüyleri ürperir, derken hem bedenleri ve hem de gönülleri Allah’ın zikrine ısınıp yumuşar. İşte bu Kitap, Allah’ın, dilediğini kendisiyle doğru yola ilettiği hidayet rehberidir. Allah kimi de saptırırsa artık ona yol gösteren olmaz.","39:29":"Allah, çekişip duran birçok ortakların sahip olduğu bir adam (köle) ile yalnız bir kişiye bağlı olan bir adamı misal olarak verir. Bu ikisi eşit midir? Hamd Allah’a mahsustur. Fakat onların çoğu bilmezler.","39:45":"Allah, tek olarak anıldığı zaman, ahirete inanmayanların içlerine sıkıntı basar. Ama Allah’tan başkası anıldığı zaman hemen yüzleri güler.","39:71":"O küfredenler, bölük halinde cehenneme sürülür. Nihayet oraya geldikleri zaman kapıları açılır, bekçileri onlara: Size, içinizden Rabbinizin âyetlerini okuyan ve bugüne kavuşacağınızı ihtar eden peygamberler gelmedi mi? derler. «Evet geldi» derler ama, azap sözü kâfirlerin üzerine hak olmuştur.","40:1":"Hâ. Mîm.","40:18":"Yaklaşan gün hususunda onları uyar! Çünkü o onda dehşet içinde yutkunurken yürekleri ağızlarına gelmiştir. Zalimlerin ne dostu ne de sözü dinlenir şefaatçısı vardır.","40:44":"Size söylediklerimi yakında hatırlayacaksınız. Ben işimi Allah’a havale ediyorum. Şüphesiz Allah, kullarını çok iyi görendir.","40:71":"(71-72) Boyunlarında demir halkalar ve zincirler olduğu halde, sıcak suya sürüklenecekler, sonra da ateşte yakılacaklardır.","40:72":"(71-72) Boyunlarında demir halkalar ve zincirler olduğu halde, sıcak suya sürüklenecekler, sonra da ateşte yakılacaklardır.","41:11":"Sonra duman halinde olan göğe yöneldi, ona ve yerküreye: İsteyerek veya istemeyerek, gelin! dedi. İkisi de «İsteyerek geldik» dediler.","41:16":"Bundan dolayı biz de onlara dünya hayatında zillet azâbını tattırmak için o uğursuz günlerde soğuk bir rüzgâr gönderdik. Ahiret azabı elbette daha çok rüsvay edicidir. Onlara yardım da edilmez.","41:25":"Biz onlara birtakım arkadaşlar musallat ettik de onlar önlerinde ve arkalarında ne varsa hepsini bunlara süslü gösterdiler. Kendilerinden önce gelip geçmiş olan cinler ve insanlar için (uygulanan) azap onlara da gerekli olmuştur. Kuşkusuz onlar hüsrana düşenlerdi.","41:47":"Kıyamet gününün bilgisi, O’na havale edilir. O’nun bilgisi dışında hiçbir meyve (çekirdeği) kabuğunu yarıp çıkamaz, hiçbir dişi gebe kalmaz ve doğurmaz. Allah onlara: Ortaklarım nerede! diye seslendiği gün: Buna dair bizden hiçbir şahit olmadığını sana arzederiz, derler.","41:53":"İnsanlara ufuklarda ve kendi nefislerinde âyetlerimizi göstereceğiz ki onun (Kuran’ın) gerçek olduğu, onlara iyice belli olsun. Rabbinin her şeye şahit olması, yetmez mi?","42:2":"(1-2) Hâ. Mîm. Ayn. Sîn. Kaf.","42:33":"Dilerse O, rüzgârı durdurur da onun (denizin) üstünde kalakalırlar. Elbette bunda çok sabreden, çok şükreden herkes için ibretler vardır.","43:71":"(71-73) Onlara altın tepsiler ve kadehler dolaştırılır. Orada canlarının istediği, gözlerinin hoşlandığı her şey vardır. Ve kendilerine: Siz, orada ebedî kalacaksınız, işte yaptıklarınıza karşılık size miras verilen cennet budur. Orada sizin için bol bol meyveler vardır, onlardan yersiniz, denilir.","43:79":"Yoksa (müşrikler) bir işe kesin karar mı verdiler? Doğrusu biz de kararlıyız!","44:24":"Denizi açık halde bırak. Çünkü onlar boğulacak bir ordudur.","44:37":"Bunlar mı daha hayırlı, yoksa Tübba’ kavmi ile onlardan öncekiler mi? Onları yok ettik, çünkü onlar suçlu idiler.","44:45":"(45-46) O, karınlarda maden eriyiği gibi, suyun kaynaması gibi kaynar.","44:47":"(47-50) (Allah zebânilere emreder): Tutun onu! Cehennemin ortasına sürükleyin! Sonra başına azap olarak kaynar su dökün! (ve deyin ki:) Tat bakalım. Hani sen kendince üstündün, şerefliydin! İşte bu, şüphelenip durduğunuz şeydir.","45:24":"Dediler ki: Hayat ancak bu dünyada yaşadığımızdır. Ölürüz ve yaşarız. Bizi ancak zaman helâk eder. Bu hususta onların hiçbir bilgisi de yoktur. Onlar sadece zanna göre hüküm veriyorlar.","46:21":"Âd kavminin kardeşini (Hûd’u) an. Zira o, kendinden önce ve sonra uyarıcıların da gelip geçtiği Ahkaf bölgesindeki kavmine: Allah’tan başkasına kulluk etmeyin. Ben sizin büyük bir günün azabına uğramanızdan korkuyorum, demişti.","46:33":"Gökleri ve yeri yaratan, bunları yaratmakla yorulmayan Allah’ın, ölüleri diriltmeye de gücünün yeteceğini düşünmezler mı? Evet O, her şeye kadirdir.","47:8":"İnkâr edenlere gelince, onların hakkı yıkımdır. Allah onların yaptıklarını boşa çıkarmıştır.","47:15":"Müttakîlere vâdolunan cennetin durumu şöyledir: İçinde bozulmayan sudan ırmaklar, tadı değişmeyen sütten ırmaklar, içenlere lezzet veren şaraptan ırmaklar ve süzme baldan ırmaklar vardır. Orada meyvelerin her çeşidi onlarındır. Rablerinden de bağışlama vardır. Hiç bu, ateşte ebedî kalan ve bağırsaklarını parça parça edecek kaynar su içirilen kimselerin durumu gibi olur mu?","47:18":"Onlar, kıyamet gününün ansızın gelip çatmasını mı bekliyorlar? Şüphesiz onun alâmetleri belirmiştir. Kendilerine gelip çatınca ibret almaları neye yarar!","47:24":"Onlar Kur’an’ı düşünmüyorlar mı? Yoksa kalpleri kilitli mi?","47:29":"Kalplerinde hastalık olanlar, yoksa Allah’ın, kinlerini ortaya çıkarmayacağını mı sandılar?","47:30":"Biz dileseydik onları sana gösterirdik de, sen onları yüzlerinden tanırdın. Andolsun ki sen onları konuşma tarzlarından tanırsın. Allah işlediklerinizi bilir.","48:24":"O sizi onlara karşı muzaffer kıldıktan sonra, Mekke’nin içinde onların ellerini sizden, sizin ellerinizi de onlardan çekendir. Allah, yaptıklarınızı görendir.","49:3":"Allah’ın elçisinin huzurunda seslerini kısanlar, şüphesiz Allah’ın kalplerini takvâ ile imtihan ettiği kimselerdir. Onlara mağfiret ve büyük bir mükâfat vardır.","49:11":"Ey müminler! Bir topluluk diğer bir topluluğu alaya almasın. Belki de onlar, kendilerinden daha iyidirler. Kadınlar da kadınları alaya almasınlar. Belki onlar kendilerinden daha iyidirler. Kendi kendinizi ayıplamayın, birbirinizi kötü lakaplarla çağırmayın. İmandan sonra fâsıklık ne kötü bir isimdir! Kim de tevbe etmezse işte onlar zalimlerdir.","49:12":"Ey iman edenler! Zannın çoğundan kaçının. Çünkü zannın bir kısmı günahtır. Birbirinizin kusurunu araştırmayın. Biriniz diğerinizi arkasından çekiştirmesin. Biriniz, ölmüş kardeşinin etini yemekten hoşlanır mı? İşte bundan tiksindiniz. O halde Allah’tan korkun. Şüphesiz Allah, tevbeyi çok kabul edendir, çok esirgeyicidir.","49:13":"Ey insanlar! Doğrusu biz sizi bir erkekle bir dişiden yarattık. Ve birbirinizle tanışmanız için sizi kavimlere ve kabilelere ayırdık. Muhakkak ki Allah yanında en değerli olanınız, O’ndan en çok korkanınızdır. Şüphesiz Allah bilendir, her şeyden haberdardır.","49:14":"Bedevîler «İnandık» dediler. De ki: Siz iman etmediniz, ama «Boyun eğdik» deyin. Henüz iman kalplerinize yerleşmedi. Eğer Allah’a ve elçisine itaat ederseniz, Allah işlerinizden hiçbir şeyi eksiltmez. Çünkü Allah çok bağışlayan, çok esirgeyendir.","50:1":"Kaf. Şerefli Kur’an’a andolsun.","50:10":"(10-11) Kullara rızık olması için birbirine girmiş, küme küme tomurcukları olan uzun boylu hurma ağaçları yetiştirdik. Ve o su ile ölü toprağa can verdik. İşte hayata yeniden çıkış da böyledir.","50:18":"İnsan hiçbir söz söylemez ki, yanında gözetleyen yazmaya hazır bir melek bulunmasın.","50:19":"Ölüm sarhoşluğu gerçekten gelir de: İşte (ey insan) bu, senin öteden beri kaçtığın şeydir, denir.","51:7":"(7-9) İçinde yörüngeleri olan göğe andolsun ki siz çelişkili sözler söylüyorsunuz. Ondan (Kur’an’dan veya imandan) dönen döndürülür (engellenmez).","51:11":"Onlar koyu bir cehalet içerisinde kalmış gafillerdir.","51:17":"Geceleri pek az uyurlardı.","51:29":"Karısı çığlık atarak geldi. Elini yüzüne çarparak: «Ben kısır bir kocakarıyım!» dedi.","52:3":"(1-8) Tûr’a, yayılmış ince deri üzerine satır satır yazılmış Kitab’a, Beyt-i Ma’mûr’a, yükseltilmiş tavana, dolu denize andolsun ki, Rabbinin azabı mutlaka vuku bulacaktır. Ona engel olacak hiçbir şey yoktur.","52:9":"O gün gök sallanıp çalkalanır.","52:13":"(13-14) O gün cehennem ateşine itilip atılırlar da «İşte yalanlayıp durduğunuz ateş budur!» denilir.","52:21":"İman eden ve soylarından gelenlerde, imanda kendilerine tâbi olanlar (var ya)! İşte biz, onların nesillerini de kendilerine kattık. Onların amellerinden de bir şey eksiltmedik. Herkes kazandıklarına karşı bir rehindir.","52:29":"(Resûlüm!) Sen öğüt ver. Rabbinin lütfuyla sen ne bir kâhinsin, ne de bir deli.","53:9":"(8-9) Sonra (Muhammed’e) yaklaştı, derken daha da yaklaştı. O kadar ki (birleştirilmiş) iki yay arası kadar, hatta daha da yakın oldu.","53:19":"Gördünüz mü o Lât ve Uzzâ’yı?","53:20":"Ve üçüncüleri olan ötekini, Menât’ı.","53:22":"O zaman bu, insafsızca bir taksim!","53:34":"Azıcık verip sonra vermemekte direneni?","53:48":"Zengin eden de yoksul kılan da O’dur.","53:61":"Ve siz gaflet içinde oyalanmaktasınız!","54:11":"Biz de derhal nehir gibi devamlı akan bir su ile göğün kapılarını açtık.","54:13":"Nuh’u da tahtalardan yapılmış, çivilerle çakılmış gemiye bindirdik.","54:20":"O rüzgâr, insanları, sökülmüş hurma kütükleri gibi yere seriyordu.","54:25":"«Vahiy, aramızda ona mı verildi? Hayır o, yalancı ve şımarığın biridir» (dediler.)","54:46":"Bilakis kıyamet onlara vâdedilen asıl saattir ve o saat daha belâlı ve daha acıdır.","54:48":"O gün yüzüstü ateşe sürüklendiklerinde «Cehennemin elemini tadın!» denir.","55:10":"Allah, yeri canlılar için yaratmıştır.","55:26":"Yeryüzünde bulunan her canlı yok olacak.","55:27":"Ancak azamet ve ikram sahibi Rabbinin zâtı bâki kalacak.","55:33":"Ey cin ve insan toplulukları! Göklerin ve yerin çerçevesinden çıkıp gitmeye gücünüz yetiyorsa geçin. Ancak büyük bir güçle çıkıp gidebilirsiniz.","55:35":"Üzerinize ateşten alev ve duman gönderilir de birbirinizi kurtaramaz ve yardımlaşamazsınız.","55:48":"İki cennet de çeşit çeşit ağaçlarla doludur.","55:56":"Oralarda gözlerini yalnız eşlerine çevirmiş güzeller var ki, bunlardan önce onlara ne insan ne de cin dokunmuştur.","55:58":"Sanki onlar yakut ve mercandırlar.","55:64":"Bu cennetler koyu yeşildirler.","55:66":"İkisinde de durmadan fışkıran iki kaynak vardır.","55:72":"Otağlar içinde sahiplerine tahsis edilmiş hûriler vardır.","55:76":"Yeşil yastıklara ve hârikulâde güzel döşemelere yaslanırlar.","56:4":"Yer şiddetle sarsıldığı,","56:5":"Dağlar parçalandığı,","56:9":"Soldakiler, ne bahtsızdırlar onlar!","56:13":"(Onların) çoğu önceki ümmetlerden,","56:15":"(15-16) Cevherlerle işlenmiş tahtlar üzerindedir, karşılıklı olarak oturup yaslanırlar.","56:18":"Maîn çeşmesinden doldurulmuş testiler, ibrikler ve kadehlerle.","56:28":"Düzgün kiraz ağacı,","56:29":"Meyveleri salkım salkım dizili muz ağaçları,","56:31":"Çağlayarak akan sular,","56:69":"Buluttan onu siz mi indirdiniz, yoksa indiren biz miyiz?","58:11":"Ey iman edenler! Size «Meclislerde yer açın» denilince yer açın ki Allah da size genişlik versin. Size «Kalkın» denilince de kalkın ki Allah sizden inananları ve kendilerine ilim verilenleri derecelerle yükseltsin. Allah yaptıklarınızdan haberdardır.","59:6":"Allah’ın, onlardan (mallarından) Peygamberine verdiği ganimetler için siz at ve deve koşturmuş değilsiniz. Fakat Allah, peygamberlerini dilediği kimselere karşı üstün kılar. Allah her şeye kadirdir.","61:4":"Allah, kendi yolunda kenetlenmiş bir yapı gibi saf bağlayarak savaşanları sever.","61:6":"Hatırla ki, Meryem oğlu İsa: Ey İsrailoğulları! Ben size Allah’ın elçisiyim, benden önce gelen Tevrat’ı doğrulayıcı ve benden sonra gelecek Ahmed adında bir peygamberi de müjdeleyici olarak geldim, demişti. Fakat o, kendilerine açık deliller getirince: Bu apaçık bir büyüdür, dediler.","63:4":"Onları gördüğün zaman kalıpları hoşuna gider, konuşurlarsa sözlerini dinlersin. Onlar sanki duvara dayanmış kütükler gibidir. Her gürültüyü kendi aleyhlerine sanırlar. Düşman onlardır. Onlardan sakın. Allah onların canlarını alsın. Nasıl bu hale geliyorlar?","64:9":"Mahşer vaktinde sizi toplayacağı gün, işte o zarar günüdür. (Ancak) kim Allah’a inanır ve yararlı iş yaparsa, Allah onun kötülüklerini örter, onu (ve benzerlerini), içinde ebedî kalacakları, altlarından ırmaklar akan cennetlere sokar. İşte büyük kurtuluş budur.","66:5":"Eğer o sizi boşarsa Rabbi ona, sizden daha iyi, kendini Allah’a veren, inanan, sebatla itaat eden, tevbe eden, ibadet eden, oruç tutan, dul ve bâkire eşler verebilir.","67:3":"O ki, birbiri ile âhenktar yedi göğü yaratmıştır. Rahmân olan Allah’ın yaratışında hiçbir uygunsuzluk göremezsin. Gözünü çevir de bir bak, bir bozukluk görebiliyor musun?","68:11":"(10-14) (Resûlüm!) Alabildiğine yemin eden, aşağılık, daima kusur arayıp kınayan, durmadan lâf götürüp getiren, iyiliği hep engelleyen, mütecâviz, günaha dadanmış, kaba ve haşin, bütün bunlardan sonra bir de soysuzlukla damgalanmış kimselerden hiçbirine, mal ve oğulları vardır diye, sakın boyun eğme.","68:13":"(10-14) (Resûlüm!) Alabildiğine yemin eden, aşağılık, daima kusur arayıp kınayan, durmadan lâf götürüp getiren, iyiliği hep engelleyen, mütecâviz, günaha dadanmış, kaba ve haşin, bütün bunlardan sonra bir de soysuzlukla damgalanmış kimselerden hiçbirine, mal ve oğulları vardır diye, sakın boyun eğme.","68:16":"Biz yakında onun burnuna damga vuracağız (kibirini kırıp rezil edeceğiz).","68:17":"(17-18) Biz, vaktiyle «bahçe sahipleri»ne belâ verdiğimiz gibi, onlara da belâ verdik. Hani onlar (bahçe sahipleri), sabah olurken (kimse görmeden) onu (mahsullerini) devşireceklerine yemin etmişlerdi. Onlar istisna da etmiyorlardı.","68:25":"(Evet, yoksullara yardıma) güçleri yettiği halde, onları yardımdan mahrum etmek niyet ve azmi ile erkenden yola düştüler.","69:7":"Allah onu, ardarda yedi gece, sekiz gün onların üzerine musallat etti. Öyle ki (eğer orada olsaydın), o kavmi, içi boş hurma kütükleri gibi oracıkta yere serilmiş halde görürdün.","69:16":"Gök de yarılır ve artık o gün o, çökmeye yüz tutar.","69:19":"(19-20) Kitabı sağ tarafından verilen: Alın, kitabımı okuyun; doğrusu ben, hesabımla karşılaşacağımı zaten biliyordum, der.","69:23":"(21-23) Artık o, meyveleri sarkmış yüce bir cennette hoşnut kalacağı bir hayat içindedir.","69:34":"Yoksulu doyurmaya teşvik etmezdi.","69:46":"Sonra onun can damarını koparırdık (onu yaşatmazdık).","70:9":"Dağlar da atılmış yüne döner.","70:15":"Fakat ne mümkün! Bilinmeli ki, o (cehennem) alevlenen bir ateştir.","70:19":"Gerçekten insan, pek hırslı (ve sabırsız) yaratılmıştır.","70:37":"(36-37) (Resûlüm!) O kâfirlere ne oluyor ki, bölük bölük sağından ve solundan sana doğru koşuyorlar.","70:43":"(43-44) O gün onlar, sanki dikili bir şeye koşuyorlar gibi, gözleri horluktan aşağı düşmüş ve kendileri zillete bürünmüş bir halde kabirlerinden fırlaya fırlaya çıkarlar. İşte bu, onların tehdit edilegeldikleri gündür!","71:23":"Ve dediler ki: Sakın ilâhlarınızı bırakmayın; hele Ved’den, Suvâ’dan, Yeğûs’tan, Ye’ûk’tan ve Nesr’den asla vazgeçmeyin!","72:8":"Doğrusu biz (cinler), göğü yokladık, fakat onu sert bekçilerle, alev huzmeleriyle doldurulmuş bulduk.","72:12":"(Artık) şu gerçeği şüphesiz anladık ki, biz yeryüzünde bulunsak da Allah’ı âciz bırakamayacağız, başka yere kaçmakla da elinden kurtulamayacağız.","72:14":"İçimizde, (Allah’a) teslimiyet gösterenler de var, hak yoldan sapanlar da var. Teslimiyet gösteren kimseler, doğru yolu arayanlardır.","72:15":"Hak yoldan sapanlara gelince, onlar cehenneme odun olmuşlardır.","72:16":"(16-17) Şayet doğru yolda gitselerdi, bu hususta kendilerini denememiz için onlara bol su verirdik. Kim Rabbinin zikrinden yüz çevirirse, (Rabbin) onu gitgide artan çetin bir azaba uğratır.","72:19":"Allah’ın kulu, O’na yalvarmaya (namaza) kalkınca, neredeyse onun etrafında keçe gibi birbirlerine geçeceklerdi.","73:1":"Ey örtünüp bürünen (Resûlüm)!","73:8":"Rabbinin adını an. Bütün varlığınla O’na yönel.","73:13":"(12-13) Hiç şüphesiz bizim nezdimizde (onlar için hazırlanmış) boyunduruklar, yakıcı bir ateş, boğazdan geçmez bir yiyecek ve elem verici bir azap vardır.","73:14":"O gün (kıyamet günü) yeryüzü ve dağlar sarsılır; dağlar çöküntü ile akıp giden kum yığınına döner.","74:1":"Ey bürünüp sarınan (Resûlüm)!","74:22":"(21-25) Sonra baktı. Sonra kaşlarını çattı, suratını astı. En sonunda, kibirini yenemeyip sırt çevirdi de: «Bu (Kur’an) dedi, olsa olsa (sihirbazlardan öğrenilip) nakledilen bir sihirdir. Bu, insan sözünden başka bir şey değil.»","74:51":"(49-51) Böyle iken onlara ne oluyor ki, âdeta arslandan ürküp kaçan yaban eşekleri gibi (hâla) öğütten yüz çeviriyorlar?","75:16":"(Resûlüm!) onu (vahyi) çarçabuk almak için dilini kımıldatma.","75:22":"Yüzler vardır ki, o gün ışıl ışıl parıldayacaktır.","75:26":"Artık gözünüzü açın! Ne zaman ki can köprücük kemiğine dayanır,","75:33":"Sonra da çalım sata sata yürüyerek kendi ehline (taraftarlarına) gitmişti.","75:36":"İnsan, kendisinin başıboş bırakılacağını mı sanır!","76:2":"Gerçek şu ki, biz insanı katışık bir nutfeden (erkek ve kadının dölünden) yarattık; onu imtihan edelim diye, kendisini işitir ve görür kıldık.","76:5":"İyiler ise, kâfûr katılmış bir kadehten (cennet şarabı) içerler.","76:10":"«Biz, çetin ve belâlı bir günde Rabbimizden (O’nun azabına uğramaktan) korkarız» (derler).","76:13":"Orada koltuklara kurulmuş olarak bulunurlar; ne yakıcı sıcak görülür orada, ne de dondurucu soğuk.","76:17":"Onlara orada bir kâseden içirilir ki (bu şarabın) karışımında zencefil vardır.","76:18":"(Bu şarap) orada bir pınardandır ki adına Selsebîl denir.","77:25":"(25-26) Biz, yeryüzünü dirilere ve ölülere toplanma yeri yapmadık mı?","77:27":"Yeryüzünde haşmetli dağlar yarattık, sizlere tatlı sular içirdik.","77:31":"(30-31) Üç kola ayrılmış, (ama) ne gölgelendiren ne de alevden koruyan bir gölgeye gidin.","78:13":"(Orada) alev alev yanan bir kandil yarattık.","78:14":"(14-16) Size tohumlar, bitkiler, (ağaçları) sarmaş dolaş olmuş bağlar bahçeler yetiştirmek için üstüste yığılıp sıkışan bulutlardan şarıl şarıl akan sular indirdik.","78:34":"(31-34) Şüphesiz takvâ sahipleri için umulanı buldukları yer, bahçeler, üzüm bağları, göğüsleri tomurcuk gibi kabarmış yaşıt kızlar, içki dolu kâseler vardır.","79:2":"(1-5) Söküp çıkaranlara, yavaşça çekenlere, yüzdükçe yüzenlere, yarıştıkça yarışanlara, iş düzenleyenlere andolsun;","79:11":"(10-11) «Öldükten sonra biz, (dünyadaki) ilk halimize mi döndürüleceğiz, (hem de) çürümüş kemikler olduktan sonra mı?» derler.","79:14":"Birdenbire kendilerini mahşerde buluverirler.","79:28":"(27-29) Sizi yaratmak mı daha güç, yoksa gökyüzünü yaratmak mı, ki onu Allah bina etti, onu yükseltip düzene koydu. Gecesini kararttı, gündüzünü ağarttı.","79:29":"(27-29) Sizi yaratmak mı daha güç, yoksa gökyüzünü yaratmak mı, ki onu Allah bina etti, onu yükseltip düzene koydu. Gecesini kararttı, gündüzünü ağarttı.","79:30":"(30-33) Ondan sonra da yerküreyi döşedi. Kendiniz ve hayvanlarınız için bir faydalanma olmak üzere, yerden suyunu ve otlağını çıkardı ve dağları sağlam bir şekilde yerleştirdi.","79:34":"(34-36) Her şeyi alt üst eden o büyük felâket geldiği vakit, insan dünyada iken ne için çalıştığını hatırlar. Cehennem de gören her kişiye açıklığı ile gösterilir.","80:28":"(25-32) Şöyle ki: Yağmurlar yağdırdık. Sonra toprağı göz göz yardık da oradan ekinler, üzüm bağları, sebzeler, zeytin ve hurma ağaçları, iri ve sık ağaçlı bahçeler, meyveler ve çayırlar bitirdik. (Bütün bunlar) sizi ve hayvanlarınızı yararlandırmak içindir.","80:31":"(25-32) Şöyle ki: Yağmurlar yağdırdık. Sonra toprağı göz göz yardık da oradan ekinler, üzüm bağları, sebzeler, zeytin ve hurma ağaçları, iri ve sık ağaçlı bahçeler, meyveler ve çayırlar bitirdik. (Bütün bunlar) sizi ve hayvanlarınızı yararlandırmak içindir.","80:33":"Kulakları sağır eden o ses geldiğinde,","81:2":"Yıldızlar (kararıp) döküldüğünde,","81:5":"Vahşî hayvanlar toplanıp bir araya getirildiğinde,","81:8":"(8-9) Diri diri toprağa gömülen kıza, hangi günah sebebiyle öldürüldüğü sorulduğunda,","81:11":"Gökyüzü sıyrılıp alındığında,","81:15":"(15-16) Hayır! Akıp giden, bir kaybolup bir etrafı aydınlatan yıldızlara andolsun,","81:16":"(15-16) Hayır! Akıp giden, bir kaybolup bir etrafı aydınlatan yıldızlara andolsun,","81:17":"Kararmaya yüz tuttuğunda geceye andolsun,","81:24":"O, gaybın bilgilerini (sizden) esirgemez.","82:4":"(1-5) Gökyüzü yarıldığı, yıldızlar döküldüğü, denizler birbirine katıldığı, kabirlerin içindekiler dışarı çıkarıldığı zaman, insanoğlu (yapıp) gönderdiklerini ve (yapamayıp) geride bıraktıklarını bir bir anlar.","83:1":"(1-3) İnsanlardan alırken ölçüp tarttıklarında tam, onlara vermek için ölçüp tarttıklarında ise noksan yapan hilekârlara yazıklar olsun!","83:14":"Hayır! Bilakis onların işlemekte oldukları (kötülükler) kalplerini kirletmiştir.","83:25":"Kendilerine mühürlü hâlis bir içki sunulur.","83:27":"Karışımı Tesnîm’dendir.","83:30":"Onlarla karşılaştıklarında kaş göz hareketiyle alay ederlerdi.","84:6":"Ey insan! Şüphe yok ki sen Rabbine karşı çaba üstüne çaba göstermektesin; sonunda O’na varacaksın.","84:17":"(16-19) Hayır! Şafağa, geceye ve onda basan karanlığa, dolunay olmuş aya yemin ederim ki, halden hale geçersiniz.","86:6":"(5-8) İnsan neden yaratıldığına bir baksın! Atılan bir sudan yaratıldı. (O su) sırt ile göğüs kafesi arasından çıkar. İşte Allah (başlangıçta bu şekilde yarattığı) insanı tekrar yaratmaya da kadirdir.","86:14":"(11-17) Dönüş sahibi olan (yağmur yağdıran) göğe, (nebat ile) yarılan yere yemin ederim ki Kur’an, (hak ile bâtılı) ayıran bir sözdür. O, asla bir şaka değildir. Onlar bir tuzak kurarlar, ben de bir tuzak kurarım. Kâfirlere mühlet ver, onları biraz kendi hallerine bırak (pek yakında desteğimiz sana gelecek).","88:15":"(12-16) Orada (cennette) devamlı akan bir pınar, orada yükseltilmiş tahtlar, konulmuş kadehler, sıra sıra dizilmiş yastıklar, serilmiş halılar vardır.","88:16":"(12-16) Orada (cennette) devamlı akan bir pınar, orada yükseltilmiş tahtlar, konulmuş kadehler, sıra sıra dizilmiş yastıklar, serilmiş halılar vardır.","88:20":"(17-20) (İnsanlar) devenin nasıl yaratıldığına, göğün nasıl yükseltildiğine, dağların nasıl dikildiğine, yeryüzünün nasıl yayıldığına bir bakmazlar mı?","89:7":"(6-14) Görmedin mi, Rabbin ne yaptı Âd kavmine; direkleri (yüksek binaları) olan, ülkelerde benzeri yaratılmamış İrem şehrine, o vadide kayaları yontan Semûd kavmine, kazıklar (çadırlar, ordular) sahibi Firavun’a! Ki onların hepsi ülkelerinde azgınlık ettiler. Oralarda kötülüğü çoğalttılar. Bu yüzden Rabbin onların üstüne azap kamçısı yağdırdı. Çünkü Rabbin (her an) gözetlemededir.","89:13":"(6-14) Görmedin mi, Rabbin ne yaptı Âd kavmine; direkleri (yüksek binaları) olan, ülkelerde benzeri yaratılmamış İrem şehrine, o vadide kayaları yontan Semûd kavmine, kazıklar (çadırlar, ordular) sahibi Firavun’a! Ki onların hepsi ülkelerinde azgınlık ettiler. Oralarda kötülüğü çoğalttılar. Bu yüzden Rabbin onların üstüne azap kamçısı yağdırdı. Çünkü Rabbin (her an) gözetlemededir.","89:20":"(17-20) Hayır! Doğrusu siz yetime ikram etmiyorsunuz, yoksulu yedirmeye birbirinizi teşvik etmiyorsunuz. Haram helâl demeden mirası yiyorsunuz. Malı aşırı biçimde seviyorsunuz.","90:4":"(1-4) Bu beldeye -ki sen bu beldedesin-, babaya ve ondan meydana gelen çocuğa yemin ederim ki biz, insanı (yüzyüze geleceği nice) zorluklar içinde yarattık.","90:9":"(8-10) Biz ona iki göz, bir dil ve iki dudak vermedik mi? Ona iki yolu (doğru ve eğriyi) göstermedik mi?","90:10":"(8-10) Biz ona iki göz, bir dil ve iki dudak vermedik mi? Ona iki yolu (doğru ve eğriyi) göstermedik mi?","90:13":"(11-16) Fakat o, sarp yokuşu aşamadı. O sarp yokuş nedir bilir misin? Köle azat etmek veya açlık gününde yakını olan bir yetimi, yahut aç açık bir yoksulu doyurmaktır.","90:14":"(11-16) Fakat o, sarp yokuşu aşamadı. O sarp yokuş nedir bilir misin? Köle azat etmek veya açlık gününde yakını olan bir yetimi, yahut aç açık bir yoksulu doyurmaktır.","91:6":"(1-10) Güneşe ve kuşluk vaktindeki aydınlığına, güneşi takip ettiğinde aya, onu açığa çıkarttığında gündüze, onu örttüğünde geceye, gökyüzüne ve onu bina edene, yere ve onu yapıp döşeyene, nefse ve ona birtakım kabiliyetler verip de iyilik ve kötülüklerini ilham edene yemin ederim ki, nefsini kötülüklerden arındıran kurtuluşa ermiş, onu kötülüklere gömen de ziyan etmiştir.","91:8":"(1-10) Güneşe ve kuşluk vaktindeki aydınlığına, güneşi takip ettiğinde aya, onu açığa çıkarttığında gündüze, onu örttüğünde geceye, gökyüzüne ve onu bina edene, yere ve onu yapıp döşeyene, nefse ve ona birtakım kabiliyetler verip de iyilik ve kötülüklerini ilham edene yemin ederim ki, nefsini kötülüklerden arındıran kurtuluşa ermiş, onu kötülüklere gömen de ziyan etmiştir.","91:10":"(1-10) Güneşe ve kuşluk vaktindeki aydınlığına, güneşi takip ettiğinde aya, onu açığa çıkarttığında gündüze, onu örttüğünde geceye, gökyüzüne ve onu bina edene, yere ve onu yapıp döşeyene, nefse ve ona birtakım kabiliyetler verip de iyilik ve kötülüklerini ilham edene yemin ederim ki, nefsini kötülüklerden arındıran kurtuluşa ermiş, onu kötülüklere gömen de ziyan etmiştir.","91:14":"(11-15) Semûd kavmi azgınlığı yüzünden (Allah’ın elçisini) yalanladı. Onların en bedbahtı (deveyi kesmek için) atıldığında, Allah’ın Resûlü onlara: «Allah’ın devesine ve onun su hakkına dokunmayın!» dedi. Ama onlar, onu yalanladılar ve deveyi kestiler. Bunun üzerine Rableri günahları sebebiyle onlara büyük bir felâket gönderdi de hepsini helâk etti. (Allah, bu şekilde azap etmenin) âkıbetinden korkacak değil ya!","92:14":"(Ey insanlar!) Alev alev yanan bir ateşle sizi uyardım.","93:2":"(1-3) Kuşluk vaktine ve sükûna erdiğinde geceye yemin ederim ki Rabbin seni bırakmadı ve sana darılmadı.","95:1":"(1-5) İncire, zeytine, Sina dağına ve şu emîn beldeye yemin ederim ki, biz insanı en güzel biçimde yarattık. Sonra onu aşağıların aşağısına indirdik.","95:2":"(1-5) İncire, zeytine, Sina dağına ve şu emîn beldeye yemin ederim ki, biz insanı en güzel biçimde yarattık. Sonra onu aşağıların aşağısına indirdik.","96:15":"(15-19) Hayır, hayır! Eğer vazgeçmezse, derhal onu alnından (perçeminden), o yalancı, günahkâr alından (perçemden) yakalarız (cehenneme atarız). O, hemen gidip meclisini (kendi taraftarlarını) çağırsın. Biz de zebânîleri çağıracağız. Hayır! Ona uyma! Allah’a secde et ve (yalnızca O’na) yaklaş!","96:18":"(15-19) Hayır, hayır! Eğer vazgeçmezse, derhal onu alnından (perçeminden), o yalancı, günahkâr alından (perçemden) yakalarız (cehenneme atarız). O, hemen gidip meclisini (kendi taraftarlarını) çağırsın. Biz de zebânîleri çağıracağız. Hayır! Ona uyma! Allah’a secde et ve (yalnızca O’na) yaklaş!","100:1":"(1-8) Harıl harıl koşanlara, (nallarıyla) çakarak kıvılcım saçanlara, (ansızın) sabah baskını yapanlara, orada tozu dumana katanlara, derken orada bir topluluğun ta ortasına girenlere yemin ederim ki insan, Rabbine karşı pek nankördür. Şüphesiz buna kendisi de şahittir ve o, mal sevgisine de aşırı derecede düşkündür.","100:2":"(1-8) Harıl harıl koşanlara, (nallarıyla) çakarak kıvılcım saçanlara, (ansızın) sabah baskını yapanlara, orada tozu dumana katanlara, derken orada bir topluluğun ta ortasına girenlere yemin ederim ki insan, Rabbine karşı pek nankördür. Şüphesiz buna kendisi de şahittir ve o, mal sevgisine de aşırı derecede düşkündür.","100:4":"(1-8) Harıl harıl koşanlara, (nallarıyla) çakarak kıvılcım saçanlara, (ansızın) sabah baskını yapanlara, orada tozu dumana katanlara, derken orada bir topluluğun ta ortasına girenlere yemin ederim ki insan, Rabbine karşı pek nankördür. Şüphesiz buna kendisi de şahittir ve o, mal sevgisine de aşırı derecede düşkündür.","100:6":"(1-8) Harıl harıl koşanlara, (nallarıyla) çakarak kıvılcım saçanlara, (ansızın) sabah baskını yapanlara, orada tozu dumana katanlara, derken orada bir topluluğun ta ortasına girenlere yemin ederim ki insan, Rabbine karşı pek nankördür. Şüphesiz buna kendisi de şahittir ve o, mal sevgisine de aşırı derecede düşkündür.","100:10":"(9-11) Kabirlerde bulunanlar diriltilip dışarı atıldığı ve kalplerde gizlenenler ortaya konduğu zaman insan (halinin ne olacağını) düşünmez mi? Şüphesiz Rableri o gün onlardan tamamıyle haberdardır.","101:10":"(10-11) Nedir o (Hâviye) bilir misin? Kızgın ateş!","105:1":"Rabbin fil sahiplerine neler etti, görmedin mi?","106:1":"(1-4) Kureyş’e kolaylaştırıldığı, evet, kış ve yaz seyahatleri onlara kolaylaştırıldığı için onlar, kendilerini açlıktan doyuran ve her çeşit korkudan emin kılan şu evin Rabbine kulluk etsinler.","106:2":"(1-4) Kureyş’e kolaylaştırıldığı, evet, kış ve yaz seyahatleri onlara kolaylaştırıldığı için onlar, kendilerini açlıktan doyuran ve her çeşit korkudan emin kılan şu evin Rabbine kulluk etsinler.","107:7":"(6-7) Onlar gösteriş yapanlardır; hayra da mâni olurlar.","108:2":"(1-3) (Resûlüm!) Kuşkusuz biz sana Kevser’i verdik. Şimdi sen Rabbine kulluk et ve kurban kes. Asıl sonu kesik olan, şüphesiz sana hınç besleyendir.","108:3":"(1-3) (Resûlüm!) Kuşkusuz biz sana Kevser’i verdik. Şimdi sen Rabbine kulluk et ve kurban kes. Asıl sonu kesik olan, şüphesiz sana hınç besleyendir.","111:5":"(1-5) Ebu Leheb’in iki eli kurusun! Kurudu da. Malı ve kazandıkları ona fayda vermedi. O, alevli bir ateşte yanacak. Odun taşıyıcı olarak ve boynunda hurma lifinden bükülmüş bir ip olduğu halde karısı da (ateşe girecek).","112:2":"(1-4) De ki: O, Allah birdir. Allah sameddir. O, doğurmamış ve doğmamıştır. Onun hiçbir dengi yoktur.","112:4":"(1-4) De ki: O, Allah birdir. Allah sameddir. O, doğurmamış ve doğmamıştır. Onun hiçbir dengi yoktur.","113:3":"(1-5) De ki: Yarattığı şeylerin şerrinden, karanlığı çöktüğü zaman gecenin şerrinden, düğümlere üfürüp büyü yapan üfürükçülerin şerrinden ve kıskandığı vakit kıskanç kişinin şerrinden sabahın Rabbine sığınırım!","113:4":"(1-5) De ki: Yarattığı şeylerin şerrinden, karanlığı çöktüğü zaman gecenin şerrinden, düğümlere üfürüp büyü yapan üfürükçülerin şerrinden ve kıskandığı vakit kıskanç kişinin şerrinden sabahın Rabbine sığınırım!"},"KA":{"سمو":"Sümüvv: yükselmek, yüksek olmak; semâ (gök)","ءله":"İlâh: tapılan; ulûhiyy
