4",5.85,["وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦ يَـٰقَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنفُسَكُم بِٱتِّخَاذِكُمُ","ٱلْعِجْلَ فَتُوبُوٓا۟ إِلَىٰ بَارِئِكُمْ فَٱقْتُلُوٓا۟ أَنفُسَكُمْ ذَٰلِكُمْ خَيْرٌ لَّكُمْ عِندَ","بَارِئِكُمْ فَتَابَ عَلَيْكُمْ ۚ إِنَّهُۥ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ ﴿٥٤﴾"]],[560.5,26.65,11.0,21.0,"2:55",5.85,["وَإِذْ قُلْتُمْ يَـٰمُوسَىٰ لَن نُّؤْمِنَ لَكَ","حَتَّىٰ نَرَى ٱللَّهَ جَهْرَةً فَأَخَذَتْكُمُ","ٱلصَّـٰعِقَةُ وَأَنتُمْ تَنظُرُونَ ﴿٥٥﴾"]],[554.5,26.65,6.0,16.0,"2:56",7.7,["ثُمَّ بَعَثْنَـٰكُم مِّنۢ","بَعْدِ مَوْتِكُمْ","لَعَلَّكُمْ تَشْكُرُونَ","﴿٥٦﴾"]],[538.5,26.65,16.0,21.0,"2:57",5.85,["وَظَلَّلْنَا عَلَيْكُمُ ٱلْغَمَامَ وَأَنزَلْنَا عَلَيْكُمُ ٱلْمَنَّ","وَٱلسَّلْوَىٰ ۖ كُلُوا۟ مِن طَيِّبَـٰتِ مَا رَزَقْنَـٰكُمْ ۖ وَمَا","ظَلَمُونَا وَلَـٰكِن كَانُوٓا۟ أَنفُسَهُمْ يَظْلِمُونَ ﴿٥٧﴾"]],[517.5,26.65,21.0,21.0,"2:58",5.85,["وَإِذْ قُلْنَا ٱدْخُلُوا۟ هَـٰذِهِ ٱلْقَرْيَةَ فَكُلُوا۟ مِنْهَا حَيْثُ شِئْتُمْ رَغَدًا","وَٱدْخُلُوا۟ ٱلْبَابَ سُجَّدًا وَقُولُوا۟ حِطَّةٌ نَّغْفِرْ لَكُمْ خَطَـٰيَـٰكُمْ ۚ وَسَنَزِيدُ","ٱلْمُحْسِنِينَ ﴿٥٨﴾"]],[506.5,26.65,11.0,16.0,"2:59",7.7,["فَبَدَّلَ ٱلَّذِينَ ظَلَمُوا۟ قَوْلًا غَيْرَ ٱلَّذِى","قِيلَ لَهُمْ فَأَنزَلْنَا عَلَى ٱلَّذِينَ ظَلَمُوا۟","رِجْزًا مِّنَ ٱلسَّمَآءِ بِمَا كَانُوا۟","يَفْسُقُونَ ﴿٥٩﴾"]],[480.5,26.65,26.0,21.0,"2:60",5.85,["۞ وَإِذِ ٱسْتَسْقَىٰ مُوسَىٰ لِقَوْمِهِۦ فَقُلْنَا ٱضْرِب بِّعَصَاكَ ٱلْحَجَرَ ۖ فَٱنفَجَرَتْ مِنْهُ ٱثْنَتَا","عَشْرَةَ عَيْنًا ۖ قَدْ عَلِمَ كُلُّ أُنَاسٍ مَّشْرَبَهُمْ ۖ كُلُوا۟ وَٱشْرَبُوا۟ مِن رِّزْقِ ٱللَّهِ وَلَا تَعْثَوْا۟","فِى ٱلْأَرْضِ مُفْسِدِينَ ﴿٦٠﴾"]],[572.5,47.65,43.0,21.0,"2:61",5.85,["وَإِذْ قُلْتُمْ يَـٰمُوسَىٰ لَن نَّصْبِرَ عَلَىٰ طَعَامٍ وَٰحِدٍ فَٱدْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ مِنۢ بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا ۖ","قَالَ أَتَسْتَبْدِلُونَ ٱلَّذِى هُوَ أَدْنَىٰ بِٱلَّذِى هُوَ خَيْرٌ ۚ ٱهْبِطُوا۟ مِصْرًا فَإِنَّ لَكُم مَّا سَأَلْتُمْ ۗ وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍ مِّنَ","ٱللَّهِ ۗ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَـٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلنَّبِيِّـۧنَ بِغَيْرِ ٱلْحَقِّ ۗ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ ﴿٦١﴾"]],[556.5,47.65,16.0,16.0,"2:62",7.7,["إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَادُوا۟ وَٱلنَّصَـٰرَىٰ","وَٱلصَّـٰبِـِٔينَ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَعَمِلَ","صَـٰلِحًا فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ","وَلَا هُمْ يَحْزَنُونَ ﴿٦٢﴾"]],[543.5,47.65,13.0,21.0,"2:63",5.85,["وَإِذْ أَخَذْنَا مِيثَـٰقَكُمْ وَرَفَعْنَا فَوْقَكُمُ","ٱلطُّورَ خُذُوا۟ مَآ ءَاتَيْنَـٰكُم بِقُوَّةٍ وَٱذْكُرُوا۟","مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَ ﴿٦٣﴾"]],[533.5,47.65,10.0,21.0,"2:64",5.85,["ثُمَّ تَوَلَّيْتُم مِّنۢ بَعْدِ ذَٰلِكَ ۖ فَلَوْلَا","فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ","لَكُنتُم مِّنَ ٱلْخَـٰسِرِينَ ﴿٦٤﴾"]],[522.5,47.65,11.0,21.0,"2:65",5.85,["وَلَقَدْ عَلِمْتُمُ ٱلَّذِينَ ٱعْتَدَوْا۟ مِنكُمْ","فِى ٱلسَّبْتِ فَقُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً","خَـٰسِـِٔينَ ﴿٦٥﴾"]],[511.5,47.65,11.0,19.0,"2:66",4.0,["فَجَعَلْنَـٰهَا نَكَـٰلًا لِّمَا بَيْنَ يَدَيْهَا وَمَا","خَلْفَهَا وَمَوْعِظَةً لِّلْمُتَّقِينَ ﴿٦٦﴾"]],[495.5,47.65,16.0,21.0,"2:67",5.85,["وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦٓ إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن","تَذْبَحُوا۟ بَقَرَةً ۖ قَالُوٓا۟ أَتَتَّخِذُنَا هُزُوًا ۖ قَالَ أَعُوذُ بِٱللَّهِ","أَنْ أَكُونَ مِنَ ٱلْجَـٰهِلِينَ ﴿٦٧﴾"]],[479.5,47.65,16.0,21.0,"2:68",5.85,["قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِىَ ۚ قَالَ إِنَّهُۥ","يَقُولُ إِنَّهَا بَقَرَةٌ لَّا فَارِضٌ وَلَا بِكْرٌ عَوَانٌۢ بَيْنَ","ذَٰلِكَ ۖ فَٱفْعَلُوا۟ مَا تُؤْمَرُونَ ﴿٦٨﴾"]],[602.5,68.65,13.0,21.0,"2:69",5.85,["قَالُوا۟ ٱدْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا لَوْنُهَا ۚ","قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌ صَفْرَآءُ فَاقِعٌ","لَّوْنُهَا تَسُرُّ ٱلنَّـٰظِرِينَ ﴿٦٩﴾"]],[583.5,68.65,19.0,21.0,"2:71",5.85,["قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٌ لَّا ذَلُولٌ تُثِيرُ ٱلْأَرْضَ وَلَا تَسْقِى","ٱلْحَرْثَ مُسَلَّمَةٌ لَّا شِيَةَ فِيهَا ۚ قَالُوا۟ ٱلْـَٔـٰنَ جِئْتَ بِٱلْحَقِّ ۚ","فَذَبَحُوهَا وَمَا كَادُوا۟ يَفْعَلُونَ ﴿٧١﴾"]],[577.5,68.65,6.0,16.0,"2:72",7.7,["وَإِذْ قَتَلْتُمْ نَفْسًا","فَٱدَّٰرَْٰٔتُمْ فِيهَا ۖ وَٱللَّهُ","مُخْرِجٌ مَّا كُنتُمْ","تَكْتُمُونَ ﴿٧٢﴾"]],[552.5,68.65,25.0,21.0,"2:74",5.85,["ثُمَّ قَسَتْ قُلُوبُكُم مِّنۢ بَعْدِ ذَٰلِكَ فَهِىَ كَٱلْحِجَارَةِ أَوْ أَشَدُّ قَسْوَةً ۚ وَإِنَّ مِنَ ٱلْحِجَارَةِ","لَمَا يَتَفَجَّرُ مِنْهُ ٱلْأَنْهَـٰرُ ۚ وَإِنَّ مِنْهَا لَمَا يَشَّقَّقُ فَيَخْرُجُ مِنْهُ ٱلْمَآءُ ۚ وَإِنَّ مِنْهَا لَمَا","يَهْبِطُ مِنْ خَشْيَةِ ٱللَّهِ ۗ وَمَا ٱللَّهُ بِغَـٰفِلٍ عَمَّا تَعْمَلُونَ ﴿٧٤﴾"]],[541.5,68.65,11.0,16.0,"2:75",7.7,["۞ أَفَتَطْمَعُونَ أَن يُؤْمِنُوا۟ لَكُمْ","وَقَدْ كَانَ فَرِيقٌ مِّنْهُمْ يَسْمَعُونَ","كَلَـٰمَ ٱللَّهِ ثُمَّ يُحَرِّفُونَهُۥ مِنۢ بَعْدِ مَا","عَقَلُوهُ وَهُمْ يَعْلَمُونَ ﴿٧٥﴾"]],[525.5,68.65,16.0,16.0,"2:76",7.7,["وَإِذَا لَقُوا۟ ٱلَّذِينَ ءَامَنُوا۟ قَالُوٓا۟ ءَامَنَّا وَإِذَا خَلَا","بَعْضُهُمْ إِلَىٰ بَعْضٍ قَالُوٓا۟ أَتُحَدِّثُونَهُم بِمَا فَتَحَ ٱللَّهُ","عَلَيْكُمْ لِيُحَآجُّوكُم بِهِۦ عِندَ رَبِّكُمْ ۚ أَفَلَا تَعْقِلُونَ","﴿٧٦﴾"]],[519.5,68.65,6.0,16.0,"2:77",7.7,["أَوَلَا يَعْلَمُونَ أَنَّ","ٱللَّهَ يَعْلَمُ مَا","يُسِرُّونَ وَمَا","يُعْلِنُونَ ﴿٧٧﴾"]],[509.5,68.65,10.0,21.0,"2:78",5.85,["وَمِنْهُمْ أُمِّيُّونَ لَا يَعْلَمُونَ","ٱلْكِتَـٰبَ إِلَّآ أَمَانِىَّ وَإِنْ هُمْ","إِلَّا يَظُنُّونَ ﴿٧٨﴾"]],[498.5,68.65,11.0,17.0,"2:79",9.55,["فَوَيْلٌ لِّلَّذِينَ يَكْتُبُونَ ٱلْكِتَـٰبَ","بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَـٰذَا مِنْ عِندِ","ٱللَّهِ لِيَشْتَرُوا۟ بِهِۦ ثَمَنًا قَلِيلًا ۖ فَوَيْلٌ","لَّهُم مِّمَّا كَتَبَتْ أَيْدِيهِمْ وَوَيْلٌ لَّهُم","مِّمَّا يَكْسِبُونَ ﴿٧٩﴾"]],[491.5,68.65,7.0,21.0,"2:80",13.25,["وَقَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ","إِلَّآ أَيَّامًا مَّعْدُودَةً ۚ","قُلْ أَتَّخَذْتُمْ عِندَ ٱللَّهِ","عَهْدًا فَلَن يُخْلِفَ","ٱللَّهُ عَهْدَهُۥٓ ۖ أَمْ","تَقُولُونَ عَلَى ٱللَّهِ مَا","لَا تَعْلَمُونَ ﴿٨٠﴾"]],[485.5,68.65,6.0,21.0,"2:81",13.25,["بَلَىٰ مَن كَسَبَ","سَيِّئَةً وَأَحَـٰطَتْ","بِهِۦ خَطِيٓـَٔتُهُۥ","فَأُو۟لَـٰٓئِكَ أَصْحَـٰبُ","ٱلنَّارِ ۖ هُمْ فِيهَا","خَـٰلِدُونَ","﴿٨١﴾"]],[599.5,89.65,16.0,17.0,"2:83",9.55,["وَإِذْ أَخَذْنَا مِيثَـٰقَ بَنِىٓ إِسْرَٰٓءِيلَ لَا تَعْبُدُونَ إِلَّا","ٱللَّهَ وَبِٱلْوَٰلِدَيْنِ إِحْسَانًا وَذِى ٱلْقُرْبَىٰ وَٱلْيَتَـٰمَىٰ","وَٱلْمَسَـٰكِينِ وَقُولُوا۟ لِلنَّاسِ حُسْنًا وَأَقِيمُوا۟ ٱلصَّلَوٰةَ","وَءَاتُوا۟ ٱلزَّكَوٰةَ ثُمَّ تَوَلَّيْتُمْ إِلَّا قَلِيلًا مِّنكُمْ وَأَنتُم","مُّعْرِضُونَ ﴿٨٣﴾"]],[592.5,89.65,7.0,21.0,"2:84",13.25,["وَإِذْ أَخَذْنَا مِيثَـٰقَكُمْ","لَا تَسْفِكُونَ","دِمَآءَكُمْ وَلَا","تُخْرِجُونَ أَنفُسَكُم مِّن","دِيَـٰرِكُمْ ثُمَّ أَقْرَرْتُمْ","وَأَنتُمْ تَشْهَدُونَ","﴿٨٤﴾"]],[556.5,89.65,36.0,16.0,"2:85",7.7,["ثُمَّ أَنتُمْ هَـٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقًا مِّنكُم مِّن دِيَـٰرِهِمْ تَظَـٰهَرُونَ عَلَيْهِم بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَإِن يَأْتُوكُمْ","أُسَـٰرَىٰ تُفَـٰدُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمْ إِخْرَاجُهُمْ ۚ أَفَتُؤْمِنُونَ بِبَعْضِ ٱلْكِتَـٰبِ وَتَكْفُرُونَ بِبَعْضٍ ۚ فَمَا جَزَآءُ مَن","يَفْعَلُ ذَٰلِكَ مِنكُمْ إِلَّا خِزْىٌ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَيَوْمَ ٱلْقِيَـٰمَةِ يُرَدُّونَ إِلَىٰٓ أَشَدِّ ٱلْعَذَابِ ۗ وَمَا ٱللَّهُ بِغَـٰفِلٍ عَمَّا","تَعْمَلُونَ ﴿٨٥﴾"]],[550.5,89.65,6.0,21.0,"2:86",13.25,["أُو۟لَـٰٓئِكَ ٱلَّذِينَ","ٱشْتَرَوُا۟ ٱلْحَيَوٰةَ","ٱلدُّنْيَا بِٱلْـَٔاخِرَةِ ۖ","فَلَا يُخَفَّفُ عَنْهُمُ","ٱلْعَذَابُ وَلَا هُمْ","يُنصَرُونَ","﴿٨٦﴾"]],[525.5,89.65,25.0,21.0,"2:87",5.85,["وَلَقَدْ ءَاتَيْنَا مُوسَى ٱلْكِتَـٰبَ وَقَفَّيْنَا مِنۢ بَعْدِهِۦ بِٱلرُّسُلِ ۖ وَءَاتَيْنَا عِيسَى ٱبْنَ","مَرْيَمَ ٱلْبَيِّنَـٰتِ وَأَيَّدْنَـٰهُ بِرُوحِ ٱلْقُدُسِ ۗ أَفَكُلَّمَا جَآءَكُمْ رَسُولٌۢ بِمَا لَا تَهْوَىٰٓ","أَنفُسُكُمُ ٱسْتَكْبَرْتُمْ فَفَرِيقًا كَذَّبْتُمْ وَفَرِيقًا تَقْتُلُونَ ﴿٨٧﴾"]],[514.5,89.65,11.0,21.0,"2:88",5.85,["وَقَالُوا۟ قُلُوبُنَا غُلْفٌۢ ۚ بَل لَّعَنَهُمُ ٱللَّهُ","بِكُفْرِهِمْ فَقَلِيلًا مَّا يُؤْمِنُونَ","﴿٨٨﴾"]],[504.5,89.65,10.0,19.0,"2:89",11.4,["وَلَمَّا جَآءَهُمْ كِتَـٰبٌ مِّنْ عِندِ","ٱللَّهِ مُصَدِّقٌ لِّمَا مَعَهُمْ وَكَانُوا۟","مِن قَبْلُ يَسْتَفْتِحُونَ عَلَى ٱلَّذِينَ","كَفَرُوا۟ فَلَمَّا جَآءَهُم مَّا عَرَفُوا۟","كَفَرُوا۟ بِهِۦ ۚ فَلَعْنَةُ ٱللَّهِ عَلَى","ٱلْكَـٰفِرِينَ ﴿٨٩﴾"]],[488.5,89.65,16.0,16.0,"2:90",7.7,["بِئْسَمَا ٱشْتَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ أَن يَكْفُرُوا۟ بِمَآ أَنزَلَ","ٱللَّهُ بَغْيًا أَن يُنَزِّلَ ٱللَّهُ مِن فَضْلِهِۦ عَلَىٰ مَن يَشَآءُ","مِنْ عِبَادِهِۦ ۖ فَبَآءُو بِغَضَبٍ عَلَىٰ غَضَبٍ ۚ","وَلِلْكَـٰفِرِينَ عَذَابٌ مُّهِينٌ ﴿٩٠﴾"]],[478.5,89.65,10.0,19.0,"2:91",11.4,["وَإِذَا قِيلَ لَهُمْ ءَامِنُوا۟ بِمَآ أَنزَلَ","ٱللَّهُ قَالُوا۟ نُؤْمِنُ بِمَآ أُنزِلَ عَلَيْنَا","وَيَكْفُرُونَ بِمَا وَرَآءَهُۥ وَهُوَ","ٱلْحَقُّ مُصَدِّقًا لِّمَا مَعَهُمْ ۗ قُلْ","فَلِمَ تَقْتُلُونَ أَنۢبِيَآءَ ٱللَّهِ مِن قَبْلُ","إِن كُنتُم مُّؤْمِنِينَ ﴿٩١﴾"]],[608.5,110.65,7.0,19.0,"2:94",11.4,["قُلْ إِن كَانَتْ لَكُمُ","ٱلدَّارُ ٱلْـَٔاخِرَةُ عِندَ","ٱللَّهِ خَالِصَةً مِّن","دُونِ ٱلنَّاسِ فَتَمَنَّوُا۟","ٱلْمَوْتَ إِن كُنتُمْ","صَـٰدِقِينَ ﴿٩٤﴾"]],[598.5,110.65,10.0,21.0,"2:95",5.85,["وَلَن يَتَمَنَّوْهُ أَبَدًۢا بِمَا قَدَّمَتْ","أَيْدِيهِمْ ۗ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّـٰلِمِينَ","﴿٩٥﴾"]],[572.5,110.65,26.0,21.0,"2:96",5.85,["وَلَتَجِدَنَّهُمْ أَحْرَصَ ٱلنَّاسِ عَلَىٰ حَيَوٰةٍ وَمِنَ ٱلَّذِينَ أَشْرَكُوا۟ ۚ يَوَدُّ أَحَدُهُمْ لَوْ يُعَمَّرُ","أَلْفَ سَنَةٍ وَمَا هُوَ بِمُزَحْزِحِهِۦ مِنَ ٱلْعَذَابِ أَن يُعَمَّرَ ۗ وَٱللَّهُ بَصِيرٌۢ بِمَا يَعْمَلُونَ","﴿٩٦﴾"]],[565.5,110.65,7.0,19.0,"2:97",11.4,["قُلْ مَن كَانَ عَدُوًّا","لِّجِبْرِيلَ فَإِنَّهُۥ نَزَّلَهُۥ","عَلَىٰ قَلْبِكَ بِإِذْنِ ٱللَّهِ","مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ","وَهُدًى وَبُشْرَىٰ","لِلْمُؤْمِنِينَ ﴿٩٧﴾"]],[559.5,110.65,6.0,19.0,"2:98",11.4,["مَن كَانَ عَدُوًّا","لِّلَّهِ وَمَلَـٰٓئِكَتِهِۦ","وَرُسُلِهِۦ وَجِبْرِيلَ","وَمِيكَىٰلَ فَإِنَّ ٱللَّهَ","عَدُوٌّ لِّلْكَـٰفِرِينَ","﴿٩٨﴾"]],[553.5,110.65,6.0,17.0,"2:99",9.55,["وَلَقَدْ أَنزَلْنَآ إِلَيْكَ","ءَايَـٰتٍۭ بَيِّنَـٰتٍ ۖ","وَمَا يَكْفُرُ بِهَآ إِلَّا","ٱلْفَـٰسِقُونَ","﴿٩٩﴾"]],[547.5,110.65,6.0,19.0,"2:100",11.4,["أَوَكُلَّمَا عَـٰهَدُوا۟","عَهْدًا نَّبَذَهُۥ فَرِيقٌ","مِّنْهُم ۚ بَلْ","أَكْثَرُهُمْ لَا","يُؤْمِنُونَ","﴿١٠٠﴾"]],[537.5,110.65,10.0,19.0,"2:101",11.4,["وَلَمَّا جَآءَهُمْ رَسُولٌ مِّنْ عِندِ","ٱللَّهِ مُصَدِّقٌ لِّمَا مَعَهُمْ نَبَذَ","فَرِيقٌ مِّنَ ٱلَّذِينَ أُوتُوا۟","ٱلْكِتَـٰبَ كِتَـٰبَ ٱللَّهِ وَرَآءَ","ظُهُورِهِمْ كَأَنَّهُمْ لَا يَعْلَمُونَ","﴿١٠١﴾"]],[491.5,110.65,46.0,16.0,"2:102",7.7,["وَٱتَّبَعُوا۟ مَا تَتْلُوا۟ ٱلشَّيَـٰطِينُ عَلَىٰ مُلْكِ سُلَيْمَـٰنَ ۖ وَمَا كَفَرَ سُلَيْمَـٰنُ وَلَـٰكِنَّ ٱلشَّيَـٰطِينَ كَفَرُوا۟ يُعَلِّمُونَ ٱلنَّاسَ ٱلسِّحْرَ وَمَآ أُنزِلَ عَلَى ٱلْمَلَكَيْنِ بِبَابِلَ","هَـٰرُوتَ وَمَـٰرُوتَ ۚ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَآ إِنَّمَا نَحْنُ فِتْنَةٌ فَلَا تَكْفُرْ ۖ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِۦ بَيْنَ ٱلْمَرْءِ وَزَوْجِهِۦ ۚ وَمَا هُم","بِضَآرِّينَ بِهِۦ مِنْ أَحَدٍ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ ۚ وَلَقَدْ عَلِمُوا۟ لَمَنِ ٱشْتَرَىٰهُ مَا لَهُۥ فِى ٱلْـَٔاخِرَةِ مِنْ خَلَـٰقٍ ۚ وَلَبِئْسَ مَا شَرَوْا۟","بِهِۦٓ أَنفُسَهُمْ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ ﴿١٠٢﴾"]],[485.5,110.65,6.0,17.0,"2:103",9.55,["وَلَوْ أَنَّهُمْ ءَامَنُوا۟","وَٱتَّقَوْا۟ لَمَثُوبَةٌ مِّنْ","عِندِ ٱللَّهِ خَيْرٌ ۖ لَّوْ","كَانُوا۟ يَعْلَمُونَ","﴿١٠٣﴾"]],[471.2,5.65,7.0,17.0,"2:104",9.55,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟","لَا تَقُولُوا۟ رَٰعِنَا وَقُولُوا۟","ٱنظُرْنَا وَٱسْمَعُوا۟ ۗ","وَلِلْكَـٰفِرِينَ عَذَابٌ","أَلِيمٌ ﴿١٠٤﴾"]],[460.2,5.65,11.0,17.0,"2:105",9.55,["مَّا يَوَدُّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ","ٱلْكِتَـٰبِ وَلَا ٱلْمُشْرِكِينَ أَن يُنَزَّلَ","عَلَيْكُم مِّنْ خَيْرٍ مِّن رَّبِّكُمْ ۗ وَٱللَّهُ","يَخْتَصُّ بِرَحْمَتِهِۦ مَن يَشَآءُ ۚ وَٱللَّهُ","ذُو ٱلْفَضْلِ ٱلْعَظِيمِ ﴿١٠٥﴾"]],[453.2,5.65,7.0,19.0,"2:106",11.4,["۞ مَا نَنسَخْ مِنْ ءَايَةٍ","أَوْ نُنسِهَا نَأْتِ بِخَيْرٍ","مِّنْهَآ أَوْ مِثْلِهَآ ۗ أَلَمْ","تَعْلَمْ أَنَّ ٱللَّهَ عَلَىٰ","كُلِّ شَىْءٍ قَدِيرٌ","﴿١٠٦﴾"]],[468.2,24.65,10.0,17.0,"2:108",9.55,["أَمْ تُرِيدُونَ أَن تَسْـَٔلُوا۟","رَسُولَكُمْ كَمَا سُئِلَ مُوسَىٰ مِن","قَبْلُ ۗ وَمَن يَتَبَدَّلِ ٱلْكُفْرَ","بِٱلْإِيمَـٰنِ فَقَدْ ضَلَّ سَوَآءَ","ٱلسَّبِيلِ ﴿١٠٨﴾"]],[455.2,24.65,13.0,19.0,"2:109",11.4,["وَدَّ كَثِيرٌ مِّنْ أَهْلِ ٱلْكِتَـٰبِ لَوْ يَرُدُّونَكُم","مِّنۢ بَعْدِ إِيمَـٰنِكُمْ كُفَّارًا حَسَدًا مِّنْ","عِندِ أَنفُسِهِم مِّنۢ بَعْدِ مَا تَبَيَّنَ لَهُمُ ٱلْحَقُّ","ۖ فَٱعْفُوا۟ وَٱصْفَحُوا۟ حَتَّىٰ يَأْتِىَ ٱللَّهُ","بِأَمْرِهِۦٓ ۗ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","﴿١٠٩﴾"]],[467.2,43.65,11.0,16.0,"2:111",7.7,["وَقَالُوا۟ لَن يَدْخُلَ ٱلْجَنَّةَ إِلَّا مَن","كَانَ هُودًا أَوْ نَصَـٰرَىٰ ۗ تِلْكَ","أَمَانِيُّهُمْ ۗ قُلْ هَاتُوا۟ بُرْهَـٰنَكُمْ إِن","كُنتُمْ صَـٰدِقِينَ ﴿١١١﴾"]],[457.2,43.65,10.0,16.0,"2:112",7.7,["بَلَىٰ مَنْ أَسْلَمَ وَجْهَهُۥ لِلَّهِ وَهُوَ","مُحْسِنٌ فَلَهُۥٓ أَجْرُهُۥ عِندَ رَبِّهِۦ","وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ","يَحْزَنُونَ ﴿١١٢﴾"]],[465.2,59.65,13.0,19.0,"2:113",11.4,["وَقَالَتِ ٱلْيَهُودُ لَيْسَتِ ٱلنَّصَـٰرَىٰ عَلَىٰ","شَىْءٍ وَقَالَتِ ٱلنَّصَـٰرَىٰ لَيْسَتِ ٱلْيَهُودُ","عَلَىٰ شَىْءٍ وَهُمْ يَتْلُونَ ٱلْكِتَـٰبَ ۗ كَذَٰلِكَ","قَالَ ٱلَّذِينَ لَا يَعْلَمُونَ مِثْلَ قَوْلِهِمْ ۚ فَٱللَّهُ","يَحْكُمُ بَيْنَهُمْ يَوْمَ ٱلْقِيَـٰمَةِ فِيمَا كَانُوا۟ فِيهِ","يَخْتَلِفُونَ ﴿١١٣﴾"]],[449.2,59.65,16.0,16.0,"2:114",7.7,["وَمَنْ أَظْلَمُ مِمَّن مَّنَعَ مَسَـٰجِدَ ٱللَّهِ أَن يُذْكَرَ فِيهَا","ٱسْمُهُۥ وَسَعَىٰ فِى خَرَابِهَآ ۚ أُو۟لَـٰٓئِكَ مَا كَانَ لَهُمْ أَن","يَدْخُلُوهَآ إِلَّا خَآئِفِينَ ۚ لَهُمْ فِى ٱلدُّنْيَا خِزْىٌ وَلَهُمْ","فِى ٱلْـَٔاخِرَةِ عَذَابٌ عَظِيمٌ ﴿١١٤﴾"]],[462.2,78.65,16.0,19.0,"2:115",4.0,["وَلِلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ فَأَيْنَمَا تُوَلُّوا۟ فَثَمَّ وَجْهُ ٱللَّهِ ۚ","إِنَّ ٱللَّهَ وَٰسِعٌ عَلِيمٌ ﴿١١٥﴾"]],[455.2,78.65,7.0,17.0,"2:116",9.55,["وَقَالُوا۟ ٱتَّخَذَ ٱللَّهُ وَلَدًا","ۗ سُبْحَـٰنَهُۥ ۖ بَل لَّهُۥ","مَا فِى ٱلسَّمَـٰوَٰتِ","وَٱلْأَرْضِ ۖ كُلٌّ لَّهُۥ","قَـٰنِتُونَ ﴿١١٦﴾"]],[467.2,97.65,11.0,14.0,"2:117",5.85,["بَدِيعُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ وَإِذَا","قَضَىٰٓ أَمْرًا فَإِنَّمَا يَقُولُ لَهُۥ كُن","فَيَكُونُ ﴿١١٧﴾"]],[461.2,97.65,6.0,17.0,"2:119",9.55,["إِنَّآ أَرْسَلْنَـٰكَ","بِٱلْحَقِّ بَشِيرًا","وَنَذِيرًا ۖ وَلَا تُسْـَٔلُ","عَنْ أَصْحَـٰبِ","ٱلْجَحِيمِ ﴿١١٩﴾"]],[450.2,97.65,11.0,19.0,"2:120",11.4,["وَلَن تَرْضَىٰ عَنكَ ٱلْيَهُودُ وَلَا","ٱلنَّصَـٰرَىٰ حَتَّىٰ تَتَّبِعَ مِلَّتَهُمْ ۗ قُلْ","إِنَّ هُدَى ٱللَّهِ هُوَ ٱلْهُدَىٰ ۗ وَلَئِنِ","ٱتَّبَعْتَ أَهْوَآءَهُم بَعْدَ ٱلَّذِى","جَآءَكَ مِنَ ٱلْعِلْمِ ۙ مَا لَكَ مِنَ ٱللَّهِ","مِن وَلِىٍّ وَلَا نَصِيرٍ ﴿١٢٠﴾"]],[437.9,5.65,11.0,25.0,"2:124",9.55,["۞ وَإِذِ ٱبْتَلَىٰٓ إِبْرَٰهِـۧمَ رَبُّهُۥ","بِكَلِمَـٰتٍ فَأَتَمَّهُنَّ ۖ قَالَ إِنِّى","جَاعِلُكَ لِلنَّاسِ إِمَامًا ۖ قَالَ وَمِن","ذُرِّيَّتِى ۖ قَالَ لَا يَنَالُ عَهْدِى","ٱلظَّـٰلِمِينَ ﴿١٢٤﴾"]],[426.9,5.65,11.0,26.0,"2:125",11.4,["وَإِذْ جَعَلْنَا ٱلْبَيْتَ مَثَابَةً لِّلنَّاسِ","وَأَمْنًا وَٱتَّخِذُوا۟ مِن مَّقَامِ إِبْرَٰهِـۧمَ","مُصَلًّى ۖ وَعَهِدْنَآ إِلَىٰٓ إِبْرَٰهِـۧمَ","وَإِسْمَـٰعِيلَ أَن طَهِّرَا بَيْتِىَ","لِلطَّآئِفِينَ وَٱلْعَـٰكِفِينَ وَٱلرُّكَّعِ","ٱلسُّجُودِ ﴿١٢٥﴾"]],[437.9,31.65,11.0,21.0,"2:126",13.25,["وَإِذْ قَالَ إِبْرَٰهِـۧمُ رَبِّ ٱجْعَلْ","هَـٰذَا بَلَدًا ءَامِنًا وَٱرْزُقْ أَهْلَهُۥ مِنَ","ٱلثَّمَرَٰتِ مَنْ ءَامَنَ مِنْهُم بِٱللَّهِ","وَٱلْيَوْمِ ٱلْـَٔاخِرِ ۖ قَالَ وَمَن كَفَرَ","فَأُمَتِّعُهُۥ قَلِيلًا ثُمَّ أَضْطَرُّهُۥٓ إِلَىٰ","عَذَابِ ٱلنَّارِ ۖ وَبِئْسَ ٱلْمَصِيرُ","﴿١٢٦﴾"]],[431.9,31.65,6.0,19.0,"2:127",11.4,["وَإِذْ يَرْفَعُ إِبْرَٰهِـۧمُ","ٱلْقَوَاعِدَ مِنَ","ٱلْبَيْتِ وَإِسْمَـٰعِيلُ","رَبَّنَا تَقَبَّلْ مِنَّآ ۖ","إِنَّكَ أَنتَ ٱلسَّمِيعُ","ٱلْعَلِيمُ ﴿١٢٧﴾"]],[425.9,31.65,6.0,23.0,"2:128",15.1,["رَبَّنَا وَٱجْعَلْنَا","مُسْلِمَيْنِ لَكَ وَمِن","ذُرِّيَّتِنَآ أُمَّةً","مُّسْلِمَةً لَّكَ وَأَرِنَا","مَنَاسِكَنَا وَتُبْ","عَلَيْنَآ ۖ إِنَّكَ أَنتَ","ٱلتَّوَّابُ ٱلرَّحِيمُ","﴿١٢٨﴾"]],[442.9,54.65,6.0,23.0,"2:129",15.1,["رَبَّنَا وَٱبْعَثْ فِيهِمْ","رَسُولًا مِّنْهُمْ يَتْلُوا۟","عَلَيْهِمْ ءَايَـٰتِكَ","وَيُعَلِّمُهُمُ ٱلْكِتَـٰبَ","وَٱلْحِكْمَةَ وَيُزَكِّيهِمْ","ۚ إِنَّكَ أَنتَ","ٱلْعَزِيزُ ٱلْحَكِيمُ","﴿١٢٩﴾"]],[432.9,54.65,10.0,25.0,"2:130",9.55,["وَمَن يَرْغَبُ عَن مِّلَّةِ إِبْرَٰهِـۧمَ","إِلَّا مَن سَفِهَ نَفْسَهُۥ ۚ وَلَقَدِ","ٱصْطَفَيْنَـٰهُ فِى ٱلدُّنْيَا ۖ وَإِنَّهُۥ فِى","ٱلْـَٔاخِرَةِ لَمِنَ ٱلصَّـٰلِحِينَ","﴿١٣٠﴾"]],[425.9,54.65,7.0,26.0,"2:132",11.4,["وَوَصَّىٰ بِهَآ إِبْرَٰهِـۧمُ","بَنِيهِ وَيَعْقُوبُ يَـٰبَنِىَّ","إِنَّ ٱللَّهَ ٱصْطَفَىٰ لَكُمُ","ٱلدِّينَ فَلَا تَمُوتُنَّ إِلَّا","وَأَنتُم مُّسْلِمُونَ","﴿١٣٢﴾"]],[437.9,80.65,11.0,26.0,"2:133",11.4,["أَمْ كُنتُمْ شُهَدَآءَ إِذْ حَضَرَ يَعْقُوبَ","ٱلْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ","مِنۢ بَعْدِى قَالُوا۟ نَعْبُدُ إِلَـٰهَكَ","وَإِلَـٰهَ ءَابَآئِكَ إِبْرَٰهِـۧمَ وَإِسْمَـٰعِيلَ","وَإِسْحَـٰقَ إِلَـٰهًا وَٰحِدًا وَنَحْنُ لَهُۥ","مُسْلِمُونَ ﴿١٣٣﴾"]],[431.9,80.65,6.0,21.0,"2:135",13.25,["وَقَالُوا۟ كُونُوا۟","هُودًا أَوْ نَصَـٰرَىٰ","تَهْتَدُوا۟ ۗ قُلْ بَلْ","مِلَّةَ إِبْرَٰهِـۧمَ حَنِيفًا","ۖ وَمَا كَانَ مِنَ","ٱلْمُشْرِكِينَ","﴿١٣٥﴾"]],[438.9,106.65,10.0,21.0,"2:136",13.25,["قُولُوٓا۟ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ","إِلَيْنَا وَمَآ أُنزِلَ إِلَىٰٓ إِبْرَٰهِـۧمَ","وَإِسْمَـٰعِيلَ وَإِسْحَـٰقَ وَيَعْقُوبَ","وَٱلْأَسْبَاطِ وَمَآ أُوتِىَ مُوسَىٰ","وَعِيسَىٰ وَمَآ أُوتِىَ ٱلنَّبِيُّونَ مِن","رَّبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّنْهُمْ","وَنَحْنُ لَهُۥ مُسْلِمُونَ ﴿١٣٦﴾"]],[432.9,106.65,6.0,23.0,"2:137",15.1,["فَإِنْ ءَامَنُوا۟ بِمِثْلِ","مَآ ءَامَنتُم بِهِۦ","فَقَدِ ٱهْتَدَوا۟ ۖ وَّإِن","تَوَلَّوْا۟ فَإِنَّمَا هُمْ فِى","شِقَاقٍ ۖ","فَسَيَكْفِيكَهُمُ ٱللَّهُ ۚ","وَهُوَ ٱلسَّمِيعُ","ٱلْعَلِيمُ ﴿١٣٧﴾"]],[426.9,106.65,6.0,17.0,"2:138",9.55,["صِبْغَةَ ٱللَّهِ ۖ وَمَنْ","أَحْسَنُ مِنَ ٱللَّهِ","صِبْغَةً ۖ وَنَحْنُ لَهُۥ","عَـٰبِدُونَ","﴿١٣٨﴾"]],[404.6,5.65,21.0,17.0,"2:143",9.55,["وَكَذَٰلِكَ جَعَلْنَـٰكُمْ أُمَّةً وَسَطًا لِّتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ وَيَكُونَ","ٱلرَّسُولُ عَلَيْكُمْ شَهِيدًا ۗ وَمَا جَعَلْنَا ٱلْقِبْلَةَ ٱلَّتِى كُنتَ عَلَيْهَآ إِلَّا","لِنَعْلَمَ مَن يَتَّبِعُ ٱلرَّسُولَ مِمَّن يَنقَلِبُ عَلَىٰ عَقِبَيْهِ ۚ وَإِن كَانَتْ","لَكَبِيرَةً إِلَّا عَلَى ٱلَّذِينَ هَدَى ٱللَّهُ ۗ وَمَا كَانَ ٱللَّهُ لِيُضِيعَ إِيمَـٰنَكُمْ ۚ","إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٌ رَّحِيمٌ ﴿١٤٣﴾"]],[391.6,5.65,13.0,21.0,"2:144",13.25,["قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِى ٱلسَّمَآءِ ۖ","فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَىٰهَا ۚ فَوَلِّ وَجْهَكَ","شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ ۚ وَحَيْثُ مَا كُنتُمْ","فَوَلُّوا۟ وُجُوهَكُمْ شَطْرَهُۥ ۗ وَإِنَّ ٱلَّذِينَ","أُوتُوا۟ ٱلْكِتَـٰبَ لَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن","رَّبِّهِمْ ۗ وَمَا ٱللَّهُ بِغَـٰفِلٍ عَمَّا يَعْمَلُونَ","﴿١٤٤﴾"]],[385.6,5.65,6.0,16.0,"2:147",7.7,["ٱلْحَقُّ مِن رَّبِّكَ ۖ","فَلَا تَكُونَنَّ مِنَ","ٱلْمُمْتَرِينَ","﴿١٤٧﴾"]],[378.6,5.65,7.0,21.0,"2:148",13.25,["وَلِكُلٍّ وِجْهَةٌ هُوَ","مُوَلِّيهَا ۖ فَٱسْتَبِقُوا۟","ٱلْخَيْرَٰتِ ۚ أَيْنَ مَا","تَكُونُوا۟ يَأْتِ بِكُمُ","ٱللَّهُ جَمِيعًا ۚ إِنَّ ٱللَّهَ","عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","﴿١٤٨﴾"]],[372.6,5.65,6.0,16.0,"2:152",7.7,["فَٱذْكُرُونِىٓ","أَذْكُرْكُمْ وَٱشْكُرُوا۟","لِى وَلَا تَكْفُرُونِ","﴿١٥٢﴾"]],[359.6,5.65,13.0,21.0,"2:155",5.85,["وَلَنَبْلُوَنَّكُم بِشَىْءٍ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ","وَنَقْصٍ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ","ۗ وَبَشِّرِ ٱلصَّـٰبِرِينَ ﴿١٥٥﴾"]],[340.6,5.65,19.0,21.0,"2:158",5.85,["۞ إِنَّ ٱلصَّفَا وَٱلْمَرْوَةَ مِن شَعَآئِرِ ٱللَّهِ ۖ فَمَنْ حَجَّ ٱلْبَيْتَ أَوِ","ٱعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَن يَطَّوَّفَ بِهِمَا ۚ وَمَن تَطَوَّعَ خَيْرًا","فَإِنَّ ٱللَّهَ شَاكِرٌ عَلِيمٌ ﴿١٥٨﴾"]],[334.6,5.65,6.0,19.0,"2:160",11.4,["إِلَّا ٱلَّذِينَ تَابُوا۟","وَأَصْلَحُوا۟ وَبَيَّنُوا۟","فَأُو۟لَـٰٓئِكَ أَتُوبُ","عَلَيْهِمْ ۚ وَأَنَا","ٱلتَّوَّابُ ٱلرَّحِيمُ","﴿١٦٠﴾"]],[303.6,5.65,31.0,21.0,"2:164",5.85,["إِنَّ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَـٰفِ ٱلَّيْلِ وَٱلنَّهَارِ وَٱلْفُلْكِ ٱلَّتِى تَجْرِى فِى ٱلْبَحْرِ بِمَا يَنفَعُ","ٱلنَّاسَ وَمَآ أَنزَلَ ٱللَّهُ مِنَ ٱلسَّمَآءِ مِن مَّآءٍ فَأَحْيَا بِهِ ٱلْأَرْضَ بَعْدَ مَوْتِهَا وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٍ","وَتَصْرِيفِ ٱلرِّيَـٰحِ وَٱلسَّحَابِ ٱلْمُسَخَّرِ بَيْنَ ٱلسَّمَآءِ وَٱلْأَرْضِ لَـَٔايَـٰتٍ لِّقَوْمٍ يَعْقِلُونَ ﴿١٦٤﴾"]],[293.6,5.65,10.0,21.0,"2:165",13.25,["وَمِنَ ٱلنَّاسِ مَن يَتَّخِذُ مِن","دُونِ ٱللَّهِ أَندَادًا يُحِبُّونَهُمْ","كَحُبِّ ٱللَّهِ ۖ وَٱلَّذِينَ ءَامَنُوٓا۟ أَشَدُّ","حُبًّا لِّلَّهِ ۗ وَلَوْ يَرَى ٱلَّذِينَ ظَلَمُوٓا۟","إِذْ يَرَوْنَ ٱلْعَذَابَ أَنَّ ٱلْقُوَّةَ لِلَّهِ","جَمِيعًا وَأَنَّ ٱللَّهَ شَدِيدُ ٱلْعَذَابِ","﴿١٦٥﴾"]],[287.6,5.65,6.0,21.0,"2:166",13.25,["إِذْ تَبَرَّأَ ٱلَّذِينَ","ٱتُّبِعُوا۟ مِنَ ٱلَّذِينَ","ٱتَّبَعُوا۟ وَرَأَوُا۟","ٱلْعَذَابَ","وَتَقَطَّعَتْ بِهِمُ","ٱلْأَسْبَابُ","﴿١٦٦﴾"]],[276.6,5.65,11.0,17.0,"2:167",9.55,["وَقَالَ ٱلَّذِينَ ٱتَّبَعُوا۟ لَوْ أَنَّ لَنَا كَرَّةً","فَنَتَبَرَّأَ مِنْهُمْ كَمَا تَبَرَّءُوا۟ مِنَّا ۗ","كَذَٰلِكَ يُرِيهِمُ ٱللَّهُ أَعْمَـٰلَهُمْ","حَسَرَٰتٍ عَلَيْهِمْ ۖ وَمَا هُم","بِخَـٰرِجِينَ مِنَ ٱلنَّارِ ﴿١٦٧﴾"]],[265.6,5.65,11.0,16.0,"2:168",7.7,["يَـٰٓأَيُّهَا ٱلنَّاسُ كُلُوا۟ مِمَّا فِى ٱلْأَرْضِ","حَلَـٰلًا طَيِّبًا وَلَا تَتَّبِعُوا۟ خُطُوَٰتِ","ٱلشَّيْطَـٰنِ ۚ إِنَّهُۥ لَكُمْ عَدُوٌّ مُّبِينٌ","﴿١٦٨﴾"]],[259.6,5.65,6.0,17.0,"2:169",9.55,["إِنَّمَا يَأْمُرُكُم بِٱلسُّوٓءِ","وَٱلْفَحْشَآءِ وَأَن","تَقُولُوا۟ عَلَى ٱللَّهِ مَا","لَا تَعْلَمُونَ","﴿١٦٩﴾"]],[252.6,5.65,7.0,21.0,"2:170",13.25,["وَإِذَا قِيلَ لَهُمُ ٱتَّبِعُوا۟","مَآ أَنزَلَ ٱللَّهُ قَالُوا۟ بَلْ","نَتَّبِعُ مَآ أَلْفَيْنَا عَلَيْهِ","ءَابَآءَنَآ ۗ أَوَلَوْ كَانَ","ءَابَآؤُهُمْ لَا يَعْقِلُونَ","شَيْـًٔا وَلَا يَهْتَدُونَ","﴿١٧٠﴾"]],[241.6,5.65,11.0,16.0,"2:171",7.7,["وَمَثَلُ ٱلَّذِينَ كَفَرُوا۟ كَمَثَلِ ٱلَّذِى","يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَآءً","وَنِدَآءً ۚ صُمٌّۢ بُكْمٌ عُمْىٌ فَهُمْ لَا","يَعْقِلُونَ ﴿١٧١﴾"]],[225.6,5.65,16.0,21.0,"2:173",5.85,["إِنَّمَا حَرَّمَ عَلَيْكُمُ ٱلْمَيْتَةَ وَٱلدَّمَ وَلَحْمَ ٱلْخِنزِيرِ وَمَآ","أُهِلَّ بِهِۦ لِغَيْرِ ٱللَّهِ ۖ فَمَنِ ٱضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ","فَلَآ إِثْمَ عَلَيْهِ ۚ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ ﴿١٧٣﴾"]],[215.6,5.65,10.0,21.0,"2:174",13.25,["إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلَ","ٱللَّهُ مِنَ ٱلْكِتَـٰبِ وَيَشْتَرُونَ","بِهِۦ ثَمَنًا قَلِيلًا ۙ أُو۟لَـٰٓئِكَ مَا","يَأْكُلُونَ فِى بُطُونِهِمْ إِلَّا ٱلنَّارَ","وَلَا يُكَلِّمُهُمُ ٱللَّهُ يَوْمَ ٱلْقِيَـٰمَةِ","وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ","﴿١٧٤﴾"]],[196.6,5.65,19.0,21.0,"2:177",13.25,["۞ لَّيْسَ ٱلْبِرَّ أَن تُوَلُّوا۟ وُجُوهَكُمْ قِبَلَ ٱلْمَشْرِقِ وَٱلْمَغْرِبِ","وَلَـٰكِنَّ ٱلْبِرَّ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَٱلْمَلَـٰٓئِكَةِ","وَٱلْكِتَـٰبِ وَٱلنَّبِيِّـۧنَ وَءَاتَى ٱلْمَالَ عَلَىٰ حُبِّهِۦ ذَوِى ٱلْقُرْبَىٰ","وَٱلْيَتَـٰمَىٰ وَٱلْمَسَـٰكِينَ وَٱبْنَ ٱلسَّبِيلِ وَٱلسَّآئِلِينَ وَفِى ٱلرِّقَابِ","وَأَقَامَ ٱلصَّلَوٰةَ وَءَاتَى ٱلزَّكَوٰةَ وَٱلْمُوفُونَ بِعَهْدِهِمْ إِذَا عَـٰهَدُوا۟","ۖ وَٱلصَّـٰبِرِينَ فِى ٱلْبَأْسَآءِ وَٱلضَّرَّآءِ وَحِينَ ٱلْبَأْسِ ۗ أُو۟لَـٰٓئِكَ","ٱلَّذِينَ صَدَقُوا۟ ۖ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُتَّقُونَ ﴿١٧٧﴾"]],[399.6,26.65,26.0,16.0,"2:178",7.7,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلْقِصَاصُ فِى ٱلْقَتْلَى ۖ ٱلْحُرُّ بِٱلْحُرِّ وَٱلْعَبْدُ بِٱلْعَبْدِ","وَٱلْأُنثَىٰ بِٱلْأُنثَىٰ ۚ فَمَنْ عُفِىَ لَهُۥ مِنْ أَخِيهِ شَىْءٌ فَٱتِّبَاعٌۢ بِٱلْمَعْرُوفِ وَأَدَآءٌ إِلَيْهِ","بِإِحْسَـٰنٍ ۗ ذَٰلِكَ تَخْفِيفٌ مِّن رَّبِّكُمْ وَرَحْمَةٌ ۗ فَمَنِ ٱعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ","أَلِيمٌ ﴿١٧٨﴾"]],[393.6,26.65,6.0,17.0,"2:179",9.55,["وَلَكُمْ فِى","ٱلْقِصَاصِ حَيَوٰةٌ","يَـٰٓأُو۟لِى ٱلْأَلْبَـٰبِ","لَعَلَّكُمْ تَتَّقُونَ","﴿١٧٩﴾"]],[387.6,26.65,6.0,19.0,"2:182",11.4,["فَمَنْ خَافَ مِن","مُّوصٍ جَنَفًا أَوْ","إِثْمًا فَأَصْلَحَ بَيْنَهُمْ","فَلَآ إِثْمَ عَلَيْهِ ۚ إِنَّ","ٱللَّهَ غَفُورٌ رَّحِيمٌ","﴿١٨٢﴾"]],[381.6,26.65,6.0,19.0,"2:183",11.4,["يَـٰٓأَيُّهَا ٱلَّذِينَ","ءَامَنُوا۟ كُتِبَ","عَلَيْكُمُ ٱلصِّيَامُ كَمَا","كُتِبَ عَلَى ٱلَّذِينَ","مِن قَبْلِكُمْ لَعَلَّكُمْ","تَتَّقُونَ ﴿١٨٣﴾"]],[370.6,26.65,11.0,21.0,"2:184",13.25,["أَيَّامًا مَّعْدُودَٰتٍ ۚ فَمَن كَانَ مِنكُم","مَّرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ","أَيَّامٍ أُخَرَ ۚ وَعَلَى ٱلَّذِينَ يُطِيقُونَهُۥ","فِدْيَةٌ طَعَامُ مِسْكِينٍ ۖ فَمَن تَطَوَّعَ","خَيْرًا فَهُوَ خَيْرٌ لَّهُۥ ۚ وَأَن تَصُومُوا۟","خَيْرٌ لَّكُمْ ۖ إِن كُنتُمْ تَعْلَمُونَ","﴿١٨٤﴾"]],[339.6,26.65,31.0,21.0,"2:185",5.85,["شَهْرُ رَمَضَانَ ٱلَّذِىٓ أُنزِلَ فِيهِ ٱلْقُرْءَانُ هُدًى لِّلنَّاسِ وَبَيِّنَـٰتٍ مِّنَ ٱلْهُدَىٰ وَٱلْفُرْقَانِ ۚ فَمَن شَهِدَ","مِنكُمُ ٱلشَّهْرَ فَلْيَصُمْهُ ۖ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ ۗ يُرِيدُ ٱللَّهُ بِكُمُ ٱلْيُسْرَ","وَلَا يُرِيدُ بِكُمُ ٱلْعُسْرَ وَلِتُكْمِلُوا۟ ٱلْعِدَّةَ وَلِتُكَبِّرُوا۟ ٱللَّهَ عَلَىٰ مَا هَدَىٰكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ ﴿١٨٥﴾"]],[328.6,26.65,11.0,16.0,"2:186",7.7,["وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى","قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا","دَعَانِ ۖ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟","بِى لَعَلَّهُمْ يَرْشُدُونَ ﴿١٨٦﴾"]],[292.6,26.65,36.0,16.0,"2:187",7.7,["أُحِلَّ لَكُمْ لَيْلَةَ ٱلصِّيَامِ ٱلرَّفَثُ إِلَىٰ نِسَآئِكُمْ ۚ هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ ۗ عَلِمَ ٱللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ","أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ ۖ فَٱلْـَٔـٰنَ بَـٰشِرُوهُنَّ وَٱبْتَغُوا۟ مَا كَتَبَ ٱللَّهُ لَكُمْ ۚ وَكُلُوا۟ وَٱشْرَبُوا۟ حَتَّىٰ يَتَبَيَّنَ","لَكُمُ ٱلْخَيْطُ ٱلْأَبْيَضُ مِنَ ٱلْخَيْطِ ٱلْأَسْوَدِ مِنَ ٱلْفَجْرِ ۖ ثُمَّ أَتِمُّوا۟ ٱلصِّيَامَ إِلَى ٱلَّيْلِ ۚ وَلَا تُبَـٰشِرُوهُنَّ وَأَنتُمْ عَـٰكِفُونَ","فِى ٱلْمَسَـٰجِدِ ۗ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَقْرَبُوهَا ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ ءَايَـٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَ ﴿١٨٧﴾"]],[285.6,26.65,7.0,21.0,"2:188",13.25,["وَلَا تَأْكُلُوٓا۟ أَمْوَٰلَكُم","بَيْنَكُم بِٱلْبَـٰطِلِ وَتُدْلُوا۟","بِهَآ إِلَى ٱلْحُكَّامِ","لِتَأْكُلُوا۟ فَرِيقًا مِّنْ","أَمْوَٰلِ ٱلنَّاسِ بِٱلْإِثْمِ","وَأَنتُمْ تَعْلَمُونَ","﴿١٨٨﴾"]],[275.6,26.65,10.0,21.0,"2:189",13.25,["۞ يَسْـَٔلُونَكَ عَنِ ٱلْأَهِلَّةِ ۖ قُلْ","هِىَ مَوَٰقِيتُ لِلنَّاسِ وَٱلْحَجِّ ۗ","وَلَيْسَ ٱلْبِرُّ بِأَن تَأْتُوا۟ ٱلْبُيُوتَ","مِن ظُهُورِهَا وَلَـٰكِنَّ ٱلْبِرَّ مَنِ","ٱتَّقَىٰ ۗ وَأْتُوا۟ ٱلْبُيُوتَ مِنْ أَبْوَٰبِهَا","ۚ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ","﴿١٨٩﴾"]],[262.6,26.65,13.0,19.0,"2:191",11.4,["وَٱقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُم","مِّنْ حَيْثُ أَخْرَجُوكُمْ ۚ وَٱلْفِتْنَةُ أَشَدُّ مِنَ","ٱلْقَتْلِ ۚ وَلَا تُقَـٰتِلُوهُمْ عِندَ ٱلْمَسْجِدِ","ٱلْحَرَامِ حَتَّىٰ يُقَـٰتِلُوكُمْ فِيهِ ۖ فَإِن قَـٰتَلُوكُمْ","فَٱقْتُلُوهُمْ ۗ كَذَٰلِكَ جَزَآءُ ٱلْكَـٰفِرِينَ","﴿١٩١﴾"]],[256.6,26.65,6.0,14.0,"2:192",5.85,["فَإِنِ ٱنتَهَوْا۟ فَإِنَّ","ٱللَّهَ غَفُورٌ رَّحِيمٌ","﴿١٩٢﴾"]],[250.6,26.65,6.0,21.0,"2:195",13.25,["وَأَنفِقُوا۟ فِى سَبِيلِ","ٱللَّهِ وَلَا تُلْقُوا۟","بِأَيْدِيكُمْ إِلَى","ٱلتَّهْلُكَةِ ۛ وَأَحْسِنُوٓا۟","ۛ إِنَّ ٱللَّهَ يُحِبُّ","ٱلْمُحْسِنِينَ","﴿١٩٥﴾"]],[219.6,26.65,31.0,17.0,"2:196",9.55,["وَأَتِمُّوا۟ ٱلْحَجَّ وَٱلْعُمْرَةَ لِلَّهِ ۚ فَإِنْ أُحْصِرْتُمْ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ ۖ وَلَا تَحْلِقُوا۟ رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ","ٱلْهَدْىُ مَحِلَّهُۥ ۚ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِۦٓ أَذًى مِّن رَّأْسِهِۦ فَفِدْيَةٌ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ","نُسُكٍ ۚ فَإِذَآ أَمِنتُمْ فَمَن تَمَتَّعَ بِٱلْعُمْرَةِ إِلَى ٱلْحَجِّ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ ۚ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَـٰثَةِ","أَيَّامٍ فِى ٱلْحَجِّ وَسَبْعَةٍ إِذَا رَجَعْتُمْ ۗ تِلْكَ عَشَرَةٌ كَامِلَةٌ ۗ ذَٰلِكَ لِمَن لَّمْ يَكُنْ أَهْلُهُۥ حَاضِرِى ٱلْمَسْجِدِ","ٱلْحَرَامِ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ ﴿١٩٦﴾"]],[208.6,26.65,11.0,21.0,"2:197",13.25,["ٱلْحَجُّ أَشْهُرٌ مَّعْلُومَـٰتٌ ۚ فَمَن","فَرَضَ فِيهِنَّ ٱلْحَجَّ فَلَا رَفَثَ وَلَا","فُسُوقَ وَلَا جِدَالَ فِى ٱلْحَجِّ ۗ وَمَا","تَفْعَلُوا۟ مِنْ خَيْرٍ يَعْلَمْهُ ٱللَّهُ ۗ","وَتَزَوَّدُوا۟ فَإِنَّ خَيْرَ ٱلزَّادِ ٱلتَّقْوَىٰ ۚ","وَٱتَّقُونِ يَـٰٓأُو۟لِى ٱلْأَلْبَـٰبِ","﴿١٩٧﴾"]],[197.6,26.65,11.0,19.0,"2:198",11.4,["لَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَبْتَغُوا۟","فَضْلًا مِّن رَّبِّكُمْ ۚ فَإِذَآ أَفَضْتُم","مِّنْ عَرَفَـٰتٍ فَٱذْكُرُوا۟ ٱللَّهَ عِندَ","ٱلْمَشْعَرِ ٱلْحَرَامِ ۖ وَٱذْكُرُوهُ كَمَا","هَدَىٰكُمْ وَإِن كُنتُم مِّن قَبْلِهِۦ لَمِنَ","ٱلضَّآلِّينَ ﴿١٩٨﴾"]],[414.6,47.65,11.0,19.0,"2:202",4.0,["أُو۟لَـٰٓئِكَ لَهُمْ نَصِيبٌ مِّمَّا كَسَبُوا۟ ۚ","وَٱللَّهُ سَرِيعُ ٱلْحِسَابِ ﴿٢٠٢﴾"]],[404.6,47.65,10.0,19.0,"2:203",11.4,["۞ وَٱذْكُرُوا۟ ٱللَّهَ فِىٓ أَيَّامٍ","مَّعْدُودَٰتٍ ۚ فَمَن تَعَجَّلَ فِى","يَوْمَيْنِ فَلَآ إِثْمَ عَلَيْهِ وَمَن تَأَخَّرَ","فَلَآ إِثْمَ عَلَيْهِ ۚ لِمَنِ ٱتَّقَىٰ ۗ وَٱتَّقُوا۟","ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُمْ إِلَيْهِ تُحْشَرُونَ","﴿٢٠٣﴾"]],[391.6,47.65,13.0,21.0,"2:204",5.85,["وَمِنَ ٱلنَّاسِ مَن يُعْجِبُكَ قَوْلُهُۥ فِى","ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيُشْهِدُ ٱللَّهَ عَلَىٰ مَا فِى","قَلْبِهِۦ وَهُوَ أَلَدُّ ٱلْخِصَامِ ﴿٢٠٤﴾"]],[385.6,47.65,6.0,21.0,"2:205",13.25,["وَإِذَا تَوَلَّىٰ سَعَىٰ","فِى ٱلْأَرْضِ","لِيُفْسِدَ فِيهَا","وَيُهْلِكَ ٱلْحَرْثَ","وَٱلنَّسْلَ ۗ وَٱللَّهُ لَا","يُحِبُّ ٱلْفَسَادَ","﴿٢٠٥﴾"]],[375.6,47.65,10.0,21.0,"2:206",5.85,["وَإِذَا قِيلَ لَهُ ٱتَّقِ ٱللَّهَ أَخَذَتْهُ","ٱلْعِزَّةُ بِٱلْإِثْمِ ۚ فَحَسْبُهُۥ جَهَنَّمُ ۚ","وَلَبِئْسَ ٱلْمِهَادُ ﴿٢٠٦﴾"]],[369.6,47.65,6.0,21.0,"2:208",13.25,["يَـٰٓأَيُّهَا ٱلَّذِينَ","ءَامَنُوا۟ ٱدْخُلُوا۟ فِى","ٱلسِّلْمِ كَآفَّةً وَلَا","تَتَّبِعُوا۟ خُطُوَٰتِ","ٱلشَّيْطَـٰنِ ۚ إِنَّهُۥ","لَكُمْ عَدُوٌّ مُّبِينٌ","﴿٢٠٨﴾"]],[363.6,47.65,6.0,21.0,"2:210",13.25,["هَلْ يَنظُرُونَ إِلَّآ","أَن يَأْتِيَهُمُ ٱللَّهُ فِى","ظُلَلٍ مِّنَ ٱلْغَمَامِ","وَٱلْمَلَـٰٓئِكَةُ وَقُضِىَ","ٱلْأَمْرُ ۚ وَإِلَى ٱللَّهِ","تُرْجَعُ ٱلْأُمُورُ","﴿٢١٠﴾"]],[353.6,47.65,10.0,17.0,"2:212",9.55,["زُيِّنَ لِلَّذِينَ كَفَرُوا۟ ٱلْحَيَوٰةُ","ٱلدُّنْيَا وَيَسْخَرُونَ مِنَ ٱلَّذِينَ","ءَامَنُوا۟ ۘ وَٱلَّذِينَ ٱتَّقَوْا۟ فَوْقَهُمْ","يَوْمَ ٱلْقِيَـٰمَةِ ۗ وَٱللَّهُ يَرْزُقُ مَن","يَشَآءُ بِغَيْرِ حِسَابٍ ﴿٢١٢﴾"]],[342.6,47.65,11.0,21.0,"2:214",13.25,["أَمْ حَسِبْتُمْ أَن تَدْخُلُوا۟ ٱلْجَنَّةَ وَلَمَّا","يَأْتِكُم مَّثَلُ ٱلَّذِينَ خَلَوْا۟ مِن قَبْلِكُم","ۖ مَّسَّتْهُمُ ٱلْبَأْسَآءُ وَٱلضَّرَّآءُ","وَزُلْزِلُوا۟ حَتَّىٰ يَقُولَ ٱلرَّسُولُ","وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ مَتَىٰ نَصْرُ ٱللَّهِ","ۗ أَلَآ إِنَّ نَصْرَ ٱللَّهِ قَرِيبٌ","﴿٢١٤﴾"]],[326.6,47.65,16.0,16.0,"2:216",7.7,["كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ وَهُوَ كُرْهٌ لَّكُمْ ۖ وَعَسَىٰٓ أَن","تَكْرَهُوا۟ شَيْـًٔا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰٓ أَن تُحِبُّوا۟","شَيْـًٔا وَهُوَ شَرٌّ لَّكُمْ ۗ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ","﴿٢١٦﴾"]],[307.6,47.65,19.0,21.0,"2:217",13.25,["يَسْـَٔلُونَكَ عَنِ ٱلشَّهْرِ ٱلْحَرَامِ قِتَالٍ فِيهِ ۖ قُلْ قِتَالٌ فِيهِ كَبِيرٌ ۖ","وَصَدٌّ عَن سَبِيلِ ٱللَّهِ وَكُفْرٌۢ بِهِۦ وَٱلْمَسْجِدِ ٱلْحَرَامِ وَإِخْرَاجُ","أَهْلِهِۦ مِنْهُ أَكْبَرُ عِندَ ٱللَّهِ ۚ وَٱلْفِتْنَةُ أَكْبَرُ مِنَ ٱلْقَتْلِ ۗ وَلَا","يَزَالُونَ يُقَـٰتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَن دِينِكُمْ إِنِ ٱسْتَطَـٰعُوا۟ ۚ","وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَيَمُتْ وَهُوَ كَافِرٌ فَأُو۟لَـٰٓئِكَ","حَبِطَتْ أَعْمَـٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ ۖ وَأُو۟لَـٰٓئِكَ أَصْحَـٰبُ","ٱلنَّارِ ۖ هُمْ فِيهَا خَـٰلِدُونَ ﴿٢١٧﴾"]],[291.6,47.65,16.0,21.0,"2:218",5.85,["إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَاجَرُوا۟ وَجَـٰهَدُوا۟ فِى","سَبِيلِ ٱللَّهِ أُو۟لَـٰٓئِكَ يَرْجُونَ رَحْمَتَ ٱللَّهِ ۚ وَٱللَّهُ","غَفُورٌ رَّحِيمٌ ﴿٢١٨﴾"]],[280.6,47.65,11.0,19.0,"2:219",11.4,["۞ يَسْـَٔلُونَكَ عَنِ ٱلْخَمْرِ وَٱلْمَيْسِرِ ۖ","قُلْ فِيهِمَآ إِثْمٌ كَبِيرٌ وَمَنَـٰفِعُ","لِلنَّاسِ وَإِثْمُهُمَآ أَكْبَرُ مِن نَّفْعِهِمَا ۗ","وَيَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلِ ٱلْعَفْوَ","ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْـَٔايَـٰتِ","لَعَلَّكُمْ تَتَفَكَّرُونَ ﴿٢١٩﴾"]],[269.6,47.65,11.0,19.0,"2:220",11.4,["فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ ۗ وَيَسْـَٔلُونَكَ","عَنِ ٱلْيَتَـٰمَىٰ ۖ قُلْ إِصْلَاحٌ لَّهُمْ","خَيْرٌ ۖ وَإِن تُخَالِطُوهُمْ فَإِخْوَٰنُكُمْ ۚ","وَٱللَّهُ يَعْلَمُ ٱلْمُفْسِدَ مِنَ ٱلْمُصْلِحِ ۚ","وَلَوْ شَآءَ ٱللَّهُ لَأَعْنَتَكُمْ ۚ إِنَّ ٱللَّهَ","عَزِيزٌ حَكِيمٌ ﴿٢٢٠﴾"]],[253.6,47.65,16.0,19.0,"2:221",11.4,["وَلَا تَنكِحُوا۟ ٱلْمُشْرِكَـٰتِ حَتَّىٰ يُؤْمِنَّ ۚ وَلَأَمَةٌ","مُّؤْمِنَةٌ خَيْرٌ مِّن مُّشْرِكَةٍ وَلَوْ أَعْجَبَتْكُمْ ۗ وَلَا","تُنكِحُوا۟ ٱلْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا۟ ۚ وَلَعَبْدٌ مُّؤْمِنٌ","خَيْرٌ مِّن مُّشْرِكٍ وَلَوْ أَعْجَبَكُمْ ۗ أُو۟لَـٰٓئِكَ يَدْعُونَ إِلَى","ٱلنَّارِ ۖ وَٱللَّهُ يَدْعُوٓا۟ إِلَى ٱلْجَنَّةِ وَٱلْمَغْفِرَةِ بِإِذْنِهِۦ ۖ","وَيُبَيِّنُ ءَايَـٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ ﴿٢٢١﴾"]],[242.6,47.65,11.0,21.0,"2:222",13.25,["وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ ۖ قُلْ","هُوَ أَذًى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى","ٱلْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ","يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ","حَيْثُ أَمَرَكُمُ ٱللَّهُ ۚ إِنَّ ٱللَّهَ يُحِبُّ","ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ","﴿٢٢٢﴾"]],[235.6,47.65,7.0,21.0,"2:223",13.25,["نِسَآؤُكُمْ حَرْثٌ لَّكُمْ","فَأْتُوا۟ حَرْثَكُمْ أَنَّىٰ","شِئْتُمْ ۖ وَقَدِّمُوا۟","لِأَنفُسِكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ","وَٱعْلَمُوٓا۟ أَنَّكُم مُّلَـٰقُوهُ ۗ","وَبَشِّرِ ٱلْمُؤْمِنِينَ","﴿٢٢٣﴾"]],[229.6,47.65,6.0,21.0,"2:224",13.25,["وَلَا تَجْعَلُوا۟ ٱللَّهَ","عُرْضَةً لِّأَيْمَـٰنِكُمْ","أَن تَبَرُّوا۟ وَتَتَّقُوا۟","وَتُصْلِحُوا۟ بَيْنَ","ٱلنَّاسِ ۗ وَٱللَّهُ","سَمِيعٌ عَلِيمٌ","﴿٢٢٤﴾"]],[218.6,47.65,11.0,16.0,"2:225",7.7,["لَّا يُؤَاخِذُكُمُ ٱللَّهُ بِٱللَّغْوِ فِىٓ","أَيْمَـٰنِكُمْ وَلَـٰكِن يُؤَاخِذُكُم بِمَا","كَسَبَتْ قُلُوبُكُمْ ۗ وَٱللَّهُ غَفُورٌ","حَلِيمٌ ﴿٢٢٥﴾"]],[207.6,47.65,11.0,21.0,"2:226",5.85,["لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ","أَرْبَعَةِ أَشْهُرٍ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ","غَفُورٌ رَّحِيمٌ ﴿٢٢٦﴾"]],[200.6,47.65,7.0,21.0,"2:227",5.85,["وَإِنْ عَزَمُوا۟ ٱلطَّلَـٰقَ","فَإِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌ","﴿٢٢٧﴾"]],[409.6,68.65,16.0,19.0,"2:228",11.4,["وَٱلْمُطَلَّقَـٰتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَـٰثَةَ قُرُوٓءٍ ۚ وَلَا","يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ ٱللَّهُ فِىٓ أَرْحَامِهِنَّ","إِن كُنَّ يُؤْمِنَّ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ ۚ وَبُعُولَتُهُنَّ","أَحَقُّ بِرَدِّهِنَّ فِى ذَٰلِكَ إِنْ أَرَادُوٓا۟ إِصْلَـٰحًا ۚ وَلَهُنَّ","مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ ۚ وَلِلرِّجَالِ عَلَيْهِنَّ","دَرَجَةٌ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌ ﴿٢٢٨﴾"]],[393.6,68.65,16.0,21.0,"2:229",13.25,["ٱلطَّلَـٰقُ مَرَّتَانِ ۖ فَإِمْسَاكٌۢ بِمَعْرُوفٍ أَوْ تَسْرِيحٌۢ","بِإِحْسَـٰنٍ ۗ وَلَا يَحِلُّ لَكُمْ أَن تَأْخُذُوا۟ مِمَّآ","ءَاتَيْتُمُوهُنَّ شَيْـًٔا إِلَّآ أَن يَخَافَآ أَلَّا يُقِيمَا حُدُودَ","ٱللَّهِ ۖ فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ فَلَا جُنَاحَ","عَلَيْهِمَا فِيمَا ٱفْتَدَتْ بِهِۦ ۗ تِلْكَ حُدُودُ ٱللَّهِ فَلَا","تَعْتَدُوهَا ۚ وَمَن يَتَعَدَّ حُدُودَ ٱللَّهِ فَأُو۟لَـٰٓئِكَ هُمُ","ٱلظَّـٰلِمُونَ ﴿٢٢٩﴾"]],[377.6,68.65,16.0,21.0,"2:231",13.25,["وَإِذَا طَلَّقْتُمُ ٱلنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ","بِمَعْرُوفٍ أَوْ سَرِّحُوهُنَّ بِمَعْرُوفٍ ۚ وَلَا تُمْسِكُوهُنَّ","ضِرَارًا لِّتَعْتَدُوا۟ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَقَدْ ظَلَمَ","نَفْسَهُۥ ۚ وَلَا تَتَّخِذُوٓا۟ ءَايَـٰتِ ٱللَّهِ هُزُوًا ۚ وَٱذْكُرُوا۟","نِعْمَتَ ٱللَّهِ عَلَيْكُمْ وَمَآ أَنزَلَ عَلَيْكُم مِّنَ ٱلْكِتَـٰبِ","وَٱلْحِكْمَةِ يَعِظُكُم بِهِۦ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ","بِكُلِّ شَىْءٍ عَلِيمٌ ﴿٢٣١﴾"]],[364.6,68.65,13.0,19.0,"2:232",11.4,["وَإِذَا طَلَّقْتُمُ ٱلنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَلَا","تَعْضُلُوهُنَّ أَن يَنكِحْنَ أَزْوَٰجَهُنَّ إِذَا","تَرَٰضَوْا۟ بَيْنَهُم بِٱلْمَعْرُوفِ ۗ ذَٰلِكَ يُوعَظُ","بِهِۦ مَن كَانَ مِنكُمْ يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ","ٱلْـَٔاخِرِ ۗ ذَٰلِكُمْ أَزْكَىٰ لَكُمْ وَأَطْهَرُ ۗ وَٱللَّهُ","يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ ﴿٢٣٢﴾"]],[333.6,68.65,31.0,17.0,"2:233",9.55,["۞ وَٱلْوَٰلِدَٰتُ يُرْضِعْنَ أَوْلَـٰدَهُنَّ حَوْلَيْنِ كَامِلَيْنِ ۖ لِمَنْ أَرَادَ أَن يُتِمَّ ٱلرَّضَاعَةَ ۚ وَعَلَى ٱلْمَوْلُودِ لَهُۥ","رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِٱلْمَعْرُوفِ ۚ لَا تُكَلَّفُ نَفْسٌ إِلَّا وُسْعَهَا ۚ لَا تُضَآرَّ وَٰلِدَةٌۢ بِوَلَدِهَا وَلَا مَوْلُودٌ","لَّهُۥ بِوَلَدِهِۦ ۚ وَعَلَى ٱلْوَارِثِ مِثْلُ ذَٰلِكَ ۗ فَإِنْ أَرَادَا فِصَالًا عَن تَرَاضٍ مِّنْهُمَا وَتَشَاوُرٍ فَلَا جُنَاحَ","عَلَيْهِمَا ۗ وَإِنْ أَرَدتُّمْ أَن تَسْتَرْضِعُوٓا۟ أَوْلَـٰدَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ إِذَا سَلَّمْتُم مَّآ ءَاتَيْتُم بِٱلْمَعْرُوفِ ۗ","وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ ﴿٢٣٣﴾"]],[322.6,68.65,11.0,19.0,"2:234",11.4,["وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ","أَزْوَٰجًا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ","أَشْهُرٍ وَعَشْرًا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ","فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِىٓ","أَنفُسِهِنَّ بِٱلْمَعْرُوفِ ۗ وَٱللَّهُ بِمَا","تَعْمَلُونَ خَبِيرٌ ﴿٢٣٤﴾"]],[306.6,68.65,16.0,21.0,"2:235",13.25,["وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُم بِهِۦ مِنْ خِطْبَةِ","ٱلنِّسَآءِ أَوْ أَكْنَنتُمْ فِىٓ أَنفُسِكُمْ ۚ عَلِمَ ٱللَّهُ أَنَّكُمْ","سَتَذْكُرُونَهُنَّ وَلَـٰكِن لَّا تُوَاعِدُوهُنَّ سِرًّا إِلَّآ أَن","تَقُولُوا۟ قَوْلًا مَّعْرُوفًا ۚ وَلَا تَعْزِمُوا۟ عُقْدَةَ ٱلنِّكَاحِ","حَتَّىٰ يَبْلُغَ ٱلْكِتَـٰبُ أَجَلَهُۥ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ يَعْلَمُ","مَا فِىٓ أَنفُسِكُمْ فَٱحْذَرُوهُ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَفُورٌ","حَلِيمٌ ﴿٢٣٥﴾"]],[296.6,68.65,10.0,21.0,"2:236",13.25,["لَّا جُنَاحَ عَلَيْكُمْ إِن طَلَّقْتُمُ","ٱلنِّسَآءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ","تَفْرِضُوا۟ لَهُنَّ فَرِيضَةً ۚ","وَمَتِّعُوهُنَّ عَلَى ٱلْمُوسِعِ قَدَرُهُۥ","وَعَلَى ٱلْمُقْتِرِ قَدَرُهُۥ مَتَـٰعًۢا","بِٱلْمَعْرُوفِ ۖ حَقًّا عَلَى","ٱلْمُحْسِنِينَ ﴿٢٣٦﴾"]],[283.6,68.65,13.0,19.0,"2:237",11.4,["وَإِن طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ","وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةً فَنِصْفُ مَا","فَرَضْتُمْ إِلَّآ أَن يَعْفُونَ أَوْ يَعْفُوَا۟ ٱلَّذِى","بِيَدِهِۦ عُقْدَةُ ٱلنِّكَاحِ ۚ وَأَن تَعْفُوٓا۟ أَقْرَبُ","لِلتَّقْوَىٰ ۚ وَلَا تَنسَوُا۟ ٱلْفَضْلَ بَيْنَكُمْ ۚ إِنَّ","ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ ﴿٢٣٧﴾"]],[277.6,68.65,6.0,17.0,"2:238",9.55,["حَـٰفِظُوا۟ عَلَى","ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ","ٱلْوُسْطَىٰ وَقُومُوا۟","لِلَّهِ قَـٰنِتِينَ","﴿٢٣٨﴾"]],[271.6,68.65,6.0,21.0,"2:239",13.25,["فَإِنْ خِفْتُمْ","فَرِجَالًا أَوْ رُكْبَانًا ۖ","فَإِذَآ أَمِنتُمْ","فَٱذْكُرُوا۟ ٱللَّهَ كَمَا","عَلَّمَكُم مَّا لَمْ","تَكُونُوا۟ تَعْلَمُونَ","﴿٢٣٩﴾"]],[255.6,68.65,16.0,21.0,"2:245",5.85,["مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًا فَيُضَـٰعِفَهُۥ","لَهُۥٓ أَضْعَافًا كَثِيرَةً ۚ وَٱللَّهُ يَقْبِضُ وَيَبْصُۜطُ وَإِلَيْهِ","تُرْجَعُونَ ﴿٢٤٥﴾"]],[239.6,68.65,16.0,21.0,"2:246",13.25,["أَلَمْ تَرَ إِلَى ٱلْمَلَإِ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ مِنۢ بَعْدِ مُوسَىٰٓ","إِذْ قَالُوا۟ لِنَبِىٍّ لَّهُمُ ٱبْعَثْ لَنَا مَلِكًا نُّقَـٰتِلْ فِى سَبِيلِ","ٱللَّهِ ۖ قَالَ هَلْ عَسَيْتُمْ إِن كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ أَلَّا","تُقَـٰتِلُوا۟ ۖ قَالُوا۟ وَمَا لَنَآ أَلَّا نُقَـٰتِلَ فِى سَبِيلِ ٱللَّهِ","وَقَدْ أُخْرِجْنَا مِن دِيَـٰرِنَا وَأَبْنَآئِنَا ۖ فَلَمَّا كُتِبَ","عَلَيْهِمُ ٱلْقِتَالُ تَوَلَّوْا۟ إِلَّا قَلِيلًا مِّنْهُمْ ۗ وَٱللَّهُ عَلِيمٌۢ","بِٱلظَّـٰلِمِينَ ﴿٢٤٦﴾"]],[226.6,68.65,13.0,21.0,"2:247",13.25,["وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ ٱللَّهَ قَدْ بَعَثَ لَكُمْ","طَالُوتَ مَلِكًا ۚ قَالُوٓا۟ أَنَّىٰ يَكُونُ لَهُ ٱلْمُلْكُ","عَلَيْنَا وَنَحْنُ أَحَقُّ بِٱلْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ","سَعَةً مِّنَ ٱلْمَالِ ۚ قَالَ إِنَّ ٱللَّهَ ٱصْطَفَىٰهُ","عَلَيْكُمْ وَزَادَهُۥ بَسْطَةً فِى ٱلْعِلْمِ وَٱلْجِسْمِ ۖ","وَٱللَّهُ يُؤْتِى مُلْكَهُۥ مَن يَشَآءُ ۚ وَٱللَّهُ","وَٰسِعٌ عَلِيمٌ ﴿٢٤٧﴾"]],[205.6,68.65,21.0,14.0,"2:248",5.85,["وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ ءَايَةَ مُلْكِهِۦٓ أَن يَأْتِيَكُمُ ٱلتَّابُوتُ فِيهِ سَكِينَةٌ","مِّن رَّبِّكُمْ وَبَقِيَّةٌ مِّمَّا تَرَكَ ءَالُ مُوسَىٰ وَءَالُ هَـٰرُونَ تَحْمِلُهُ ٱلْمَلَـٰٓئِكَةُ","ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ﴿٢٤٨﴾"]],[394.6,89.65,31.0,16.0,"2:249",7.7,["فَلَمَّا فَصَلَ طَالُوتُ بِٱلْجُنُودِ قَالَ إِنَّ ٱللَّهَ مُبْتَلِيكُم بِنَهَرٍ فَمَن شَرِبَ مِنْهُ فَلَيْسَ مِنِّى وَمَن لَّمْ يَطْعَمْهُ","فَإِنَّهُۥ مِنِّىٓ إِلَّا مَنِ ٱغْتَرَفَ غُرْفَةًۢ بِيَدِهِۦ ۚ فَشَرِبُوا۟ مِنْهُ إِلَّا قَلِيلًا مِّنْهُمْ ۚ فَلَمَّا جَاوَزَهُۥ هُوَ وَٱلَّذِينَ","ءَامَنُوا۟ مَعَهُۥ قَالُوا۟ لَا طَاقَةَ لَنَا ٱلْيَوْمَ بِجَالُوتَ وَجُنُودِهِۦ ۚ قَالَ ٱلَّذِينَ يَظُنُّونَ أَنَّهُم مُّلَـٰقُوا۟ ٱللَّهِ كَم","مِّن فِئَةٍ قَلِيلَةٍ غَلَبَتْ فِئَةً كَثِيرَةًۢ بِإِذْنِ ٱللَّهِ ۗ وَٱللَّهُ مَعَ ٱلصَّـٰبِرِينَ ﴿٢٤٩﴾"]],[381.6,89.65,13.0,21.0,"2:250",5.85,["وَلَمَّا بَرَزُوا۟ لِجَالُوتَ وَجُنُودِهِۦ قَالُوا۟ رَبَّنَآ","أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا","عَلَى ٱلْقَوْمِ ٱلْكَـٰفِرِينَ ﴿٢٥٠﴾"]],[365.6,89.65,16.0,16.0,"2:251",7.7,["فَهَزَمُوهُم بِإِذْنِ ٱللَّهِ وَقَتَلَ دَاوُۥدُ جَالُوتَ وَءَاتَىٰهُ","ٱللَّهُ ٱلْمُلْكَ وَٱلْحِكْمَةَ وَعَلَّمَهُۥ مِمَّا يَشَآءُ ۗ وَلَوْلَا دَفْعُ","ٱللَّهِ ٱلنَّاسَ بَعْضَهُم بِبَعْضٍ لَّفَسَدَتِ ٱلْأَرْضُ","وَلَـٰكِنَّ ٱللَّهَ ذُو فَضْلٍ عَلَى ٱلْعَـٰلَمِينَ ﴿٢٥١﴾"]],[354.6,89.65,11.0,17.0,"2:254",9.55,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِمَّا","رَزَقْنَـٰكُم مِّن قَبْلِ أَن يَأْتِىَ يَوْمٌ لَّا","بَيْعٌ فِيهِ وَلَا خُلَّةٌ وَلَا شَفَـٰعَةٌ ۗ","وَٱلْكَـٰفِرُونَ هُمُ ٱلظَّـٰلِمُونَ","﴿٢٥٤﴾"]],[328.6,89.65,26.0,16.0,"2:255",7.7,["ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ","وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا","خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ","وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ ﴿٢٥٥﴾"]],[312.6,89.65,16.0,16.0,"2:256",7.7,["لَآ إِكْرَاهَ فِى ٱلدِّينِ ۖ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ ۚ","فَمَن يَكْفُرْ بِٱلطَّـٰغُوتِ وَيُؤْمِنۢ بِٱللَّهِ فَقَدِ ٱسْتَمْسَكَ","بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ لَا ٱنفِصَامَ لَهَا ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ","﴿٢٥٦﴾"]],[299.6,89.65,13.0,21.0,"2:258",13.25,["أَلَمْ تَرَ إِلَى ٱلَّذِى حَآجَّ إِبْرَٰهِـۧمَ فِى رَبِّهِۦٓ","أَنْ ءَاتَىٰهُ ٱللَّهُ ٱلْمُلْكَ إِذْ قَالَ إِبْرَٰهِـۧمُ","رَبِّىَ ٱلَّذِى يُحْىِۦ وَيُمِيتُ قَالَ أَنَا۠ أُحْىِۦ","وَأُمِيتُ ۖ قَالَ إِبْرَٰهِـۧمُ فَإِنَّ ٱللَّهَ يَأْتِى","بِٱلشَّمْسِ مِنَ ٱلْمَشْرِقِ فَأْتِ بِهَا مِنَ","ٱلْمَغْرِبِ فَبُهِتَ ٱلَّذِى كَفَرَ ۗ وَٱللَّهُ لَا","يَهْدِى ٱلْقَوْمَ ٱلظَّـٰلِمِينَ ﴿٢٥٨﴾"]],[258.6,89.65,41.0,16.0,"2:259",7.7,["أَوْ كَٱلَّذِى مَرَّ عَلَىٰ قَرْيَةٍ وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْىِۦ هَـٰذِهِ ٱللَّهُ بَعْدَ مَوْتِهَا ۖ فَأَمَاتَهُ ٱللَّهُ مِا۟ئَةَ عَامٍ ثُمَّ بَعَثَهُۥ ۖ قَالَ كَمْ","لَبِثْتَ ۖ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍ ۖ قَالَ بَل لَّبِثْتَ مِا۟ئَةَ عَامٍ فَٱنظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۖ وَٱنظُرْ إِلَىٰ حِمَارِكَ","وَلِنَجْعَلَكَ ءَايَةً لِّلنَّاسِ ۖ وَٱنظُرْ إِلَى ٱلْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًا ۚ فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ","﴿٢٥٩﴾"]],[232.6,89.65,26.0,16.0,"2:260",7.7,["وَإِذْ قَالَ إِبْرَٰهِـۧمُ رَبِّ أَرِنِى كَيْفَ تُحْىِ ٱلْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِن ۖ قَالَ بَلَىٰ","وَلَـٰكِن لِّيَطْمَئِنَّ قَلْبِى ۖ قَالَ فَخُذْ أَرْبَعَةً مِّنَ ٱلطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ ٱجْعَلْ عَلَىٰ","كُلِّ جَبَلٍ مِّنْهُنَّ جُزْءًا ثُمَّ ٱدْعُهُنَّ يَأْتِينَكَ سَعْيًا ۚ وَٱعْلَمْ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ","﴿٢٦٠﴾"]],[222.6,89.65,10.0,19.0,"2:261",11.4,["مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى","سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتْ","سَبْعَ سَنَابِلَ فِى كُلِّ سُنۢبُلَةٍ","مِّا۟ئَةُ حَبَّةٍ ۗ وَٱللَّهُ يُضَـٰعِفُ لِمَن","يَشَآءُ ۗ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","﴿٢٦١﴾"]],[216.6,89.65,6.0,17.0,"2:263",9.55,["۞ قَوْلٌ مَّعْرُوفٌ","وَمَغْفِرَةٌ خَيْرٌ مِّن","صَدَقَةٍ يَتْبَعُهَآ","أَذًى ۗ وَٱللَّهُ غَنِىٌّ","حَلِيمٌ ﴿٢٦٣﴾"]],[200.6,89.65,16.0,19.0,"2:264",11.4,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُبْطِلُوا۟ صَدَقَـٰتِكُم بِٱلْمَنِّ","وَٱلْأَذَىٰ كَٱلَّذِى يُنفِقُ مَالَهُۥ رِئَآءَ ٱلنَّاسِ وَلَا","يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ ۖ فَمَثَلُهُۥ كَمَثَلِ صَفْوَانٍ","عَلَيْهِ تُرَابٌ فَأَصَابَهُۥ وَابِلٌ فَتَرَكَهُۥ صَلْدًا ۖ لَّا","يَقْدِرُونَ عَلَىٰ شَىْءٍ مِّمَّا كَسَبُوا۟ ۗ وَٱللَّهُ لَا يَهْدِى","ٱلْقَوْمَ ٱلْكَـٰفِرِينَ ﴿٢٦٤﴾"]],[414.6,110.65,11.0,19.0,"2:265",11.4,["وَمَثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمُ","ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ وَتَثْبِيتًا مِّنْ","أَنفُسِهِمْ كَمَثَلِ جَنَّةٍۭ بِرَبْوَةٍ أَصَابَهَا","وَابِلٌ فَـَٔاتَتْ أُكُلَهَا ضِعْفَيْنِ فَإِن","لَّمْ يُصِبْهَا وَابِلٌ فَطَلٌّ ۗ وَٱللَّهُ بِمَا","تَعْمَلُونَ بَصِيرٌ ﴿٢٦٥﴾"]],[393.6,110.65,21.0,16.0,"2:266",7.7,["أَيَوَدُّ أَحَدُكُمْ أَن تَكُونَ لَهُۥ جَنَّةٌ مِّن نَّخِيلٍ وَأَعْنَابٍ تَجْرِى مِن","تَحْتِهَا ٱلْأَنْهَـٰرُ لَهُۥ فِيهَا مِن كُلِّ ٱلثَّمَرَٰتِ وَأَصَابَهُ ٱلْكِبَرُ وَلَهُۥ ذُرِّيَّةٌ","ضُعَفَآءُ فَأَصَابَهَآ إِعْصَارٌ فِيهِ نَارٌ فَٱحْتَرَقَتْ ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ","لَكُمُ ٱلْـَٔايَـٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ ﴿٢٦٦﴾"]],[377.6,110.65,16.0,17.0,"2:267",9.55,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِن طَيِّبَـٰتِ مَا كَسَبْتُمْ","وَمِمَّآ أَخْرَجْنَا لَكُم مِّنَ ٱلْأَرْضِ ۖ وَلَا تَيَمَّمُوا۟","ٱلْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِـَٔاخِذِيهِ إِلَّآ أَن","تُغْمِضُوا۟ فِيهِ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ","﴿٢٦٧﴾"]],[371.6,110.65,6.0,21.0,"2:268",13.25,["ٱلشَّيْطَـٰنُ يَعِدُكُمُ","ٱلْفَقْرَ وَيَأْمُرُكُم","بِٱلْفَحْشَآءِ ۖ وَٱللَّهُ","يَعِدُكُم مَّغْفِرَةً مِّنْهُ","وَفَضْلًا ۗ وَٱللَّهُ","وَٰسِعٌ عَلِيمٌ","﴿٢٦٨﴾"]],[361.6,110.65,10.0,17.0,"2:271",9.55,["إِن تُبْدُوا۟ ٱلصَّدَقَـٰتِ فَنِعِمَّا","هِىَ ۖ وَإِن تُخْفُوهَا وَتُؤْتُوهَا","ٱلْفُقَرَآءَ فَهُوَ خَيْرٌ لَّكُمْ ۚ وَيُكَفِّرُ","عَنكُم مِّن سَيِّـَٔاتِكُمْ ۗ وَٱللَّهُ بِمَا","تَعْمَلُونَ خَبِيرٌ ﴿٢٧١﴾"]],[350.6,110.65,11.0,21.0,"2:273",13.25,["لِلْفُقَرَآءِ ٱلَّذِينَ أُحْصِرُوا۟ فِى سَبِيلِ","ٱللَّهِ لَا يَسْتَطِيعُونَ ضَرْبًا فِى","ٱلْأَرْضِ يَحْسَبُهُمُ ٱلْجَاهِلُ أَغْنِيَآءَ","مِنَ ٱلتَّعَفُّفِ تَعْرِفُهُم بِسِيمَـٰهُمْ لَا","يَسْـَٔلُونَ ٱلنَّاسَ إِلْحَافًا ۗ وَمَا تُنفِقُوا۟","مِنْ خَيْرٍ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ","﴿٢٧٣﴾"]],[334.6,110.65,16.0,21.0,"2:275",13.25,["ٱلَّذِينَ يَأْكُلُونَ ٱلرِّبَوٰا۟ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ","ٱلَّذِى يَتَخَبَّطُهُ ٱلشَّيْطَـٰنُ مِنَ ٱلْمَسِّ ۚ ذَٰلِكَ بِأَنَّهُمْ","قَالُوٓا۟ إِنَّمَا ٱلْبَيْعُ مِثْلُ ٱلرِّبَوٰا۟ ۗ وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ","وَحَرَّمَ ٱلرِّبَوٰا۟ ۚ فَمَن جَآءَهُۥ مَوْعِظَةٌ مِّن رَّبِّهِۦ","فَٱنتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى ٱللَّهِ ۖ وَمَنْ عَادَ","فَأُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَـٰلِدُونَ","﴿٢٧٥﴾"]],[328.6,110.65,6.0,17.0,"2:276",9.55,["يَمْحَقُ ٱللَّهُ ٱلرِّبَوٰا۟","وَيُرْبِى ٱلصَّدَقَـٰتِ","ۗ وَٱللَّهُ لَا يُحِبُّ","كُلَّ كَفَّارٍ أَثِيمٍ","﴿٢٧٦﴾"]],[321.6,110.65,7.0,21.0,"2:279",13.25,["فَإِن لَّمْ تَفْعَلُوا۟","فَأْذَنُوا۟ بِحَرْبٍ مِّنَ","ٱللَّهِ وَرَسُولِهِۦ ۖ وَإِن","تُبْتُمْ فَلَكُمْ رُءُوسُ","أَمْوَٰلِكُمْ لَا تَظْلِمُونَ","وَلَا تُظْلَمُونَ","﴿٢٧٩﴾"]],[281.6,110.65,40.0,21.0,"2:282",13.25,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍ مُّسَمًّى فَٱكْتُبُوهُ ۚ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌۢ بِٱلْعَدْلِ ۚ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ","كَمَا عَلَّمَهُ ٱللَّهُ ۚ فَلْيَكْتُبْ وَلْيُمْلِلِ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًٔا ۚ فَإِن كَانَ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ","ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ ۚ وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ ۖ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌ","وَٱمْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَآءِ أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا ٱلْأُخْرَىٰ ۚ وَلَا يَأْبَ ٱلشُّهَدَآءُ إِذَا مَا دُعُوا۟ ۚ وَلَا","تَسْـَٔمُوٓا۟ أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰٓ أَجَلِهِۦ ۚ ذَٰلِكُمْ أَقْسَطُ عِندَ ٱللَّهِ وَأَقْوَمُ لِلشَّهَـٰدَةِ وَأَدْنَىٰٓ أَلَّا تَرْتَابُوٓا۟ ۖ إِلَّآ أَن تَكُونَ","تِجَـٰرَةً حَاضِرَةً تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا ۗ وَأَشْهِدُوٓا۟ إِذَا تَبَايَعْتُمْ ۚ وَلَا يُضَآرَّ كَاتِبٌ وَلَا شَهِيدٌ ۚ وَإِن","تَفْعَلُوا۟ فَإِنَّهُۥ فُسُوقٌۢ بِكُمْ ۗ وَٱتَّقُوا۟ ٱللَّهَ ۖ وَيُعَلِّمُكُمُ ٱللَّهُ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌ ﴿٢٨٢﴾"]],[268.6,110.65,13.0,19.0,"2:283",11.4,["۞ وَإِن كُنتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا۟","كَاتِبًا فَرِهَـٰنٌ مَّقْبُوضَةٌ ۖ فَإِنْ أَمِنَ بَعْضُكُم","بَعْضًا فَلْيُؤَدِّ ٱلَّذِى ٱؤْتُمِنَ أَمَـٰنَتَهُۥ وَلْيَتَّقِ","ٱللَّهَ رَبَّهُۥ ۗ وَلَا تَكْتُمُوا۟ ٱلشَّهَـٰدَةَ ۚ وَمَن","يَكْتُمْهَا فَإِنَّهُۥٓ ءَاثِمٌ قَلْبُهُۥ ۗ وَٱللَّهُ بِمَا","تَعْمَلُونَ عَلِيمٌ ﴿٢٨٣﴾"]],[252.6,110.65,16.0,19.0,"2:286",11.4,["لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ","وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ","أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُۥ","عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ","لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ","مَوْلَى 11.4,["هُنَالِكَ دَعَا زَكَرِيَّا","رَبَّهُۥ ۖ قَالَ رَبِّ","هَبْ لِى مِن","لَّدُنكَ ذُرِّيَّةً طَيِّبَةً","ۖ إِنَّكَ سَمِيعُ","ٱلدُّعَآءِ ﴿٣٨﴾"]],[161.4,30.65,6.0,25.0,"3:39",16.95,["فَنَادَتْهُ ٱلْمَلَـٰٓئِكَةُ","وَهُوَ قَآئِمٌ يُصَلِّى","فِى ٱلْمِحْرَابِ أَنَّ","ٱللَّهَ يُبَشِّرُكَ بِيَحْيَىٰ","مُصَدِّقًۢا بِكَلِمَةٍ مِّنَ","ٱللَّهِ وَسَيِّدًا","وَحَصُورًا وَنَبِيًّا","مِّنَ ٱلصَّـٰلِحِينَ","﴿٣٩﴾"]],[151.4,30.65,10.0,23.0,"3:40",7.7,["قَالَ رَبِّ أَنَّىٰ يَكُونُ لِى غُلَـٰمٌ","وَقَدْ بَلَغَنِىَ ٱلْكِبَرُ وَٱمْرَأَتِى","عَاقِرٌ ۖ قَالَ كَذَٰلِكَ ٱللَّهُ يَفْعَلُ","مَا يَشَآءُ ﴿٤٠﴾"]],[163.4,55.65,10.0,25.0,"3:41",9.55,["قَالَ رَبِّ ٱجْعَل لِّىٓ ءَايَةً ۖ قَالَ","ءَايَتُكَ أَلَّا تُكَلِّمَ ٱلنَّاسَ ثَلَـٰثَةَ","أَيَّامٍ إِلَّا رَمْزًا ۗ وَٱذْكُر رَّبَّكَ","كَثِيرًا وَسَبِّحْ بِٱلْعَشِىِّ","وَٱلْإِبْكَـٰرِ ﴿٤١﴾"]],[152.4,55.65,11.0,25.0,"3:44",9.55,["ذَٰلِكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهِ","إِلَيْكَ ۚ وَمَا كُنتَ لَدَيْهِمْ إِذْ يُلْقُونَ","أَقْلَـٰمَهُمْ أَيُّهُمْ يَكْفُلُ مَرْيَمَ وَمَا","كُنتَ لَدَيْهِمْ إِذْ يَخْتَصِمُونَ","﴿٤٤﴾"]],[146.4,55.65,6.0,23.0,"3:45",15.1,["إِذْ قَالَتِ ٱلْمَلَـٰٓئِكَةُ","يَـٰمَرْيَمُ إِنَّ ٱللَّهَ","يُبَشِّرُكِ بِكَلِمَةٍ مِّنْهُ","ٱسْمُهُ ٱلْمَسِيحُ","عِيسَى ٱبْنُ مَرْيَمَ","وَجِيهًا فِى ٱلدُّنْيَا","وَٱلْـَٔاخِرَةِ وَمِنَ","ٱلْمُقَرَّبِينَ ﴿٤٥﴾"]],[167.4,80.65,6.0,16.0,"3:46",7.7,["وَيُكَلِّمُ ٱلنَّاسَ فِى","ٱلْمَهْدِ وَكَهْلًا","وَمِنَ ٱلصَّـٰلِحِينَ","﴿٤٦﴾"]],[148.4,80.65,19.0,25.0,"3:49",9.55,["وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ ۖ","أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ","طَيْرًۢا بِإِذْنِ ٱللَّهِ ۖ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ","بِإِذْنِ ٱللَّهِ ۖ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ ۚ إِنَّ","فِى ذَٰلِكَ لَـَٔايَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ﴿٤٩﴾"]],[163.4,105.65,10.0,25.0,"3:52",9.55,["۞ فَلَمَّآ أَحَسَّ عِيسَىٰ مِنْهُمُ","ٱلْكُفْرَ قَالَ مَنْ أَنصَارِىٓ إِلَى","ٱللَّهِ ۖ قَالَ ٱلْحَوَارِيُّونَ نَحْنُ","أَنصَارُ ٱللَّهِ ءَامَنَّا بِٱللَّهِ وَٱشْهَدْ","بِأَنَّا مُسْلِمُونَ ﴿٥٢﴾"]],[157.4,105.65,6.0,14.0,"3:54",5.85,["وَمَكَرُوا۟ وَمَكَرَ ٱللَّهُ ۖ","وَٱللَّهُ خَيْرُ","ٱلْمَـٰكِرِينَ ﴿٥٤﴾"]],[150.4,105.65,7.0,25.0,"3:61",16.95,["فَمَنْ حَآجَّكَ فِيهِ مِنۢ","بَعْدِ مَا جَآءَكَ مِنَ","ٱلْعِلْمِ فَقُلْ تَعَالَوْا۟ نَدْعُ","أَبْنَآءَنَا وَأَبْنَآءَكُمْ","وَنِسَآءَنَا وَنِسَآءَكُمْ","وَأَنفُسَنَا وَأَنفُسَكُمْ ثُمَّ","نَبْتَهِلْ فَنَجْعَل لَّعْنَتَ","ٱللَّهِ عَلَى ٱلْكَـٰذِبِينَ","﴿٦١﴾"]],[133.1,5.65,11.0,21.0,"3:75",13.25,["۞ وَمِنْ أَهْلِ ٱلْكِتَـٰبِ مَنْ إِن","تَأْمَنْهُ بِقِنطَارٍ يُؤَدِّهِۦٓ إِلَيْكَ وَمِنْهُم","مَّنْ إِن تَأْمَنْهُ بِدِينَارٍ لَّا يُؤَدِّهِۦٓ","إِلَيْكَ إِلَّا مَا دُمْتَ عَلَيْهِ قَآئِمًا ۗ","ذَٰلِكَ بِأَنَّهُمْ قَالُوا۟ لَيْسَ عَلَيْنَا فِى","ٱلْأُمِّيِّـۧنَ سَبِيلٌ وَيَقُولُونَ عَلَى ٱللَّهِ","ٱلْكَذِبَ وَهُمْ يَعْلَمُونَ ﴿٧٥﴾"]],[122.1,5.65,11.0,19.0,"3:78",11.4,["وَإِنَّ مِنْهُمْ لَفَرِيقًا يَلْوُۥنَ أَلْسِنَتَهُم","بِٱلْكِتَـٰبِ لِتَحْسَبُوهُ مِنَ ٱلْكِتَـٰبِ","وَمَا هُوَ مِنَ ٱلْكِتَـٰبِ وَيَقُولُونَ","هُوَ مِنْ عِندِ ٱللَّهِ وَمَا هُوَ مِنْ عِندِ","ٱللَّهِ وَيَقُولُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ","وَهُمْ يَعْلَمُونَ ﴿٧٨﴾"]],[134.1,26.65,10.0,21.0,"3:79",13.25,["مَا كَانَ لِبَشَرٍ أَن يُؤْتِيَهُ ٱللَّهُ","ٱلْكِتَـٰبَ وَٱلْحُكْمَ وَٱلنُّبُوَّةَ ثُمَّ","يَقُولَ لِلنَّاسِ كُونُوا۟ عِبَادًا لِّى","مِن دُونِ ٱللَّهِ وَلَـٰكِن كُونُوا۟","رَبَّـٰنِيِّـۧنَ بِمَا كُنتُمْ تُعَلِّمُونَ","ٱلْكِتَـٰبَ وَبِمَا كُنتُمْ تَدْرُسُونَ","﴿٧٩﴾"]],[128.1,26.65,6.0,25.0,"3:96",9.55,["إِنَّ أَوَّلَ بَيْتٍ","وُضِعَ لِلنَّاسِ","لَلَّذِى بِبَكَّةَ مُبَارَكًا","وَهُدًى لِّلْعَـٰلَمِينَ","﴿٩٦﴾"]],[122.1,26.65,6.0,25.0,"3:99",16.95,["قُلْ يَـٰٓأَهْلَ","ٱلْكِتَـٰبِ لِمَ","تَصُدُّونَ عَن","سَبِيلِ ٱللَّهِ مَنْ","ءَامَنَ تَبْغُونَهَا","عِوَجًا وَأَنتُمْ","شُهَدَآءُ ۗ وَمَا ٱللَّهُ","بِغَـٰفِلٍ عَمَّا","تَعْمَلُونَ ﴿٩٩﴾"]],[116.1,26.65,6.0,23.0,"3:101",15.1,["وَكَيْفَ تَكْفُرُونَ","وَأَنتُمْ تُتْلَىٰ عَلَيْكُمْ","ءَايَـٰتُ "ذَٰلِكُمْ أَن تَبْتَغُوا۟ بِأَمْوَٰلِكُم مُّحْصِنِينَ غَيْرَ مُسَـٰفِحِينَ","ۚ فَمَا ٱسْتَمْتَعْتُم بِهِۦ مِنْهُنَّ فَـَٔاتُوهُنَّ أُجُورَهُنَّ","فَرِيضَةً ۚ وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا تَرَٰضَيْتُم بِهِۦ مِنۢ","بَعْدِ ٱلْفَرِيضَةِ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًا","﴿٢٤﴾"]],[671.7,161.65,22.0,21.0,"4:25",13.25,["وَمَن لَّمْ يَسْتَطِعْ مِنكُمْ طَوْلًا أَن يَنكِحَ ٱلْمُحْصَنَـٰتِ ٱلْمُؤْمِنَـٰتِ فَمِن","مَّا مَلَكَتْ أَيْمَـٰنُكُم مِّن فَتَيَـٰتِكُمُ ٱلْمُؤْمِنَـٰتِ ۚ وَٱللَّهُ أَعْلَمُ بِإِيمَـٰنِكُم ۚ","بَعْضُكُم مِّنۢ بَعْضٍ ۚ فَٱنكِحُوهُنَّ بِإِذْنِ أَهْلِهِنَّ وَءَاتُوهُنَّ أُجُورَهُنَّ","بِٱلْمَعْرُوفِ مُحْصَنَـٰتٍ غَيْرَ مُسَـٰفِحَـٰتٍ وَلَا مُتَّخِذَٰتِ أَخْدَانٍ ۚ فَإِذَآ","أُحْصِنَّ فَإِنْ أَتَيْنَ بِفَـٰحِشَةٍ فَعَلَيْهِنَّ نِصْفُ مَا عَلَى ٱلْمُحْصَنَـٰتِ مِنَ","ٱلْعَذَابِ ۚ ذَٰلِكَ لِمَنْ خَشِىَ ٱلْعَنَتَ مِنكُمْ ۚ وَأَن تَصْبِرُوا۟ خَيْرٌ لَّكُمْ ۗ","وَٱللَّهُ غَفُورٌ رَّحِيمٌ ﴿٢٥﴾"]],[703.7,182.65,6.0,19.0,"4:27",11.4,["وَٱللَّهُ يُرِيدُ أَن","يَتُوبَ عَلَيْكُمْ","وَيُرِيدُ ٱلَّذِينَ","يَتَّبِعُونَ ٱلشَّهَوَٰتِ","أَن تَمِيلُوا۟ مَيْلًا","عَظِيمًا ﴿٢٧﴾"]],[697.7,182.65,6.0,19.0,"4:30",11.4,["وَمَن يَفْعَلْ ذَٰلِكَ","عُدْوَٰنًا وَظُلْمًا","فَسَوْفَ نُصْلِيهِ","نَارًا ۚ وَكَانَ ذَٰلِكَ","عَلَى ٱللَّهِ يَسِيرًا","﴿٣٠﴾"]],[691.7,182.65,6.0,19.0,"4:31",11.4,["إِن تَجْتَنِبُوا۟ كَبَآئِرَ","مَا تُنْهَوْنَ عَنْهُ","نُكَفِّرْ عَنكُمْ","سَيِّـَٔاتِكُمْ","وَنُدْخِلْكُم مُّدْخَلًا","كَرِيمًا ﴿٣١﴾"]],[681.7,182.65,10.0,17.0,"4:35",9.55,["وَإِنْ خِفْتُمْ شِقَاقَ بَيْنِهِمَا","فَٱبْعَثُوا۟ حَكَمًا مِّنْ أَهْلِهِۦ وَحَكَمًا","مِّنْ أَهْلِهَآ إِن يُرِيدَآ إِصْلَـٰحًا","يُوَفِّقِ ٱللَّهُ بَيْنَهُمَآ ۗ إِنَّ ٱللَّهَ كَانَ","عَلِيمًا خَبِيرًا ﴿٣٥﴾"]],[661.4,140.65,10.0,32.0,"4:36",16.95,["۞ وَٱعْبُدُوا۟ ٱللَّهَ وَلَا تُشْرِكُوا۟","بِهِۦ شَيْـًٔا ۖ وَبِٱلْوَٰلِدَيْنِ إِحْسَـٰنًا","وَبِذِى ٱلْقُرْبَىٰ وَٱلْيَتَـٰمَىٰ","وَٱلْمَسَـٰكِينِ وَٱلْجَارِ ذِى","ٱلْقُرْبَىٰ وَٱلْجَارِ ٱلْجُنُبِ","وَٱلصَّاحِبِ بِٱلْجَنۢبِ وَٱبْنِ","ٱلسَّبِيلِ وَمَا مَلَكَتْ أَيْمَـٰنُكُ لَيَقُولَنَّ كَأَن","لَّمْ تَكُنۢ بَيْنَكُمْ","وَبَيْنَهُۥ مَوَدَّةٌ يَـٰلَيْتَنِى","كُنتُ مَعَهُمْ فَأَفُوزَ","فَوْزًا عَظِيمًا","﴿٧٣﴾"]],[670.3,207.65,21.0,16.0,"4:78",7.7,["أَيْنَمَا تَكُونُوا۟ يُدْرِككُّمُ ٱلْمَوْتُ وَلَوْ كُنتُمْ فِى بُرُوجٍ مُّشَيَّدَةٍ ۗ وَإِن","تُصِبْهُمْ حَسَنَةٌ يَقُولُوا۟ هَـٰذِهِۦ مِنْ عِندِ ٱللَّهِ ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌ","يَقُولُوا۟ هَـٰذِهِۦ مِنْ عِندِكَ ۚ قُلْ كُلٌّ مِّنْ عِندِ ٱللَّهِ ۖ فَمَالِ هَـٰٓؤُلَآءِ","ٱلْقَوْمِ لَا يَكَادُونَ يَفْقَهُونَ حَدِيثًا ﴿٧٨﴾"]],[736.3,228.65,11.0,21.0,"4:83",13.25,["وَإِذَا جَآءَهُمْ أَمْرٌ مِّنَ ٱلْأَمْنِ أَوِ","ٱلْخَوْفِ أَذَاعُوا۟ بِهِۦ ۖ وَلَوْ رَدُّوهُ","إِلَى ٱلرَّسُولِ وَإِلَىٰٓ أُو۟لِى ٱلْأَمْرِ","مِنْهُمْ لَعَلِمَهُ ٱلَّذِينَ يَسْتَنۢبِطُونَهُۥ مِنْهُمْ","ۗ وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ","وَرَحْمَتُهُۥ لَٱتَّبَعْتُمُ ٱلشَّيْطَـٰنَ إِلَّا","قَلِيلًا ﴿٨٣﴾"]],[726.3,228.65,10.0,19.0,"4:84",11.4,["فَقَـٰتِلْ فِى سَبِيلِ ٱللَّهِ لَا","تُكَلَّفُ إِلَّا نَفْسَكَ ۚ وَحَرِّضِ","ٱلْمُؤْمِنِينَ ۖ عَسَى ٱللَّهُ أَن يَكُفَّ","بَأْسَ ٱلَّذِينَ كَفَرُوا۟ ۚ وَٱللَّهُ","أَشَدُّ بَأْسًا وَأَشَدُّ تَنكِيلًا","﴿٨٤﴾"]],[719.3,228.65,7.0,21.0,"4:85",13.25,["مَّن يَشْفَعْ شَفَـٰعَةً","حَسَنَةً يَكُن لَّهُۥ","نَصِيبٌ مِّنْهَا ۖ وَمَن","يَشْفَعْ شَفَـٰعَةً سَيِّئَةً","يَكُن لَّهُۥ كِفْلٌ مِّنْهَا ۗ","وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ","شَىْءٍ مُّقِيتًا ﴿٨٥﴾"]],[712.3,228.65,7.0,21.0,"4:88",13.25,["۞ فَمَا لَكُمْ فِى","ٱلْمُنَـٰفِقِينَ فِئَتَيْنِ وَٱللَّهُ","أَرْكَسَهُم بِمَا كَسَبُوٓا۟ ۚ","أَتُرِيدُونَ أَن تَهْدُوا۟","مَنْ أَضَلَّ ٱللَّهُ ۖ وَمَن","يُضْلِلِ ٱللَّهُ فَلَن تَجِدَ","لَهُۥ سَبِيلًا ﴿٨٨﴾"]],[693.3,228.65,19.0,21.0,"4:92",13.25,["وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِنًا إِلَّا خَطَـًٔا ۚ وَمَن قَتَلَ","مُؤْمِنًا خَطَـًٔا فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَدِيَةٌ مُّسَلَّمَةٌ إِلَىٰٓ أَهْلِهِۦٓ","إِلَّآ أَن يَصَّدَّقُوا۟ ۚ فَإِن كَانَ مِن قَوْمٍ عَدُوٍّ لَّكُمْ وَهُوَ مُؤْمِنٌ","فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ ۖ وَإِن كَانَ مِن قَوْمٍۭ بَيْنَكُمْ وَبَيْنَهُم","مِّيثَـٰقٌ فَدِيَةٌ مُّسَلَّمَةٌ إِلَىٰٓ أَهْلِهِۦ وَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ ۖ فَمَن لَّمْ","يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةً مِّنَ ٱللَّهِ ۗ وَكَانَ ٱللَّهُ عَلِيمًا","حَكِيمًا ﴿٩٢﴾"]],[687.3,228.65,6.0,21.0,"4:93",13.25,["وَمَن يَقْتُلْ مُؤْمِنًا","مُّتَعَمِّدًا فَجَزَآؤُهُۥ","جَهَنَّمُ خَـٰلِدًا فِيهَا","وَغَضِبَ ٱللَّهُ عَلَيْهِ","وَلَعَنَهُۥ وَأَعَدَّ لَهُۥ","عَذَابًا عَظِيمًا","﴿٩٣﴾"]],[674.3,228.65,13.0,21.0,"4:94",13.25,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا ضَرَبْتُمْ فِى سَبِيلِ","ٱللَّهِ فَتَبَيَّنُوا۟ وَلَا تَقُولُوا۟ لِمَنْ أَلْقَىٰٓ إِلَيْكُمُ","ٱلسَّلَـٰمَ لَسْتَ مُؤْمِنًا تَبْتَغُونَ عَرَضَ","ٱلْحَيَوٰةِ ٱلدُّنْيَا فَعِندَ ٱللَّهِ مَغَانِمُ كَثِيرَةٌ ۚ","كَذَٰلِكَ كُنتُم مِّن قَبْلُ فَمَنَّ ٱللَّهُ عَلَيْكُمْ","فَتَبَيَّنُوٓا۟ ۚ إِنَّ ٱللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا","﴿٩٤﴾"]],[663.3,228.65,11.0,19.0,"4:100",11.4,["۞ وَمَن يُهَاجِرْ فِى سَبِيلِ ٱللَّهِ يَجِدْ","فِى ٱلْأَرْضِ مُرَٰغَمًا كَثِيرًا وَسَعَةً ۚ","وَمَن يَخْرُجْ مِنۢ بَيْتِهِۦ مُهَاجِرًا إِلَى","ٱللَّهِ وَرَسُولِهِۦ ثُمَّ يُدْرِكْهُ ٱلْمَوْتُ","فَقَدْ وَقَعَ أَجْرُهُۥ عَلَى ٱللَّهِ ۗ وَكَانَ","ٱللَّهُ غَفُورًا رَّحِيمًا ﴿١٠٠﴾"]],[737.3,249.65,10.0,19.0,"4:101",11.4,["وَإِذَا ضَرَبْتُمْ فِى ٱلْأَرْضِ","فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَن","تَقْصُرُوا۟ مِنَ ٱلصَّلَوٰةِ إِنْ خِفْتُمْ","أَن يَفْتِنَكُمُ ٱلَّذِينَ كَفَرُوٓا۟ ۚ إِنَّ","ٱلْكَـٰفِرِينَ كَانُوا۟ لَكُمْ عَدُوًّا","مُّبِينًا ﴿١٠١﴾"]],[715.3,249.65,22.0,21.0,"4:102",13.25,["وَإِذَا كُنتَ فِيهِمْ فَأَقَمْتَ لَهُمُ ٱلصَّلَوٰةَ فَلْتَقُمْ طَآئِفَةٌ مِّنْهُم مَّعَكَ","وَلْيَأْخُذُوٓا۟ أَسْلِحَتَهُمْ فَإِذَا سَجَدُوا۟ فَلْيَكُونُوا۟ مِن وَرَآئِكُمْ وَلْتَأْتِ طَآئِفَةٌ","أُخْرَىٰ لَمْ يُصَلُّوا۟ فَلْيُصَلُّوا۟ مَعَكَ وَلْيَأْخُذُوا۟ حِذْرَهُمْ وَأَسْلِحَتَهُمْ ۗ وَدَّ","ٱلَّذِينَ كَفَرُوا۟ لَوْ تَغْفُلُونَ عَنْ أَسْلِحَتِكُمْ وَأَمْتِعَتِكُمْ فَيَمِيلُونَ عَلَيْكُم","مَّيْلَةً وَٰحِدَةً ۚ وَلَا جُنَاحَ عَلَيْكُمْ إِن كَانَ بِكُمْ أَذًى مِّن مَّطَرٍ أَوْ","كُنتُم مَّرْضَىٰٓ أَن تَضَعُوٓا۟ أَسْلِحَتَكُمْ ۖ وَخُذُوا۟ حِذْرَكُمْ ۗ إِنَّ ٱللَّهَ أَعَدَّ","لِلْكَـٰفِرِينَ عَذَابًا مُّهِينًا ﴿١٠٢﴾"]],[709.3,249.65,6.0,19.0,"4:112",11.4,["وَمَن يَكْسِبْ","خَطِيٓـَٔةً أَوْ إِثْمًا ثُمَّ","يَرْمِ بِهِۦ بَرِيٓـًٔا فَقَدِ","ٱحْتَمَلَ بُهْتَـٰنًا","وَإِثْمًا مُّبِينًا","﴿١١٢﴾"]],[703.3,249.65,6.0,17.0,"4:117",9.55,["إِن يَدْعُونَ مِن","دُونِهِۦٓ إِلَّآ إِنَـٰثًا","وَإِن يَدْعُونَ إِلَّا","شَيْطَـٰنًا مَّرِيدًا","﴿١١٧﴾"]],[693.3,249.65,10.0,19.0,"4:119",11.4,["وَلَأُضِلَّنَّهُمْ وَلَأُمَنِّيَنَّهُمْ","وَلَـَٔامُرَنَّهُمْ فَلَيُبَتِّكُنَّ ءَاذَانَ","ٱلْأَنْعَـٰمِ وَلَـَٔامُرَنَّهُمْ فَلَيُغَيِّرُنَّ","خَلْقَ ٱللَّهِ ۚ وَمَن يَتَّخِذِ ٱلشَّيْطَـٰنَ","وَلِيًّا مِّن دُونِ ٱللَّهِ فَقَدْ خَسِرَ","خُسْرَانًا مُّبِينًا ﴿١١٩﴾"]],[687.3,249.65,6.0,16.0,"4:121",7.7,["أُو۟لَـٰٓئِكَ مَأْوَىٰهُمْ","جَهَنَّمُ وَلَا يَجِدُونَ","عَنْهَا مَحِيصًا","﴿١٢١﴾"]],[677.3,249.65,10.0,21.0,"4:128",13.25,["وَإِنِ ٱمْرَأَةٌ خَافَتْ مِنۢ بَعْلِهَا","نُشُوزًا أَوْ إِعْرَاضًا فَلَا جُنَاحَ","عَلَيْهِمَآ أَن يُصْلِحَا بَيْنَهُمَا صُلْحًا","ۚ وَٱلصُّلْحُ خَيْرٌ ۗ وَأُحْضِرَتِ","ٱلْأَنفُسُ ٱلشُّحَّ ۚ وَإِن تُحْسِنُوا۟","وَتَتَّقُوا۟ فَإِنَّ ٱللَّهَ كَانَ بِمَا","تَعْمَلُونَ خَبِيرًا ﴿١٢٨﴾"]],[667.3,249.65,10.0,19.0,"4:129",11.4,["وَلَن تَسْتَطِيعُوٓا۟ أَن تَعْدِلُوا۟ بَيْنَ","ٱلنِّسَآءِ وَلَوْ حَرَصْتُمْ ۖ فَلَا تَمِيلُوا۟","كُلَّ ٱلْمَيْلِ فَتَذَرُوهَا كَٱلْمُعَلَّقَةِ ۚ","وَإِن تُصْلِحُوا۟ وَتَتَّقُوا۟ فَإِنَّ ٱللَّهَ","كَانَ غَفُورًا رَّحِيمًا","﴿١٢٩﴾"]],[657.0,207.65,6.0,34.0,"4:140",26.2,["وَقَدْ نَزَّلَ عَلَيْكُمْ","فِى ٱلْكِتَـٰبِ أَنْ","إِذَا سَمِعْتُمْ ءَايَـٰتِ","ٱللَّهِ يُكْفَرُ بِهَا","وَيُسْتَهْزَأُ بِهَا فَلَا","تَقْعُدُوا۟ مَعَهُمْ","حَتَّىٰ يَخُوضُوا۟ فِى","حَدِيثٍ غَيْرِهِۦٓ ۚ","إِنَّكُمْ إِذًا مِّثْلُهُمْ ۗ","إِنَّ ٱللَّهَ جَامِعُ","ٱلْمُنَـٰفِقِينَ","وَٱلْكَـٰفِرِينَ فِى","جَهَنَّمَ جَمِيعًا","﴿١٤٠﴾"]],[650.0,207.65,7.0,32.0,"4:141",24.35,["ٱلَّذِينَ يَتَرَبَّصُونَ بِكُمْ","فَإِن كَانَ لَكُمْ فَتْحٌ","مِّنَ ٱللَّهِ قَالُوٓا۟ أَلَمْ","نَكُن مَّعَكُمْ وَإِن","كَانَ لِلْكَـٰفِرِينَ","نَصِيبٌ قَالُوٓا۟ أَلَمْ","نَسْتَح شَوْنِ ۚ ٱلْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ","وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِى وَرَضِيتُ لَكُمُ ٱلْإِسْلَـٰمَ","دِينًا ۚ فَمَنِ ٱضْطُرَّ فِى مَخْمَصَةٍ غَيْرَ مُتَجَانِفٍ لِّإِثْمٍ ۙ","فَإِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ ﴿٣﴾"]],[618.4,224.65,6.0,41.0,"5:4",26.2,["يَسْـَٔلُونَكَ مَاذَآ","أُحِلَّ لَهُمْ ۖ قُلْ","أُحِلَّ لَكُمُ","ٱلطَّيِّبَـٰتُ ۙ وَمَا","عَلَّمْتُم مِّنَ","ٱلْجَوَارِحِ مُكَلِّبِينَ","تُعَلِّمُونَهُنَّ مِمَّا","عَلَّمَكُمُ ٱللَّهُ ۖ فَكُلُوا۟","مِمَّآ أَمْسَكْنَ","عَلَيْكُمْ وَٱذْكُرُوا۟","ٱسْمَ ٱللَّهِ عَلَيْهِ ۖ","وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ","ٱللَّهَ سَرِيعُ","ٱلْحِسَابِ ﴿٤﴾"]],[583.1,140.65,25.0,19.0,"5:6",11.4,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا قُمْتُمْ إِلَى ٱلصَّلَوٰةِ فَٱغْسِلُوا۟ وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى","ٱلْمَرَافِقِ وَٱمْسَحُوا۟ بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى ٱلْكَعْبَيْنِ ۚ وَإِن كُنتُمْ جُنُبًا","فَٱطَّهَّرُوا۟ ۚ وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌ مِّنكُم مِّنَ ٱلْغَآئِطِ أَوْ","لَـٰمَسْتُمُ ٱلنِّسَآءَ فَلَمْ تَجِدُوا۟ مَآءً فَتَيَمَّمُوا۟ صَعِيدًا طَيِّبًا فَٱمْسَحُوا۟ بِوُجُوهِكُمْ","وَأَيْدِيكُم مِّنْهُ ۚ مَا يُرِيدُ ٱللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ وَلَـٰكِن يُرِيدُ لِيُطَهِّرَكُمْ وَلِيُتِمَّ","نِعْمَتَهُۥ عَلَيْكُمْ لَعَلَّكُمْ تَشْكُرُونَ ﴿٦﴾"]],[589.1,159.65,19.0,19.0,"5:12",11.4,["۞ وَلَقَدْ أَخَذَ ٱللَّهُ مِيثَـٰقَ بَنِىٓ إِسْرَٰٓءِيلَ وَبَعَثْنَا مِنْهُمُ ٱثْنَىْ","عَشَرَ نَقِيبًا ۖ وَقَالَ ٱللَّهُ إِنِّى مَعَكُمْ ۖ لَئِنْ أَقَمْتُمُ ٱلصَّلَوٰةَ وَءَاتَيْتُمُ","ٱلزَّكَوٰةَ وَءَامَنتُم بِرُسُلِى وَعَزَّرْتُمُوهُمْ وَأَقْرَضْتُمُ ٱللَّهَ قَرْضًا","حَسَنًا لَّأُكَفِّرَنَّ عَنكُمْ سَيِّـَٔاتِكُمْ وَلَأُدْخِلَنَّكُمْ جَنَّـٰتٍ تَجْرِى","مِن تَحْتِهَا ٱلْأَنْهَـٰرُ ۚ فَمَن كَفَرَ بَعْدَ ذَٰلِكَ مِنكُمْ فَقَدْ ضَلَّ","سَوَآءَ ٱلسَّبِيلِ ﴿١٢﴾"]],[578.1,159.65,11.0,19.0,"5:14",11.4,["وَمِنَ ٱلَّذِينَ قَالُوٓا۟ إِنَّا نَصَـٰرَىٰٓ","أَخَذْنَا مِيثَـٰقَهُمْ فَنَسُوا۟ حَظًّا مِّمَّا","ذُكِّرُوا۟ بِهِۦ فَأَغْرَيْنَا بَيْنَهُمُ ٱلْعَدَاوَةَ","وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ ۚ","وَسَوْفَ يُنَبِّئُهُمُ ٱللَّهُ بِمَا كَانُوا۟","يَصْنَعُونَ ﴿١٤﴾"]],[598.1,178.65,10.0,19.0,"5:19",11.4,["يَـٰٓأَهْلَ ٱلْكِتَـٰبِ قَدْ جَآءَكُمْ","رَسُولُنَا يُبَيِّنُ لَكُمْ عَلَىٰ فَتْرَةٍ","مِّنَ ٱلرُّسُلِ أَن تَقُولُوا۟ مَا","جَآءَنَا مِنۢ بَشِيرٍ وَلَا نَذِيرٍ ۖ","فَقَدْ جَآءَكُم بَشِيرٌ وَنَذِيرٌ ۗ وَٱللَّهُ","عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ ﴿١٩﴾"]],[591.1,178.65,7.0,19.0,"5:22",11.4,["قَالُوا۟ يَـٰمُوسَىٰٓ إِنَّ فِيهَا","قَوْمًا جَبَّارِينَ وَإِنَّا","لَن نَّدْخُلَهَا حَتَّىٰ","يَخْرُجُوا۟ مِنْهَا فَإِن","يَخْرُجُوا۟ مِنْهَا فَإِنَّا","دَٰخِلُونَ ﴿٢٢﴾"]],[580.1,178.65,11.0,16.0,"5:26",7.7,["قَالَ فَإِنَّهَا مُحَرَّمَةٌ عَلَيْهِمْ ۛ أَرْبَعِينَ","سَنَةً ۛ يَتِيهُونَ فِى ٱلْأَرْضِ ۚ فَلَا","تَأْسَ عَلَى ٱلْقَوْمِ ٱلْفَـٰسِقِينَ","﴿٢٦﴾"]],[592.1,197.65,16.0,16.0,"5:31",7.7,["فَبَعَثَ ٱللَّهُ غُرَابًا يَبْحَثُ فِى ٱلْأَرْضِ لِيُرِيَهُۥ كَيْفَ","يُوَٰرِى سَوْءَةَ أَخِيهِ ۚ قَالَ يَـٰوَيْلَتَىٰٓ أَعَجَزْتُ أَنْ","أَكُونَ مِثْلَ هَـٰذَا ٱلْغُرَابِ فَأُوَٰرِىَ سَوْءَةَ أَخِى ۖ","فَأَصْبَحَ مِنَ ٱلنَّـٰدِمِينَ ﴿٣١﴾"]],[579.1,197.65,13.0,19.0,"5:33",11.4,["إِنَّمَا جَزَٰٓؤُا۟ ٱلَّذِينَ يُحَارِبُونَ ٱللَّهَ وَرَسُولَهُۥ","وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًا أَن يُقَتَّلُوٓا۟","أَوْ يُصَلَّبُوٓا۟ أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُم","مِّنْ خِلَـٰفٍ أَوْ يُنفَوْا۟ مِنَ ٱلْأَرْضِ ۚ","ذَٰلِكَ لَهُمْ خِزْىٌ فِى ٱلدُّنْيَا ۖ وَلَهُمْ فِى","ٱلْـَٔاخِرَةِ عَذَابٌ عَظِيمٌ ﴿٣٣﴾"]],[602.1,216.65,6.0,19.0,"5:35",11.4,["يَـٰٓأَيُّهَا ٱلَّذِينَ","ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ","وَٱبْتَغُوٓا۟ إِلَيْهِ","ٱلْوَسِيلَةَ وَجَـٰهِدُوا۟","فِى سَبِيلِهِۦ لَعَلَّكُمْ","تُفْلِحُونَ ﴿٣٥﴾"]],[595.1,216.65,7.0,19.0,"5:38",11.4,["وَٱلسَّارِقُ وَٱلسَّارِقَةُ","فَٱقْطَعُوٓا۟ أَيْدِيَهُمَا","جَزَآءًۢ بِمَا كَسَبَا","نَكَـٰلًا مِّنَ ٱللَّهِ ۗ وَٱللَّهُ","عَزِيزٌ حَكِيمٌ","﴿٣٨﴾"]],[582.1,216.65,13.0,17.0,"5:42",9.55,["سَمَّـٰعُونَ لِلْكَذِبِ أَكَّـٰلُونَ لِلسُّحْتِ ۚ فَإِن","جَآءُوكَ فَٱحْكُم بَيْنَهُمْ أَوْ أَعْرِضْ عَنْهُمْ","ۖ وَإِن تُعْرِضْ عَنْهُمْ فَلَن يَضُرُّوكَ شَيْـًٔا","ۖ وَإِنْ حَكَمْتَ فَٱحْكُم بَيْنَهُم بِٱلْقِسْطِ ۚ","إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ ﴿٤٢﴾"]],[592.1,235.65,16.0,19.0,"5:44",11.4,["إِنَّآ أَنزَلْنَا ٱلتَّوْرَىٰةَ فِيهَا هُدًى وَنُورٌ ۚ يَحْكُمُ بِهَا","ٱلنَّبِيُّونَ ٱلَّذِينَ أَسْلَمُوا۟ لِلَّذِينَ هَادُوا۟ وَٱلرَّبَّـٰنِيُّونَ","وَٱلْأَحْبَارُ بِمَا ٱسْتُحْفِظُوا۟ مِن كِتَـٰبِ ٱللَّهِ وَكَانُوا۟","عَلَيْهِ شُهَدَآءَ ۚ فَلَا تَخْشَوُا۟ ٱلنَّاسَ وَٱخْشَوْنِ وَلَا","تَشْتَرُوا۟ بِـَٔايَـٰتِى ثَمَنًا قَلِيلًا ۚ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ","ٱللَّهُ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْكَـٰفِرُونَ ﴿٤٤﴾"]],[579.1,235.65,13.0,19.0,"5:45",11.4,["وَكَتَبْنَا عَلَيْهِمْ فِيهَآ أَنَّ ٱلنَّفْسَ بِٱلنَّفْسِ","وَٱلْعَيْنَ بِٱلْعَيْنِ وَٱلْأَنفَ بِٱلْأَنفِ","وَٱلْأُذُنَ بِٱلْأُذُنِ وَٱلسِّنَّ بِٱلسِّنِّ","وَٱلْجُرُوحَ قِصَاصٌ ۚ فَمَن تَصَدَّقَ بِهِۦ","فَهُوَ كَفَّارَةٌ لَّهُۥ ۚ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ","ٱللَّهُ فَأُو۟لَـٰٓئِكَ هُمُ ٱلظَّـٰلِمُونَ ﴿٤٥﴾"]],[598.1,254.65,10.0,19.0,"5:46",11.4,["وَقَفَّيْنَا عَلَىٰٓ ءَاثَـٰرِهِم بِعِيسَى","ٱبْنِ مَرْيَمَ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ","مِنَ ٱلتَّوْرَىٰةِ ۖ وَءَاتَيْنَـٰهُ ٱلْإِنجِيلَ","فِيهِ هُدًى وَنُورٌ وَمُصَدِّقًا لِّمَا","بَيْنَ يَدَيْهِ مِنَ ٱلتَّوْرَىٰةِ وَهُدًى","وَمَوْعِظَةً لِّلْمُتَّقِينَ ﴿٤٦﴾"]],[579.1,254.65,19.0,19.0,"5:48",11.4,["وَأَنزَلْنَآ إِلَيْكَ ٱلْكِتَـٰبَ بِٱلْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ مِنَ","ٱلْكِتَـٰبِ وَمُهَيْمِنًا عَلَيْهِ ۖ فَٱحْكُم بَيْنَهُم بِمَآ أَنزَلَ ٱللَّهُ ۖ وَلَا","تَتَّبِعْ أَهْوَآءَهُمْ عَمَّا جَآءَكَ مِنَ ٱلْحَقِّ ۚ لِكُلٍّ جَعَلْنَا مِنكُمْ","شِرْعَةً وَمِنْهَاجًا ۚ وَلَوْ شَآءَ ٱللَّهُ لَجَعَلَكُمْ أُمَّةً وَٰحِدَةً وَلَـٰكِن","لِّيَبْلُوَكُمْ فِى مَآ ءَاتَىٰكُمْ ۖ فَٱسْتَبِقُوا۟ ٱلْخَيْرَٰتِ ۚ إِلَى ٱللَّهِ","مَرْجِعُكُمْ جَمِيعًا فَيُنَبِّئُكُم بِمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ ﴿٤٨﴾"]],[567.8,140.65,10.0,25.0,"5:54",16.95,["يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ مَن يَرْتَدَّ","مِنكُمْ عَن دِينِهِۦ فَسَوْفَ يَأْتِى","ٱللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُۥٓ أَذِلَّةٍ","عَلَى ٱلْمُؤْمِنِينَ أَعِزَّةٍ عَلَى","ٱلْكَـٰفِرِينَ يُجَـٰهِدُونَ فِى سَبِيلِ","ٱللَّهِ وَلَا يَخَافُونَ لَوْمَةَ لَآئِمٍ ۚ","ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن","يَشَآءُ ۚ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","﴿٥٤﴾"]],[571.8,165.65,6.0,17.0,"5:56",9.55,["وَمَن يَتَوَلَّ ٱللَّهَ","وَرَسُولَهُۥ وَٱلَّذِينَ","ءَامَنُوا۟ فَإِنَّ حِزْبَ","ٱللَّهِ هُمُ ٱلْغَـٰلِبُونَ","﴿٥٦﴾"]],[565.8,165.65,6.0,27.0,"5:57",18.8,["يَـٰٓأَيُّهَا ٱلَّذِينَ","ءَامَنُوا۟ لَا تَتَّخِذُوا۟","ٱلَّذِينَ ٱتَّخَذُوا۟","دِينَكُمْ هُزُوًا وَلَعِبًا","مِّنَ ٱلَّذِينَ أُوتُوا۟","ٱلْكِتَـٰبَ مِن","قَبْلِكُمْ وَٱلْكُفَّارَ","أَوْلِيَآءَ ۚ وَٱتَّقُوا۟ ٱللَّهَ","إِن كُنتُم مُّؤْمِنِينَ","﴿٥٧﴾"]],[564.8,192.65,13.0,25.0,"5:64",16.95,["وَقَالَتِ ٱلْيَهُودُ يَدُ ٱللَّهِ مَغْلُولَةٌ ۚ غُلَّتْ","أَيْدِيهِمْ وَلُعِنُوا۟ بِمَا قَالُوا۟ ۘ بَلْ يَدَاهُ","مَبْسُوطَتَانِ يُنفِقُ كَيْفَ يَشَآءُ ۚ وَلَيَزِيدَنَّ","كَثِيرًا مِّنْهُم مَّآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ","طُغْيَـٰنًا وَكُفْرًا ۚ وَأَلْقَيْنَا بَيْنَهُمُ ٱلْعَدَٰوَةَ","وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ ۚ كُلَّمَآ","أَوْقَدُوا۟ نَارًا لِّلْحَرْبِ أَطْفَأَهَا ٱللَّهُ ۚ","وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًا ۚ وَٱللَّهُ لَا","يُحِبُّ ٱلْمُفْسِدِينَ ﴿٦٤﴾"]],[571.8,217.65,6.0,27.0,"5:66",18.8,["وَلَوْ أَنَّهُمْ أَقَامُوا۟","ٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ","وَمَآ أُنزِلَ إِلَيْهِم","مِّن رَّبِّهِمْ لَأَكَلُوا۟","مِن فَوْقِهِمْ وَمِن","تَحْتِ أَرْجُلِهِم ۚ","مِّنْهُمْ أُمَّةٌ","مُّقْتَصِدَةٌ ۖ وَكَثِيرٌ","مِّنْهُمْ سَآءَ مَا","يَعْمَلُونَ ﴿٦٦﴾"]],[565.8,217.65,6.0,27.0,"5:75",18.8,["مَّا ٱلْمَسِيحُ ٱبْنُ","مَرْيَمَ إِلَّا رَسُولٌ","قَدْ خَلَتْ مِن","قَبْلِهِ ٱلرُّسُلُ وَأُمُّهُۥ","صِدِّيقَةٌ ۖ كَانَا","يَأْكُلَانِ ٱلطَّعَامَ ۗ","ٱنظُرْ كَيْفَ نُبَيِّنُ","لَهُمُ ٱلْـَٔايَـٰتِ ثُمَّ","ٱنظُرْ أَنَّىٰ يُؤْفَكُونَ","﴿٧٥﴾"]],[570.8,244.65,7.0,27.0,"5:82",18.8,["۞ لَتَجِدَنَّ أَشَدَّ","ٱلنَّاسِ عَدَٰوَةً لِّلَّذِينَ","ءَامَنُوا۟ ٱلْيَهُودَ وَٱلَّذِينَ","أَشْرَكُوا۟ ۖ وَلَتَجِدَنَّ","أَقْرَبَهُم مَّوَدَّةً لِّلَّذِينَ","ءَامَنُوا۟ ٱلَّذِينَ قَالُوٓا۟ إِنَّا","نَصَـٰرَىٰ ۚ ذَٰلِكَ بِأَنَّ","مِنْهُمْ قِسّ [422.9,224.65,6.0,16.0,"7:83",7.7,["فَأَنجَيْنَـٰهُ وَأَهْلَهُۥٓ","إِلَّا ٱمْرَأَتَهُۥ كَانَتْ","مِنَ ٱلْغَـٰبِرِينَ","﴿٨٣﴾"]],[417.9,240.65,11.0,23.0,"7:85",15.1,["وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا ۗ قَالَ","يَـٰقَوْمِ ٱعْبُدُوا۟ ٱللَّهَ مَا لَكُم مِّنْ","إِلَـٰهٍ غَيْرُهُۥ ۖ قَدْ جَآءَتْكُم بَيِّنَةٌ مِّن","رَّبِّكُمْ ۖ فَأَوْفُوا۟ ٱلْكَيْلَ وَٱلْمِيزَانَ وَلَا","تَبْخَسُوا۟ ٱلنَّاسَ أَشْيَآءَهُمْ وَلَا","تُفْسِدُوا۟ فِى ٱلْأَرْضِ بَعْدَ","إِصْلَـٰحِهَا ۚ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن","كُنتُم مُّؤْمِنِينَ ﴿٨٥﴾"]],[411.6,140.65,6.0,16.0,"7:98",7.7,["أَوَأَمِنَ أَهْلُ","ٱلْقُرَىٰٓ أَن يَأْتِيَهُم","بَأْسُنَا ضُحًى وَهُمْ","يَلْعَبُونَ ﴿٩٨﴾"]],[405.3,140.65,6.0,14.0,"7:107",5.85,["فَأَلْقَىٰ عَصَاهُ","فَإِذَا هِىَ ثُعْبَانٌ","مُّبِينٌ ﴿١٠٧﴾"]],[399.3,140.65,6.0,16.0,"7:111",7.7,["قَالُوٓا۟ أَرْجِهْ وَأَخَاهُ","وَأَرْسِلْ فِى","ٱلْمَدَآئِنِ حَـٰشِرِينَ","﴿١١١﴾"]],[393.3,140.65,6.0,19.0,"7:117",11.4,["۞ وَأَوْحَيْنَآ إِلَىٰ","مُوسَىٰٓ أَنْ أَلْقِ","عَصَاكَ ۖ فَإِذَا هِىَ","تَلْقَفُ مَا","يَأْفِكُونَ","﴿١١٧﴾"]],[387.3,140.65,6.0,17.0,"7:132",9.55,["وَقَالُوا۟ مَهْمَا تَأْتِنَا","بِهِۦ مِنْ ءَايَةٍ","لِّتَسْحَرَنَا بِهَا فَمَا","نَحْنُ لَكَ بِمُؤْمِنِينَ","﴿١٣٢﴾"]],[400.3,159.65,11.0,23.0,"7:133",7.7,["فَأَرْسَلْنَا عَلَيْهِمُ ٱلطُّوفَانَ وَٱلْجَرَادَ","وَٱلْقُمَّلَ وَٱلضَّفَادِعَ وَٱلدَّمَ ءَايَـٰتٍ","مُّفَصَّلَـٰتٍ فَٱسْتَكْبَرُوا۟ وَكَانُوا۟ قَوْمًا","مُّجْرِمِينَ ﴿١٣٣﴾"]],[394.3,159.65,6.0,17.0,"7:135",9.55,["فَلَمَّا كَشَفْنَا عَنْهُمُ","ٱلرِّجْزَ إِلَىٰٓ أَجَلٍ","هُم بَـٰلِغُوهُ إِذَا","هُمْ يَنكُثُونَ","﴿١٣٥﴾"]],[387.3,159.65,7.0,29.0,"7:137",20.65,["وَأَوْرَثْنَا ٱلْقَوْمَ ٱلَّذِينَ","كَانُوا۟ يُسْتَضْعَفُونَ","مَشَـٰرِقَ ٱلْأَرْضِ","وَمَغَـٰرِبَهَا ٱلَّتِى بَـٰرَكْنَا","فِيهَا ۖ وَتَمَّتْ كَلِمَتُ","رَبِّكَ ٱلْحُسْنَىٰ عَلَىٰ","بَنِىٓ إِسْرَٰٓءِيلَ بِمَا","صَبَرُوا۟ ۖ وَدَمَّرْنَا مَا","كَانَ يَصْنَعُ فِرْعَوْنُ","وَقَوْمُهُۥ وَمَا كَانُوا۟","يَعْرِشُونَ ﴿١٣٧﴾"]],[381.3,159.65,6.0,17.0,"7:139",9.55,["إِنَّ هَـٰٓؤُلَآءِ مُتَبَّرٌ","مَّا هُمْ فِيهِ","وَبَـٰطِلٌ مَّا كَانُوا۟","يَعْمَلُونَ","﴿١٣٩﴾"]],[398.3,188.65,13.0,28.0,"7:143",13.25,["وَلَمَّا جَآءَ مُوسَىٰ لِمِيقَـٰتِنَا وَكَلَّمَهُۥ رَبُّهُۥ","قَالَ رَبِّ أَرِنِىٓ أَنظُرْ إِلَيْكَ ۚ قَالَ لَن","تَرَىٰنِى وَلَـٰكِنِ ٱنظُرْ إِلَى ٱلْجَبَلِ فَإِنِ","ٱسْتَقَرَّ مَكَانَهُۥ فَسَوْفَ تَرَىٰنِى ۚ فَلَمَّا تَجَلَّىٰ","رَبُّهُۥ لِلْجَبَلِ جَعَلَهُۥ دَكًّا وَخَرَّ مُوسَىٰ","صَعِقًا ۚ فَلَمَّآ أَفَاقَ قَالَ سُبْحَـٰنَكَ تُبْتُ","إِلَيْكَ وَأَنَا۠ أَوَّلُ ٱلْمُؤْمِنِينَ ﴿١٤٣﴾"]],[392.3,188.65,6.0,27.0,"7:145",18.8,["وَكَتَبْنَا لَهُۥ فِى","ٱلْأَلْوَاحِ مِن كُلِّ","شَىْءٍ مَّوْعِظَةً","وَتَفْصِيلًا لِّكُلِّ","شَىْءٍ فَخُذْهَا بِقُوَّةٍ","وَأْمُرْ قَوْمَكَ","يَأْخُذُوا۟ بِأَحْسَنِهَا","ۚ سَأُو۟رِيكُمْ دَارَ","ٱلْفَـٰسِقِينَ","﴿١٤٥﴾"]],[381.3,188.65,11.0,25.0,"7:148",9.55,["وَٱتَّخَذَ قَوْمُ مُوسَىٰ مِنۢ بَعْدِهِۦ مِنْ","حُلِيِّهِمْ عِجْلًا جَسَدًا لَّهُۥ خُوَارٌ ۚ","أَلَمْ يَرَوْا۟ أَنَّهُۥ لَا يُكَلِّمُهُمْ وَلَا","يَهْدِيهِمْ سَبِيلًا ۘ ٱتَّخَذُوهُ وَكَانُوا۟","ظَـٰلِمِينَ ﴿١٤٨﴾"]],[398.3,216.65,13.0,28.0,"7:150",13.25,["وَلَمَّا رَجَعَ مُوسَىٰٓ إِلَىٰ قَوْمِهِۦ غَضْبَـٰنَ","أَسِفًا قَالَ بِئْسَمَا خَلَفْتُمُونِى مِنۢ بَعْدِىٓ ۖ","أَعَجِلْتُمْ أَمْرَ رَبِّكُمْ ۖ وَأَلْقَى ٱلْأَلْوَاحَ وَأَخَذَ","بِرَأْسِ أَخِيهِ يَجُرُّهُۥٓ إِلَيْهِ ۚ قَالَ ٱبْنَ أُمَّ إِنَّ","ٱلْقَوْمَ ٱسْتَضْعَفُونِى وَكَادُوا۟ يَقْتُلُونَنِى فَلَا","تُشْمِتْ بِىَ ٱلْأَعْدَآءَ وَلَا تَجْعَلْنِى مَعَ","ٱلْقَوْمِ ٱلظَّـٰلِمِينَ ﴿١٥٠﴾"]],[392.3,216.65,6.0,23.0,"7:154",15.1,["وَلَمَّا سَكَتَ عَن","مُّوسَى ٱلْغَضَبُ","أَخَذَ ٱلْأَلْوَاحَ ۖ","وَفِى نُسْخَتِهَا","هُدًى وَرَحْمَةٌ","لِّلَّذِينَ هُمْ لِرَبِّهِمْ","يَرْهَبُونَ","﴿١٥٤﴾"]],[382.3,216.65,10.0,29.0,"7:160",20.65,["وَقَطَّعْنَـٰهُمُ ٱثْنَتَىْ عَشْرَةَ","أَسْبَاطًا أُمَمًا ۚ وَأَوْحَيْنَآ إِلَىٰ","مُوسَىٰٓ إِذِ ٱسْتَسْقَىٰهُ قَوْمُهُۥٓ أَنِ","ٱضْرِب بِّعَصَاكَ ٱلْحَجَرَ ۖ","فَٱنۢبَجَسَتْ مِنْهُ ٱثْنَتَا عَشْرَةَ","عَيْنًا ۖ قَدْ عَلِمَ كُلُّ أُنَاسٍ","مَّشْرَبَهُمْ ۚ وَظَلَّلْنَا عَلَيْهِمُ ٱلْغَمَـٰمَ","وَأَنزَلْنَا عَلَيْهِمُ ٱلْمَنَّ وَٱلسَّلْوَى أَرْضَ","حَتَّىٰ يَأْذَنَ لِىٓ أَبِىٓ أَوْ يَحْكُمَ ٱللَّهُ لِى ۖ","وَهُوَ خَيْرُ ٱلْحَـٰكِمِينَ ﴿٨٠﴾"]],[176.3,219.65,6.0,19.0,"12:85",11.4,["قَالُوا۟ تَٱللَّهِ تَفْتَؤُا۟","تَذْكُرُ يُوسُفَ حَتَّىٰ","تَكُونَ حَرَضًا أَوْ","تَكُونَ مِنَ","ٱلْهَـٰلِكِينَ","﴿٨٥﴾"]],[189.3,238.65,6.0,17.0,"12:86",9.55,["قَالَ إِنَّمَآ أَشْكُوا۟","بَثِّى وَحُزْنِىٓ إِلَى","ٱللَّهِ وَأَعْلَمُ مِنَ","ٱللَّهِ مَا لَا تَعْلَمُونَ","﴿٨٦﴾"]],[179.3,238.65,10.0,19.0,"12:88",11.4,["فَلَمَّا دَخَلُوا۟ عَلَيْهِ قَالُوا۟ يَـٰٓأَيُّهَا","ٱلْعَزِيزُ مَسَّنَا وَأَهْلَنَا ٱلضُّرُّ","وَجِئْنَا بِبِضَـٰعَةٍ مُّزْجَىٰةٍ فَأَوْفِ","لَنَا ٱلْكَيْلَ وَتَصَدَّقْ عَلَيْنَآ ۖ إِنَّ","ٱللَّهَ يَجْزِى ٱلْمُتَصَدِّقِينَ","﴿٨٨﴾"]],[189.3,257.65,6.0,17.0,"12:92",9.55,["قَالَ لَا تَثْرِيبَ","عَلَيْكُمُ ٱلْيَوْمَ ۖ","يَغْفِرُ ٱللَّهُ لَكُمْ ۖ","وَهُوَ أَرْحَمُ","ٱلرَّٰحِمِينَ ﴿٩٢﴾"]],[183.3,257.65,6.0,17.0,"12:94",9.55,["وَلَمَّا فَصَلَتِ ٱلْعِيرُ","قَالَ أَبُوهُمْ إِنِّى","لَأَجِدُ رِيحَ","يُوسُفَ ۖ لَوْلَآ أَن","تُفَنِّدُونِ ﴿٩٤﴾"]],[167.7,140.65,6.0,21.0,"13:1",13.25,["الٓمٓر ۚ تِلْكَ ءَايَـٰتُ","ٱلْكِتَـٰبِ ۗ وَٱلَّذِىٓ","أُنزِلَ إِلَيْكَ مِن","رَّبِّكَ ٱلْحَقُّ","وَلَـٰكِنَّ أَكْثَرَ","ٱلنَّاسِ لَا يُؤْمِنُونَ","﴿١﴾"]],[167.7,161.65,6.0,32.0,"13:4",24.35,["وَفِى ٱلْأَرْضِ","قِطَعٌ مُّتَجَـٰوِرَٰتٌ","وَجَنَّـٰتٌ مِّنْ","أَعْنَـٰبٍ وَزَرْعٌ","وَنَخِيلٌ صِنْوَانٌ","وَغَيْرُ صِنْوَانٍ","يُسْقَىٰ بِمَآءٍ وَٰحِدٍ","وَنُفَضِّلُ بَعْضَهَا","عَلَىٰ بَعْضٍ فِى","ٱلْأُكُلِ ۚ إِنَّ فِى","ذَٰلِكَ لَـَٔايَـٰتٍ","لِّقَوْمٍ يَعْقِلُونَ","﴿٤﴾"]],[157.4,140.65,10.0,21.0,"13:5",13.25,["۞ وَإِن تَعْجَبْ فَعَجَبٌ قَوْلُهُمْ","أَءِذَا كُنَّا تُرَٰبًا أَءِنَّا لَفِى خَلْقٍ","جَدِيدٍ ۗ أُو۟لَـٰٓئِكَ ٱلَّذِينَ كَفَرُوا۟","بِرَبِّهِمْ ۖ وَأُو۟لَـٰٓئِكَ ٱلْأَغْلَـٰلُ فِىٓ","أَعْنَاقِهِمْ ۖ وَأُو۟لَـٰٓئِكَ أَصْحَـٰبُ","ٱلنَّارِ ۖ هُمْ فِيهَا خَـٰلِدُونَ","﴿٥﴾"]],[161.4,161.65,6.0,19.0,"13:10",11.4,["سَوَآءٌ مِّنكُم مَّنْ","أَسَرَّ ٱلْقَوْلَ وَمَن","جَهَرَ بِهِۦ وَمَنْ","هُوَ مُسْتَخْفٍۭ","بِٱلَّيْلِ وَسَارِبٌۢ","بِٱلنَّهَارِ ﴿١٠﴾"]],[157.4,180.65,10.0,17.0,"13:13",9.55,["وَيُسَبِّحُ ٱلرَّعْدُ بِحَمْدِهِۦ","وَٱلْمَلَـٰٓئِكَةُ مِنْ خِيفَتِهِۦ وَيُرْسِلُ","ٱلصَّوَٰعِقَ فَيُصِيبُ بِهَا مَن","يَشَآءُ وَهُمْ يُجَـٰدِلُونَ فِى ٱللَّهِ","وَهُوَ شَدِيدُ ٱلْمِحَالِ ﴿١٣﴾"]],[166.7,200.65,7.0,57.0,"13:17",28.05,["أَنزَلَ مِنَ ٱلسَّمَآءِ","مَآءً فَسَالَتْ أَوْدِيَةٌۢ","بِقَدَرِهَا فَٱحْتَمَلَ","ٱلسَّيْلُ زَبَدًا رَّابِيًا ۚ","وَمِمَّا يُوقِدُونَ عَلَيْهِ فِى","ٱلنَّارِ ٱبْتِغَآءَ حِلْيَةٍ أَوْ","مَتَـٰعٍ زَبَدٌ مِّثْلُهُۥ ۚ","كَذَٰلِكَ يَضْرِبُ ٱللَّهُ","ٱلْحَقَّ وَٱلْبَـٰطِلَ ۚ فَأَمَّا","ٱلزَّبَدُ فَيَذْهَبُ جُفَآءً","ۖ وَأَمَّا مَا يَنفَعُ","ٱلنَّاسَ فَيَمْكُثُ فِى","ٱلْأَرْضِ ۚ كَذَٰلِكَ","يَضْرِبُ ٱللَّهُ ٱلْأَمْثَالَ","﴿١٧﴾"]],[159.4,200.65,7.0,38.0,"13:31",29.9,["وَلَوْ أَنَّ قُرْءَانًا","سُيِّرَتْ بِهِ ٱلْجِبَالُ أَوْ","قُطِّعَتْ بِهِ ٱلْأَرْضُ","أَوْ كُلِّمَ بِهِ ٱلْمَوْتَىٰ ۗ","بَل لِّلَّهِ ٱلْأَمْرُ جَمِيعًا ۗ","أَفَلَمْ يَا۟يْـَٔسِ ٱلَّذِينَ","ءَامَنُوٓا۟ أَن لَّوْ يَشَآءُ","ٱللَّهُ لَهَدَى ٱلنَّاسَ","جَمِيعًا ۗ وَلَا يَزَالُ","ٱلَّذِينَ كَفَرُوا۟ تُصِيبُهُم","بِمَا صَنَعُوا۟ قَارِعَةٌ أَوْ","تَحُلُّ قَرِيبًا مِّن","دَارِهِمْ حَتَّىٰ يَأْتِىَ","وَعْدُ ٱللَّهِ ۚ إِنَّ ٱللَّهَ لَا","يُخْلِفُ ٱلْمِيعَادَ","﴿٣١﴾"]],[160.4,238.65,6.0,17.0,"13:39",9.55,["يَمْحُوا۟ ٱللَّهُ مَا","يَشَآءُ وَيُثْبِتُ ۖ","وَعِندَهُۥٓ أُمُّ","ٱلْكِتَـٰبِ","﴿٣٩﴾"]],[150.8,140.65,6.0,28.0,"14:17",13.25,["يَتَجَرَّعُهُۥ وَلَا يَكَادُ","يُسِيغُهُۥ وَيَأْتِيهِ","ٱلْمَوْتُ مِن كُلِّ","مَكَانٍ وَمَا هُوَ","بِمَيِّتٍ ۖ وَمِن","وَرَآئِهِۦ عَذَابٌ","غَلِيظٌ ﴿١٧﴾"]],[144.8,140.65,6.0,27.0,"14:18",18.8,["مَّثَلُ ٱلَّذِينَ","كَفَرُوا۟ بِرَبِّهِمْ ۖ","أَعْمَـٰلُهُمْ كَرَمَادٍ","ٱشْتَدَّتْ بِهِ ٱلرِّيحُ","فِى يَوْمٍ عَاصِفٍ ۖ","لَّا يَقْدِرُونَ مِمَّا","كَسَبُوا۟ عَلَىٰ شَىْءٍ","ۚ ذَٰلِكَ هُوَ","ٱلضَّلَـٰلُ ٱلْبَعِيدُ","﴿١٨﴾"]],[150.8,168.65,6.0,30.0,"14:21",22.5,["وَبَرَزُوا۟ لِلَّهِ جَمِيعًا","فَقَالَ ٱلضُّعَفَـٰٓؤُا۟","لِلَّذِينَ ٱسْتَكْبَرُوٓا۟","إِنَّا كُنَّا لَكُمْ تَبَعًا","فَهَلْ أَنتُم مُّغْنُونَ","عَنَّا مِنْ عَذَابِ","ٱللَّهِ مِن شَىْءٍ ۚ","قَالُوا۟ لَوْ هَدَىٰنَا ٱللَّهُ","لَهَدَيْنَـٰكُمْ ۖ سَوَآءٌ","عَلَيْنَآ أَجَزِعْنَآ أَمْ","صَبَرْنَا مَا لَنَا مِن","مَّحِيصٍ ﴿٢١﴾"]],[140.8,168.65,10.0,29.0,"14:22",20.65,["وَقَالَ ٱلشَّيْطَـٰنُ لَمَّا قُضِىَ","ٱلْأَمْرُ إِنَّ ٱللَّهَ وَعَدَكُمْ وَعْدَ","ٱلْحَقِّ وَوَعَدتُّكُمْ فَأَخْلَفْتُكُمْ ۖ","وَمَا كَانَ لِىَ عَلَيْكُم مِّن","سُلْطَـٰنٍ إِلَّآ أَن دَعَوْتُكُمْ","فَٱسْتَجَبْتُمْ لِى ۖ فَلَا تَلُومُونِى","وَلُومُوٓا۟ أَنفُسَكُم ۖ مَّآ أَنَا۠","بِمُصْرِخِكُمْ وَمَآ أَنتُم بِمُصْرِخِىَّ ۖ","إِنِّى كَفَرْتُ بِمَآ أَشْرَكْتُمُونِ","مِن قَبْلُ ۗ إِنَّ ٱلظَّـٰلِمِينَ لَهُمْ","عَذَابٌ أَلِيمٌ ﴿٢٢﴾"]],[134.5,140.65,6.0,21.0,"14:24",13.25,["أَلَمْ تَرَ كَيْفَ","ضَرَبَ ٱللَّهُ مَثَلًا","كَلِمَةً طَيِّبَةً","كَشَجَرَةٍ طَيِّبَةٍ","أَصْلُهَا ثَابِتٌ","وَفَرْعُهَا فِى","ٱلسَّمَآءِ ﴿٢٤﴾"]],[134.5,161.65,6.0,21.0,"14:26",13.25,["وَمَثَلُ كَلِمَةٍ","خَبِيثَةٍ كَشَجَرَةٍ","خَبِيثَةٍ ٱجْتُثَّتْ","مِن فَوْقِ","ٱلْأَرْضِ مَا لَهَا","مِن قَرَارٍ","﴿٢٦﴾"]],[150.8,201.65,6.0,17.0,"14:28",9.55,["۞ أَلَمْ تَرَ إِلَى","ٱلَّذِينَ بَدَّلُوا۟","نِعْمَتَ ٱللَّهِ كُفْرًا","وَأَحَلُّوا۟ قَوْمَهُمْ دَارَ","ٱلْبَوَارِ ﴿٢٨﴾"]],[150.8,218.65,6.0,19.0,"14:34",11.4,["وَءَاتَىٰكُم مِّن كُلِّ","مَا سَأَلْتُمُوهُ ۚ وَإِن","تَعُدُّوا۟ نِعْمَتَ ٱللَّهِ","لَا تُحْصُوهَآ ۗ إِنَّ","ٱلْإِنسَـٰنَ لَظَلُومٌ","كَفَّارٌ ﴿٣٤﴾"]],[144.5,201.65,6.0,19.0,"14:42",11.4,["وَلَا تَحْسَبَنَّ ٱللَّهَ","غَـٰفِلًا عَمَّا يَعْمَلُ","ٱلظَّـٰلِمُونَ ۚ إِنَّمَا","يُؤَخِّرُهُمْ لِيَوْمٍ","تَشْخَصُ فِيهِ","ٱلْأَبْصَـٰرُ ﴿٤٢﴾"]],[134.5,201.65,10.0,21.0,"14:43",5.85,["مُهْطِعِينَ مُقْنِعِى رُءُوسِهِمْ لَا","يَرْتَدُّ إِلَيْهِمْ طَرْفُهُمْ ۖ وَأَفْـِٔدَتُهُمْ","هَوَآءٌ ﴿٤٣﴾"]],[140.5,222.65,10.0,19.0,"14:44",11.4,["وَأَنذِرِ ٱلنَّاسَ يَوْمَ يَأْتِيهِمُ","ٱلْعَذَابُ فَيَقُولُ ٱلَّذِينَ ظَلَمُوا۟","رَبَّنَآ أَخِّرْنَآ إِلَىٰٓ أَجَلٍ قَرِيبٍ","نُّجِبْ دَعْوَتَكَ وَنَتَّبِعِ ٱلرُّسُلَ ۗ","أَوَلَمْ تَكُونُوٓا۟ أَقْسَمْتُم مِّن قَبْلُ","مَا لَكُم مِّن زَوَالٍ ﴿٤٤﴾"]],[134.5,222.65,6.0,16.0,"14:49",7.7,[
