<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خلق kafesi (üç boyut)</title>
<style>
:root{--bg:#fffdf6;--ink:#2b2410;--line:#b5a97f;--seb:#b3541e}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Amiri,"Noto Naskh Arabic","DejaVu Sans",sans-serif;overflow:hidden}

svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kutu{position:absolute;transform:translate(-50%,-50%);border:1.4px solid #7a6a3c;border-radius:9px;padding:5px 8px;box-shadow:0 1px 4px #0003;pointer-events:none;white-space:nowrap}
.kutu .b{font:700 12.5px/1.25 system-ui,sans-serif;text-align:center;margin-bottom:3px;white-space:normal;max-width:210px}

.kelime .tr{font:10px/1.1 system-ui,sans-serif;max-width:112px;white-space:normal}
.kelime .tg{font:8.5px/1 system-ui,sans-serif;color:#777}

#ctl button{font:12px system-ui;margin:0 2px 3px 0;padding:3px 7px;border:1px solid #a89a70;background:#fff;border-radius:6px;cursor:pointer}
#ctl label{margin-right:8px;white-space:nowrap}
#nota{position:absolute;right:10px;bottom:8px;font:11.5px/1.4 system-ui,sans-serif;background:#fffdf6e6;border:1px solid #d6caa0;border-radius:8px;padding:6px 9px;max-width:420px;z-index:9999}
.hal{font:10px system-ui;fill:#8a7a55}
.seb{font:10px system-ui,sans-serif;fill:var(--seb);paint-order:stroke;stroke:#fffdf6;stroke-width:3px}
</style></head><body>

const q=new URLSearchParams(location.hash.slice(1));
let yaw=+(q.get('yaw')||35)*Math.PI/180, pit=+(q.get('pitch')||28)*Math.PI/180, zoom=+(q.get('zoom')||1);
const cL=document.getElementById('cL'),cS=document.getElementById('cS'),cH=document.getElementById('cH');
if(q.get('sebep')==='0')cS.checked=false; if(q.get('kafes')==='0')cL.checked=false; if(q.get('halka')==='0')cH.checked=false;
if(q.get('ctl')==='0')document.getElementById('ctl').style.display='none';
if(q.get('nota')==='0')document.getElementById('nota').style.display='none';
const sahne=document.getElementById('sahne'),svg=document.getElementById('svg'),kut=document.getElementById('kutular');
const P=D.dugumler.map(n=>({...n,x:n.r*Math.cos(n.theta),y:n.r*Math.sin(n.theta)}));
// kutuları bir kez kur
const el=P.map(n=>{const d=document.createElement('div');d.className='kutu '+(n.kind==='top'?'top':n.kind==='bot'?'bot':n.renk);
 let h='';
 if(n.kind==='bot'){h='<div class="b">alt (boş küme)</div>'}
 else{ if(n.baslik.length)h+='<div class="b">'+n.baslik.join('<br>')+'</div>';
  if(n.kelimeler.length){const c=n.kelimeler.length>3?2:1;h+='<div class="k" style="--c:'+c+'">'+n.kelimeler.map(k=>'<div class="kelime"><div class="ar">'+k.ar+'</div><div class="tr">'+k.tr+'</div><div class="tg">'+k.tag+(k.kuran?' '+k.kuran:'')+'</div></div>').join('')+'</div>';}
  if(!n.baslik.length&&!n.kelimeler.length)h='<div class="b" style="opacity:.6">·</div>';}
 d.innerHTML=h;kut.appendChild(d);return d;});
function proj(x,y,z){const c=Math.cos(yaw),s=Math.sin(yaw);const x1=x*c-y*s,y1=x*s+y*c;
 const up=z*Math.cos(pit)+y1*Math.sin(pit),dep=-y1*Math.cos(pit)+z*Math.sin(pit);return [x1,up,dep];}
function ciz(){
 const W=sahne.clientWidth,H=sahne.clientHeight;
 const zs=D.dugumler.map(n=>n.z);const zmin=Math.min(...zs),zmax=Math.max(...zs);
 const rmax=Math.max(...D.dugumler.map(n=>n.r));
 const sc=Math.min(W/(2*rmax+330),H/((zmax-zmin)*Math.cos(pit)+2*rmax*Math.sin(pit)+260))*zoom*1.0;
 const cx=W/2,cy=H/2+((zmax+zmin)/2)*Math.cos(pit)*sc;
 const S=(x,y,z)=>{const p=proj(x,y,z);return [cx+p[0]*sc,cy-p[1]*sc,p[2]];};
 let out='<defs><marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L8,4L0,8z" fill="#b3541e"/></marker></defs>';
 if(cH.checked){ // halkalar: ilk katman düzleminde
  const z0=D.katman_z[1];
  D.halkalar.forEach((r,i)=>{let pts=[];for(let a=0;a<=64;a++){const t=a/64*2*Math.PI;const p=S(r*Math.cos(t),r*Math.sin(t),z0);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
   out+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#d9cfa8" stroke-dasharray="3 4"/>';
   const l=S(r*Math.cos(-0.22),r*Math.sin(-0.22),z0);out+='<text class="hal" x="'+l[0].toFixed(0)+'" y="'+l[1].toFixed(0)+'">köke uzaklık '+(i+1)+'</text>';});
  // eksen
  const a=S(0,0,zmax),b=S(0,0,zmin);out+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#d9cfa8" stroke-dasharray="2 5"/>';
 }
 if(cL.checked)D.kafes_kenarlari.forEach(([u,a])=>{const p=S(P[u].x,P[u].y,P[u].z),r=S(P[a].x,P[a].y,P[a].z);
  out+='<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+r[0].toFixed(1)+'" y2="'+r[1].toFixed(1)+'" stroke="#9a8a5c" stroke-width="1.5"/>';});
 let labs='';
 if(cS.checked)D.sebep_kenarlari.forEach(([u,a,v])=>{const p=S(P[u].x,P[u].y,P[u].z),r=S(P[a].x,P[a].y,P[a].z);
  const mx=(p[0]+r[0])/2,my=(p[1]+r[1])/2+(Math.abs(p[1]-r[1])<30?-14:0);
  out+='<path d="M'+p[0].toFixed(1)+','+p[1].toFixed(1)+' Q'+((p[0]+r[0])/2+ (r[1]-p[1])*0.12).toFixed(1)+','+((p[1]+r[1])/2-(r[0]-p[0])*0.12).toFixed(1)+' '+r[0].toFixed(1)+','+r[1].toFixed(1)+'" fill="none" stroke="#b3541e" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#ok)"/>';
  const t=[...new Set(v)].map(s=>s.replace(/^çünkü /,'')).join(' / ');
  labs+='<text class="seb" x="'+mx.toFixed(0)+'" y="'+my.toFixed(0)+'" text-anchor="middle">'+t.slice(0,46)+(t.length>46?'…':'')+'</text>';});
 svg.innerHTML=out+labs;
 const ds=P.map((n,i)=>{const p=S(n.x,n.y,n.z);return {i,x:p[0],y:p[1],d:p[2]};}).sort((a,b)=>a.d-b.d);
 ds.forEach((o,k)=>{const e=el[o.i];e.style.left=o.x.toFixed(1)+'px';e.style.top=o.y.toFixed(1)+'px';e.style.zIndex=k+1;e.style.transform='translate(-50%,-50%) scale('+Math.max(.42,Math.min(1.1,sc*1.55))+')';});
}
let dr=null;
sahne.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];sahne.setPointerCapture(e.pointerId);});
sahne.addEventListener('pointermove',e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*0.008;pit=Math.max(0,Math.min(Math.PI/2,pit+(e.clientY-dr[1])*0.006));dr=[e.clientX,e.clientY];ciz();});
sahne.addEventListener('pointerup',()=>dr=null);
sahne.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*(e.deltaY<0?1.1:.9)));ciz();},{passive:false});
document.querySelectorAll('#ctl button').forEach(b=>b.onclick=()=>{const [y,p]=b.dataset.v.split(',').map(Number);yaw=y*Math.PI/180;pit=p*Math.PI/180;ciz();});
[cL,cS,cH].forEach(c=>c.onchange=ciz);
addEventListener('resize',ciz);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(ciz);
ciz();
</script></body></html>
