<title>خلق Kafesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Yerleşim: tam ekran sahne, üstte kontrol şeridi, sağda seçili düğüm paneli.
   Palet: sıcak kâğıt zemin, esas altın, mana mavi/yeşil/şeftali, sebep çizgisi toprak turuncusu. */
:root{
  --bg:#fbf8ef; --fg:#2a2414; --muted:#7a6f55; --panel:#fffdf6; --line:#d9cfa8;
  --esas:#e8c766; --mavi:#bcd9f5; --yesil:#cde8b8; --seftali:#f6cfa6; --pembe:#eac3df; --turkuaz:#bfe6dc; --gri:#dcd8c8;
  --kenar:#8d7f4f; --sebep:#b3541e; --halka:#cfc293; --kelime:#fffdf6c0;
  --font-metin:'Inter',system-ui,sans-serif; --font-arap:'Amiri','Noto Naskh Arabic',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15130d; --fg:#efe8d0; --muted:#a79d7d; --panel:#1e1b12; --line:#3c3724;
  --esas:#9c7f2a; --mavi:#2d4a66; --yesil:#40592f; --seftali:#6b4a2c; --pembe:#5e3a56; --turkuaz:#2f5c52; --gri:#3a3828;
  --kenar:#b9a96d; --sebep:#ff9a5c; --halka:#4a4328; --kelime:#15130dc0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130d; --fg:#efe8d0; --muted:#a79d7d; --panel:#1e1b12; --line:#3c3724;
  --esas:#9c7f2a; --mavi:#2d4a66; --yesil:#40592f; --seftali:#6b4a2c; --pembe:#5e3a56; --turkuaz:#2f5c52; --gri:#3a3828;
  --kenar:#b9a96d; --sebep:#ff9a5c; --halka:#4a4328; --kelime:#15130dc0; color-scheme:dark;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-metin);overflow:hidden}
#app{position:absolute;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#gl,#lab{position:absolute;inset:0}
#lab{pointer-events:none}
#bar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;z-index:5;pointer-events:none}
#bar>*{pointer-events:auto}
.grup{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;font-size:12px}
.grup button{font:600 12px var(--font-metin);padding:5px 9px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:7px;cursor:pointer}
.grup button:hover,.grup button[aria-pressed=true]{background:var(--esas)}
.grup label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
#ad{font:700 15px var(--font-metin);padding:5px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#ad b{font-family:var(--font-arap);font-size:20px;margin-right:4px}
#panel{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 24px));max-height:46%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;z-index:5}
#panel h3{margin:0 0 4px;font-size:13px}
#panel .ar{font-family:var(--font-arap);font-size:20px;direction:rtl}
#panel .sol{color:var(--muted)}
#panel ul{margin:4px 0 6px;padding-left:16px}
#kural{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.5;z-index:5}
#kural h3{margin:0 0 4px;font-size:12.5px}
#kural table{border-collapse:collapse;width:100%}#kural td{padding:1px 0;vertical-align:top}#kural td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;padding-left:8px}
.et{transform-origin:center;pointer-events:none}
.kart{border:1.5px solid var(--kenar);border-radius:10px;padding:5px 8px;color:#2a2414;box-shadow:0 2px 8px #0003;white-space:nowrap;transition:opacity .15s}
.kart.sonuk{opacity:.18}
.kart.secili{outline:3px solid var(--sebep)}
.kart .b{font:700 12.5px/1.25 var(--font-metin);text-align:center;margin-bottom:3px;white-space:normal;max-width:210px}
.kart .k{display:grid;gap:3px 6px}
.kart .kw{background:var(--kelime);border:1px solid #a89a70;border-radius:6px;padding:1px 5px;text-align:center;color:#2a2414}
.kart .kw .ar{font:400 20px/1.3 var(--font-arap);direction:rtl}
.kart .kw .tr{font:10px/1.15 var(--font-metin);max-width:116px;white-space:normal}
.kart .kw .tg{font:8.5px/1 var(--font-metin);color:#6d6650}
.c-top{background:var(--esas)}.c-bot{background:var(--gri)}.c-a{background:var(--mavi)}.c-b{background:var(--yesil)}.c-c{background:var(--seftali)}.c-h{background:var(--pembe)}.c-ab{background:var(--turkuaz)}.c-dis{background:var(--gri)}.c-esas{background:var(--esas)}
.sbp{font:600 10.5px var(--font-metin);color:var(--sebep);background:var(--panel);border:1px solid var(--sebep);border-radius:6px;padding:1px 5px;max-width:190px;white-space:normal;text-align:center}
.halka{font:600 10px var(--font-metin);color:var(--muted);background:var(--panel);border-radius:5px;padding:0 4px}
#hata{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:9}
@media (max-width:640px){#panel{max-height:34%}#kural{display:none}}
</style>
<div id="app">
  <div id="gl"></div><div id="lab"></div>
  <div id="bar">
    <div id="ad"><b>خلق</b> kafesi</div>
    <div class="grup"><span>Bakış</span>
      <button data-v="genel">Genel</button><button data-v="on">Önden</button><button data-v="ust">Üstten</button><button data-v="yan">Yandan</button>
    </div>
    <div class="grup">
      <label><input type="checkbox" id="cDon"> kendiliğinden dön</label>
      <label><input type="checkbox" id="cKafes" checked> kafes çizgisi</label>
      <label><input type="checkbox" id="cSebep" checked> sebep çizgisi</label>
      <label><input type="checkbox" id="cSyaz"> sebep yazıları</label>
      <label><input type="checkbox" id="cHalka" checked> halkalar</label>
    </div>
  </div>
  <div id="kural"></div>
  <div id="panel"><h3>Bir kutuya dokun</h3><span class="sol">Sürükle: döndür · tekerlek veya iki parmak: yakınlaş · sağ tuş veya üç parmak: kaydır. Kutu seçince onun ebeveynleri ve çocukları belirir, öbürleri solar.</span></div>
  <div id="hata"><div>Bu tarayıcıda üç boyutlu çizim (WebGL) açılamadı.</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
const D=__VERI__, RAPOR=__RAPOR__;
(function(){
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const glEl=document.getElementById('gl'), labEl=document.getElementById('lab');
let renderer; try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});}catch(e){document.getElementById('hata').style.display='flex';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); glEl.appendChild(renderer.domElement);
const l2=new THREE.CSS2DRenderer();l2.domElement.style.position='absolute';l2.domElement.style.top='0';l2.domElement.style.left='0';l2.domElement.style.pointerEvents='none';labEl.appendChild(l2.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,1,20,40000);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);
ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.autoRotateSpeed=.7;ctl.minDistance=250;ctl.maxDistance=14000;
const ZG=D.katman_z, K=D.olcek, CW=D.kutu[0], CH=D.kutu[1];
const zTop=Math.max(...D.dugumler.map(n=>n.z)), zBot=Math.min(...D.dugumler.map(n=>n.z));
const orta=new THREE.Vector3(0,(zTop+zBot)/2,0);
const rmax=Math.max(...D.dugumler.map(n=>n.r));
const V={genel:[rmax*0.4,(zTop+zBot)/2+rmax*0.28,rmax*1.7],ust:[0,rmax*2.6,1],yan:[0,(zTop+zBot)/2,rmax*2.0],on:[0,(zTop+zBot)/2,rmax*1.75]};
let ucus=0;
function ucur(hedef,bak,sure){const from=cam.position.clone(),fromT=ctl.target.clone(),t0=performance.now();const id=++ucus;
  (function adim(){if(id!==ucus)return;const k=sure?Math.min(1,(performance.now()-t0)/sure):1;const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
   cam.position.lerpVectors(from,hedef,e);ctl.target.lerpVectors(fromT,bak,e);if(k<1)requestAnimationFrame(adim);})();}
function git(ad,hizli){const p=V[ad];ucur(new THREE.Vector3(p[0],p[1],p[2]),orta.clone(),hizli?0:700);}
git('genel',true);
const dunya=new THREE.Group();scene.add(dunya);
const P=D.dugumler.map(n=>new THREE.Vector3(n.r*Math.cos(n.theta),n.z,n.r*Math.sin(n.theta)));
const RENK={top:'#e8c766',bot:'#dcd8c8',a:'#bcd9f5',b:'#cde8b8',c:'#f6cfa6',h:'#eac3df',ab:'#bfe6dc',dis:'#dcd8c8',esas:'#e8c766'};
const adlar=D.dugumler.map(n=>n.kind==='top'?'esas':(n.baslik.join(' · ')||n.kelimeler.map(k=>k.ar).join(' ')||'alt'));
// ---- sabit ebatlı kart dokusu ----
const SC=2; // doku çözünürlüğü
function sar(ctx,t,w,maks){const k=t.split(' ');const sat=[];let cur='';k.forEach(x=>{const d=cur?cur+' '+x:x;if(ctx.measureText(d).width>w&&cur){sat.push(cur);cur=x;}else cur=d;});if(cur)sat.push(cur);return maks?sat.slice(0,maks):sat;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function kartCiz(n,cv){const ctx=cv.getContext('2d');ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,CW,CH);
  const renk=RENK[n.kind==='top'?'top':n.kind==='bot'?'bot':n.renk]||RENK.ab;
  rr(ctx,1.5,1.5,CW-3,CH-3,12);ctx.fillStyle=renk;ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle='#7a6a3c';ctx.stroke();
  ctx.fillStyle='#2a2414';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  let y=8;
  const basl=n.kind==='bot'?['alt: boş küme']:n.baslik;
  ctx.font='700 14px Inter,system-ui,sans-serif';
  const bsat=[];basl.forEach(b=>sar(ctx,b,CW-20,3).forEach(s=>bsat.push(s)));
  bsat.forEach(s=>{y+=17;ctx.fillText(s,CW/2,y-3);});
  y+=6;
  const ks=n.kelimeler;if(!ks.length)return;
  const cols=ks.length<=3?ks.length:3, rows=Math.ceil(ks.length/cols),g=6,pad=10;
  const cw=(CW-2*pad-g*(cols-1))/cols, ch=Math.min(84,(CH-y-pad-g*(rows-1))/rows);
  ks.forEach((k,i)=>{const c=i%cols,r=Math.floor(i/cols);const x=pad+c*(cw+g),yy=y+r*(ch+g);
    rr(ctx,x,yy,cw,ch,7);ctx.fillStyle='rgba(255,253,246,.82)';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#a89a70';ctx.stroke();
    ctx.fillStyle='#1a1a1a';ctx.font='400 '+Math.min(24,ch*0.46)+'px Amiri,"Noto Naskh Arabic",serif';ctx.direction='rtl';ctx.fillText(k.ar,x+cw/2,yy+Math.min(24,ch*0.46)+1);ctx.direction='ltr';
    ctx.fillStyle='#2a2414';ctx.font='10.5px Inter,system-ui,sans-serif';
    const ty=yy+Math.min(24,ch*0.46)+14;const ts=sar(ctx,k.tr,cw-8,Math.max(1,Math.floor((ch-Math.min(24,ch*0.46)-22)/12)));
    ts.forEach((s,j)=>ctx.fillText(s,x+cw/2,ty+12*j));
    ctx.fillStyle='#6d6650';ctx.font='9px Inter,system-ui,sans-serif';ctx.fillText(k.tag+(k.kuran?' '+k.kuran:''),x+cw/2,yy+ch-4);});
}
const kartlar=[];const meshler=[];
D.dugumler.forEach((n,i)=>{
  const cv=document.createElement('canvas');cv.width=CW*SC;cv.height=CH*SC;
  const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;tex.anisotropy=8;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.02,opacity:1,side:THREE.FrontSide});
  const g=new THREE.Group();g.position.copy(P[i]);
  const on=new THREE.Mesh(new THREE.PlaneGeometry(CW*K,CH*K),mat);on.position.z=1.5;on.userData.i=i;
  const arka=new THREE.Mesh(new THREE.PlaneGeometry(CW*K,CH*K),mat);arka.rotation.y=Math.PI;arka.position.z=-1.5;arka.userData.i=i;
  g.add(on);g.add(arka);dunya.add(g);meshler.push(on,arka);kartlar.push({n,cv,tex,mat,g});
});
function kartlariCiz(){kartlar.forEach(k=>{kartCiz(k.n,k.cv);k.tex.needsUpdate=true;});}
kartlariCiz();
if(document.fonts){Promise.all([document.fonts.load('24px Amiri'),document.fonts.load('700 14px Inter'),document.fonts.load('10px Inter')]).then(()=>setTimeout(kartlariCiz,50)).catch(()=>{});document.fonts.ready.then(()=>setTimeout(kartlariCiz,50));}
// ---- halkalar ----
const halkaGrup=new THREE.Group();dunya.add(halkaGrup);const halkaYaz=[];
D.halkalar.forEach((r,k)=>{const pts=[];for(let a=0;a<=128;a++){const t=a/128*Math.PI*2;pts.push(new THREE.Vector3(r*Math.cos(t),ZG[1],r*Math.sin(t)));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:new THREE.Color(cssv('--halka')),dashSize:16,gapSize:14}));l.computeLineDistances();halkaGrup.add(l);
  const d=document.createElement('div');d.className='halka';d.textContent='köke uzaklık '+(k+1);const o=new THREE.CSS2DObject(d);o.position.set(r*Math.cos(-.3),ZG[1],r*Math.sin(-.3));halkaGrup.add(o);halkaYaz.push(o);});
ZG.forEach(z=>{const g=new THREE.Mesh(new THREE.CircleGeometry(Math.max(...D.halkalar)*1.08,96),new THREE.MeshBasicMaterial({color:new THREE.Color(cssv('--halka')),transparent:true,opacity:.07,side:THREE.DoubleSide,depthWrite:false}));g.rotation.x=-Math.PI/2;g.position.y=z-1;halkaGrup.add(g);});
const eksen=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,zTop+120,0),new THREE.Vector3(0,zBot-120,0)]),new THREE.LineDashedMaterial({color:new THREE.Color(cssv('--halka')),dashSize:10,gapSize:12}));eksen.computeLineDistances();halkaGrup.add(eksen);
// ---- kafes kenarları ----
const up=new THREE.Vector3(0,1,0);
const kafGrup=new THREE.Group();dunya.add(kafGrup);const kafKenar=[];
function silindir(a,b,r,renk){const d=new THREE.Vector3().subVectors(b,a),L=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,8,1),new THREE.MeshBasicMaterial({color:renk,transparent:true,opacity:.9}));m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(up,d.normalize());return m;}
D.kafes_kenarlari.forEach(([u,a])=>{const m=silindir(P[u],P[a],3.2,new THREE.Color(cssv('--kenar')));m.userData={u,a};kafGrup.add(m);kafKenar.push(m);});
// ---- sebep kenarları ----
const sebGrup=new THREE.Group();dunya.add(sebGrup);const sebKenar=[];
function yazKart(t){const cv=document.createElement('canvas');const c=cv.getContext('2d');c.font='600 15px Inter,system-ui,sans-serif';const sat=sar(c,t,230,3);const w=250,h=14+sat.length*19;cv.width=w*2;cv.height=h*2;
  const x=cv.getContext('2d');x.setTransform(2,0,0,2,0,0);rr(x,1,1,w-2,h-2,8);x.fillStyle='#fffdf6';x.fill();x.lineWidth=1.6;x.strokeStyle='#b3541e';x.stroke();x.fillStyle='#b3541e';x.font='600 15px Inter,system-ui,sans-serif';x.textAlign='center';sat.forEach((s,i)=>x.fillText(s,w/2,22+19*i));
  const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;return [tex,w,h];}
D.sebep_kenarlari.forEach(([u,a,v])=>{const A=P[u],B=P[a];const mid=A.clone().add(B).multiplyScalar(.5);
  const dir=new THREE.Vector3().subVectors(B,A);const yan=new THREE.Vector3(-dir.z,0,dir.x);if(yan.lengthSq()<1)yan.set(1,0,0);yan.normalize().multiplyScalar(dir.length()*.18);mid.add(yan);
  const eg=new THREE.QuadraticBezierCurve3(A,mid,B);const pts=eg.getPoints(48);
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:new THREE.Color(cssv('--sebep')),dashSize:24,gapSize:14,transparent:true}));line.computeLineDistances();sebGrup.add(line);
  const son=pts[pts.length-1],on=pts[pts.length-6];const cone=new THREE.Mesh(new THREE.ConeGeometry(11,34,12),new THREE.MeshBasicMaterial({color:new THREE.Color(cssv('--sebep')),transparent:true}));
  cone.position.copy(son);cone.quaternion.setFromUnitVectors(up,new THREE.Vector3().subVectors(son,on).normalize());sebGrup.add(cone);
  const t=[...new Set(v)].map(s=>s.replace(/^çünkü /,'')).join(' / ');const [tex,w,h]=yazKart(t);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(w*1.2,h*1.2),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));pl.position.copy(eg.getPoint(.5));pl.visible=false;sebGrup.add(pl);
  sebKenar.push({line,cone,pl,u,a});});
// ---- seçim ----
const komsu=D.dugumler.map(()=>({ust:[],alt:[]}));D.kafes_kenarlari.forEach(([u,a])=>{komsu[u].alt.push(a);komsu[a].ust.push(u);});
const panel=document.getElementById('panel');let secili=-1;
function ata(i,set,yon){if(set.has(i))return;set.add(i);komsu[i][yon].forEach(j=>ata(j,set,yon));}
function sec(i,uc){secili=i;
  if(i<0){kartlar.forEach(k=>k.mat.opacity=1);kafKenar.forEach(m=>m.material.opacity=.9);sebKenar.forEach(s=>{s.line.material.opacity=1;s.cone.material.opacity=1;});return;}
  const A=new Set(),B=new Set();ata(i,A,'ust');ata(i,B,'alt');const hep=new Set([...A,...B]);
  kartlar.forEach((k,j)=>{k.mat.opacity=hep.has(j)?1:.16;});
  kafKenar.forEach(m=>{const ok=hep.has(m.userData.u)&&hep.has(m.userData.a);m.material.opacity=ok?1:.07;});
  sebKenar.forEach(s=>{const ok=hep.has(s.u)&&hep.has(s.a);s.line.material.opacity=ok?1:.1;s.cone.material.opacity=ok?1:.1;});
  const n=D.dugumler[i];const ad=j=>'<li>'+adlar[j].replace(/</g,'')+'</li>';
  panel.innerHTML='<h3>'+(n.kind==='top'?'Esas':n.kind==='bot'?'Alt (boş küme)':(n.baslik.join(' · ')||'Kelime kutusu'))+'</h3>'
   +'<div class="sol">kafes katmanı '+n.rank+' · köke uzaklık '+(n.r?(n.r/D.halkalar[0]).toFixed(1):'0')+' · kutuya düşen kelime: '+n.kelimeler.length+'</div>'
   +(n.kelimeler.length?'<ul>'+n.kelimeler.map(k=>'<li><span class="ar">'+k.ar+'</span> '+k.tr+' <span class="sol">('+k.tag+(k.kuran?' '+k.kuran:'')+')</span></li>').join('')+'</ul>':'')
   +(komsu[i].ust.length?'<b>Üstündekiler</b><ul>'+komsu[i].ust.map(ad).join('')+'</ul>':'')
   +(komsu[i].alt.length?'<b>Altındakiler</b><ul>'+komsu[i].alt.map(ad).join('')+'</ul>':'');
  if(uc){const p=P[i];ucur(new THREE.Vector3(p.x,p.y+60,p.z+CH*K*5.2),p.clone(),700);}
}
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];ucus++;});
