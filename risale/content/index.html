<title>İspat Risalesi</title>
<meta name="description" content="Küme usulüyle inşa edilen İslam İspat Risalesi — canlı kaynaktan üretilir.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg:#f6f1e7; --bg-raised:#fffdf8; --ink:#2b2418; --ink-soft:#5c5240;
    --rule:#d8cdb4; --accent:#7a5c2e; --accent-soft:#efe4c9;
    --table-head:#eee2c4; --link:#7a5c2e; --code-bg:#efe6d2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1812; --bg-raised:#262019; --ink:#ecE3d2; --ink-soft:#b9ac91;
      --rule:#3a3225; --accent:#d8b46a; --accent-soft:#33291a;
      --table-head:#2e2617; --link:#d8b46a; --code-bg:#2a2318;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1812; --bg-raised:#262019; --ink:#ecE3d2; --ink-soft:#b9ac91;
    --rule:#3a3225; --accent:#d8b46a; --accent-soft:#33291a;
    --table-head:#2e2617; --link:#d8b46a; --code-bg:#2a2318;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;
    padding-inline:16px;
  }
  .shell{max-width:760px;margin:0 auto;padding-block:28px 80px;}
  header.top{
    display:flex; flex-direction:column; gap:6px; align-items:center;
    text-align:center; padding-block:8px 24px; border-bottom:1px solid var(--rule); margin-bottom:28px;
  }
  header.top .kicker{
    font-family:"Noto Naskh Arabic","Amiri",serif; letter-spacing:.08em;
    text-transform:uppercase; font-size:.72rem; color:var(--ink-soft);
  }
  header.top h1{
    font-family:"Amiri","Noto Naskh Arabic",Georgia,serif; font-size:2rem;
    margin:.1em 0; font-weight:700;
  }
  header.top .sub{color:var(--ink-soft); font-size:.95rem; max-width:52ch;}
  nav.fasil-nav{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px;
  }
  nav.fasil-nav button{
    font:inherit; font-size:.82rem; cursor:pointer; border:1px solid var(--rule);
    background:var(--bg-raised); color:var(--ink); border-radius:999px;
    padding:6px 14px;
  }
  nav.fasil-nav button[aria-current="true"]{
    background:var(--accent); color:var(--bg); border-color:var(--accent);
  }
  article{
    background:var(--bg-raised); border:1px solid var(--rule); border-radius:10px;
    padding:clamp(18px,4vw,40px); line-height:1.75; font-size:1.05rem;
  }
  article h1{font-family:"Amiri",Georgia,serif; font-size:1.6rem; border-bottom:2px solid var(--accent); padding-bottom:.3em;}
  article h2{font-family:"Amiri",Georgia,serif; font-size:1.28rem; color:var(--accent); margin-top:1.8em;}
  article h3{font-size:1.05rem; margin-top:1.4em;}
  article p{margin:1em 0; max-width:66ch;}
  article em{color:var(--ink-soft);}
  article code{background:var(--code-bg); padding:.1em .35em; border-radius:4px; font-size:.92em;}
  article pre{
    background:var(--code-bg); padding:14px 16px; border-radius:8px; overflow-x:auto;
    font-size:.88rem; line-height:1.55; border:1px solid var(--rule);
  }
  article pre code{background:none; padding:0;}
  article a{color:var(--link);}
  article table{border-collapse:collapse; width:100%; margin:1.4em 0; font-size:.92rem;}
  article :is(th,td){border:1px solid var(--rule); padding:8px 10px; text-align:left; vertical-align:top;}
  article th{background:var(--table-head); font-weight:600;}
  article table{display:block; overflow-x:auto;}
  article blockquote{
    border-inline-start:3px solid var(--accent); margin:1.2em 0; padding:.2em 1em;
    color:var(--ink-soft); background:var(--accent-soft); border-radius:0 6px 6px 0;
  }
  article img{max-width:100%; border-radius:6px;}
  article figure{margin:1.6em 0; padding:0;}
  article figure svg{width:100%; height:auto; display:block; color:var(--ink);}
  article figcaption{
    margin-top:.6em; font-size:.82rem; color:var(--ink-soft); text-align:center;
    font-style:italic;
  }
  article hr{border:none; border-top:1px solid var(--rule); margin:2em 0;}
  .state-msg{color:var(--ink-soft); text-align:center; padding:40px 0; font-style:italic;}
  footer.note{
    text-align:center; color:var(--ink-soft); font-size:.8rem; margin-top:28px;
  }
</style>

<div class="shell">
  <header class="top">
    <div class="kicker">Küme Usulüyle</div>
    <h1>İslâm İspat Risâlesi</h1>
    <p class="sub">Bu sayfa, projenin kendi Markdown kaynak dosyalarından <strong>her yayında yeniden üretilir</strong>: içerik değiştikçe, aynı bağlantı güncellenir — yeniden inşa edilmez.</p>
    <nav class="fasil-nav" id="fasil-nav"></nav>
  </header>
  <article id="content"><p class="state-msg">Yükleniyor…</p></article>
  <footer class="note">Kaynak: <code id="src-name">—</code> · üretici: <code>index.html</code> (sabit iskele)</footer>
</div>

<script>
(function(){
  var FASILLAR = [
    { id: "fasil_1", label: "Fasıl I — El-Vücûd", file: "fasil_1.md" }
    // Yeni fasıl yazıldığında yalnız buraya bir satır eklenir; iskele (index.html) değişmez.
  ];

  var nav = document.getElementById("fasil-nav");
  var content = document.getElementById("content");
  var srcName = document.getElementById("src-name");

  FASILLAR.forEach(function(f){
    var b = document.createElement("button");
    b.textContent = f.label;
    b.addEventListener("click", function(){ location.hash = f.id; });
    b.dataset.id = f.id;
    nav.appendChild(b);
  });

  function setActive(id){
    Array.prototype.forEach.call(nav.children, function(btn){
      btn.setAttribute("aria-current", btn.dataset.id === id ? "true" : "false");
    });
  }

  function render(id){
    var f = FASILLAR.find(function(x){ return x.id === id; }) || FASILLAR[0];
    setActive(f.id);
    srcName.textContent = "content/" + f.file;
    content.innerHTML = '<p class="state-msg">Yükleniyor…</p>';
    fetch(f.file, { cache: "no-store" })
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function(md){
        content.innerHTML = marked.parse(md);
      })
      .catch(function(err){
        content.innerHTML = '<p class="state-msg">Kaynak okunamadı: ' + String(err.message||err) + '</p>';
      });
  }

  window.addEventListener("hashchange", function(){
    render((location.hash || "#").slice(1) || FASILLAR[0].id);
  });

  try{
    render((location.hash || "#").slice(1) || FASILLAR[0].id);
  }catch(e){
    render(FASILLAR[0].id);
  }
})();
</script>
